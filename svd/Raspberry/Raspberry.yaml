              control: {reg: WAKE_EN1, field: CLK_SYS_UART0}
            - name: CLK_PERI_UART1
              description: UART1 baud-rate clock
              input: clk_peri
              output: clk_peri_uart1
              control: {reg: WAKE_EN1, field: CLK_PERI_UART1}
            - name: CLK_SYS_UART1
              description: UART1 register-interface clock
              input: clk_sys
              output: clk_sys_uart1
              control: {reg: WAKE_EN1, field: CLK_SYS_UART1}
            - name: CLK_SYS_USBCTRL
              description: USB controller register-interface clock
              input: clk_sys
              output: clk_sys_usbctrl
