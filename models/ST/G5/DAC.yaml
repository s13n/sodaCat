            description: 'There is no write operation of DAC_SHSR1 ongoing: DAC_SHSR1 can be written'
            value: 0
          - name: B_0x1
            description: 'There is a write operation of DAC_SHSR1 ongoing: DAC_SHSR1 cannot be written'
