name: RCC
description: Register block
groupName: RCC
source: stm32g5xx-dfp 2.0.0/STM32G564 SVD v2.0.0
registers:
  - name: CR
    displayName: CR
    description: Clock control register
    addressOffset: 0
    size: 32
    access: read-write
    resetValue: 35
    resetMask: 4294967295
    fields:
      - name: HSION
        description: HSI clock enable
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: HSI is OFF
            value: 0
          - name: B_0x1
            description: HSI is ON (default after reset)
            value: 1
      - name: HSIRDY
        description: HSI clock ready flag
        bitOffset: 1
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: HSI clock is not ready (default after reset)
            value: 0
          - name: B_0x1
            description: HSI clock is ready
            value: 1
      - name: HSIKERON
        description: HSI clock enable in Stop mode
        bitOffset: 2
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: no effect on HSI (default after reset)
            value: 0
          - name: B_0x1
            description: HSI is forced to ON even in Stop mode
            value: 1
      - name: HSIDIV
        description: HSI clock divider
        bitOffset: 3
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: division by 1, hsi_ck, hsi_ker_ck=64MHz (default after reset)
            value: 0
          - name: B_0x1
            description: division by 2, hsi_ck, hsi_ker_ck=32MHz
            value: 1
          - name: B_0x2
            description: division by 4, hsi_ck, hsi_ker_ck=16MHz
            value: 2
          - name: B_0x3
            description: division by 8, hsi_ck, hsi_ker_ck=8MHz
            value: 3
      - name: HSIDIVF
        description: HSI divider flag
        bitOffset: 5
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: new division ratio not yet propagated to hsi_ck, hsi_ker_ck (default after reset)
            value: 0
          - name: B_0x1
            description: hsi_ck, hsi_ker_ck clock frequency reflects the new HSIDIV value (default register value when the clock setting is completed).
            value: 1
      - name: HSI48ON
        description: HSI48 clock enable Only on STM32G553, STM32G554, STM32G563, STM32G564.
        bitOffset: 12
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: HSI48 is OFF (default after reset)
            value: 0
          - name: B_0x1
            description: HSI48 is ON
            value: 1
      - name: HSI48RDY
        description: HSI48 clock ready flag Only on STM32G553, STM32G554, STM32G563, STM32G564.
        bitOffset: 13
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: HSI48 clock is not ready (default after reset)
            value: 0
          - name: B_0x1
            description: HSI48 clock is ready
            value: 1
      - name: HSEON
        description: HSE clock enable
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: HSE is OFF (default after reset)
            value: 0
          - name: B_0x1
            description: HSE is ON
            value: 1
      - name: HSERDY
        description: HSE clock ready flag
        bitOffset: 17
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: HSE clock is not ready (default after reset)
            value: 0
          - name: B_0x1
            description: HSE clock is ready
            value: 1
      - name: HSEBYP
        description: HSE clock bypass
        bitOffset: 18
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: HSE oscillator not bypassed (default after reset)
            value: 0
          - name: B_0x1
            description: HSE oscillator bypassed with an external clock
            value: 1
      - name: HSECSSON
        description: HSE clock security system enable
        bitOffset: 19
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: CSS on HSE OFF (clock detector OFF) (default after reset)
            value: 0
          - name: B_0x1
            description: CSS on HSE ON (clock detector ON if the HSE oscillator is stable, OFF otherwise).
            value: 1
      - name: HSEEXT
        description: External high-speed clock type in bypass mode
        bitOffset: 20
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: HSE in analog mode (default after reset)
            value: 0
          - name: B_0x1
            description: HSE in digital mode
            value: 1
      - name: PLL1ON
        description: PLL1 enable
        bitOffset: 24
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PLL1 OFF (default after reset)
            value: 0
          - name: B_0x1
            description: PLL1 ON
            value: 1
      - name: PLL1RDY
        description: PLL1 clock ready flag
        bitOffset: 25
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: PLL1 unlocked (default after reset)
            value: 0
          - name: B_0x1
            description: PLL1 locked
            value: 1
      - name: PLL2ON
        description: PLL2 enable Only on STM32G553, STM32G554, STM32G563, STM32G564.
        bitOffset: 26
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PLL2 OFF (default after reset)
            value: 0
          - name: B_0x1
            description: PLL2 ON
            value: 1
      - name: PLL2RDY
        description: PLL2 clock ready flag Only on STM32G553, STM32G554, STM32G563, STM32G564.
        bitOffset: 27
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: PLL2 unlocked
            value: 0
          - name: B_0x1
            description: PLL2 locked
            value: 1
  - name: HSICFGR
    displayName: HSICFGR
    description: HSI calibration register
    addressOffset: 16
    size: 32
    access: read-write
    resetValue: 4194304
    resetMask: 4294963200
    fields:
      - name: HSICAL
        description: HSI clock calibration
        bitOffset: 0
        bitWidth: 12
        access: read-only
      - name: HSITRIM
        description: HSI clock trimming
        bitOffset: 16
        bitWidth: 7
        access: read-write
  - name: CRRCR
    displayName: CRRCR
    description: Clock recovery RC register Only on STM32G553, STM32G554, STM32G563, STM32G564.
    addressOffset: 20
    size: 32
    access: read-only
    resetValue: 0
    resetMask: 4294963200
    fields:
      - name: HSI48CAL
        description: Internal RC 48MHz clock calibration
        bitOffset: 0
        bitWidth: 10
        access: read-only
  - name: CFGR1
    displayName: CFGR1
    description: Clock configuration register1
    addressOffset: 28
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: SYSSW
        description: system clock and trace clock switch
        bitOffset: 0
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: HSI selected as system clock (hsi_ck) (default after reset)
            value: 0
          - name: B_0x1
            description: HSE selected as system clock (hse_ck)
            value: 1
          - name: B_0x2
            description: PLL1 selected as system clock (pll1_p_ck)
            value: 2
      - name: SYSSWS
        description: system clock switch status
        bitOffset: 3
        bitWidth: 2
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: HSI used as system clock (hsi_ck) (default after reset).
            value: 0
          - name: B_0x1
            description: HSE used as system clock (hse_ck)
            value: 1
          - name: B_0x2
            description: PLL1 used as system clock (pll1_p_ck)
            value: 2
      - name: RTCPRE
        description: HSE division factor for RTC clock
        bitOffset: 8
        bitWidth: 6
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: no clock (default after reset)
            value: 0
          - name: B_0x1
            description: no clock
            value: 1
          - name: B_0x2
            description: HSE/2
            value: 2
          - name: B_0x3
            description: HSE/3
            value: 3
          - name: B_0x4
            description: HSE/4
            value: 4
          - name: B_0x3E
            description: HSE/62
            value: 62
          - name: B_0x3F
            description: HSE/63
            value: 63
      - name: MCO1PRE
        description: MCO1 prescaler
        bitOffset: 18
        bitWidth: 4
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: prescaler disabled, no clock output on MCO1 (default after reset)
            value: 0
          - name: B_0x1
            description: division by 1 (bypass)
            value: 1
          - name: B_0x2
            description: division by 2
            value: 2
          - name: B_0x3
            description: division by 3
            value: 3
          - name: B_0x4
            description: division by 4
            value: 4
          - name: B_0xF
            description: division by 15
            value: 15
      - name: MCO1SEL
        description: Microcontroller clock output 1
        bitOffset: 22
        bitWidth: 3
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: HSI clock selected (hsi_ck) (default after reset)
            value: 0
          - name: B_0x1
            description: LSE oscillator clock selected (lse_ck)
            value: 1
          - name: B_0x2
            description: HSE clock selected (hse_ck)
            value: 2
          - name: B_0x3
            description: PLL1 clock selected (pll1_q_ck)
            value: 3
          - name: B_0x4
            description: HSI48 clock selected (hsi48_ker_ck)
            value: 4
      - name: MCO2PRE
        description: MCO2 prescaler
        bitOffset: 25
        bitWidth: 4
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: prescaler disabled, no clock output on MCO2 (default after reset)
            value: 0
          - name: B_0x1
            description: division by 1 (bypass)
            value: 1
          - name: B_0x2
            description: division by 2
            value: 2
          - name: B_0x3
            description: division by 3
            value: 3
          - name: B_0x4
            description: division by 4
            value: 4
          - name: B_0xF
            description: division by 15
            value: 15
      - name: MCO2SEL
        description: microcontroller clock output 2
        bitOffset: 29
        bitWidth: 3
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: system clock selected (sys_ck) (default after reset)
            value: 0
          - name: B_0x1
            description: PLL2 oscillator clock selected (pll2_p_ck)
            value: 1
          - name: B_0x2
            description: HSE clock selected (hse_ck)
            value: 2
          - name: B_0x3
            description: PLL1 clock selected (pll1_p_ck)
            value: 3
          - name: B_0x4
            description: LSI clock selected (lsi_ck)
            value: 4
