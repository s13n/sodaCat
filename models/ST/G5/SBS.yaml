name: SBS
description: Address block description
groupName: SBS
source: stm32g5xx-dfp 2.0.0/STM32G564 SVD v2.0.0
registers:
  - name: HDPLCR
    displayName: HDPLCR
    description: Temporal isolation control register
    addressOffset: 16
    size: 32
    access: read-write
    resetValue: 180
    resetMask: 4294967295
    fields:
      - name: INCR_HDPL
        description: increment HDPL value
        bitOffset: 0
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0xB4
            description: no increment
            value: 180
          - name: B_0x6A
            description: recommended value to increment HDPL level by one
            value: 106
  - name: HDPLSR
    displayName: HDPLSR
    description: Temporal isolation status register
    addressOffset: 20
    size: 32
    access: read-only
    resetValue: 0
    resetMask: 0
    fields:
      - name: HDPL
        description: temporal isolation level
        bitOffset: 0
        bitWidth: 8
        access: read-only
        enumeratedValues:
          - name: B_0xB4
            description: HDPL0, RSS
            value: 180
          - name: B_0x51
            description: HDPL1, iRoT
            value: 81
          - name: B_0x8A
            description: HDPL2, uRoT
            value: 138
          - name: B_0x6F
            description: HDPL3, application (secure/nonsecure)
            value: 111
  - name: NEXTHDPLCR
    displayName: NEXTHDPLCR
    description: Next HDPL control register
    addressOffset: 24
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: NEXTHDPL
        description: index to point to a higher HDPL than the current one
        bitOffset: 0
        bitWidth: 2
        access: read-write
  - name: DBGCR
    displayName: DBGCR
    description: Debug control register
    addressOffset: 32
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: AP_UNLOCK
        description: access port unlock
        bitOffset: 0
        bitWidth: 8
        access: read-write
      - name: DBG_UNLOCK
        description: debug unlock when DBG_AUTH_HDPL is reached
        bitOffset: 8
        bitWidth: 8
        access: read-write
      - name: DBG_AUTH_HDPL
        description: authenticated debug temporal isolation level
        bitOffset: 16
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0x51
            description: HDPL1
            value: 81
          - name: B_0x8A
            description: HDPL2
            value: 138
          - name: B_0x6F
            description: HDPL3
            value: 111
      - name: DBG_AUTH_SEC
        description: control debug opening secure/nonsecure
        bitOffset: 24
        bitWidth: 8
        access: read-write
  - name: DBGLOCKR
    displayName: DBGLOCKR
    description: Debug lock register
    addressOffset: 36
    size: 32
    access: read-write
    resetValue: 180
    resetMask: 4294967295
    fields:
      - name: DBGCFG_LOCK
        description: debug configuration lock
        bitOffset: 0
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0xB4
            description: Writes to SBS_DBGCR and SBS_DBGCR2 allowed (default)
            value: 180
  - name: DBGCR2
    displayName: DBGCR2
    description: Debug control register 2
    addressOffset: 40
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: SEC_AP_UNLOCK
        description: Secure AHB access port unlock.
        bitOffset: 0
        bitWidth: 8
        access: read-write
  - name: RSSCMDR
    displayName: RSSCMDR
    description: RSS command register
    addressOffset: 52
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: RSSCMD
        description: RSS command
        bitOffset: 0
        bitWidth: 16
        access: read-write
  - name: EPOCHSELCR
    displayName: EPOCHSELCR
    description: EPOCH selection control register
    addressOffset: 160
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: EPOCH_SEL
        description: select EPOCH value to be sent to the SAES
        bitOffset: 0
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: NS_EPOCH (nonsecure) counter input selected
            value: 0
          - name: B_0x1
            description: SEC_EPOCH counter input selected
            value: 1
  - name: SECCFGR
    displayName: SECCFGR
    description: Security mode configuration control register
    addressOffset: 192
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: SBSSEC
        description: SBS clock control, memory-erase status register and compensation cell register security enable
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SBS_MESR, SBS_CCCSR, SBS_CCVALR, SBS_CCSWCR registers accessible through secure or nonsecure transaction
            value: 0
          - name: B_0x1
            description: SBS_MESR, SBS_CCCSR, SBS_CCVALR, SBS_CCSWCR registers accessible only through secure transaction
            value: 1
      - name: CLASSBSEC
        description: ClassB security enable
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SBS_CFGR2 register accessible through secure or nonsecure transaction
            value: 0
          - name: B_0x1
            description: SBS_CFGR2 register accessible only through secure transaction
            value: 1
      - name: FPUSEC
        description: FPU security enable
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SBS_FPUIMR register accessible through secure or nonsecure transaction
            value: 0
          - name: B_0x1
            description: SBS_FPUIMR register accessible only through secure transaction
            value: 1
  - name: PMCR
    displayName: PMCR
    description: Product mode and configuration register
    addressOffset: 256
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: I2C1SMB3EN
        description: SMBUS 3.0 on I2C1 enable
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SMBUS 3.0 on I2C1 enable
            value: 0
          - name: B_0x1
            description: SMBUS 3.0 on I2C1 enable
            value: 1
      - name: I2C3SMB3EN
        description: SMBUS 3.0 on I2C3 enable Only on STM32G553, STM32G554, STM32G563, STM32G564.
        bitOffset: 2
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SMBUS 3.0 on I2C3 enable
            value: 0
          - name: B_0x1
            description: SMBUS 3.0 on I2C3 enable
            value: 1
      - name: I2C4SMB3EN
        description: SMBUS 3.0 on I2C4 enable Only on STM32G553, STM32G554, STM32G563, STM32G564.
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SMBUS 3.0 on I2C4 enable
            value: 0
          - name: B_0x1
            description: SMBUS 3.0 on I2C4 enable
            value: 1
      - name: PB6_FMP
        description: Fast-mode Plus driving capability activation on PB6
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PB6 pin operates in standard mode.
            value: 0
          - name: B_0x1
            description: Fm+ mode is enabled on PB6 pin and the speed control is bypassed.
            value: 1
      - name: PB7_FMP
        description: Fast-mode Plus driving capability activation on PB7
        bitOffset: 17
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PB7 pin operates in standard mode.
            value: 0
          - name: B_0x1
            description: Fm+ mode is enabled on PB7 pin and the speed control is bypassed.
            value: 1
      - name: PB9_FMP
        description: Fast-mode Plus driving capability activation on PB9
        bitOffset: 19
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PB9 pin operates in standard mode.
            value: 0
          - name: B_0x1
            description: Fm+ mode is enabled on PB9 pin and the speed control is bypassed.
            value: 1
  - name: FPUIMR
    displayName: FPUIMR
    description: FPU interrupt mask register
    addressOffset: 260
    size: 32
    access: read-write
    resetValue: 31
    resetMask: 4294967295
    fields:
      - name: FPU_IE
        description: FPU interrupt enable
        bitOffset: 0
        bitWidth: 6
        access: read-write
  - name: MESR
    displayName: MESR
    description: Memory erase status register
    addressOffset: 264
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967280
    fields:
      - name: MCLR
        description: device memories erase status
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: memory erase on going if not yet cleared by software
            value: 0
          - name: B_0x1
            description: Memory erase done
            value: 1
      - name: IPMEE
        description: ICACHE erase status
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: ICACHE and PKA RAM erase on going
            value: 0
          - name: B_0x1
            description: ICACHE and PKA RAM erase done
            value: 1
  - name: CCCSR
    displayName: CCCSR
    description: Compensation cell for I/Os control and status register
    addressOffset: 272
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: EN1
        description: enable compensation cell for VDD power rail
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: I/O compensation cell disabled
            value: 0
          - name: B_0x1
            description: I/O compensation cell enabled
            value: 1
      - name: CS1
        description: code selection for VDD power rail (reset value set to 1)
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Code from the cell (available in the SBS_CCVALR)
            value: 0
          - name: B_0x1
            description: Code from SBS_CCSWCR
            value: 1
      - name: RDY1
        description: VDD compensation cell ready flag
        bitOffset: 8
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: VDD compensation cell not ready
            value: 0
          - name: B_0x1
            description: VDD compensation cell ready (code value provided by the cell can be used)
            value: 1
  - name: CCVALR
    displayName: CCVALR
    description: Compensation cell for I/Os value register
    addressOffset: 276
    size: 32
    access: read-only
    resetValue: 136
    resetMask: 4294967295
    fields:
      - name: ANSRC1
        description: compensation value for the NMOS transistor
        bitOffset: 0
        bitWidth: 4
        access: read-only
      - name: APSRC1
        description: compensation value for the PMOS transistor
        bitOffset: 4
        bitWidth: 4
        access: read-only
  - name: CCSWCR
    displayName: CCSWCR
    description: Compensation cell for I/Os software code register
    addressOffset: 280
    size: 32
    access: read-write
    resetValue: 30840
    resetMask: 4294967295
    fields:
      - name: SW_ANSRC1
        description: NMOS compensation code for VDD power rails
        bitOffset: 0
        bitWidth: 4
        access: read-write
      - name: SW_APSRC1
        description: PMOS compensation code for the VDD power rails
        bitOffset: 4
        bitWidth: 4
        access: read-write
  - name: CFGR2
    displayName: CFGR2
    description: Class B register
    addressOffset: 288
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: CLL
        description: core lockup lock
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: lockup output disconnected from timer break inputs
            value: 0
          - name: B_0x1
            description: lockup output connected to timer break inputs
            value: 1
      - name: SEL
        description: SRAM ECC error lock
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SRAM double ECC error flag disconnected from timer break inputs
            value: 0
          - name: B_0x1
            description: SRAM double ECC error flag connected to timer break inputs
            value: 1
      - name: PVDL
        description: PVD lock
        bitOffset: 2
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PVD interrupt disconnected from timer break inputs. PVDE and PLS[2:0] in the PWR registers are read/write
            value: 0
          - name: B_0x1
            description: PVD interrupt is connected to timer break inputs. PVDE and PLS[2:0] in the PWR registers are read only
            value: 1
      - name: ECCL
        description: ECC lock
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: double ECC error flag disconnected to timer break inputs
            value: 0
          - name: B_0x1
            description: double ECC error flag connected to timer break inputs
            value: 1
      - name: DCECCL
        description: Arm  Cortex -M33 D-CACHE ECC lock
        bitOffset: 4
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Arm  Cortex -M33 D-CACHE double ECC error flag disconnected to timer break inputs
            value: 0
          - name: B_0x1
            description: Arm  Cortex -M33 D-CACHE double ECC error flag connected to timer break inputs
            value: 1
  - name: CNSLCKR
