name: SBS
description: Address block description
groupName: SBS
source: STM32H533 SVD v1.3
registers:
  - name: HDPLCR
    displayName: HDPLCR
    description: Temporal isolation control register
    addressOffset: 16
    size: 32
    access: read-write
    resetValue: 180
    resetMask: 4294967295
    fields:
      - name: INCR_HDPL
        description: increment HDPL value
        bitOffset: 0
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0xB4
            description: no increment
            value: 180
          - name: B_0x6A
            description: recommended value to increment HDPL level by one
            value: 106
  - name: HDPLSR
    displayName: HDPLSR
    description: Temporal isolation status register
    addressOffset: 20
    size: 32
    access: read-only
    resetValue: 0
    resetMask: 0
    fields:
      - name: HDPL
        description: temporal isolation level
        bitOffset: 0
        bitWidth: 8
        access: read-only
        enumeratedValues:
          - name: B_0xB4
            description: HDPL0, RSS
            value: 180
          - name: B_0x51
            description: HDPL1, iRoT
            value: 81
          - name: B_0x8A
            description: HDPL2, uRoT
            value: 138
          - name: B_0x6F
            description: HDPL3, application (secure/non-secure)
            value: 111
  - name: NEXTHDPLCR
    displayName: NEXTHDPLCR
    description: Next HDPL control register
    addressOffset: 24
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: NEXTHDPL
        description: index to point to a higher HDPL than the current one
        bitOffset: 0
        bitWidth: 2
        access: read-write
  - name: DBGCR
    displayName: DBGCR
    description: Debug control register
    addressOffset: 32
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: AP_UNLOCK
        description: access port unlock
        bitOffset: 0
        bitWidth: 8
        access: read-write
      - name: DBG_UNLOCK
        description: debug unlock when DBG_AUTH_HDPL is reached
        bitOffset: 8
        bitWidth: 8
        access: read-write
      - name: DBG_AUTH_HDPL
        description: authenticated debug temporal isolation level
        bitOffset: 16
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0x51
            description: HDPL1
            value: 81
          - name: B_0x8A
            description: HDPL2
            value: 138
          - name: B_0x6F
            description: HDPL3
            value: 111
      - name: DBG_AUTH_SEC
        description: control debug opening secure/non-secure
        bitOffset: 24
        bitWidth: 8
        access: read-write
  - name: DBGLOCKR
    displayName: DBGLOCKR
    description: Debug lock register
    addressOffset: 36
    size: 32
    access: read-write
    resetValue: 180
    resetMask: 4294967295
    fields:
      - name: DBGCFG_LOCK
        description: debug configuration lock
        bitOffset: 0
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0xB4
            description: Writes to SBS_DBGCR allowed (default)
            value: 180
  - name: RSSCMDR
    displayName: RSSCMDR
    description: RSS command register
    addressOffset: 52
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: RSSCMD
        description: RSS command
        bitOffset: 0
        bitWidth: 16
        access: read-write
  - name: EPOCHSELCR
    displayName: EPOCHSELCR
    description: EPOCH selection control register
    addressOffset: 160
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: EPOCH_SEL
        description: select EPOCH value to be sent to the SAES
        bitOffset: 0
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: NS_EPOCH (non-secure) counter input selected
            value: 0
          - name: B_0x1
            description: SEC_EPOCH counter input selected
            value: 1
  - name: SECCFGR
    displayName: SECCFGR
    description: Security mode configuration control register
    addressOffset: 192
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: SBSSEC
        description: SBS clock control, memory-erase status register and compensation cell register security enable
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SBS_MESR, SBS_CCCSR, SBS_CCVALR, SBS_CCSWCR registers accessible through secure or non-secure transaction
            value: 0
          - name: B_0x1
            description: SBS_MESR, SBS_CCCSR, SBS_CCVALR, SBS_CCSWCR registers accessible only through secure transaction
            value: 1
      - name: CLASSBSEC
        description: ClassB security enable
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SBS_CFGR2 register accessible through secure or non-secure transaction
            value: 0
          - name: B_0x1
            description: SBS_CFGR2 register accessible only through secure transaction
            value: 1
      - name: FPUSEC
        description: FPU security enable
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SBS_FPUIMP register accessible through secure or non-secure transaction
            value: 0
          - name: B_0x1
            description: SBS_FPUIMP register accessible only through secure transaction
            value: 1
      - name: SDCE_SEC_EN
        description: control accessibility of SMPS_DIV_CLOCK _EN in SBS_PMCR Only on STM32H562, STM32H563, STM32H573.
        bitOffset: 31
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SMPS_DIV_CLOCK _EN accessible through a secure or non-secure transaction
            value: 0
          - name: B_0x1
            description: SMPS_DIV_CLOCK _EN only accessible through a secure transaction
            value: 1
  - name: PMCR
    displayName: PMCR
    description: Product mode and configuration register
    addressOffset: 256
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: BOOSTEN
        description: "booster enable\nSet this bit to reduce the total harmonic distortion of the analog switch when the processor supply is below 2.7 V. The booster can be activated to guaranty AC performance on analog switch when the supply is below 2.7 V. When the booster is activated, the analog switch performances are the same as with the full voltage range. Only on STM32H562, STM32H563, STM32H573."
        bitOffset: 8
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Booster disabled
            value: 0
          - name: B_0x1
            description: Booster enabled
            value: 1
      - name: BOOSTVDDSEL
        description: "booster VDD selection\nNote: Booster must not be used when VDDA   2.7 V, but VDD   2.7 V (add current consumption).\nWhen both VDD   2.7 V and VDDA   2.7 V, booster is needed to get full AC performances from I/O analog switches. Only on STM32H562, STM32H563, STM32H573."
        bitOffset: 9
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: VDDA is selected as VBOOSTER supply (BOOSTE = 0)
            value: 0
          - name: B_0x1
            description: VDD is selected as VBOOSTER supply (regardless BOOSTEN that must be cleared to avoid unwanted power consumption)
            value: 1
      - name: PB6_FMP
        description: Fast-mode Plus driving capability activation on PB6
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PB6 pin operates in standard mode.
            value: 0
          - name: B_0x1
            description: Fm+ mode is enabled on PB6 pin and the speed control is bypassed.
            value: 1
      - name: PB7_FMP
        description: Fast-mode Plus driving capability activation on PB7
        bitOffset: 17
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PB7 pin operates in standard mode.
            value: 0
          - name: B_0x1
            description: Fm+ mode is enabled on PB7 pin and the speed control is bypassed.
            value: 1
      - name: PB8_FMP
        description: Fast-mode Plus driving capability activation on PB8
        bitOffset: 18
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PB8 pin operates in standard mode.
            value: 0
          - name: B_0x1
            description: Fm+ mode is enabled on PB8 pin and the speed control is bypassed.
            value: 1
      - name: PB9_FMP
        description: Fast-mode Plus driving capability activation on PB9
        bitOffset: 19
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PB9 pin operates in standard mode.
            value: 0
          - name: B_0x1
            description: Fm+ mode is enabled on PB9 pin and the speed control is bypassed.
            value: 1
      - name: ETH_SEL_PHY
        description: Ethernet PHY interface selection Only on STM32H543, STM32H553, STM32H563, STM32H573.
        bitOffset: 21
        bitWidth: 4
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: GMII or MII
            value: 0
          - name: B_0x4
            description: RMII
            value: 4
      - name: ETHINTPOL
        description: ETH external PHY interrupt polarity configuration Only on STM32H543, STM32H553.
        bitOffset: 25
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Active high
            value: 0
          - name: B_0x1
            description: Active low
            value: 1
      - name: ETHPDACK
        description: ETH power-down acknowledge Only on STM32H543, STM32H553.
        bitOffset: 26
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: ETH functional/power-down sequence not yet completed
            value: 0
          - name: B_0x1
            description: ETH power-down sequence completed
            value: 1
      - name: ETHTXLPI
        description: ETH TxLPI status Only on STM32H543, STM32H553.
        bitOffset: 27
        bitWidth: 1
        access: read-only
  - name: FPUIMR
    displayName: FPUIMR
    description: FPU interrupt mask register
    addressOffset: 260
    size: 32
    access: read-write
    resetValue: 31
    resetMask: 4294967295
    fields:
      - name: FPU_IE
        description: FPU interrupt enable
        bitOffset: 0
        bitWidth: 6
        access: read-write
  - name: MESR
    displayName: MESR
    description: Memory erase status register
    addressOffset: 264
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967280
    fields:
      - name: MCLR
        description: device memories erase status
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: memory erase on going if not yet cleared by software
            value: 0
          - name: B_0x1
            description: Memory erase done
            value: 1
      - name: IPMEE
        description: ICACHE erase status
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: ICACHE and PKA RAM erase on going
            value: 0
          - name: B_0x1
            description: ICACHE and PKA SRAM erase done
            value: 1
  - name: CCCSR
    displayName: CCCSR
    description: Compensation cell for I/Os control and status register
    addressOffset: 272
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: EN1
        description: enable compensation cell for VDDIO power rail
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: I/O compensation cell disabled
            value: 0
          - name: B_0x1
            description: I/O compensation cell enabled
            value: 1
      - name: CS1
        description: code selection for VDDIO power rail (reset value set to 1)
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Code from the cell (available in the SBS_CCVR)
            value: 0
          - name: B_0x1
            description: Code from SBS_CCCR
            value: 1
      - name: EN2
        description: enable compensation cell for VDDIO2 power rail
        bitOffset: 2
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: I/O compensation cell disabled
            value: 0
          - name: B_0x1
            description: I/O compensation cell enabled
            value: 1
      - name: CS2
        description: code selection for VDDIO2 power rail (reset value set to 1)
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Code from the cell (available in SBS_CCVR)
            value: 0
          - name: B_0x1
            description: Code from SBS_CCCR
            value: 1
      - name: RDY1
        description: VDDIO compensation cell ready flag
        bitOffset: 8
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: VDDIO compensation cell not ready
            value: 0
          - name: B_0x1
            description: VDDIO compensation cell ready (code value provided by the cell can be used)
            value: 1
      - name: RDY2
        description: VDDIO2 compensation cell ready flag
        bitOffset: 9
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: VDDIO2 compensation cell not ready
            value: 0
          - name: B_0x1
            description: VDDIO2 compensation cell ready (code value provided by the cell can be used)
            value: 1
  - name: CCVALR
    displayName: CCVALR
    description: Compensation cell for I/Os value register
    addressOffset: 276
    size: 32
    access: read-only
    resetValue: 136
    resetMask: 4294967295
    fields:
      - name: ANSRC1
        description: compensation value for the NMOS transistor
        bitOffset: 0
        bitWidth: 4
        access: read-only
      - name: APSRC1
        description: compensation value for the PMOS transistor
        bitOffset: 4
        bitWidth: 4
        access: read-only
      - name: ANSRC2
        description: Compensation value for the NMOS transistor
        bitOffset: 8
        bitWidth: 4
        access: read-only
      - name: APSRC2
        description: compensation value for the PMOS transistor
        bitOffset: 12
        bitWidth: 4
        access: read-only
  - name: CCSWCR
    displayName: CCSWCR
    description: Compensation cell for I/Os software code register
    addressOffset: 280
    size: 32
    access: read-write
    resetValue: 30840
    resetMask: 4294967295
    fields:
      - name: SW_ANSRC1
        description: NMOS compensation code for VDD power rails
        bitOffset: 0
        bitWidth: 4
        access: read-write
      - name: SW_APSRC1
        description: PMOS compensation code for the VDD power rails
        bitOffset: 4
        bitWidth: 4
        access: read-write
      - name: SW_ANSRC2
        description: NMOS compensation code for VDDIO power rails
        bitOffset: 8
        bitWidth: 4
        access: read-write
      - name: SW_APSRC2
        description: PMOS compensation code for the Vless thansub>DDIOless than/sub> power rails
        bitOffset: 12
        bitWidth: 4
        access: read-write
  - name: CFGR2
    displayName: CFGR2
    description: Class B register
    addressOffset: 288
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: CLL
        description: core lockup lock
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: lockup output disconnected from timer break inputs
            value: 0
          - name: B_0x1
            description: lockup output connected to timer break inputs
            value: 1
      - name: SEL
        description: SRAM ECC error lock
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SRAM double ECC error flag disconnected from timer break inputs
            value: 0
          - name: B_0x1
            description: SRAM double ECC error flag connected to timer break inputs
            value: 1
      - name: PVDL
        description: PVD lock
        bitOffset: 2
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: PVD interrupt disconnected from timer break inputs.
            value: 0
          - name: B_0x1
            description: PVD interrupt is connected to timer break inputs.
            value: 1
      - name: ECCL
        description: ECC lock
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: double ECC error flag disconnected to timer break inputs
            value: 0
          - name: B_0x1
            description: double ECC error flag connected to timer break inputs
            value: 1
  - name: CNSLCKR
    displayName: CNSLCKR
    description: CPU non-secure lock register
    addressOffset: 324
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: LOCKNSVTOR
        description: VTOR_NS register lock
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: VTOR_NS register write enabled
            value: 0
          - name: B_0x1
            description: VTOR_NS register write disabled
            value: 1
      - name: LOCKNSMPU
        description: non-secure MPU register lock
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: non-secure MPU registers write enabled
            value: 0
          - name: B_0x1
            description: non-secure MPU registers write disabled
            value: 1
  - name: CSLCKR
    displayName: CSLCKR
    description: CPU secure lock register
    addressOffset: 328
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: LOCKSVTAIRCR
        description: VTOR_S and AIRCR register lock
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: VTOR_S register PRIS and BFHFNMINS bits in the AIRCR register write enabled
            value: 0
          - name: B_0x1
            description: VTOR_S register PRIS and BFHFNMINS bits in the AIRCR register write disabled
            value: 1
      - name: LOCKSMPU
        description: secure MPU registers lock
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Secure MPU registers writes enabled
            value: 0
          - name: B_0x1
            description: Secure MPU registers writes disabled
            value: 1
      - name: LOCKSAU
        description: SAU registers lock
        bitOffset: 2
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SAU registers write enabled
            value: 0
          - name: B_0x1
            description: SAU registers write disabled
            value: 1
  - name: ECCNMIR
    displayName: ECCNMIR
    description: Flift ECC NMI mask register
    addressOffset: 332
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: ECCNMI_MASK_EN
        description: NMI behavior setup when a double ECC error occurs on flitf data part
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: NMI generated if a double ECC error in the flitf data part
            value: 0
          - name: B_0x1
            description: NMI not generated if a double ECC error in the flitf data part
            value: 1
addressBlocks:
  - offset: 0
    size: 336
    usage: registers
namespace: stm32h5
