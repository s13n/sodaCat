            # --- PLL source ---
            - name: PLLSRC
              description: Common source for all three PLLs
              output: pll_src
              inputs:
                - hsi_ck
                - csi_ck
                - hse_ck
                - ''
              control:
                reg: PLLCKSELR
                field: PLLSRC

            # --- System clock ---
            - name: SW
              description: System clock switch
              output: sys_ck
              inputs:
                - hsi_ck
                - csi_ck
                - hse_ck
                - pll1_p_ck
                - 
                - 
                - 
                - 
              control:
                reg: CFGR
                field: SW

            # --- per_ck ---
            - name: CKPERSEL
              description: External peripheral clock source selection
              output: per_ck
              inputs:
                - hsi_ker_ck
                - csi_ker_ck
                - hse_ck
                - ''
              control:
                reg: CDCCIPR
                field: CKPERSEL

            # --- RTC source ---
