        - lse_ck
        - lsi_ck
      control:
        reg: D2CCIP2R
        field: RNGSEL
    - name: CECSEL
      description: HDMI-CEC kernel clock source selection
      output: cec_ker_ck
      inputs:
        - lse_ck
        - lsi_ck
        - csi_ker_div122
