    - name: gpioh_hclk
      max: 240000000
    - name: gpioi_hclk
      max: 240000000
    - name: gpioj_hclk
      max: 240000000
    - name: gpiok_hclk
      max: 240000000
    - name: hash_hclk
      max: 240000000
    - name: hsem_hclk
      max: 240000000
    - name: jpgdec_hclk
      max: 240000000
    - name: mdma_hclk
      max: 240000000
    - name: octospi1_hclk
      description: OCTOSPI1 bus interface clock (H7A3_B-specific; replaces QUADSPI on H742_H753)
      max: 240000000
    - name: octospi2_hclk
      description: OCTOSPI2 bus interface clock
      max: 240000000
    - name: octospim_hclk
      description: OCTOSPI I/O Manager bus interface clock
      max: 240000000
    - name: rng_hclk
      max: 240000000
    - name: sdmmc1_hclk
      max: 240000000
    - name: sdmmc2_hclk
      max: 240000000
    - name: usb1otg_hclk
      description: USB1 OTG_HS bus interface clock (H7A3_B has only one USB OTG vs. two on H742_H753)
      max: 240000000
    - name: usb1ulpi_hclk
      description: USB1 ULPI PHY clock
      max: 240000000
    - name: cec_pclk
      max: 120000000
    - name: crs_pclk
      max: 120000000
    - name: dac1_pclk
      description: DAC1 APB1 bus interface clock (H7A3_B has separate DAC1 / DAC2 on different domains)
      max: 120000000
    - name: dac2_pclk
      description: DAC2 APB4 bus interface clock (Smart Run Domain)
      max: 120000000
    - name: fdcan_pclk
      max: 120000000
    - name: i2c1_pclk
      max: 120000000
    - name: i2c2_pclk
      max: 120000000
    - name: i2c3_pclk
      max: 120000000
    - name: lptim1_pclk
      max: 120000000
    - name: mdios_pclk
      max: 120000000
    - name: opamp_pclk
      max: 120000000
    - name: spdifrx_pclk
      max: 120000000
    - name: spi2_pclk
      max: 120000000
    - name: spi3_pclk
      max: 120000000
    - name: swpmi_pclk
      max: 120000000
    - name: tim12_pclk
      max: 120000000
    - name: tim13_pclk
      max: 120000000
    - name: tim14_pclk
      max: 120000000
    - name: tim2_pclk
      max: 120000000
    - name: tim3_pclk
      max: 120000000
    - name: tim4_pclk
      max: 120000000
    - name: tim5_pclk
      max: 120000000
    - name: tim6_pclk
      max: 120000000
    - name: tim7_pclk
      max: 120000000
    - name: uart4_pclk
      max: 120000000
    - name: uart5_pclk
      max: 120000000
    - name: uart7_pclk
      max: 120000000
    - name: uart8_pclk
      max: 120000000
    - name: usart2_pclk
      max: 120000000
    - name: usart3_pclk
      max: 120000000
    - name: dfsdm1_pclk
      max: 120000000
    - name: sai1_pclk
      max: 120000000
    - name: sai2_pclk
      max: 120000000
    - name: spi1_pclk
      max: 120000000
    - name: spi4_pclk
      max: 120000000
    - name: spi5_pclk
      max: 120000000
    - name: tim15_pclk
      max: 120000000
    - name: tim16_pclk
      max: 120000000
    - name: tim17_pclk
      max: 120000000
    - name: tim1_pclk
      max: 120000000
    - name: tim8_pclk
      max: 120000000
    - name: usart1_pclk
      max: 120000000
    - name: usart6_pclk
      max: 120000000
    - name: uart9_pclk
      description: UART9 APB2 bus interface clock (H7A3_B-specific)
      max: 120000000
    - name: usart10_pclk
      description: USART10 APB2 bus interface clock (H7A3_B-specific)
      max: 120000000
    - name: dfsdm2_pclk
      description: DFSDM2 APB4 bus interface clock (Smart Run Domain)
      max: 120000000
    - name: ltdc_pclk
      max: 120000000
    - name: wwdg_pclk
      max: 120000000
    - name: comp12_pclk
      max: 120000000
    - name: i2c4_pclk
      max: 120000000
    - name: lptim2_pclk
      max: 120000000
    - name: lptim3_pclk
      max: 120000000
    - name: lpuart1_pclk
      max: 120000000
    - name: rtcapb_pclk
      max: 120000000
    - name: spi6_pclk
      max: 120000000
    - name: syscfg_pclk
      max: 120000000
    - name: vrefbuf_pclk
      max: 120000000
    - name: mco1_pre_ck
      description: MCO1 clock after the selector mux, before MCO1PRE prescaler
    - name: mco2_pre_ck
      description: MCO2 clock after the selector mux, before MCO2PRE prescaler
  generators:
    - name: HSI64
      description: 64 MHz high-speed internal RC oscillator
      output: hsi_osc
      control:
        reg: CR
        field: HSION
        values:
          - 0
          - 64000000
    - name: HSE
      description: High-speed external oscillator (4-48 MHz crystal or bypass)
      output: hse_ck
      control:
        state: freqHSE
        reg: CR
        field: HSEON
    - name: CSI
      description: 4 MHz low-power internal RC oscillator
      output: csi_ck
      control:
        reg: CR
        field: CSION
        values:
          - 0
          - 4000000
    - name: LSI
      description: 32 kHz low-speed internal RC oscillator
      output: lsi_ck
      control:
        reg: CSR
        field: LSION
        values:
          - 0
          - 32000
    - name: LSE
      description: 32.768 kHz low-speed external crystal oscillator
      output: lse_ck
      control:
        state: freqLSE
        reg: BDCR
        field: LSEON
    - name: HSI48
      description: 48 MHz internal RC oscillator (CRS trimmable)
      output: hsi48_ck
      control:
        reg: CR
        field: HSI48ON
        values:
          - 0
          - 48000000
    - name: I2S_CKIN
      description: External I2S clock input pin
      output: I2S_CKIN
  muxes:
    - name: PLLSRC
      description: Common source for all three PLLs
      output: pll_src
      inputs:
        - hsi_ck
        - csi_ck
        - hse_ck
        - ''
      control:
        reg: PLLCKSELR
        field: PLLSRC
    - name: SW
      description: System clock switch
      output: sys_ck
      inputs:
        - hsi_ck
        - csi_ck
        - hse_ck
        - pll1_p_ck
        - 
        - 
        - 
        - 
      control:
        reg: CFGR
        field: SW
    - name: CKPERSEL
      description: External peripheral clock source selection
      output: per_ck
      inputs:
        - hsi_ker_ck
        - csi_ker_ck
        - hse_ck
        - ''
      control:
        reg: CDCCIPR
        field: CKPERSEL
    - name: RTCSEL
      description: RTC clock source selection
      output: rtc_pre
      inputs:
        - ''
        - lse_ck
        - lsi_ck
        - hse_rtc_ck
      control:
        reg: BDCR
        field: RTCSEL
    - name: MCO1SEL
      description: Microcontroller clock output 1 source
      output: mco1_pre_ck
      inputs:
        - hsi_ck
        - lse_ck
        - hse_ck
        - pll1_q_ck
        - hsi48_ck
        - 
        - 
        - 
      control:
        reg: CFGR
        field: MCO1SEL
    - name: MCO2SEL
      description: Microcontroller clock output 2 source
      output: mco2_pre_ck
      inputs:
        - sys_ck
        - pll2_p_ck
        - hse_ck
        - pll1_p_ck
        - csi_ck
        - lsi_ck
        - 
        - 
      control:
        reg: CFGR
        field: MCO2SEL
    - name: SDMMCSEL
      description: SDMMC1/2 kernel clock source selection
      output: sdmmc_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_r_ck
      control:
        reg: CDCCIPR
        field: SDMMCSEL
    - name: OCTOSPISEL
      description: OCTOSPI1/2 kernel clock source selection (RM0455 Table 58)
      output: octospi_ker_ck
      inputs:
        - rcc_hclk
        - pll1_q_ck
        - pll2_r_ck
        - per_ck
      control:
        reg: CDCCIPR
        field: OCTOSPISEL
    - name: FMCSEL
      description: FMC kernel clock source selection
      output: fmc_ker_ck
      inputs:
        - rcc_hclk
        - pll1_q_ck
        - pll2_r_ck
        - per_ck
      control:
        reg: CDCCIPR
        field: FMCSEL
    - name: FDCANSEL
      description: FDCAN kernel clock source selection
      output: fdcan_ker_ck
      inputs:
        - hse_ck
        - pll1_q_ck
        - pll2_q_ck
        - ''
      control:
        reg: CDCCIP1R
        field: FDCANSEL
    - name: SWPSEL
      description: SWPMI kernel clock source selection
      output: swpmi_ker_ck
      inputs:
        - rcc_pclk1
        - hsi_ker_ck
      control:
        reg: CDCCIP1R
        field: SWPMISEL
    - name: DFSDM1SEL
      description: DFSDM1 processing clock source selection
      output: dfsdm1_ker_ck
      inputs:
        - rcc_pclk2
        - sys_ck
      control:
        reg: CDCCIP1R
        field: DFSDM1SEL
    - name: DFSDM2SEL
      description: DFSDM2 processing clock source selection (Smart Run Domain)
      output: dfsdm2_ker_ck
      inputs:
        - rcc_pclk4
        - sys_ck
      control:
        reg: SRDCCIPR
        field: DFSDM2SEL
    - name: SPDIFSEL
      description: SPDIFRX kernel clock source selection
      output: spdif_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_r_ck
        - pll3_r_ck
        - hsi_ker_ck
      control:
        reg: CDCCIP1R
        field: SPDIFRXSEL
    - name: SPI45SEL
      description: SPI4/5 kernel clock source selection
      output: spi45_ker_ck
      inputs:
        - rcc_pclk2
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
        - csi_ker_ck
        - hse_ck
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SPI45SEL
    - name: SPI123SEL
      description: SPI/I2S 1,2,3 kernel clock source selection
      output: spi123_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SPI123SEL
    - name: SAI1SEL
      description: SAI1 and DFSDM1 audio kernel clock source selection
      output: sai1_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SAI1SEL
    - name: SAI2ASEL
      description: SAI2 sub-block A audio kernel clock source selection (RM0455 Table 58; H7A3_B replaces SAI23SEL with split SAI2ASEL/SAI2BSEL)
      output: sai_a_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SAI2ASEL
    - name: SAI2BSEL
      description: SAI2 sub-block B audio kernel clock source selection
      output: sai_b_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SAI2BSEL
    - name: USART16910SEL
      description: USART1, USART6, UART9, USART10 kernel clock source selection (H7A3_B groups four instances; the H742_H753 USART16SEL covered just USART1/6)
      output: usart16910_ker_ck
      inputs:
        - rcc_pclk2
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
        - csi_ker_ck
        - lse_ck
        - 
        - 
      control:
        reg: CDCCIP2R
        field: USART16910SEL
    - name: USART234578SEL
      description: USART2/3, UART4/5/7/8 kernel clock source selection
      output: usart234578_ker_ck
      inputs:
        - rcc_pclk1
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
        - csi_ker_ck
        - lse_ck
        - 
        - 
      control:
        reg: CDCCIP2R
        field: USART234578SEL
    - name: I2C123SEL
      description: I2C1/2/3 kernel clock source selection
      output: i2c123_ker_ck
      inputs:
        - rcc_pclk1
        - pll3_r_ck
        - hsi_ker_ck
        - csi_ker_ck
      control:
        reg: CDCCIP2R
        field: I2C123SEL
    - name: USBSEL
      description: USB1/2 OTG kernel clock source selection
      output: usb_ker_ck
      inputs:
        - ''
        - pll1_q_ck
        - pll3_q_ck
        - hsi48_ck
      control:
        reg: CDCCIP2R
        field: USBSEL
    - name: RNGSEL
      description: RNG kernel clock source selection
      output: rng_ker_ck
      inputs:
        - hsi48_ck
        - pll1_q_ck
        - lse_ck
        - lsi_ck
      control:
        reg: CDCCIP2R
        field: RNGSEL
    - name: CECSEL
      description: HDMI-CEC kernel clock source selection
      output: cec_ker_ck
      inputs:
        - lse_ck
        - lsi_ck
        - csi_ker_div122
        - ''
      control:
        reg: CDCCIP2R
        field: CECSEL
    - name: LPTIM1SEL
      description: LPTIM1 kernel clock source selection
      output: lptim1_ker_ck
      inputs:
        - rcc_pclk1
        - pll2_p_ck
        - pll3_r_ck
        - lse_ck
        - lsi_ck
        - per_ck
        - 
        - 
      control:
        reg: CDCCIP2R
        field: LPTIM1SEL
    - name: SPI6SEL
      description: SPI6 kernel clock source selection
      output: spi6_ker_ck
      inputs:
        - rcc_pclk4
        - pll2_q_ck
