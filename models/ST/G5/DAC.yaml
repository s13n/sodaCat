name: DAC
description: Address block description
groupName: DAC
source: stm32g5xx-dfp 2.0.0/STM32G564 SVD v2.0.0
registers:
  - name: CR
    displayName: CR
    description: Control register
    addressOffset: 0
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: EN1
        description: DAC channel1 enable
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: DAC channel1 disabled
            value: 0
          - name: B_0x1
            description: DAC channel1 enabled
            value: 1
      - name: TEN1
        description: DAC channel1 trigger enable
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: DAC channel1 trigger disabled and data written into the DAC_DHR1 register are transferred one dac_ker_ck clock cycle later to the DAC_DOR1 register
            value: 0
          - name: B_0x1
            description: DAC channel1 trigger enabled and data from the DAC_DHR1 register are transferred three dac_ker_ck clock cycles later to the DAC_DOR1 register
            value: 1
      - name: TSEL1
        description: 'TSEL1[3:0]: DAC channel1 trigger selection'
        bitOffset: 2
        bitWidth: 4
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SWTRIG1
            value: 0
          - name: B_0x1
            description: dac_ch1_trg1
            value: 1
          - name: B_0x2
            description: dac_ch1_trg2
            value: 2
      - name: WAVE1
        description: DAC channel1 noise/triangle wave generation enable
        bitOffset: 6
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: wave generation disabled
            value: 0
          - name: B_0x1
            description: Noise wave generation enabled
            value: 1
          - name: B_0x2
            description: Triangle wave generation enabled
            value: 2
          - name: B_0x3
            description: Sawtooth wave generation enabled
            value: 3
      - name: MAMP1
        description: DAC channel1 mask/amplitude selector
        bitOffset: 8
        bitWidth: 4
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Unmask bit0 of LFSR/ triangle amplitude equal to 1
            value: 0
          - name: B_0x1
            description: Unmask bits[1:0] of LFSR/ triangle amplitude equal to 3
            value: 1
          - name: B_0x2
            description: Unmask bits[2:0] of LFSR/ triangle amplitude equal to 7
            value: 2
          - name: B_0x3
            description: Unmask bits[3:0] of LFSR/ triangle amplitude equal to 15
            value: 3
          - name: B_0x4
            description: Unmask bits[4:0] of LFSR/ triangle amplitude equal to 31
            value: 4
          - name: B_0x5
            description: Unmask bits[5:0] of LFSR/ triangle amplitude equal to 63
            value: 5
          - name: B_0x6
            description: Unmask bits[6:0] of LFSR/ triangle amplitude equal to 127
            value: 6
          - name: B_0x7
            description: Unmask bits[7:0] of LFSR/ triangle amplitude equal to 255
            value: 7
          - name: B_0x8
            description: Unmask bits[8:0] of LFSR/ triangle amplitude equal to 511
            value: 8
          - name: B_0x9
            description: Unmask bits[9:0] of LFSR/ triangle amplitude equal to 1023
            value: 9
          - name: B_0xA
            description: Unmask bits[10:0] of LFSR/ triangle amplitude equal to 2047
            value: 10
