    blocks:
      ACOMP:
        from: LPC865.ACOMP
        instances: [ACOMP]
        outputs:
          CMP: COMPEDGE
          CMP_CAPT: COMPEDGE
          COMPEDGE: COMPEDGE
      ADC:
        from: LPC865.ADC0
        instances: [ADC, ADC0]
        outputs:
          ADC0_SEQA: SEQA
          ADC0_SEQB: SEQB
          ADC0_THCMP: THCMP
          ADC0_OVR: OVR
          ADC_SEQA: SEQA
          ADC_SEQB: SEQB
          ADC_THCMP: THCMP
          ADC_OVR: OVR
      CAPT:
        from: LPC845.CAPT
        instances: [CAPT]
        outputs:
          CMP_CAPT: CAPT
      CRC:
        uses: CRC
        instances: [CRC]
      CTIMER:
        uses: CTIMER
        instances: [CTIMER0]
        outputs:
          CTIMER0: CTIMER
      DAC:
        from: LPC845.DAC0
        instances: [DAC0, DAC1]
        outputs:
          DAC0: DAC
          PIN_INT5_DAC1: DAC
      SmartDMA:
        from: LPC865.DMA0
        instances: [DMA0]
        outputs:
          DMA0: DMA
        params:
          - {name: max_channel, type: int, default: 15, max: 15, description: Index of last DMA channel}
      FLASH_CTRL:
        from: LPC865.FLASH_CTRL
        instances: [FLASH_CTRL]
        outputs:
          FLASH: FLASH
      FTM:
        from: LPC865.FTM0
        instances: [FTM0, FTM1]
        outputs:
          FTM0: FTM
        transforms:
          - {type: renameRegisters, pattern: "^CONTROLS\\[%s\\]$", replacement: "C[%s]"}
          - {type: renameRegisters, pattern: "^CSC$", replacement: SC}
          - {type: renameRegisters, pattern: "^CV$", replacement: V}
        params:
          - {name: max_channel, type: int, default: 5, max: 5, description: Index of last timer channel}
          - {name: qdec, type: bool, default: false, description: Quadrature decoder present}
          - {name: dither, type: bool, default: true, description: PWM dithering support}
          - {name: fault_inputs, type: int, default: 4, max: 4, description: Number of fault inputs}
          - {name: modulation, type: bool, default: false, description: Modulation support}
      GPIO:
        uses: GPIO
        instances: [GPIO]
      I2C:
        from: LPC865.I2C0
        instances: [I2C0, I2C1, I2C2, I2C3]
        outputs:
          I2C0: I2C
        params:
          - {name: rx_req, type: int, description: DMA receive channel}
          - {name: tx_req, type: int, description: DMA transmit channel}
      I3C:
        from: LPC864.I3C0
        instances: [I3C0]
        outputs:
          I3C0: I3C
        params:
          - {name: rx_req, type: int, description: DMA receive channel}
          - {name: tx_req, type: int, description: DMA transmit channel}
      INPUTMUX:
        from: LPC865.INPUTMUX
        instances: [INPUTMUX]
        variants:
          LPC82x:
            from: LPC824.INPUTMUX
          LPC83x:
            from: LPC832.INPUTMUX
          LPC84x:
            from: LPC845.INPUTMUX
      IOCON:
        from: LPC865.IOCON
        instances: [IOCON]
      MRT:
        uses: MRT
        instances: [MRT0]
        outputs:
          MRT0: MRT
      PINT:
        uses: PINT
        instances: [PINT]
        outputs:
          PIN_INT0: INT0
          PIN_INT1: INT1
          PIN_INT2: INT2
          PIN_INT3: INT3
          PIN_INT4: INT4
          PIN_INT5: INT5
          PIN_INT6: INT6
          PIN_INT7: INT7
          PIN_INT5_DAC1: INT5
          PIN_INT6_USART3: INT6
          PIN_INT7_USART4: INT7
      PLU:
        from: LPC804.PLU
        instances: [PLU]
      PMU:
        from: LPC865.PMU
        instances: [PMU]
      SCT:
        uses: SCT
        instances: [SCT0]
        outputs:
          SCT0: INTR
      SPI:
        from: LPC865.SPI0
        instances: [SPI0, SPI1]
        outputs:
          SPI0: SPI
        params:
          - {name: rx_req, type: int, description: DMA receive channel}
          - {name: tx_req, type: int, description: DMA transmit channel}
          - {name: ssel_num, type: int, default: 4, max: 4, description: Number of SSEL signals}
      SWM:
        from: LPC865.SWM0
        instances: [SWM0]
        variants:
          LPC802:
            from: LPC802.SWM0
          LPC804:
            from: LPC804.SWM0
          LPC81x:
            from: LPC812.SWM0
          LPC82x:
            from: LPC824.SWM0
          LPC83x:
            from: LPC832.SWM0
          LPC84x:
            from: LPC845.SWM0
      SYSCON:
        from: LPC864.SYSCON
        instances: [SYSCON]
        outputs:
          BOD: BOD
        variants:
          LPC802:
            from: LPC802.SYSCON
          LPC804:
            from: LPC804.SYSCON
          LPC81x:
            from: LPC812.SYSCON
          LPC82x:
            from: LPC824.SYSCON
          LPC83x:
            from: LPC832.SYSCON
          LPC84x:
            from: LPC845.SYSCON
      USART:
        from: LPC865.USART0
        instances: [USART0, USART1, USART2, USART3, USART4]
        outputs:
          USART0: USART
          PIN_INT6_USART3: USART
          PIN_INT7_USART4: USART
        params:
          - {name: rx_req, type: int, description: DMA receive channel}
          - {name: tx_req, type: int, description: DMA transmit channel}
      WKT:
        from: LPC865.WKT
        instances: [WKT]
        outputs:
          WKT: WKT
      WWDT:
        uses: WWDT
        instances: [WWDT]
    chip_params:
      _all:
        _all:
          FTM1: {max_channel: 3, qdec: true, fault_inputs: 0}
          SCT0: {match_channels: 8, events: 8, outputs: 7}
          SPI1: {ssel_num: 2}
      LPC86x:
        LPC865:
          I2C0: {rx_req: 10, tx_req: 11}
          I3C0: {rx_req: 12, tx_req: 13}
          SPI0: {rx_req: 6, tx_req: 7}
          SPI1: {rx_req: 8, tx_req: 9}
          USART0: {rx_req: 0, tx_req: 1}
          USART1: {rx_req: 2, tx_req: 3}
          USART2: {rx_req: 4, tx_req: 5}
    chip_connections:
      LPC802:
        _all:
          ACOMP: {COMPEDGE: [NVIC.27]}
          MRT0: {MRT: [NVIC.26]}
          SYSCON: {BOD: [NVIC.29]}
          WWDT: {INTR: [NVIC.28]}
      LPC804:
        _all:
          ACOMP: {COMPEDGE: [NVIC.27]}
          MRT0: {MRT: [NVIC.26]}
          SYSCON: {BOD: [NVIC.29]}
      LPC81x:
        _all:
          ACOMP: {COMPEDGE: [NVIC.27]}
          FLASH_CTRL: {FLASH: [NVIC.30]}
          MRT0: {MRT: [NVIC.26]}
          SYSCON: {BOD: [NVIC.29]}
      LPC86x:
        _all:
          ACOMP: {COMPEDGE: [NVIC.27]}

