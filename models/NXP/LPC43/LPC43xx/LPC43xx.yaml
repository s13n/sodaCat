version: 1.0.0
family: LPC43xx
devices:
  - LPC4310
  - LPC4320
  - LPC4330
  - LPC4350
  - LPC4370
  - LPC43S10
  - LPC43S20
  - LPC43S30
  - LPC43S37
  - LPC43S50
  - LPC43S57
  - LPC43S67
clocks:
  instance: CGU
  signals:
    - name: irc_12mhz
      nominal: 12000000
      description: 12 MHz internal RC oscillator (always on, default boot clock)
    - name: osc_32khz
      nominal: 32768
      description: 32.768 kHz oscillator on RTCX1/RTCX2 pins (RTC and low-power timing)
    - name: xtal_clk
      min: 1000000
      max: 25000000
      description: Crystal oscillator on XTAL1/XTAL2 (1-25 MHz, or external clock in bypass mode)
    - name: enet_rx_clk_in
      max: 75000000
      description: Ethernet PHY receive clock (external pin, RMII/MII)
    - name: enet_tx_clk_in
      max: 75000000
      description: Ethernet PHY transmit clock (external pin, RMII/MII)
    - name: gp_clkin_in
      description: General-purpose external clock input pin (GP_CLKIN)
    - name: pll0usb_in
      description: PLL0USB_CTRL.CLK_SEL mux output
    - name: pll0usb_clk
      nominal: 480000000
      max: 480000000
      description: PLL0USB output (USB high-speed 480 MHz)
    - name: pll0audio_in
      description: PLL0AUDIO_CTRL.CLK_SEL mux output
    - name: pll0audio_clk
      description: PLL0AUDIO output (with optional fractional divider)
    - name: pll1_in_pre
      description: PLL1_CTRL.CLK_SEL mux output (before NSEL pre-divider)
    - name: pll1_in
      description: PLL1 phase-detector input (after NSEL pre-divider)
    - name: pll1_clk
      max: 204000000
      description: PLL1 output (main system PLL)
    - name: idiva_in
      description: IDIVA_CTRL.CLK_SEL mux output
    - name: idiva_clk
      description: IDIVA output (max divisor /4)
    - name: idivb_in
      description: IDIVB_CTRL.CLK_SEL mux output
    - name: idivb_clk
      description: IDIVB output (max divisor /16)
    - name: idivc_in
      description: IDIVC_CTRL.CLK_SEL mux output
    - name: idivc_clk
      description: IDIVC output (max divisor /16)
    - name: idivd_in
      description: IDIVD_CTRL.CLK_SEL mux output
    - name: idivd_clk
      description: IDIVD output (max divisor /16)
    - name: idive_in
      description: IDIVE_CTRL.CLK_SEL mux output
    - name: idive_clk
      description: IDIVE output (max divisor /256)
    - name: base_safe_clk
      max: 12000000
      description: 'Output stage 0: WWDT (always-on safe clock; IRC only)'
    - name: base_usb0_clk
      max: 480000000
      description: 'Output stage 1: USB0 high-speed (PLL0USB only)'
    - name: base_periph_clk
      max: 204000000
      description: 'Output stage 2: Cortex-M0SUB subsystem, SPI, SGPIO'
    - name: base_usb1_clk
      max: 204000000
      description: 'Output stage 3: USB1'
    - name: base_m4_clk
      max: 204000000
      description: 'Output stage 4: ARM Cortex-M4 core, APB blocks 0 & 2'
    - name: base_spifi_clk
      max: 204000000
      description: 'Output stage 5: SPIFI'
    - name: base_spi_clk
      max: 204000000
      description: 'Output stage 6: SPI'
    - name: base_phy_rx_clk
      max: 75000000
      description: 'Output stage 7: Ethernet PHY receive'
    - name: base_phy_tx_clk
      max: 75000000
      description: 'Output stage 8: Ethernet PHY transmit'
    - name: base_apb1_clk
      max: 204000000
      description: 'Output stage 9: APB peripheral block 1'
    - name: base_apb3_clk
      max: 204000000
      description: 'Output stage 10: APB peripheral block 3'
    - name: base_lcd_clk
      max: 204000000
      description: 'Output stage 11: LCD'
    - name: base_adchs_clk
      max: 80000000
      description: 'Output stage 12: ADCHS (LPC4370/LPC43S70 only)'
    - name: base_sdio_clk
      max: 204000000
      description: 'Output stage 13: SD/MMC'
    - name: base_ssp0_clk
      max: 204000000
      description: 'Output stage 14: SSP0'
    - name: base_ssp1_clk
      max: 204000000
      description: 'Output stage 15: SSP1'
    - name: base_uart0_clk
      max: 204000000
      description: 'Output stage 16: UART0'
    - name: base_uart1_clk
      max: 204000000
      description: 'Output stage 17: UART1'
    - name: base_uart2_clk
      max: 204000000
      description: 'Output stage 18: UART2'
    - name: base_uart3_clk
      max: 204000000
      description: 'Output stage 19: UART3'
    - name: base_out_clk
      max: 204000000
      description: 'Output stage 20: CLKOUT pin'
    - name: base_audio_clk
      max: 204000000
      description: 'Output stage 25: I2S audio system'
    - name: base_cgu_out0_clk
      max: 204000000
      description: 'Output stage 26: CGU_OUT0 pin'
    - name: base_cgu_out1_clk
      max: 204000000
      description: 'Output stage 27: CGU_OUT1 pin'
    - name: clk_apb3_bus
    - name: clk_apb3_i2c1
    - name: clk_apb3_dac
    - name: clk_apb3_adc0
    - name: clk_apb3_adc1
    - name: clk_apb3_can0
    - name: clk_apb1_bus
    - name: clk_apb1_motoconpwm
    - name: clk_apb1_i2c0
    - name: clk_apb1_i2s
    - name: clk_apb1_can1
    - name: clk_spifi
    - name: clk_m4_bus
    - name: clk_m4_spifi
    - name: clk_m4_gpio
    - name: clk_m4_lcd
    - name: clk_m4_ethernet
    - name: clk_m4_usb0
    - name: clk_m4_emc
    - name: clk_m4_sdio
    - name: clk_m4_dma
    - name: clk_m4_m4core
    - name: clk_m4_sct
    - name: clk_m4_usb1
    - name: clk_m4_flasha
    - name: clk_m4_flashb
    - name: clk_m4_m0app
    - name: clk_m4_adchs
    - name: clk_m4_eeprom
    - name: clk_m4_wwdt
    - name: clk_m4_usart0
    - name: clk_m4_uart1
    - name: clk_m4_ssp0
    - name: clk_m4_timer0
    - name: clk_m4_timer1
    - name: clk_m4_scu
    - name: clk_m4_creg
    - name: clk_m4_ritimer
    - name: clk_m4_usart2
    - name: clk_m4_usart3
    - name: clk_m4_timer2
    - name: clk_m4_timer3
    - name: clk_m4_ssp1
    - name: clk_m4_qei
    - name: clk_periph_bus
    - name: clk_periph_core
    - name: clk_periph_sgpio
    - name: clk_usb0
    - name: clk_usb1
    - name: clk_spi
    - name: clk_adchs
    - name: clk_audio
    - name: clk_apb2_usart3
    - name: clk_apb2_usart2
    - name: clk_apb0_uart1
    - name: clk_apb0_usart0
    - name: clk_apb2_ssp1
    - name: clk_apb0_ssp0
    - name: clk_sdio
    - name: clk_m4_emcdiv_gated
      description: BASE_M4_CLK gated by CLK_M4_EMCDIV_CFG.RUN, before DIV
    - name: clk_m4_emcdiv
      description: EMC clock with optional divide-by-1/2 (CLK_M4_EMCDIV_CFG.DIV); see also CREG6.EMC_CLK_SEL bit 16
  generators:
    - name: IRC
      output: irc_12mhz
      description: 12 MHz internal RC oscillator. No CGU power control; always running.
    - name: OSC32K
      output: osc_32khz
      description: 32.768 kHz oscillator (RTCX1/RTCX2). Power control lives in the RTC peripheral, not in CGU.
    - name: XTAL
      output: xtal_clk
      control:
        reg: XTAL_OSC_CTRL
        field: ENABLE
        values:
          - 1
          - 0
        state: stateXTAL_CLK
      description: Crystal oscillator (XTAL1/XTAL2). XTAL_OSC_CTRL also has BYPASS (use external clock instead of crystal) and HF (1=15-25 MHz range, 0=1-20 MHz range).
    - name: ENET_RX_CLK
      output: enet_rx_clk_in
      control:
        state: stateENET_RX_CLK
      description: Ethernet PHY receive clock; presence depends on board wiring and PHY configuration.
    - name: ENET_TX_CLK
      output: enet_tx_clk_in
      control:
        state: stateENET_TX_CLK
      description: Ethernet PHY transmit clock; presence depends on board wiring and PHY configuration.
    - name: GP_CLKIN
      output: gp_clkin_in
      control:
        state: stateGP_CLKIN
      description: General-purpose clock input pin; presence depends on pin function selection.
  muxes:
    - name: PLL0USB_CLKSEL
      output: pll0usb_in
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
      control:
        reg: PLL0USB_CTRL
        field: CLK_SEL
      description: Source for PLL0USB. Encoding values 0x09, 0x0C-0x10 are also valid in hardware (PLL1, IDIVA-E) but omitted here to avoid graph cycles; values 0x05, 0x07-0x08, 0x0A-0x0B are reserved.
    - name: PLL0AUDIO_CLKSEL
      output: pll0audio_in
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
      control:
        reg: PLL0AUDIO_CTRL
        field: CLK_SEL
      description: Source for PLL0AUDIO. Encoding values 0x09, 0x0C-0x10 are also valid in hardware (PLL1, IDIVA-E) but omitted to avoid cycles.
    - name: PLL1_CLKSEL
      output: pll1_in_pre
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
      control:
        reg: PLL1_CTRL
        field: CLK_SEL
      description: Source for PLL1.  Encoding values 0x07-0x08 (PLL0USB, PLL0AUDIO) and 0x0C-0x10 (IDIVA-E) are valid in hardware but omitted to avoid cycles.
    - name: IDIVA_CLKSEL
      output: idiva_in
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - pll0usb_clk
        - pll0audio_clk
        - pll1_clk
      control:
        reg: IDIVA_CTRL
        field: CLK_SEL
      description: Source for IDIVA (4-bit divider, max /4). IDIVA can take any of the three PLLs but no other dividers.
    - name: IDIVB_CLKSEL
      output: idivb_in
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
      control:
        reg: IDIVB_CTRL
        field: CLK_SEL
      description: Source for IDIVB (4-bit divider, max /16). PLL0USB is not selectable; only IDIVA among the dividers.
    - name: IDIVC_CLKSEL
      output: idivc_in
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
      control:
        reg: IDIVC_CTRL
        field: CLK_SEL
      description: Source for IDIVC (4-bit divider, max /16). Same restrictions as IDIVB.
    - name: IDIVD_CLKSEL
      output: idivd_in
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
      control:
        reg: IDIVD_CTRL
        field: CLK_SEL
      description: Source for IDIVD (4-bit divider, max /16). Same restrictions as IDIVB.
    - name: IDIVE_CLKSEL
      output: idive_in
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
      control:
        reg: IDIVE_CTRL
        field: CLK_SEL
      description: Source for IDIVE (8-bit divider, max /256). Same restrictions as IDIVB.
    - name: BASE_SAFE_CLKSEL
      output: base_safe_clk
      inputs:
        - 
        - irc_12mhz
      control:
        reg: BASE_CLK[SAFE]
        field: CLK_SEL
      description: BASE_SAFE_CLK is hardwired to the IRC; CLK_SEL is read-only at 0x01.  Feeds the WWDT.
    - name: BASE_USB0_CLKSEL
      output: base_usb0_clk
      inputs:
        - 
        - 
        - 
        - 
        - 
        - 
        - 
        - pll0usb_clk
      control:
        reg: BASE_CLK[USB0]
        field: CLK_SEL
      description: BASE_USB0_CLK is hardwired to PLL0USB.  Feeds the high-speed USB0 controller.
    - name: BASE_USB1_CLKSEL
      output: base_usb1_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - pll0usb_clk
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[USB1]
        field: CLK_SEL
      description: Source for BASE_USB1_CLK (USB1).
    - name: BASE_OUT_CLKSEL
      output: base_out_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - pll0usb_clk
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[OUT]
        field: CLK_SEL
      description: Source for the CLKOUT pin.  Any clock generator output may be monitored.
    - name: BASE_CGU_OUT0_CLKSEL
      output: base_cgu_out0_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - pll0usb_clk
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[CGU_OUT0]
        field: CLK_SEL
      description: Source for the CGU_OUT0 pin.
    - name: BASE_CGU_OUT1_CLKSEL
      output: base_cgu_out1_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - pll0usb_clk
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[CGU_OUT1]
        field: CLK_SEL
      description: Source for the CGU_OUT1 pin.
    - name: BASE_PERIPH_CLKSEL
      output: base_periph_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[PERIPH]
        field: CLK_SEL
      description: Source for BASE_PERIPH_CLK (Cortex-M0SUB subsystem, SPI, SGPIO).
    - name: BASE_M4_CLKSEL
      output: base_m4_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[M4]
        field: CLK_SEL
      description: Source for BASE_M4_CLK (Cortex-M4 core + APB blocks 0 and 2).  Boot default is PLL1 at 96 MHz fed from IRC.
    - name: BASE_SPIFI_CLKSEL
      output: base_spifi_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[SPIFI]
        field: CLK_SEL
      description: Source for BASE_SPIFI_CLK (SPI flash interface).
    - name: BASE_SPI_CLKSEL
      output: base_spi_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[SPI]
        field: CLK_SEL
      description: Source for BASE_SPI_CLK (SPI master).
    - name: BASE_PHY_RX_CLKSEL
      output: base_phy_rx_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[PHY_RX]
        field: CLK_SEL
      description: Source for BASE_PHY_RX_CLK (Ethernet PHY receive clock).
    - name: BASE_PHY_TX_CLKSEL
      output: base_phy_tx_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[PHY_TX]
        field: CLK_SEL
      description: Source for BASE_PHY_TX_CLK (Ethernet PHY transmit clock).
    - name: BASE_APB1_CLKSEL
      output: base_apb1_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[APB1]
        field: CLK_SEL
      description: 'Source for BASE_APB1_CLK (APB peripheral block 1: I2C0, I2S, C_CAN1).'
    - name: BASE_APB3_CLKSEL
      output: base_apb3_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[APB3]
        field: CLK_SEL
      description: 'Source for BASE_APB3_CLK (APB peripheral block 3: I2C1, DAC, ADC0/1, C_CAN0).'
    - name: BASE_LCD_CLKSEL
      output: base_lcd_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[LCD]
        field: CLK_SEL
      description: Source for BASE_LCD_CLK (LCD pixel clock).
    - name: BASE_ADCHS_CLKSEL
      output: base_adchs_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[ADCHS]
        field: CLK_SEL
      description: Source for BASE_ADCHS_CLK (high-speed ADC; LPC4370/LPC43S70 only).
    - name: BASE_SDIO_CLKSEL
      output: base_sdio_clk
      inputs:
        - osc_32khz
        - irc_12mhz
        - enet_rx_clk_in
        - enet_tx_clk_in
        - gp_clkin_in
        - 
        - xtal_clk
        - 
        - pll0audio_clk
        - pll1_clk
        - 
        - 
        - idiva_clk
        - idivb_clk
        - idivc_clk
        - idivd_clk
        - idive_clk
      control:
        reg: BASE_CLK[SDIO]
        field: CLK_SEL
      description: Source for BASE_SDIO_CLK (SD/MMC controller).
    - name: BASE_SSP0_CLKSEL
      output: base_ssp0_clk
