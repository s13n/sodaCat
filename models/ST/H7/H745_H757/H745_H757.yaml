        field: LPTIM1SEL
    - name: SPI6SEL
      description: SPI6 kernel clock source selection
      output: spi6_ker_ck
      inputs:
        - rcc_pclk4
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
