version: 1.0.0
family: STM32H7
devices:
  - STM32H7A3
  - STM32H7B0
  - STM32H7B3
documents:
  - id: RM0455
    title: STM32H7A3/7B3 and STM32H7B0 Value line advanced Arm®-based 32-bit MCUs
    revision: '11'
    url: https://www.st.com/resource/en/reference_manual/rm0455-stm32h7a37b3-and-stm32h7b0-value-line-advanced-armbased-32bit-mcus-stmicroelectronics.pdf
clocks:
  instance: RCC
  signals:
    - name: hsi_osc
      description: High-speed internal RC oscillator raw output (before HSIDIV)
      nominal: 64000000
    - name: hsi_ck
      description: HSI clock after HSIDIV prescaler
      max: 64000000
    - name: hsi_ker_ck
      description: HSI kernel clock (same frequency as hsi_ck, gated by HSIKERON for Stop mode)
      max: 64000000
    - name: hse_ck
      description: High-speed external oscillator or clock input
      min: 4000000
      max: 48000000
    - name: csi_ck
      description: Low-power internal RC oscillator
      nominal: 4000000
    - name: csi_ker_ck
      description: CSI kernel clock (same frequency as csi_ck, gated by CSIKERON for Stop mode)
      nominal: 4000000
    - name: csi_ker_div122
      description: CSI kernel clock divided by 122 (for HDMI-CEC)
      nominal: 32786
    - name: lsi_ck
      description: Low-speed internal RC oscillator
      nominal: 32000
    - name: lse_ck
      description: Low-speed external crystal oscillator
      nominal: 32768
    - name: hsi48_ck
      description: 48 MHz internal RC oscillator (trimmable via CRS)
      nominal: 48000000
    - name: I2S_CKIN
      description: External I2S clock input pin
    - name: pll_src
      description: Common PLL source clock (before per-PLL prescalers)
    - name: ref1_ck
      description: PLL1 reference clock (after DIVM1 prescaler)
      min: 1000000
      max: 16000000
    - name: ref2_ck
      description: PLL2 reference clock (after DIVM2 prescaler)
      min: 1000000
      max: 16000000
    - name: ref3_ck
      description: PLL3 reference clock (after DIVM3 prescaler)
      min: 1000000
      max: 16000000
    - name: vco1_ck
      description: PLL1 VCO output
    - name: vco2_ck
      description: PLL2 VCO output
    - name: vco3_ck
      description: PLL3 VCO output
    - name: pll1_p_raw
      description: PLL1 P divider output (system clock candidate) (before enable gate)
      max: 480000000
    - name: pll1_p_ck
      description: PLL1 P divider output (system clock candidate) (gated)
      max: 480000000
    - name: pll1_q_raw
      description: PLL1 Q divider output (before enable gate)
      max: 480000000
    - name: pll1_q_ck
      description: PLL1 Q divider output (gated)
      max: 480000000
    - name: pll1_r_raw
      description: PLL1 R divider output (before enable gate)
      max: 480000000
    - name: pll1_r_ck
      description: PLL1 R divider output (gated)
      max: 480000000
    - name: pll2_p_raw
      description: PLL2 P divider output (before enable gate)
      max: 480000000
    - name: pll2_p_ck
      description: PLL2 P divider output (gated)
      max: 480000000
    - name: pll2_q_raw
      description: PLL2 Q divider output (before enable gate)
      max: 480000000
    - name: pll2_q_ck
      description: PLL2 Q divider output (gated)
      max: 480000000
    - name: pll2_r_raw
      description: PLL2 R divider output (before enable gate)
      max: 480000000
    - name: pll2_r_ck
      description: PLL2 R divider output (gated)
      max: 480000000
    - name: pll3_p_raw
      description: PLL3 P divider output (before enable gate)
      max: 480000000
    - name: pll3_p_ck
      description: PLL3 P divider output (gated)
      max: 480000000
    - name: pll3_q_raw
      description: PLL3 Q divider output (before enable gate)
      max: 480000000
    - name: pll3_q_ck
      description: PLL3 Q divider output (gated)
      max: 480000000
    - name: pll3_r_raw
      description: PLL3 R divider output (before enable gate)
      max: 480000000
    - name: pll3_r_ck
      description: PLL3 R divider output (gated)
      max: 480000000
    - name: sys_ck
      description: System clock
      max: 480000000
    - name: sys_cdcpre_ck
      description: D1 domain CPU prescaler output (CPU1 clock, rcc_c1_ck)
      max: 480000000
    - name: rcc_hclk
      description: AHB / AXI bus clock (all domains, also rcc_hclk1/2/3/4 and rcc_aclk)
      max: 240000000
    - name: rcc_pclk1
      description: APB1 peripheral bus clock (D2 domain)
      max: 120000000
    - name: rcc_pclk2
      description: APB2 peripheral bus clock (D2 domain)
      max: 120000000
    - name: rcc_pclk3
      description: APB3 peripheral bus clock (D1 domain)
      max: 120000000
    - name: rcc_pclk4
      description: APB4 peripheral bus clock (D3 domain)
      max: 120000000
    - name: rcc_timx_ker_ck
      description: Timer kernel clock for APB1 timers (TIM2-7, TIM12-14)
      max: 480000000
    - name: rcc_timy_ker_ck
      description: Timer kernel clock for APB2 timers (TIM1, TIM8, TIM15-17)
      max: 480000000
    - name: per_ck
      description: Direct kernel clock for peripherals (hsi/csi/hse selectable)
    - name: sdmmc_ker_ck
      description: SDMMC1/2 kernel clock
    - name: octospi_ker_ck
      description: OCTOSPI1/2 kernel clock (output of OCTOSPISEL mux)
    - name: fmc_ker_ck
      description: FMC kernel clock
    - name: fdcan_ker_ck
      description: FDCAN kernel clock
    - name: spi123_ker_ck
      description: SPI/I2S 1,2,3 kernel clock
    - name: spi45_ker_ck
      description: SPI 4,5 kernel clock
    - name: spi6_ker_ck
      description: SPI6 kernel clock
    - name: sai1_ker_ck
      description: SAI1 and DFSDM1 audio kernel clock
    - name: sai_a_ker_ck
      description: SAI2 sub-block A kernel clock (H7A3_B replaces SAI23/SAI4 with SAI2A/SAI2B)
    - name: sai_b_ker_ck
      description: SAI2 sub-block B kernel clock
    - name: usart16910_ker_ck
      description: USART1, USART6, UART9, USART10 kernel clock (H7A3_B groups four instances vs USART1/6 on H742_H753)
    - name: usart234578_ker_ck
      description: USART2/3, UART4/5/7/8 kernel clock
    - name: dfsdm2_ker_ck
      description: DFSDM2 processing clock (H7A3_B-specific; SRD-domain instance)
    - name: lpuart1_ker_ck
      description: LPUART1 kernel clock
    - name: i2c123_ker_ck
      description: I2C1/2/3 kernel clock
    - name: i2c4_ker_ck
      description: I2C4 kernel clock
    - name: lptim1_ker_ck
      description: LPTIM1 kernel clock
    - name: lptim2_ker_ck
      description: LPTIM2 kernel clock
    - name: lptim345_ker_ck
      description: LPTIM3/4/5 kernel clock
    - name: usb_ker_ck
      description: USB1/2 OTG kernel clock
    - name: adc_ker_ck
      description: ADC1/2/3 kernel clock
    - name: rng_ker_ck
      description: RNG kernel clock
    - name: spdif_ker_ck
      description: SPDIFRX kernel clock
    - name: cec_ker_ck
      description: HDMI-CEC kernel clock
    - name: swpmi_ker_ck
      description: SWPMI kernel clock
    - name: dfsdm1_ker_ck
      description: DFSDM1 processing clock
    - name: hse_rtc_ck
      description: HSE divided for RTC
    - name: rtc_pre
      description: RTC/AWU clock source (before enable gate)
    - name: rtc_ck
      description: RTC/AWU clock source (gated)
    - name: mco1
      description: Microcontroller clock output 1
    - name: mco2
      description: Microcontroller clock output 2
    - name: adc12_hclk
      max: 240000000
    - name: bdma1_hclk
      max: 240000000
    - name: bdma2_hclk
      max: 240000000
    - name: bkpram_hclk
      max: 240000000
    - name: crc_hclk
      max: 240000000
    - name: cryp_hclk
      max: 240000000
    - name: dcmi_pssi_hclk
      description: DCMI/PSSI shared bus interface clock (combined controller in H7A3_B)
      max: 240000000
    - name: dma1_hclk
      max: 240000000
    - name: dma2_hclk
      max: 240000000
    - name: dma2d_hclk
      max: 240000000
    - name: fmc_hclk
      max: 240000000
    - name: gfxmmu_hclk
      description: Graphics MMU bus interface clock (H7A3_B-specific peripheral)
      max: 240000000
    - name: gpioa_hclk
      max: 240000000
    - name: gpiob_hclk
      max: 240000000
    - name: gpioc_hclk
      max: 240000000
    - name: gpiod_hclk
      max: 240000000
    - name: gpioe_hclk
      max: 240000000
    - name: gpiof_hclk
      max: 240000000
    - name: gpiog_hclk
      max: 240000000
    - name: gpioh_hclk
      max: 240000000
    - name: gpioi_hclk
      max: 240000000
    - name: gpioj_hclk
      max: 240000000
    - name: gpiok_hclk
      max: 240000000
    - name: hash_hclk
      max: 240000000
    - name: hsem_hclk
      max: 240000000
    - name: jpgdec_hclk
      max: 240000000
    - name: mdma_hclk
      max: 240000000
    - name: octospi1_hclk
      description: OCTOSPI1 bus interface clock (H7A3_B-specific; replaces QUADSPI on H742_H753)
      max: 240000000
    - name: octospi2_hclk
      description: OCTOSPI2 bus interface clock
      max: 240000000
    - name: octospim_hclk
      description: OCTOSPI I/O Manager bus interface clock
      max: 240000000
    - name: rng_hclk
      max: 240000000
    - name: sdmmc1_hclk
      max: 240000000
    - name: sdmmc2_hclk
      max: 240000000
    - name: usb1otg_hclk
      description: USB1 OTG_HS bus interface clock (H7A3_B has only one USB OTG vs. two on H742_H753)
      max: 240000000
    - name: usb1ulpi_hclk
      description: USB1 ULPI PHY clock
      max: 240000000
    - name: cec_pclk
      max: 120000000
    - name: crs_pclk
      max: 120000000
    - name: dac1_pclk
      description: DAC1 APB1 bus interface clock (H7A3_B has separate DAC1 / DAC2 on different domains)
      max: 120000000
    - name: dac2_pclk
      description: DAC2 APB4 bus interface clock (Smart Run Domain)
      max: 120000000
    - name: fdcan_pclk
      max: 120000000
    - name: i2c1_pclk
      max: 120000000
    - name: i2c2_pclk
      max: 120000000
    - name: i2c3_pclk
      max: 120000000
    - name: lptim1_pclk
      max: 120000000
    - name: mdios_pclk
      max: 120000000
    - name: opamp_pclk
      max: 120000000
    - name: spdifrx_pclk
      max: 120000000
    - name: spi2_pclk
      max: 120000000
    - name: spi3_pclk
      max: 120000000
    - name: swpmi_pclk
      max: 120000000
    - name: tim12_pclk
      max: 120000000
    - name: tim13_pclk
      max: 120000000
    - name: tim14_pclk
      max: 120000000
    - name: tim2_pclk
      max: 120000000
    - name: tim3_pclk
      max: 120000000
    - name: tim4_pclk
      max: 120000000
    - name: tim5_pclk
      max: 120000000
    - name: tim6_pclk
      max: 120000000
    - name: tim7_pclk
      max: 120000000
    - name: uart4_pclk
      max: 120000000
    - name: uart5_pclk
      max: 120000000
    - name: uart7_pclk
      max: 120000000
    - name: uart8_pclk
      max: 120000000
    - name: usart2_pclk
      max: 120000000
    - name: usart3_pclk
      max: 120000000
    - name: dfsdm1_pclk
      max: 120000000
    - name: sai1_pclk
      max: 120000000
    - name: sai2_pclk
      max: 120000000
    - name: spi1_pclk
      max: 120000000
    - name: spi4_pclk
      max: 120000000
    - name: spi5_pclk
      max: 120000000
    - name: tim15_pclk
      max: 120000000
    - name: tim16_pclk
      max: 120000000
    - name: tim17_pclk
      max: 120000000
    - name: tim1_pclk
      max: 120000000
    - name: tim8_pclk
      max: 120000000
    - name: usart1_pclk
      max: 120000000
    - name: usart6_pclk
      max: 120000000
    - name: uart9_pclk
      description: UART9 APB2 bus interface clock (H7A3_B-specific)
      max: 120000000
    - name: usart10_pclk
      description: USART10 APB2 bus interface clock (H7A3_B-specific)
      max: 120000000
    - name: dfsdm2_pclk
      description: DFSDM2 APB4 bus interface clock (Smart Run Domain)
      max: 120000000
    - name: ltdc_pclk
      max: 120000000
    - name: wwdg_pclk
      max: 120000000
    - name: comp12_pclk
      max: 120000000
    - name: i2c4_pclk
      max: 120000000
    - name: lptim2_pclk
      max: 120000000
    - name: lptim3_pclk
      max: 120000000
    - name: lpuart1_pclk
      max: 120000000
    - name: rtcapb_pclk
      max: 120000000
    - name: spi6_pclk
      max: 120000000
    - name: syscfg_pclk
      max: 120000000
    - name: vrefbuf_pclk
      max: 120000000
  generators:
    - name: HSI64
      description: 64 MHz high-speed internal RC oscillator
      output: hsi_osc
      control:
        reg: CR
        field: HSION
        values:
          - 0
          - 64000000
    - name: HSE
      description: High-speed external oscillator (4-48 MHz crystal or bypass)
      output: hse_ck
      control:
        state: freqHSE
        reg: CR
        field: HSEON
    - name: CSI
      description: 4 MHz low-power internal RC oscillator
      output: csi_ck
      control:
        reg: CR
        field: CSION
        values:
          - 0
          - 4000000
    - name: LSI
      description: 32 kHz low-speed internal RC oscillator
      output: lsi_ck
      control:
        reg: CSR
        field: LSION
        values:
          - 0
          - 32000
    - name: LSE
      description: 32.768 kHz low-speed external crystal oscillator
      output: lse_ck
      control:
        state: freqLSE
        reg: BDCR
        field: LSEON
    - name: HSI48
      description: 48 MHz internal RC oscillator (CRS trimmable)
      output: hsi48_ck
      control:
        reg: CR
        field: HSI48ON
        values:
          - 0
          - 48000000
    - name: I2S_CKIN
      description: External I2S clock input pin
      output: I2S_CKIN
  muxes:
    - name: PLLSRC
      description: Common source for all three PLLs
      output: pll_src
      inputs:
        - hsi_ck
        - csi_ck
        - hse_ck
        - ''
      control:
        reg: PLLCKSELR
        field: PLLSRC
    - name: SW
      description: System clock switch
      output: sys_ck
      inputs:
        - hsi_ck
        - csi_ck
        - hse_ck
        - pll1_p_ck
        - 
        - 
        - 
        - 
      control:
        reg: CFGR
        field: SW
    - name: CKPERSEL
      description: External peripheral clock source selection
      output: per_ck
      inputs:
        - hsi_ker_ck
        - csi_ker_ck
        - hse_ck
        - ''
      control:
        reg: CDCCIPR
        field: CKPERSEL
    - name: RTCSEL
      description: RTC clock source selection
      output: rtc_pre
      inputs:
        - ''
        - lse_ck
        - lsi_ck
        - hse_rtc_ck
      control:
        reg: BDCR
        field: RTCSEL
    - name: MCO1SEL
      description: Microcontroller clock output 1 source
      output: mco1
      inputs:
        - hsi_ck
        - lse_ck
        - hse_ck
        - pll1_q_ck
        - hsi48_ck
        - 
        - 
        - 
      control:
        reg: CFGR
        field: MCO1SEL
    - name: MCO2SEL
      description: Microcontroller clock output 2 source
      output: mco2
      inputs:
        - sys_ck
        - pll2_p_ck
        - hse_ck
        - pll1_p_ck
        - csi_ck
        - lsi_ck
        - 
        - 
      control:
        reg: CFGR
        field: MCO2SEL
    - name: SDMMCSEL
      description: SDMMC1/2 kernel clock source selection
      output: sdmmc_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_r_ck
      control:
        reg: CDCCIPR
        field: SDMMCSEL
    - name: OCTOSPISEL
      description: OCTOSPI1/2 kernel clock source selection (RM0455 Table 58)
      output: octospi_ker_ck
      inputs:
        - rcc_hclk
        - pll1_q_ck
        - pll2_r_ck
        - per_ck
      control:
        reg: CDCCIPR
        field: OCTOSPISEL
    - name: FMCSEL
      description: FMC kernel clock source selection
      output: fmc_ker_ck
      inputs:
        - rcc_hclk
        - pll1_q_ck
        - pll2_r_ck
        - per_ck
      control:
        reg: CDCCIPR
        field: FMCSEL
    - name: FDCANSEL
      description: FDCAN kernel clock source selection
      output: fdcan_ker_ck
      inputs:
        - hse_ck
        - pll1_q_ck
        - pll2_q_ck
        - ''
      control:
        reg: CDCCIP1R
        field: FDCANSEL
    - name: SWPSEL
      description: SWPMI kernel clock source selection
      output: swpmi_ker_ck
      inputs:
        - rcc_pclk1
        - hsi_ker_ck
      control:
        reg: CDCCIP1R
        field: SWPMISEL
    - name: DFSDM1SEL
      description: DFSDM1 processing clock source selection
      output: dfsdm1_ker_ck
      inputs:
        - rcc_pclk2
        - sys_ck
      control:
        reg: CDCCIP1R
        field: DFSDM1SEL
    - name: DFSDM2SEL
      description: DFSDM2 processing clock source selection (Smart Run Domain)
      output: dfsdm2_ker_ck
      inputs:
        - rcc_pclk4
        - sys_ck
      control:
        reg: SRDCCIPR
        field: DFSDM2SEL
    - name: SPDIFSEL
      description: SPDIFRX kernel clock source selection
      output: spdif_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_r_ck
        - pll3_r_ck
        - hsi_ker_ck
      control:
        reg: CDCCIP1R
        field: SPDIFRXSEL
    - name: SPI45SEL
      description: SPI4/5 kernel clock source selection
      output: spi45_ker_ck
      inputs:
        - rcc_pclk2
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
        - csi_ker_ck
        - hse_ck
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SPI45SEL
    - name: SPI123SEL
      description: SPI/I2S 1,2,3 kernel clock source selection
      output: spi123_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SPI123SEL
    - name: SAI1SEL
      description: SAI1 and DFSDM1 audio kernel clock source selection
      output: sai1_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SAI1SEL
    - name: SAI2ASEL
      description: SAI2 sub-block A audio kernel clock source selection (RM0455 Table 58; H7A3_B replaces SAI23SEL with split SAI2ASEL/SAI2BSEL)
      output: sai_a_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SAI2ASEL
    - name: SAI2BSEL
      description: SAI2 sub-block B audio kernel clock source selection
      output: sai_b_ker_ck
      inputs:
        - pll1_q_ck
        - pll2_p_ck
        - pll3_p_ck
        - I2S_CKIN
        - per_ck
        - 
        - 
        - 
      control:
        reg: CDCCIP1R
        field: SAI2BSEL
    - name: USART16910SEL
      description: USART1, USART6, UART9, USART10 kernel clock source selection (H7A3_B groups four instances; the H742_H753 USART16SEL covered just USART1/6)
      output: usart16910_ker_ck
      inputs:
        - rcc_pclk2
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
        - csi_ker_ck
        - lse_ck
        - 
        - 
      control:
        reg: CDCCIP2R
        field: USART16910SEL
    - name: USART234578SEL
      description: USART2/3, UART4/5/7/8 kernel clock source selection
      output: usart234578_ker_ck
      inputs:
        - rcc_pclk1
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
        - csi_ker_ck
        - lse_ck
        - 
        - 
      control:
        reg: CDCCIP2R
        field: USART234578SEL
    - name: I2C123SEL
      description: I2C1/2/3 kernel clock source selection
      output: i2c123_ker_ck
      inputs:
        - rcc_pclk1
        - pll3_r_ck
        - hsi_ker_ck
        - csi_ker_ck
      control:
        reg: CDCCIP2R
        field: I2C123SEL
    - name: USBSEL
      description: USB1/2 OTG kernel clock source selection
      output: usb_ker_ck
      inputs:
        - ''
        - pll1_q_ck
        - pll3_q_ck
        - hsi48_ck
      control:
        reg: CDCCIP2R
        field: USBSEL
    - name: RNGSEL
      description: RNG kernel clock source selection
      output: rng_ker_ck
      inputs:
        - hsi48_ck
        - pll1_q_ck
        - lse_ck
        - lsi_ck
      control:
        reg: CDCCIP2R
        field: RNGSEL
    - name: CECSEL
      description: HDMI-CEC kernel clock source selection
      output: cec_ker_ck
      inputs:
        - lse_ck
        - lsi_ck
        - csi_ker_div122
        - ''
      control:
        reg: CDCCIP2R
        field: CECSEL
    - name: LPTIM1SEL
      description: LPTIM1 kernel clock source selection
      output: lptim1_ker_ck
      inputs:
        - rcc_pclk1
        - pll2_p_ck
        - pll3_r_ck
        - lse_ck
        - lsi_ck
        - per_ck
        - 
        - 
      control:
        reg: CDCCIP2R
        field: LPTIM1SEL
    - name: SPI6SEL
      description: SPI6 kernel clock source selection
      output: spi6_ker_ck
      inputs:
        - rcc_pclk4
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
        - csi_ker_ck
        - hse_ck
        - 
        - 
      control:
        reg: SRDCCIPR
        field: SPI6SEL
    - name: ADCSEL
      description: ADC1/2/3 kernel clock source selection
