          - name: B_0x5
            description: rcc_pclk1 = rcc_hclk1 / 4
            value: 5
          - name: B_0x6
            description: rcc_pclk1 = rcc_hclk1 / 8
            value: 6
          - name: B_0x7
            description: rcc_pclk1 = rcc_hclk1 / 16
            value: 7
      - name: PPRE2
        description: APB high-speed prescaler (APB2)
        bitOffset: 8
        bitWidth: 3
        access: read-write
        enumeratedValues:
          - name: B_0x4
            description: rcc_pclk2 = rcc_hclk1 / 2
            value: 4
          - name: B_0x5
            description: rcc_pclk2 = rcc_hclk1 / 4
            value: 5
          - name: B_0x6
            description: rcc_pclk2 = rcc_hclk1 / 8
            value: 6
          - name: B_0x7
            description: rcc_pclk2 = rcc_hclk1 / 16
            value: 7
      - name: PPRE3
        description: APB low-speed prescaler (APB3)
        bitOffset: 12
        bitWidth: 3
        access: read-write
        enumeratedValues:
          - name: B_0x4
            description: rcc_pclk3 = rcc_hclk1 / 2
            value: 4
          - name: B_0x5
            description: rcc_pclk3 = rcc_hclk1 / 4
            value: 5
          - name: B_0x6
            description: rcc_pclk3 = rcc_hclk1 / 8
            value: 6
          - name: B_0x7
            description: rcc_pclk3 = rcc_hclk1 / 16
            value: 7
      - name: AHB1DIS
        description: AHB1 clock disable
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: AHB1 clock enabled, distributed to peripherals according to their dedicated clock enable control bits
            value: 0
          - name: B_0x1
            description: AHB1 clock disabled
            value: 1
      - name: AHB2DIS
        description: AHB2 clock disable
        bitOffset: 17
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: AHB2 clock enabled, distributed to peripherals according to their dedicated clock enable control bits
            value: 0
          - name: B_0x1
            description: AHB2 clock disabled
            value: 1
      - name: AHB4DIS
        description: AHB4 clock disable
        bitOffset: 19
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: AHB4 clock enabled, distributed to peripherals according to their dedicated clock enable control bits
            value: 0
          - name: B_0x1
            description: AHB4 clock disabled
            value: 1
      - name: APB1DIS
        description: APB1 clock disable value
        bitOffset: 20
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: APB1 clock enabled, distributed to peripherals according to their dedicated clock enable control bits
            value: 0
          - name: B_0x1
            description: APB1 clock disabled
            value: 1
      - name: APB2DIS
        description: APB2 clock disable value
        bitOffset: 21
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: APB2 clock enabled, distributed to peripherals according to their dedicated clock enable control bits
            value: 0
          - name: B_0x1
            description: APB2 clock disabled
            value: 1
      - name: APB3DIS
        description: APB3 clock disable value.
        bitOffset: 22
