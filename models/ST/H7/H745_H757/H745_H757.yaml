      control:
        reg: D2CCIP2R
        field: CECSEL
    - name: LPTIM1SEL
      description: LPTIM1 kernel clock source selection
      output: lptim1_ker_ck
      inputs:
        - rcc_pclk1
        - pll2_p_ck
        - pll3_r_ck
