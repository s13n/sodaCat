          - name: ENABLED
            value: 1
            description: Enabled
      - name: HPOUT1L_ENA
        bitOffset: 9
        bitWidth: 1
        description: Enables HPOUT1L input stage For normal operation, this bit should be set as the first step of the HPOUT1L Enable sequence.
        enumeratedValues:
          - name: DISABLED
            value: 0
            description: Disabled
          - name: ENABLED
            value: 1
            description: Enabled
      - name: HPOUT1R_ENA
        bitOffset: 8
        bitWidth: 1
        description: Enables HPOUT1R input stage For normal operation, this bit should be set as the first step of the HPOUT1R Enable sequence.
