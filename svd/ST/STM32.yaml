      _all:
        _all:
          # SVD bug (L552 / L562 v1.0): the LPTIM1 peripheral lists both the
          # LPTIM1 interrupt (vec 67 → NVIC.83) AND the LPTIM2 interrupt
          # (vec 68 → NVIC.84), while the LPTIM2 peripheral has no
          # interrupts at all.  Per RM0438 LPTIM1's IRQ is at vector 83 and
          # LPTIM2's at 84; move LPTIM2's IRQ to its correct instance.
          LPTIM1: {INTR: [NVIC.83]}
          LPTIM2: {INTR: [NVIC.84]}
