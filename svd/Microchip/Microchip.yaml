      TC:
        uses: TC
        instances: [TC0, TC1, TC2, TC3]
        # Each TC instance carries three timer-channel interrupts; canonicalise
        # them to INT0/INT1/INT2 within each instance (TC0–TC11 → modulo 3).
        outputs:
          TC0: INT0
          TC1: INT1
          TC2: INT2
          TC3: INT0
          TC4: INT1
          TC5: INT2
          TC6: INT0
          TC7: INT1
          TC8: INT2
          TC9: INT0
          TC10: INT1
          TC11: INT2

      # ====================================================================
      # SAME70-specific peripherals (MATRIX/PMC differ per SAM family)
      # ====================================================================
      MATRIX:
        from: ATSAME70Q21B.MATRIX
        instances: [MATRIX]

      PMC:
        from: ATSAME70Q21B.PMC
        instances: [PMC]
        outputs:
          PMC: INT

      # ====================================================================
      # ARM Cortex-M core peripherals (hand-maintained, cross-vendor)
      # ====================================================================
      NVIC:
        uses: NVIC
        instances: [NVIC]

      SCB:
        uses: SCB
        instances: [SCB]
        outputs:
          CCW: CCW
          CCF: CCF

      FPU:
        uses: FPU
        instances: [FPU]
        outputs:
          FPU: INT
          IXC: IXC

    chip_params:
      _all:
        _all:
          NVIC:
            priobits: 3
            interrupts: 74
          # Cortex-M7 has fault handlers (MMFAR/BFAR/CFSR) and L1 I/D caches.
          SCB:
            has_faults: true
            has_cache: true
          # Port E is limited to PE0..PE5 on the SAM E70/S70/V70/V71 family
          # (DS60001527).  PIC32CZ-CA70/MC70 inherit the same silicon design.
          PIOE:
            pins: 0x3F
          # UART instances re-use the unified USART model; turn off every
          # mode-specific feature flag so the IP-block's parameter struct
          # reflects what the simpler UART hardware actually provides.
          UART:
            handshake: false
            syncMode: false
            spiMode: false
            irdaCtrl: false
            rs485Ctrl: false
            manchester: false
            iso7816: false
            linMode: false
            lonMode: false
            multidrop: false
