          # ===========================================================================
          # PLLs
          # ===========================================================================
          plls:
            - name: PLL1
              description: Main system PLL (fractional-N)
              input: ref1_ck
              output: vco1_ck
              feedback_integer:
                reg: PLL1DIVR
                field: DIVN1
                value_range:
                  min: 3
                  max: 511
                  offset: 1
              feedback_fraction:
                reg: PLL1FRACR
                field: FRACN1
                value_range:
                  min: 0
                  max: 8191
              vco_limits:
                min: 150000000
                max: 960000000
              notes: 'Wide VCO (VCOH): 192-960 MHz; Medium VCO (VCOL): 150-420 MHz. Selected by PLL1VCOSEL in RCC_PLLCFGR.'

            - name: PLL2
              description: Auxiliary PLL 2 (fractional-N)
              input: ref2_ck
              output: vco2_ck
              feedback_integer:
                reg: PLL2DIVR
                field: DIVN2
                value_range:
                  min: 3
                  max: 511
                  offset: 1
              feedback_fraction:
                reg: PLL2FRACR
                field: FRACN2
                value_range:
                  min: 0
                  max: 8191
              vco_limits:
                min: 150000000
                max: 960000000

            - name: PLL3
              description: Auxiliary PLL 3 (fractional-N)
              input: ref3_ck
              output: vco3_ck
              feedback_integer:
                reg: PLL3DIVR
                field: DIVN3
                value_range:
                  min: 3
                  max: 511
                  offset: 1
              feedback_fraction:
                reg: PLL3FRACR
                field: FRACN3
                value_range:
                  min: 0
                  max: 8191
              vco_limits:
                min: 150000000
                max: 960000000

          # ===========================================================================
          # Dividers
          # ===========================================================================
          dividers:
            # --- HSI divider ---
            - name: HSIDIV
              description: HSI oscillator prescaler
              input: hsi_osc
              output: hsi_ck
              factor:
                reg: CR
                field: HSIDIV
                values: [1, 2, 4, 8]

            # --- CEC fixed divider ---
            - name: CSI_CEC_DIV
              description: Fixed /122 divider for HDMI-CEC from CSI kernel clock
              input: csi_ker_ck
              output: csi_ker_div122
              value: 122

            # --- PLL input prescalers ---
            - name: DIVM1
              description: PLL1 prescaler (division factor for PLL1 reference clock)
              input: pll_src
              output: ref1_ck
              factor:
                reg: PLLCKSELR
                field: DIVM1
                value_range:
                  min: 0
                  max: 63
              notes: Value 0 disables the prescaler (no clock). Values 1-63 divide by that amount.

            - name: DIVM2
              description: PLL2 prescaler (division factor for PLL2 reference clock)
              input: pll_src
              output: ref2_ck
              factor:
                reg: PLLCKSELR
                field: DIVM2
                value_range:
                  min: 0
                  max: 63

            - name: DIVM3
              description: PLL3 prescaler (division factor for PLL3 reference clock)
              input: pll_src
              output: ref3_ck
              factor:
                reg: PLLCKSELR
                field: DIVM3
                value_range:
                  min: 0
                  max: 63

            # --- PLL output dividers ---
            - name: DIVP1
              description: PLL1 P output divider
              input: vco1_ck
              output: pll1_p_raw
              factor:
                reg: PLL1DIVR
                field: DIVP1
                value_range:
                  min: 0
                  max: 127
                  offset: 1
              notes: Odd division factors not allowed for PLL1 P output

            - name: DIVQ1
              description: PLL1 Q output divider
              input: vco1_ck
              output: pll1_q_raw
              factor:
                reg: PLL1DIVR
                field: DIVQ1
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVR1
              description: PLL1 R output divider
              input: vco1_ck
              output: pll1_r_raw
              factor:
                reg: PLL1DIVR
                field: DIVR1
                value_range:
                  min: 1
                  max: 127
                  offset: 1
              notes: Field value 0 is not allowed

            - name: DIVP2
              description: PLL2 P output divider
              input: vco2_ck
              output: pll2_p_raw
              factor:
                reg: PLL2DIVR
                field: DIVP2
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVQ2
              description: PLL2 Q output divider
              input: vco2_ck
              output: pll2_q_raw
              factor:
                reg: PLL2DIVR
                field: DIVQ2
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVR2
              description: PLL2 R output divider
              input: vco2_ck
              output: pll2_r_raw
              factor:
                reg: PLL2DIVR
                field: DIVR2
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVP3
              description: PLL3 P output divider
              input: vco3_ck
              output: pll3_p_raw
              factor:
                reg: PLL3DIVR
                field: DIVP3
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVQ3
              description: PLL3 Q output divider
              input: vco3_ck
              output: pll3_q_raw
              factor:
