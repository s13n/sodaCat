        enumeratedValues:
          - name: B_0x0
            description: The timer operates in single-shot mode and stops when it reaches TIMxPER value
            value: 0
          - name: B_0x1
            description: The timer operates in continuous mode and rolls over to zero when it reaches TIMxPER value
            value: 1
      - name: RETRIG
        description: Re-triggerable mode
        bitOffset: 4
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: 'The timer is not re-triggerable: a counter reset is done if the counter is stopped (period elapsed in single-shot mode or counter stopped in continuous mode)'
            value: 0
          - name: B_0x1
            description: 'The timer is re-triggerable: a counter reset is done whatever the counter state.'
            value: 1
