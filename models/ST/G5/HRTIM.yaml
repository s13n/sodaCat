  - name: TIMACR
    displayName: TIMACR
    description: Timer A control register
    addressOffset: 256
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: CKPSCA
        description: HRTIM timer x clock prescaler
        bitOffset: 0
        bitWidth: 3
        access: read-write
      - name: CONT
        description: Continuous mode
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: The timer operates in single-shot mode and stops when it reaches TIMxPER value
            value: 0
          - name: B_0x1
            description: The timer operates in continuous mode and rolls over to zero when it reaches TIMxPER value
            value: 1
      - name: RETRIG
        description: Re-triggerable mode
        bitOffset: 4
        bitWidth: 1
