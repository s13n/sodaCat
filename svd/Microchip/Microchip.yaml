        - {name: QSPI_CLK, input: mck, output: periph_clk_qspi, control: {reg: PCER1, field: PID43}}
        - {name: UART2_CLK, input: mck, output: periph_clk_uart2, control: {reg: PCER1, field: PID44}}
        - {name: UART3_CLK, input: mck, output: periph_clk_uart3, control: {reg: PCER1, field: PID45}}
        - {name: UART4_CLK, input: mck, output: periph_clk_uart4, control: {reg: PCER1, field: PID46}}
        - {name: TC2_CH0_CLK, input: mck, output: periph_clk_tc2_ch0, control: {reg: PCER1, field: PID47}}
