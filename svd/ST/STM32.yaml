              control: {reg: 'C1_AHB3ENR', field: DMA2DEN}
            - name: JPGDECEN
              description: JPEG decoder clock enable
              input: rcc_hclk
              output: jpgdec_hclk
              control: {reg: 'C1_AHB3ENR', field: JPGDECEN}
            - name: FMCEN
