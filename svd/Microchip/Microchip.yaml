        uses: TPI
        instances: [TPI]

      TRAM:
        uses: TRAM
        instances: [TRAM]
        outputs:
          TRAM: INT

      # ====================================================================
      # PIC32CZ-CA90 family-level peripherals (Gen2 register layouts
      # for blocks whose names also appear in SAM-Gen1 — extracted into
      # models/Microchip/PIC32CZ-CA90/<Block>.yaml).
      # ====================================================================
      MLB:
        from: PIC32CZ8110CA90208.MLB
        instances: [MLB]
        outputs:
          MLB_GENERAL: GENERAL
          MLB_BUSREQ: BUSREQ

      RSTC:
        from: PIC32CZ8110CA90208.RSTC
        instances: [RSTC]

      RTC:
        from: PIC32CZ8110CA90208.RTC
        instances: [RTC]
        outputs:
          RTC_TAMPER: TAMPER
          RTC_OVF: OVF
          RTC_PERIOD: PERIOD
          RTC_COMPARE: COMPARE

      SUPC:
        from: PIC32CZ8110CA90208.SUPC
        instances: [SUPC]
        outputs:
          SUPC: INT

      TRNG:
        from: PIC32CZ8110CA90208.TRNG
        instances: [TRNG]
        outputs:
          TRNG: INT

      USBHS:
        from: PIC32CZ8110CA90208.USBHS0
        instances: [USBHS0, USBHS1]
        outputs:
          USBHS0: INT
          USBHS1: INT

      WDT:
        from: PIC32CZ8110CA90208.WDT
        instances: [WDT]
        outputs:
          WDT: INT

      # ====================================================================
      # CA90-only: hardware security module
      # ====================================================================
      HSM:
        from: PIC32CZ8110CA90208.HSM
        instances: [HSM]
        outputs:
          HSM: INT

      # ====================================================================
      # ARM Cortex-M core peripherals (hand-maintained, cross-vendor)
      # ====================================================================
      NVIC:
        uses: NVIC
        instances: [NVIC]

      FPU:
        uses: FPU
        instances: [FPU]
        outputs:
          FPU: INT
          IXC: IXC

    chip_params:
      _all:
        _all:
          NVIC:
            priobits: 3
            interrupts: 222   # per SVD deviceNumInterrupts (Gen2 Cortex-M7)
          # SAMD-style SCB (named SystemControl in CA80/CA90 SVDs);
          # ARM-shared SCB hand-maintained model isn't referenced because
          # the SVD calls the instance SystemControl, not SCB.
