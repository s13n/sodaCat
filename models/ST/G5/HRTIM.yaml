            value: 0
          - name: B_0x1
            description: Master compare 1 interrupt occurred
            value: 1
      - name: MCMP2
        description: Master compare 2 interrupt flag
        bitOffset: 1
        bitWidth: 1
        access: read-only
      - name: MCMP3
        description: Master compare 3 interrupt flag
        bitOffset: 2
        bitWidth: 1
        access: read-only
      - name: MCMP4
