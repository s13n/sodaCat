name: HRTIM
description: Address block description
groupName: HRTIM
source: stm32g5xx-dfp 2.0.0/STM32G564 SVD v2.0.0
registers:
  - name: MCR
    displayName: MCR
    description: Master timer control register
    addressOffset: 0
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: CKPSC
        description: Clock prescaler
        bitOffset: 0
        bitWidth: 3
        access: read-write
      - name: CONT
        description: Continuous mode
        bitOffset: 3
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: The timer operates in single-shot mode and stops when it reaches the MPER value
            value: 0
          - name: B_0x1
            description: The timer operates in continuous (free-running) mode and rolls over to zero when it reaches the MPER value
            value: 1
      - name: RETRIG
        description: Re-triggerable mode
        bitOffset: 4
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: 'The timer is not re-triggerable: a counter reset can be done only if the counter is stopped (period elapsed)'
            value: 0
          - name: B_0x1
            description: 'The timer is re-triggerable: a counter reset is done whatever the counter state (running or stopped)'
            value: 1
      - name: HALF
        description: Half mode
        bitOffset: 5
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Half mode disabled
            value: 0
          - name: B_0x1
            description: Half mode enabled
            value: 1
      - name: INTLVD
        description: Interleaved mode
        bitOffset: 6
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Interleaved mode disabled
            value: 0
          - name: B_0x1
            description: 'Triple interleaved mode: when HRTIM_MPER register is written, the HRTIM_MCMP1R active register is automatically updated with HRTIM_MPER/3 value, and the HRTIM_MCMP2R active register is automatically updated with 2x (HRTIM_MPER/3) value.'
            value: 1
          - name: B_0x2
            description: 'Quad interleaved mode: when HRTIM_MPER register is written, the HRTIM_MCMP1R active register is automatically updated with HRTIM_MPER/4 value, the HRTIM_MCMP2R active register is automatically updated with HRTIM_MPER/2 value and the HRTIM_MCMP3R active register is automatically updated with 3x (HRTIM_MPER/4) value.'
            value: 2
          - name: B_0x3
            description: Interleaved mode disabled
            value: 3
      - name: SYNCIN
        description: Synchronization input
        bitOffset: 8
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Disabled. HRTIM is not synchronized and runs in standalone mode.
            value: 0
          - name: B_0x2
            description: 'Internal event on hrtim_in_sync[2]: the HRTIM is synchronized with the on-chip timer (see Section: Synchronization input).'
            value: 2
          - name: B_0x3
            description: 'External event on hrtim_in_sync[3]: a positive pulse on HRTIM_SCIN input triggers the HRTIM.'
            value: 3
      - name: SYNCRSTM
        description: Synchronization resets master
        bitOffset: 10
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: No effect on the master timer
            value: 0
          - name: B_0x1
            description: A synchronization input event resets the master timer
            value: 1
      - name: SYNCSTRTM
        description: Synchronization starts master
        bitOffset: 11
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: No effect on the master timer
            value: 0
          - name: B_0x1
            description: A synchronization input event starts the master timer
            value: 1
      - name: SYNCOUT
        description: Synchronization output
        bitOffset: 12
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Disabled
            value: 0
          - name: B_0x2
            description: Positive pulse on HRTIM_SCOUT output (16x fless thansub>HRTIMless than/sub> clock cycles)
            value: 2
          - name: B_0x3
            description: Negative pulse on HRTIM_SCOUT output (16x fless thansub>HRTIMless than/sub> clock cycles)
            value: 3
      - name: SYNCSRC
        description: Synchronization source
        bitOffset: 14
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Master timer start
            value: 0
          - name: B_0x1
            description: Master timer compare 1 event
            value: 1
          - name: B_0x2
            description: Timer A start/reset
            value: 2
          - name: B_0x3
            description: Timer A compare 1 event
            value: 3
      - name: MCEN
        description: Master timer counter enable
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Master counter disabled
            value: 0
          - name: B_0x1
            description: Master counter enabled
            value: 1
      - name: TACEN
        description: Timer A counter enable
        bitOffset: 17
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Timer A counter disabled
            value: 0
          - name: B_0x1
            description: Timer A counter enabled
            value: 1
      - name: TBCEN
        description: Timer B counter enable
        bitOffset: 18
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Timer B counter disabled
            value: 0
          - name: B_0x1
            description: Timer B counter enabled
            value: 1
      - name: TCCEN
        description: Timer C counter enable
        bitOffset: 19
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Timer C counter disabled
            value: 0
          - name: B_0x1
            description: Timer C counter enabled
            value: 1
      - name: TDCEN
        description: Timer D counter enable
        bitOffset: 20
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Timer D counter disabled
            value: 0
          - name: B_0x1
            description: Timer D counter enabled
            value: 1
      - name: TECEN
        description: Timer E counter enable
        bitOffset: 21
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Timer E counter disabled
            value: 0
          - name: B_0x1
            description: Timer E counter enabled
            value: 1
      - name: TFCEN
        description: Timer F counter enable
        bitOffset: 22
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Timer F counter disabled
            value: 0
          - name: B_0x1
            description: Timer F counter enabled
            value: 1
      - name: DACSYNC
        description: DAC synchronization
        bitOffset: 25
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: No DAC trigger generated
            value: 0
          - name: B_0x1
            description: Trigger generated on hrtim_dac_trg1
            value: 1
          - name: B_0x2
            description: Trigger generated on hrtim_dac_trg2
            value: 2
          - name: B_0x3
            description: Trigger generated on hrtim_dac_trg3
            value: 3
      - name: PREEN
        description: Preload enable
        bitOffset: 27
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: 'Preload disabled: the write access is directly done into the active register'
            value: 0
          - name: B_0x1
            description: 'Preload enabled: the write access is done into the preload register'
            value: 1
      - name: MREPU
        description: Master timer repetition update
        bitOffset: 29
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Update on repetition disabled
            value: 0
          - name: B_0x1
            description: Update on repetition enabled
            value: 1
      - name: BRSTDMA
        description: Burst DMA update
        bitOffset: 30
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Update done independently from the DMA burst transfer completion
            value: 0
          - name: B_0x1
            description: Update done when the DMA burst transfer is completed
            value: 1
          - name: B_0x2
            description: Update done on master timer roll-over following a DMA burst transfer completion. This mode only works in continuous mode.
            value: 2
  - name: MISR
    displayName: MISR
    description: Master timer interrupt status register
    addressOffset: 4
    size: 32
    access: read-only
    resetValue: 0
    resetMask: 4294967295
    fields:
