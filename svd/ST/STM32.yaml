          generators:
            - name: HSI64
              description: 64 MHz high-speed internal RC oscillator
              output: hsi_osc
              control:
                reg: CR
                field: HSION
                values: [0, 64000000]

            - name: HSE
              description: High-speed external oscillator (4-48 MHz crystal or bypass)
              output: hse_ck
              control:
                state: freqHSE
                reg: CR
                field: HSEON

            - name: CSI
              description: 4 MHz low-power internal RC oscillator
              output: csi_ck
              control:
                reg: CR
                field: CSION
                values: [0, 4000000]

            - name: LSI
              description: 32 kHz low-speed internal RC oscillator
              output: lsi_ck
              control:
                reg: CSR
                field: LSION
                values: [0, 32000]

            - name: LSE
              description: 32.768 kHz low-speed external crystal oscillator
              output: lse_ck
              control:
                state: freqLSE
                reg: BDCR
                field: LSEON

            - name: HSI48
              description: 48 MHz internal RC oscillator (CRS trimmable)
              output: hsi48_ck
              control:
                reg: CR
                field: HSI48ON
                values: [0, 48000000]

            - name: I2S_CKIN
              description: External I2S clock input pin
              output: I2S_CKIN

          # ===========================================================================
          # Muxes
          # ===========================================================================
