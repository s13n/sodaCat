    resetValue: 0
    fields:
      - name: SW_RESET
        bitOffset: 0
        bitWidth: 16
        description: Writing to this register resets all registers to their default state. (Note - Control Write Sequencer registers are not affected by Software Reset.) Reading from this register will indicate device family ID 8994h.
  - name: Power_Management_1
