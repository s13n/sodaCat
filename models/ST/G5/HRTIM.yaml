        bitOffset: 17
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Update on repetition disabled
            value: 0
          - name: B_0x1
            description: Update on repetition enabled
            value: 1
      - name: TARSTU
        description: Timer x reset update
        bitOffset: 18
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Update by timer x reset / roll-over disabled
            value: 0
          - name: B_0x1
            description: Update by timer x reset / roll-over enabled
            value: 1
      - name: TAU
        description: Timer A update
        bitOffset: 19
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Update by timer A disabled
            value: 0
          - name: B_0x1
            description: Update by timer A enabled
            value: 1
      - name: TBU
        description: Timer B update
        bitOffset: 20
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Update by timer B disabled
            value: 0
          - name: B_0x1
            description: Update by timer B enabled
            value: 1
      - name: TCU
        description: Timer C update
        bitOffset: 21
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Update by timer C disabled
            value: 0
          - name: B_0x1
            description: Update by timer C enabled
            value: 1
