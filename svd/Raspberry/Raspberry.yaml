            from: RP2350.BUSCTRL

      CLOCKS:
        from: RP2040.CLOCKS
        instances: [CLOCKS]
        outputs:
          CLOCKS_IRQ: IRQ
        transforms:
          - type: renameFields
            register: 'CLK_[A-Z0-9]+_SELECTED'
            pattern: 'CLK_[A-Z0-9]+_SELECTED'
            replacement: SELECTED
          - type: createClusterArray
            pattern: '^CLK_(\w+)_(CTRL|DIV|SELECTED)$'
            name: CLK
            dimIndex: [GPOUT0, GPOUT1, GPOUT2, GPOUT3, REF, SYS, PERI, USB, ADC, RTC]
            template: GPOUT0
        variants:
          RP2350:
            from: RP2350.CLOCKS
            transforms:
              - type: renameFields
                register: 'CLK_[A-Z0-9]+_SELECTED'
                pattern: 'CLK_[A-Z0-9]+_SELECTED'
                replacement: SELECTED
              - type: createClusterArray
                pattern: '^CLK_(\w+)_(CTRL|DIV|SELECTED)$'
                name: CLK
                dimIndex: [GPOUT0, GPOUT1, GPOUT2, GPOUT3, REF, SYS, PERI, HSTX, USB, ADC]
                template: GPOUT0

      DMA:
        from: RP2040.DMA
