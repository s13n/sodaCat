            description: DAC channel1 in normal operating mode
            value: 0
          - name: B_0x1
            description: DAC channel1 in calibration mode
            value: 1
      - name: TSEL1_1
        description: TSEL1[4]
        bitOffset: 15
        bitWidth: 1
        access: read-write
