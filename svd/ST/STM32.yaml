              input: rcc_hclk
              output: rng_hclk
              control: {reg: 'C1_AHB2ENR', field: RNGEN}
            - name: SDMMC2EN
              description: SDMMC2 peripheral clock enable
              input: rcc_hclk
              output: sdmmc2_hclk
              control: {reg: 'C1_AHB2ENR', field: SDMMC2EN}

            # =========================================================================
