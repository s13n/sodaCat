name: GIMA
description: Global Input Multiplexer Array (GIMA)
groupName: GIMA
source: LPC43xx_43Sxx.svd v10 (MCUX_2.16.100)
registers:
  - name: IN[%s]
    description: Input multiplexer entry — selects which signal is routed to the indexed destination (capture timer input, SCT input, ADC trigger, ...). Per UM10503 §17.4.
    addressOffset: 0
    dim: 30
    dimIncrement: 4
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: INV
        description: Invert input
        enumeratedValues:
          - name: NOT_INVERTED
            description: Not inverted.
            value: 0
          - name: INPUT_INVERTED
            description: Input inverted.
            value: 1
        bitOffset: 0
        bitWidth: 1
      - name: EDGE
        description: Enable rising edge detection
        enumeratedValues:
          - name: NO_EDGE
            description: No edge detection.
            value: 0
          - name: ENABLED
            description: Rising edge detection enabled.
            value: 1
        bitOffset: 1
        bitWidth: 1
      - name: SYNCH
        description: Enable   synchronization
        enumeratedValues:
          - name: DISABLE__SYNCHRONIZ
            description: Disable   synchronization.
            value: 0
          - name: ENABLE__SYNCHRONIZA
            description: Enable   synchronization.
            value: 1
        bitOffset: 2
        bitWidth: 1
      - name: PULSE
        description: Enable single pulse generation.
        enumeratedValues:
          - name: DISABLE
            description: Disable single pulse generation.
            value: 0
          - name: ENABLE
            description: Enable single pulse generation.
            value: 1
        bitOffset: 3
        bitWidth: 1
      - name: SELECT
        description: Select input. Values 0x3 to 0xF are reserved.
        enumeratedValues:
          - name: CTIN
            description: CTIN_0
            value: 0
          - name: SGPIO3
            description: SGPIO3
            value: 1
          - name: T0_CAP0
            description: T0_CAP0
            value: 2
        bitOffset: 4
        bitWidth: 4
    enumeratedIndices:
      name: Input
      description: GIMA destination identifier (UM10503 §17.4 input-multiplexer table).
      values:
        - name: CAP0_0
          value: 0
          description: Capture timer 0, capture channel 0
        - name: CAP0_1
          value: 1
          description: Capture timer 0, capture channel 1
        - name: CAP0_2
          value: 2
          description: Capture timer 0, capture channel 2
        - name: CAP0_3
          value: 3
          description: Capture timer 0, capture channel 3
        - name: CAP1_0
          value: 4
