# Consolidated configuration for NXP LPC model extraction.
# SVD files are fetched from https://github.com/nxp-mcuxpresso/mcux-soc-svd
# via CMake FetchContent. File layout: <chip>/<chip>.xml

svd:
  repo: https://github.com/nxp-mcuxpresso/mcux-soc-svd
  tag: MCUX_2.16.100

shared_blocks:
  WWDT:
    from: LPC865.WWDT
    params:
      - {name: has_debug_en, type: bool, default: false, description: Has DEBUG_EN field in MOD register}
    outputs:
      WDT: INTR
      WDT_BOD: INTR
      WWDT: INTR
      WWDT0: INTR
      WWDT1: INTR
    transforms:
      - type: patchFields
        register: MOD
        fields:
          - name: WDTOF
            enumeratedValues:
              - {name: CLEAR, description: No watchdog event, value: 0}
              - {name: RESET, description: Watchdog event occurred, value: 1}
          - name: WDINT
            modifiedWriteValues: oneToClear
            enumeratedValues:
              - {name: NO_FLAG, description: No flag, value: 0}
              - {name: FLAG, description: Flag, value: 1}
          - name: LOCK
            enumeratedValues:
              - {name: NO_LOCK, description: No Lock, value: 0}
              - {name: LOCK, description: Lock, value: 1}
          - name: DEBUG_EN
            description: Debug Enable
            bitOffset: 6
            bitWidth: 1
            access: read-write
            enumeratedValues:
              - {name: DISABLE, description: Disabled, value: 0}
              - {name: ENABLE, description: Enabled, value: 1}

  GPIO:
    from: LPC54S018.GPIO
    params:
      - {name: ports, type: int, default: 2, max: 6, description: Number of GPIO ports}

  CTIMER:
    from: LPC54S018.CTIMER0
    outputs:
      CTIMER0: CTIMER

  SCT:
    from: LPC54S018.SCT0
    params:
      - {name: match_channels, type: int, default: 16, max: 16, description: Number of match/capture channels}
      - {name: events, type: int, default: 16, max: 16, description: Number of events}
      - {name: outputs, type: int, default: 10, max: 16, description: Number of output channels}
      - {name: has_fractional_match, type: bool, default: false, description: Has DITHER and FRACMAT registers for fractional match}
    outputs:
      SCT0: INTR
      SCT: INTR
    transforms:
      - type: patchRegisters
        registers:
          - name: DITHER
            description: Dither Condition
            addressOffset: 24
            size: 32
            access: read-write
            resetValue: 0
            fields:
              - {name: DITHER_L, description: Dither Low, bitOffset: 0, bitWidth: 16, access: read-write}
              - {name: DITHER_H, description: Dither High, bitOffset: 16, bitWidth: 16, access: read-write}
          - name: FRACMAT[%s]
            dim: 16
            dimIncrement: 4
            description: Fractional Match
            addressOffset: 320
            size: 32
            access: read-write
            resetValue: 0
            fields:
              - {name: FRACMAT_L, description: Fractional Match Low, bitOffset: 0, bitWidth: 4, access: read-write}
              - {name: FRACMAT_H, description: Fractional Match High, bitOffset: 16, bitWidth: 4, access: read-write}
          - name: FRACMATREL[%s]
            dim: 16
            dimIncrement: 4
            description: Fractional Match Reload
            addressOffset: 576
            size: 32
            access: read-write
            resetValue: 0
            fields:
              - {name: RELFRAC_L, description: Reload Fractional Match Low, bitOffset: 0, bitWidth: 4, access: read-write}
              - {name: RELFRAC_H, description: Reload Fractional Match High, bitOffset: 16, bitWidth: 4, access: read-write}
      - type: patchFields
        register: DMAREQ0
        fields:
          - {name: DRQ0, access: read-only}
      - type: patchFields
        register: DMAREQ1
        fields:
          - {name: DRQ1, access: read-only}
      - type: patchFields
        register: CONFIG
        fields:
          - name: NORELOAD_L
            enumeratedValues:
              - {name: RELOAD, description: Reloaded, value: 0}
              - {name: NO_RELOAD, description: Not reloaded, value: 1}
          - name: NORELOAD_H
            enumeratedValues:
              - {name: RELOAD_H, description: Reloaded, value: 0}
              - {name: NO_RELOAD_H, description: Not reloaded, value: 1}
          - name: AUTOLIMIT_L
            enumeratedValues:
              - {name: DISABLE, description: Disables, value: 0}
              - {name: ENABLE, description: Enables, value: 1}
          - name: AUTOLIMIT_H
            enumeratedValues:
              - {name: DISABLE, description: Disables, value: 0}
              - {name: ENABLE, description: Enables, value: 1}
      - type: patchFields
        register: CTRL
        fields:
          - name: DOWN_L
            enumeratedValues:
              - {name: UP, description: Up, value: 0}
              - {name: DOWN, description: Down, value: 1}
          - name: STOP_L
            enumeratedValues:
              - {name: DISABLE, description: Disabled, value: 0}
              - {name: ENABLE, description: Enabled, value: 1}
          - name: HALT_L
            enumeratedValues:
              - {name: DISABLE, description: Disabled, value: 0}
              - {name: ENABLE, description: Enabled, value: 1}
          - name: DOWN_H
            enumeratedValues:
              - {name: UP, description: Up, value: 0}
              - {name: DOWN, description: Down, value: 1}
          - name: STOP_H
            enumeratedValues:
              - {name: DISABLE, description: Disabled, value: 0}
              - {name: ENABLE, description: Enabled, value: 1}
          - name: HALT_H
            enumeratedValues:
              - {name: DISABLE, description: Disable, value: 0}
              - {name: ENABLE, description: Enable, value: 1}

  CRC:
    from: LPC865.CRC

  MRT:
    from: LPC865.MRT0
    params:
      - {name: timer_bits, type: int, default: 31, description: Timer counter width in bits}
      - {name: has_modcfg, type: bool, default: false, description: Has MODCFG register and INUSE flags}
    transforms:
      - type: patchRegisters
        registers:
          - name: MODCFG
            description: Module Configuration register. This register provides information about this particular MRT instance, and allows choosing an overall mode for the idle channel feature.
            addressOffset: 240
            size: 32
            access: read-write
            resetValue: 371
            resetMask: 2147484159
            fields:
              - name: NOC
                description: Identifies the number of channels in this MRT.
                bitOffset: 0
                bitWidth: 4
                access: read-only
              - name: NOB
                description: Identifies the number of timer bits in this MRT.
                bitOffset: 4
                bitWidth: 5
                access: read-only
              - name: MULTITASK
                description: Selects the operating mode for the INUSE flags and the IDLE_CH register.
                bitOffset: 31
                bitWidth: 1
                access: read-write
                enumeratedValues:
                  - {name: HARDWARE_STATUS_MODE, description: Hardware status mode. In this mode, the INUSE(n) flags for all channels are reset.: null, value: 0}
                  - {name: MULTI_TASK_MODE, description: Multi-task mode., value: 1}
    outputs:
      MRT0: MRT

  PINT:
    from: LPC865.PINT
    outputs:
      PIN_INT0: INT0
      PIN_INT1: INT1
      PIN_INT2: INT2
      PIN_INT3: INT3
      PIN_INT4: INT4
      PIN_INT5: INT5
      PIN_INT6: INT6
      PIN_INT7: INT7
      PINT0: PINT

  UTICK:
    from: LPC54S018.UTICK0
    outputs:
      UTICK0: INTR

  LCD:
    from: LPC4350.LCD
    params:
      - {name: num_palette, type: int, default: 256, description: Number of palette entries}
    outputs:
      LCD: INTR

  ChipIdeaHS:
    # Synopsys/ChipIdea USB 2.0 OTG HS — the canonical model is owned by
    # MCX.yaml (extracted from MCXN947).  This stub carries only the
    # designer field so LPC43 chips emit `models: ChipIdeaHS:
    # Synopsys/ChipIdeaHS` rather than `NXP/ChipIdeaHS`.  No `from:` ⇒
    # not extracted here; the chip block uses `uses: ChipIdeaHS` to
    # reference the existing model file.
    designer: Synopsys
  PL08x:
    # ARM PrimeCell DMA Controller.  Two ARM-published variants share one
    # register layout: the full PL080 (DDI 0196) and the cut-down PL081
    # (DDI 0218).  Licensed IP used by NXP LPC17xx/LPC178x/LPC408x/LPC18xx/
    # LPC43xx/LPC24xx, ST SPEAr, ST-Ericsson Nomadik, Samsung S3C6410,
    # Faraday FTDMAC020, ARM RealView/Versatile reference platforms.  The
    # 32-bit-wide channel-mask register fields are synthesis headroom; no
    # known silicon uses more than 8 channels (PL080) or 2 (PL081).
    designer: ARM
    from: LPC4350.GPDMA
    description: ARM PrimeCell DMA Controller (PL080/PL081)
    # The PL080 IP has three interrupt outputs (DMACINTERR, DMACINTTC, and
    # the combined DMACINTR).  LPC43 only routes the combined OR to NVIC
    # (mapped per-family as DMA: COMBINED below); other SoCs (e.g. ARM
    # MPS2 reference designs) route all three.  Declare ERROR and TC here
    # as canonical-only entries so the shared model carries the IP's full
    # interrupt surface.  Keep them as synthetic raw_name: canonical pairs
    # because the LPC43 SVD doesn't supply raw names for them.
    outputs:
      ERROR: ERROR
      TC: TC
    params:
      - {name: pl081, type: int, default: 0, max: 1, description: "0 = PL080 (8 channels, 2 AHB masters); 1 = PL081 (2 channels only, single AHB master so CONFIG.M1 endianness bit, C[n].LLI.LM bit, and C[n].CONTROL.S/D master-select bits are reserved). Both variants share the same register layout."}
    transforms:
      - type: clusterArrays
        pattern: 'C%s(.+)'
        name: C
        description: DMA channel
  SPIFI:
    from: LPC54S018.SPIFI0
    # Memory-mapped flash windows.  Naming for the primary (code-capable)
    # window mirrors STM32 QUADSPI (`base`, `logsize`).  The optional
    # data-only secondary window is an LPC speciality: LPC43 exposes the
    # same flash twice — a code-capable window and a non-cacheable
    # data-only window.  Set `data_base = 0` to disable.
    params:
      - {name: base, type: int, default: 0, max: 255, description: 'Top 8 bits of memory-mapped base address (e.g. 0x14 = 0x14000000)'}
      - {name: logsize, type: int, default: 0, max: 31, description: 'Memory window size as log2 (26 = 64 MB)'}
      - {name: data_base, type: int, default: 0, max: 255, description: 'Top 8 bits of data-only memory-mapped base address (0 = no separate data window)'}
      - {name: data_logsize, type: int, default: 0, max: 31, description: 'Data-only window size as log2 (0 = none)'}
    outputs:
      SPIFI: INTR
      SPIFI0: INTR

families:
  LPC8:
    subfamilies:
      LPC802:
        chips: [LPC802]
        ref_manual: {name: UM11045, rev: "1.5", date: 2021-03-22, url: "https://www.nxp.com/webapp/Download?colCode=UM11045"}
      LPC804:
        chips: [LPC804]
        ref_manual: {name: UM11065, rev: "1.4", date: 2021-03-18, url: "https://www.nxp.com/webapp/Download?colCode=UM11065"}
      LPC81x:
        chips: [LPC810, LPC811, LPC812]
        ref_manual: {name: UM10601, rev: "1.7", date: 2021-05-27, url: "https://www.nxp.com/webapp/Download?colCode=UM10601"}
      LPC82x:
        chips: [LPC822, LPC824]
        ref_manual: {name: UM10800, rev: "1.4", date: 2021-05-27, url: "https://www.nxp.com/webapp/Download?colCode=UM10800"}
      LPC83x:
        chips: [LPC832, LPC834]
        ref_manual: {name: UM11021, rev: "1.1", date: 2016-10-05, url: "https://www.nxp.com/webapp/Download?colCode=UM11021"}
      LPC84x:
        chips: [LPC844, LPC845]
        ref_manual: {name: UM11029, rev: "1.7", date: 2021-04-14, url: "https://www.nxp.com/webapp/Download?colCode=UM11029"}
      LPC86x:
        chips: [LPC864, LPC865]
        ref_manual: {name: UM11607, rev: "3.1", date: 2025-11-07, url: "https://www.nxp.com/webapp/Download?colCode=UM11607"}
        inherits: NXP/LPC8/LPC86x/LPC86x
        clocks:
          instance: SYSCON
          signals:
            - {name: fro_oscout, nominal: 48000000, min: 36000000, max: 60000000, description: "The output of the FRO oscillator"}
            - {name: fro_div2, description: "FRO oscillator divided by 2"}
            - {name: fro}
            - {name: fro_div, description: "FRO output divided by 2 via FROOSCCTRL"}
            - {name: wkt_div}
            - {name: clkin, max: 25000000, description: "Internal clock that comes from the main CLKIN pin function."}
            - {name: sys_osc_clk, max: 25000000, description: "Internal clock that comes from external crystal oscillator"}
            - {name: external_clk, description: "Internal clock that comes from the crystal oscillator or the CLK_IN pin"}
            - {name: lp_osc, nominal: 1000000}
            - {name: pll_in, min: 10000000, max: 25000000}
            - {name: sys_pll0_clk, max: 100000000}
            - {name: pll_div_clk, description: "PLL output divided via SYSPLLDIV"}
            - {name: main_clk_pre_pll}
            - {name: main_clk, description: "The main clock used to generate the system clock and other clocks"}
            - {name: system_clk, max: 60000000, description: "The clock used for the CPU and the buses"}
            - {name: adc_clk, description: "ADC clock source selected via ADCCLKSEL"}
            - {name: adc_div_clk}
            - {name: clkout_src, description: "Clock source for CLKOUT pin"}
            - {name: clkout}
            - {name: frg0clksel, description: "Clock source for fractional rate generator 0"}
            - {name: frg0clk}
            - {name: frg1clksel, description: "Clock source for fractional rate generator 1"}
            - {name: frg1clk}
            - {name: lpwr_clk_vulp, nominal: 10000, min: 6000, max: 14000}
            - {name: lwpwr_clk_vulp}
            - {name: wdt_clk, description: "WWDT count clock (lp_osc gated by LPOSCEN.WDT_CLK_EN)"}
            - {name: wkt_lposc_clk, description: "WKT count clock from lp_osc (gated by LPOSCEN.WKT_CLK_EN)"}
            - {name: acmpclk}
            - {name: adc_sclk}
            - {name: crcclk}
            - {name: dmaclk}
            - {name: fclk0, description: "Functional clock for UART0"}
            - {name: fclk1, description: "Functional clock for UART1"}
            - {name: fclk10, description: "Functional clock for SPI1"}
            - {name: fclk2, description: "Functional clock for UART2"}
            - {name: fclk5, description: "Functional clock for I2C0"}
            - {name: fclk9, description: "Functional clock for SPI0"}
            - {name: flashclk}
            - {name: ftm0clk, description: "Register clock for FTM0"}
            - {name: ftm1clk, description: "Register clock for FTM1"}
            - {name: gpio0clk}
            - {name: gpio1clk}
            - {name: gpiointclk}
            - {name: i2c0clk}
            - {name: ioconclk, description: "Register clock for IOCON"}
            - {name: mrtclk}
            - {name: ramclk}
            - {name: romclk}
            - {name: spi0clk}
            - {name: spi1clk}
            - {name: swmclk}
            - {name: uart0clk}
            - {name: uart1clk}
            - {name: uart2clk}
            - {name: i3cclk, description: "Register clock for I3C"}
            - {name: i3cfclk}
            - {name: i3c_fclk}
            - {name: i3cslowtcclk}
            - {name: i3c_clk_slow_tc}
            - {name: i3c_clk_slow}
            - {name: ftm0fclk, description: "Counter clock for FTM0"}
            - {name: ftm1fclk, description: "Counter clock for FTM1"}
            - {name: ftm0_extclk, description: "External clock for FTM0"}
            - {name: ftm1_extclk, description: "External clock for FTM1"}
            - {name: wkt_counter_clk, description: "The counter clock in the WKT"}
            - {name: wkt_int_clk, description: "The WKT internal counter clock alternative"}
            - {name: wktclk}
            - {name: wktclkin, max: 10000000, description: "The clock at the WKTCLKIN input"}
            - {name: wwdtclk}
            - {name: ioconclkdiv0}
            - {name: ioconclkdiv1}
            - {name: ioconclkdiv2}
            - {name: ioconclkdiv3}
            - {name: ioconclkdiv4}
            - {name: ioconclkdiv5}
            - {name: ioconclkdiv6}

          generators:
            - name: FRO
              output: fro_oscout
              control:
                state: stateFRO
                set: |-
                  struct PWRD { void (*set_fro_freq)(unsigned); };
                  struct ROM { const PWRD *pPWRD; };
                  ROM **rom = (ROM **)0x0F001D98;
                  (*rom)->pPWRD->set_fro_freq(val/1000);
                values: [0, 36000000, 48000000, 60000000]
                default: 48000000
            - name: CLKIN
              output: clkin
              control:
                state: stateCLKIN
              description: Special function of PIO0_1
            - name: XTALIN
              output: sys_osc_clk
              control:
                state: stateXTAL
                reg: SYSOSCCTRL
                field: BYPASS
            - name: FTM0_EXTCLK
              output: ftm0_extclk
              control:
                state: stateFTM0ext
              description: External clock source for FTM0
            - name: FTM1_EXTCLK
              output: ftm1_extclk
              control:
                state: stateFTM1ext
              description: External clock source for FTM1
            - name: WKTCLKIN
              output: wktclkin
              control:
                state: stateWKTCLKIN
              description: Special function of PIO0_28
            - name: LPOSC
              output: lp_osc
            - name: ULPOSC
              output: lpwr_clk_vulp
              control:
                instance: PMU
                reg: DPDCTRL
                field: ULPOSCEN
                values: [0, 10000]

          muxes:
            - name: EXTCLKSEL
              output: external_clk
              inputs: [sys_osc_clk, clkin]
              control:
                reg: EXTCLKSEL
                field: SEL
            # WKT clocking uses three muxes. WKTCLKSEL is in SYSCON; the other two
            # (WKT_CLKSEL, WKT_EXTCLK) are in the WKT block via CTRL register bits.
            # Figures 7, 8, and 43 mislabel WKTCLKSEL as WKT_CTRL[CLKSEL].
            # Note: "low power clock" in WKT CTRL.CLKSEL description means the ULP
            # oscillator (~10 kHz), not lp_osc (~1 MHz). These are distinct oscillators.
            - name: WKTCLKSEL
              output: lwpwr_clk_vulp
              inputs: [fro, lp_osc]
              control:
                reg: WKTCLKSEL
                field: SEL
            - name: FROOSCCTRL
              output: fro
              inputs: [fro_div2, fro_oscout]
              control:
                reg: FROOSCCTRL
                field: FRO_DIRECT
            - name: SYSPLLCLKSEL
              output: pll_in
              inputs: [fro, external_clk, lp_osc, fro_div]
              control:
                reg: SYSPLLCLKSEL
                field: SEL
            - name: MAINCLKSEL
              output: main_clk_pre_pll
              inputs: [fro, external_clk, lp_osc, fro_div]
              control:
                reg: MAINCLKSEL
                field: SEL
              description: Selects main clock source before PLL
            - name: MAINCLKPLLSEL
              output: main_clk
              inputs: [main_clk_pre_pll, sys_pll0_clk, "", ""]
              control:
                reg: MAINCLKPLLSEL
                field: SEL
              description: Selects final main clock source (PLL or pre-PLL)
            - name: CLKOUTSEL
              output: clkout_src
              inputs: [fro, main_clk, pll_div_clk, external_clk, lp_osc, "", "", ""]
              control:
                reg: CLKOUTSEL
                field: SEL
            - name: ADCCLKSEL
              output: adc_clk
              inputs: [fro, pll_div_clk, "", ""]
              control:
                reg: ADCCLKSEL
                field: SEL
              description: Selects ADC clock source
            - name: FRG0CLKSEL
              output: frg0clksel
              inputs: [fro, main_clk, pll_div_clk, ""]
              control:
                reg: FRG[0].FRGCLKSEL
                field: SEL
            - name: FRG1CLKSEL
              output: frg1clksel
              inputs: [fro, main_clk, pll_div_clk, ""]
              control:
                reg: FRG[1].FRGCLKSEL
                field: SEL
            - name: UART0CLKSEL
              output: uart0clk
              inputs: [fro, main_clk, frg0clk, frg1clk, fro_div, "", "", ""]
              control:
                reg: FCLKSEL[0]
                field: SEL
            - name: UART1CLKSEL
              output: uart1clk
              inputs: [fro, main_clk, frg0clk, frg1clk, fro_div, "", "", ""]
              control:
                reg: FCLKSEL[1]
                field: SEL
            - name: UART2CLKSEL
              output: uart2clk
              inputs: [fro, main_clk, frg0clk, frg1clk, fro_div, "", "", ""]
              control:
                reg: FCLKSEL[2]
                field: SEL
            - name: SPI0CLKSEL
              output: spi0clk
              inputs: [fro, main_clk, frg0clk, frg1clk, fro_div, "", "", ""]
              control:
                reg: FCLKSEL2[0]
                field: SEL
            - name: SPI1CLKSEL
              output: spi1clk
              inputs: [fro, main_clk, frg0clk, frg1clk, fro_div, "", "", ""]
              control:
                reg: FCLKSEL2[1]
                field: SEL
            - name: I2C0CLKSEL
              output: i2c0clk
              inputs: [fro, main_clk, frg0clk, frg1clk, fro_div, "", "", ""]
              control:
                reg: FCLKSEL[5]
                field: SEL
            - name: I3CFCLKSEL
              output: i3cfclk
              inputs: [fro, external_clk, null, null, null, null, null, ""]
              control:
                reg: I3CCLKSEL
                field: SEL
            - name: I3CSLOWTCCLKSEL
              output: i3cslowtcclk
              inputs: [i3cfclk, lp_osc, null, null, null, null, null, ""]
              control:
                reg: I3CSLOWTCCLKSEL
                field: SEL
            - name: FTM0SC
              description: Clock multiplexer within the FTM.
              output: ftm0fclk
              inputs: ["", system_clk, null, ftm0_extclk]
              control:
                instance: FTM0
                reg: SC
                field: CLKS
            - name: FTM1SC
              description: Clock multiplexer within the FTM.
              output: ftm1fclk
              inputs: ["", system_clk, null, ftm1_extclk]
              control:
                instance: FTM1
                reg: SC
                field: CLKS
            - name: WKT_CLKSEL
              description: This is the first in a chain of multiplexers in the WKT. See UM11607 Fig 43.
              control:
                instance: WKT
                reg: CTRL
                field: CLKSEL
              inputs: [wkt_div, lpwr_clk_vulp]
              output: wkt_int_clk
            - name: WKT_EXTCLK
              description: This is the second in a chain of multiplexers in the WKT. See UM11607 Fig 43.
              control:
                instance: WKT
                reg: CTRL
                field: SEL_EXTCLK
              inputs: [wkt_int_clk, wktclkin]
              output: wkt_counter_clk

          plls:
            - name: SYSPLL
              input: pll_in
              output: sys_pll0_clk
              feedback_integer:
                reg: SYSPLLCTRL
                field: MSEL
                value_range: {min: 1, max: 32, offset: 1}
              post_divider:
                reg: SYSPLLCTRL
                field: PSEL
                values: [2, 4, 8, 16]
              vco_limits: {min: 156000000, max: 320000000}

          dividers:
            - name: FRO_HALF_DIV
              input: fro_oscout
              output: fro_div2
              value: 2
            - name: FRO_DIV
              input: fro
              output: fro_div
              value: 2
            - name: WKT_DIV
              input: lwpwr_clk_vulp
              output: wkt_div
              value: 16
              description: Divider in the WKT block
            - name: SYSPLLDIV
              input: sys_pll0_clk
              output: pll_div_clk
              factor:
                reg: SYSPLLDIV
                field: DIV
                value_range:
                  min: 0 # Zero turns off divider
                  max: 255
            - name: SYSAHBCLKDIV
              input: main_clk
              output: system_clk
              factor:
                reg: SYSAHBCLKDIV
                field: DIV
                value_range:
                  min: 0 # Zero turns off divider
                  max: 255
              description: Divides main clock to generate system clock
            - name: IOCONCLKDIV0
              input: main_clk
              output: ioconclkdiv0
              factor:
                reg: IOCONCLKDIV0
                field: DIV
                value_range:
                  min: 0 # Zero turns off divider
                  max: 255
            - name: IOCONCLKDIV1
              input: main_clk
              output: ioconclkdiv1
              factor:
                reg: IOCONCLKDIV1
                field: DIV
                value_range:
