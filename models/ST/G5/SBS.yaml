    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: LOCKNSVTOR
        description: VTOR_NS register lock
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: VTOR_NS register write enabled
            value: 0
          - name: B_0x1
            description: VTOR_NS register write disabled
            value: 1
      - name: LOCKNSMPU
        description: nonsecure MPU register lock
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: nonsecure MPU registers write enabled
            value: 0
          - name: B_0x1
            description: nonsecure MPU registers write disabled
            value: 1
  - name: CSLCKR
    displayName: CSLCKR
    description: CPU secure lock register
    addressOffset: 328
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: LOCKSVTAIRCR
        description: VTOR_S and AIRCR register lock
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: VTOR_S register PRIS and BFHFNMINS bits in the AIRCR register write enabled
            value: 0
          - name: B_0x1
            description: VTOR_S register PRIS and BFHFNMINS bits in the AIRCR register write disabled
            value: 1
      - name: LOCKSMPU
        description: secure MPU registers lock
        bitOffset: 1
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Secure MPU registers writes enabled
            value: 0
          - name: B_0x1
            description: Secure MPU registers writes disabled
            value: 1
      - name: LOCKSAU
        description: SAU registers lock
        bitOffset: 2
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: SAU registers write enabled
            value: 0
          - name: B_0x1
            description: SAU registers write disabled
            value: 1
  - name: ECCNMIR
    displayName: ECCNMIR
    description: ECC NMI mask register
    addressOffset: 332
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: ECCNMI_MASK_EN
        description: NMI behavior setup when a double ECC error occurs on FLASH data part
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: NMI generated if a double ECC error in the FLASH data part
            value: 0
          - name: B_0x1
            description: NMI not generated if a double ECC error in the FLASH data part
            value: 1
  - name: SWAPLOCKR
    displayName: SWAPLOCKR
    description: Debug control register 2
    addressOffset: 368
    size: 32
    access: read-write
    resetValue: 180
    resetMask: 4294967295
    fields:
      - name: SWAP_LOCK
        description: Flash bank swap operation lock
        bitOffset: 0
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0xC3
            description: Flash bank swap operation allowed, FB_MODE and SWAP_BANK option byte can be modified
            value: 195
          - name: B_0xB4
            description: Flash bank swap operation not allowed, FB_MODE and SWAP_BANK option byte access blocked
            value: 180
  - name: FBMODER
    displayName: FBMODER
    description: Debug control register 2
    addressOffset: 372
    size: 32
    access: read-write
    resetValue: 195
    resetMask: 4294967295
    fields:
      - name: FB_MODE
        description: Flash bank mode selection
        bitOffset: 0
        bitWidth: 8
        access: read-write
        enumeratedValues:
          - name: B_0xC3
            description: Flash Bank 1 mapped at 0x0800 0000 (and aliased @0x0C00 0000) and Flash Bank 2 mapped at 0x0804 0000 (and aliased at 0x0C04 0000)
            value: 195
          - name: B_0xB4
            description: Flash Bank 2 mapped at 0x0800 0000 (and aliased @0x0C00 0000) and Flash Bank 1 mapped at 0x0804 0000 (and aliased at 0x0C04 0000)
            value: 180
addressBlocks:
  - offset: 0
