version: 1.0.0
family: RP
devices:
  - RP2040
documents:
  - id: RP2040 Datasheet
    title: RP2040 Datasheet
    url: https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf
clocks:
  instance: CLOCKS
  signals:
    - name: xosc
      description: Crystal oscillator output
      nominal: 12000000
    - name: rosc
      description: Ring oscillator output (undivided, before ROSC DIV)
      min: 1000000
      max: 130000000
    - name: rosc_ph
      description: Ring oscillator phase-shifted/divided output (rosc_clksrc_ph)
      min: 1000000
      max: 130000000
    - name: gpin0
      description: External clock input on GPIO20
    - name: gpin1
      description: External clock input on GPIO22
    - name: pll_sys
      description: System PLL output
      max: 133000000
    - name: pll_usb
      description: USB PLL output
      nominal: 48000000
    - name: clk_ref
      description: Reference clock, used by watchdog and timer. Typically 12MHz (XOSC).
      max: 12000000
    - name: clk_sys
      description: Main system clock
      max: 133000000
    - name: clk_peri
      description: Clock for UART, SPI peripherals
      max: 133000000
    - name: clk_usb
      description: USB clock, must be 48MHz
      nominal: 48000000
    - name: clk_adc
      description: ADC clock, must be 48MHz
      nominal: 48000000
    - name: clk_rtc
      description: RTC clock, typically ~46kHz (48MHz / 1024)
      max: 65536
    - name: clk_gpout0
      description: GPIO clock output 0
    - name: clk_gpout1
      description: GPIO clock output 1
    - name: clk_gpout2
      description: GPIO clock output 2
    - name: clk_gpout3
      description: GPIO clock output 3
    - name: clk_ref_aux
      description: Output of CLK_REF auxiliary mux (glitchy), feeds CLK_REF glitchless mux at SRC=1
    - name: clk_ref_src
      description: Output of CLK_REF glitchless source mux, feeds CLK_REF divider
    - name: clk_sys_aux
      description: Output of CLK_SYS auxiliary mux (glitchy), feeds CLK_SYS glitchless mux at SRC=1
    - name: clk_sys_src
      description: Output of CLK_SYS glitchless source mux, feeds CLK_SYS divider
    - name: clk_peri_src
      description: Output of CLK_PERI source mux, feeds CLK_PERI gate
    - name: clk_usb_src
      description: Output of CLK_USB source mux, feeds CLK_USB divider
    - name: clk_usb_div_out
      description: Output of CLK_USB divider, feeds CLK_USB gate
    - name: clk_adc_src
      description: Output of CLK_ADC source mux, feeds CLK_ADC divider
    - name: clk_adc_div_out
      description: Output of CLK_ADC divider, feeds CLK_ADC gate
    - name: clk_rtc_src
      description: Output of CLK_RTC source mux, feeds CLK_RTC divider
    - name: clk_rtc_div_out
      description: Output of CLK_RTC divider, feeds CLK_RTC gate
    - name: clk_gpout0_src
      description: Output of CLK_GPOUT0 source mux, feeds CLK_GPOUT0 divider
    - name: clk_gpout0_div_out
      description: Output of CLK_GPOUT0 divider, feeds CLK_GPOUT0 gate
    - name: clk_gpout1_src
      description: Output of CLK_GPOUT1 source mux, feeds CLK_GPOUT1 divider
    - name: clk_gpout1_div_out
      description: Output of CLK_GPOUT1 divider, feeds CLK_GPOUT1 gate
    - name: clk_gpout2_src
      description: Output of CLK_GPOUT2 source mux, feeds CLK_GPOUT2 divider
    - name: clk_gpout2_div_out
      description: Output of CLK_GPOUT2 divider, feeds CLK_GPOUT2 gate
    - name: clk_gpout3_src
      description: Output of CLK_GPOUT3 source mux, feeds CLK_GPOUT3 divider
    - name: clk_gpout3_div_out
      description: Output of CLK_GPOUT3 divider, feeds CLK_GPOUT3 gate
    - name: clk_sys_clocks
    - name: clk_adc_adc
    - name: clk_sys_adc
    - name: clk_sys_busctrl
    - name: clk_sys_busfabric
    - name: clk_sys_dma
    - name: clk_sys_i2c0
    - name: clk_sys_i2c1
    - name: clk_sys_io
    - name: clk_sys_jtag
    - name: clk_sys_vreg_and_chip_reset
    - name: clk_sys_pads
    - name: clk_sys_pio0
    - name: clk_sys_pio1
    - name: clk_sys_pll_sys
    - name: clk_sys_pll_usb
    - name: clk_sys_psm
    - name: clk_sys_pwm
    - name: clk_sys_resets
    - name: clk_sys_rom
    - name: clk_sys_rosc
    - name: clk_rtc_rtc
    - name: clk_sys_rtc
    - name: clk_sys_sio
    - name: clk_peri_spi0
    - name: clk_sys_spi0
    - name: clk_peri_spi1
    - name: clk_sys_spi1
    - name: clk_sys_sram0
    - name: clk_sys_sram1
    - name: clk_sys_sram2
    - name: clk_sys_sram3
    - name: clk_sys_sram4
    - name: clk_sys_sram5
    - name: clk_sys_syscfg
    - name: clk_sys_sysinfo
    - name: clk_sys_tbman
    - name: clk_sys_timer
    - name: clk_peri_uart0
    - name: clk_sys_uart0
    - name: clk_peri_uart1
    - name: clk_sys_uart1
    - name: clk_sys_usbctrl
    - name: clk_usb_usbctrl
    - name: clk_sys_watchdog
    - name: clk_sys_xip
    - name: clk_sys_xosc
  generators:
    - name: xosc
      description: Crystal oscillator (12MHz typical)
      output: xosc
      control:
        instance: XOSC
        reg: CTRL
        field: ENABLE
        values:
          - 3358
          - 4011
        default: 3358
    - name: rosc
      description: Ring oscillator
      output: rosc
      control:
        instance: ROSC
        reg: CTRL
        field: ENABLE
        values:
          - 3358
          - 4011
        default: 4011
    - name: gpin0
      description: External clock input 0 (GPIO20)
      output: gpin0
    - name: gpin1
      description: External clock input 1 (GPIO22)
      output: gpin1
  muxes:
    - name: clk_ref_src
      description: >
        CLK_REF glitchless source mux. SRC=1 selects the AUX mux output.
        Glitchless switching between ROSC and XOSC; switching through AUX may glitch.
      inputs:
        - rosc_ph
        - clk_ref_aux
        - xosc
      output: clk_ref_src
      control:
        reg: CLK_REF.CTRL
        field: SRC
      notes: SRC field is 2 bits at [1:0]. Default 0 (ROSC).
    - name: clk_ref_aux
      description: CLK_REF auxiliary mux (glitchy). Selected when CLK_REF_CTRL.SRC=1.
      inputs:
        - pll_usb
        - gpin0
        - gpin1
      output: clk_ref_aux
      control:
        reg: CLK_REF.CTRL
        field: AUXSRC
      notes: AUXSRC field is 2 bits at [6:5].
    - name: clk_sys_src
      description: >
        CLK_SYS glitchless source mux. SRC=0 selects CLK_REF (safe fallback),
        SRC=1 selects the AUX mux output (high-speed sources).
      inputs:
        - clk_ref
        - clk_sys_aux
      output: clk_sys_src
      control:
        reg: CLK_SYS.CTRL
        field: SRC
      notes: SRC field is 1 bit at [0]. Default 0 (CLK_REF).
    - name: clk_sys_aux
      description: CLK_SYS auxiliary mux (glitchy). Selected when CLK_SYS_CTRL.SRC=1.
      inputs:
        - pll_sys
        - pll_usb
        - rosc
        - xosc
        - gpin0
        - gpin1
      output: clk_sys_aux
      control:
        reg: CLK_SYS.CTRL
        field: AUXSRC
      notes: AUXSRC field is 3 bits at [7:5].
    - name: clk_peri_src
      description: >
        CLK_PERI auxiliary source mux. CLK_PERI has no integer divider;
        the selected source is gated directly.
      inputs:
        - clk_sys
        - pll_sys
        - pll_usb
        - rosc_ph
        - xosc
        - gpin0
        - gpin1
      output: clk_peri_src
      control:
        reg: CLK_PERI.CTRL
        field: AUXSRC
      notes: AUXSRC field is 3 bits at [7:5].
    - name: clk_usb_src
      description: CLK_USB auxiliary source mux.
      inputs:
        - pll_usb
        - pll_sys
        - rosc_ph
        - xosc
        - gpin0
        - gpin1
      output: clk_usb_src
      control:
        reg: CLK_USB.CTRL
        field: AUXSRC
      notes: AUXSRC field is 3 bits at [7:5].
    - name: clk_adc_src
      description: CLK_ADC auxiliary source mux.
      inputs:
        - pll_usb
        - pll_sys
        - rosc_ph
        - xosc
        - gpin0
        - gpin1
      output: clk_adc_src
      control:
        reg: CLK_ADC.CTRL
        field: AUXSRC
      notes: AUXSRC field is 3 bits at [7:5].
    - name: clk_rtc_src
      description: CLK_RTC auxiliary source mux.
      inputs:
        - pll_usb
        - pll_sys
        - rosc_ph
        - xosc
        - gpin0
        - gpin1
      output: clk_rtc_src
      control:
        reg: CLK_RTC.CTRL
        field: AUXSRC
      notes: AUXSRC field is 3 bits at [7:5].
    - name: clk_gpout0_src
      description: CLK_GPOUT0 auxiliary source mux.
      inputs:
        - pll_sys
        - gpin0
        - gpin1
        - pll_usb
        - rosc
        - xosc
        - clk_sys
        - clk_usb
        - clk_adc
        - clk_rtc
        - clk_ref
      output: clk_gpout0_src
      control:
        reg: CLK_GPOUT0.CTRL
        field: AUXSRC
      notes: AUXSRC field is 4 bits at [8:5].
    - name: clk_gpout1_src
      description: CLK_GPOUT1 auxiliary source mux. Same inputs as GPOUT0.
      inputs:
        - pll_sys
        - gpin0
        - gpin1
        - pll_usb
        - rosc
        - xosc
        - clk_sys
        - clk_usb
        - clk_adc
        - clk_rtc
        - clk_ref
      output: clk_gpout1_src
      control:
        reg: CLK_GPOUT1.CTRL
        field: AUXSRC
    - name: clk_gpout2_src
      description: >
        CLK_GPOUT2 auxiliary source mux. Index 4 is rosc_clksrc_ph
        (phase-shifted/divided) rather than rosc_clksrc.
      inputs:
        - pll_sys
        - gpin0
        - gpin1
        - pll_usb
        - rosc_ph
        - xosc
        - clk_sys
        - clk_usb
        - clk_adc
        - clk_rtc
        - clk_ref
      output: clk_gpout2_src
      control:
        reg: CLK_GPOUT2.CTRL
        field: AUXSRC
    - name: clk_gpout3_src
      description: >
        CLK_GPOUT3 auxiliary source mux. Index 4 is rosc_clksrc_ph
        (phase-shifted/divided) rather than rosc_clksrc.
      inputs:
        - pll_sys
        - gpin0
        - gpin1
        - pll_usb
        - rosc_ph
        - xosc
        - clk_sys
        - clk_usb
        - clk_adc
        - clk_rtc
        - clk_ref
      output: clk_gpout3_src
      control:
        reg: CLK_GPOUT3.CTRL
        field: AUXSRC
  plls:
    - name: pll_sys
      description: System PLL. fVCO = xosc / refdiv * fbdiv. fOut = fVCO / postdiv1 / postdiv2.
      input: xosc
      output: pll_sys
      feedback_integer:
        instance: PLL_SYS
        reg: FBDIV_INT
        field: FBDIV_INT
        value_range:
          min: 16
          max: 320
      post_divider:
        instance: PLL_SYS
        reg: PRIM
        field: POSTDIV1
        value_range:
          min: 1
          max: 7
      vco_limits:
        min: 750000000
        max: 1600000000
      notes: >
        PRIM.POSTDIV2[14:12] provides a second post-divider stage (1-7).
        CS.REFDIV[5:0] divides the reference input (default 1).
        Full formula: fOut = xosc / REFDIV * FBDIV_INT / POSTDIV1 / POSTDIV2.
    - name: pll_usb
      description: USB PLL. Same structure as pll_sys. Typically configured for 48MHz output.
      input: xosc
      output: pll_usb
      feedback_integer:
        instance: PLL_USB
        reg: FBDIV_INT
        field: FBDIV_INT
        value_range:
          min: 16
          max: 320
      post_divider:
        instance: PLL_USB
        reg: PRIM
        field: POSTDIV1
        value_range:
          min: 1
          max: 7
      vco_limits:
        min: 750000000
        max: 1600000000
      notes: >
        PRIM.POSTDIV2[14:12] provides a second post-divider stage (1-7).
        CS.REFDIV[5:0] divides the reference input (default 1).
        Typical configuration: 12MHz * 40 / 5 / 2 = 48MHz.
  dividers:
    - name: rosc_div
      description: >
        ROSC output divider. DIV[11:0] = 0xAA0 + n, where n=0 -> /32, n=1..31 -> /n.
        Produces the rosc_ph (rosc_clksrc_ph) output used by most clock generators.
      input: rosc
      output: rosc_ph
      factor:
        instance: ROSC
        reg: DIV
        field: DIV
        notes: >
          Raw field encodes as 0xAA0 + divisor. Divisor 0 means divide by 32;
          1-31 divide by that value; reset default is divide-by-16 (raw 0xAA0).
    - name: clk_ref_div
      description: CLK_REF integer divider (1-3). No fractional part.
      input: clk_ref_src
      output: clk_ref
      factor:
        reg: CLK_REF.DIV
        field: INT
        value_range:
          min: 1
          max: 3
          offset: 0
      notes: >
        INT field is 2 bits at [9:8]. Raw value 0 = divide by 4 (2^2),
        raw 1 = divide by 1, raw 2 = divide by 2, raw 3 = divide by 3.
        In practice, CLK_REF is typically left undivided (INT=1).
    - name: clk_sys_div
      description: CLK_SYS divider with 8-bit fraction. Effective divisor = INT + FRAC/256.
      input: clk_sys_src
      output: clk_sys
      factor:
        reg: CLK_SYS.DIV
        field: INT
        value_range:
          min: 1
          max: 16777215
      denominator:
        reg: CLK_SYS.DIV
        field: FRAC
      notes: >
        INT is 24 bits at [31:8]; FRAC is 8 bits at [7:0].
        Reset value 0x100 = INT=1, FRAC=0 (divide by 1).
        Raw INT=0 means divide by 2^24 (maximum division).
    - name: clk_usb_div
      description: CLK_USB integer divider (1-3).
      input: clk_usb_src
      output: clk_usb_div_out
      factor:
        reg: CLK_USB.DIV
        field: INT
        value_range:
          min: 1
          max: 3
      notes: INT field is 2 bits at [9:8]. Typically left at 1.
    - name: clk_adc_div
      description: CLK_ADC integer divider (1-3).
      input: clk_adc_src
      output: clk_adc_div_out
      factor:
        reg: CLK_ADC.DIV
        field: INT
        value_range:
          min: 1
          max: 3
      notes: INT field is 2 bits at [9:8].
    - name: clk_rtc_div
      description: CLK_RTC divider with 8-bit fraction. Typically 48MHz / 1024 ≈ 46.875kHz.
      input: clk_rtc_src
      output: clk_rtc_div_out
      factor:
        reg: CLK_RTC.DIV
        field: INT
        value_range:
          min: 1
          max: 16777215
      denominator:
        reg: CLK_RTC.DIV
        field: FRAC
      notes: INT is 24 bits at [31:8]; FRAC is 8 bits at [7:0].
    - name: clk_gpout0_div
      description: CLK_GPOUT0 divider with 8-bit fraction.
      input: clk_gpout0_src
      output: clk_gpout0_div_out
      factor:
        reg: CLK_GPOUT0.DIV
        field: INT
      denominator:
        reg: CLK_GPOUT0.DIV
        field: FRAC
      notes: INT is 24 bits at [31:8]; FRAC is 8 bits at [7:0]. Reset value 0x100 = divide by 1.
    - name: clk_gpout1_div
      description: CLK_GPOUT1 divider with 8-bit fraction.
      input: clk_gpout1_src
      output: clk_gpout1_div_out
      factor:
        reg: CLK_GPOUT1.DIV
        field: INT
      denominator:
        reg: CLK_GPOUT1.DIV
        field: FRAC
    - name: clk_gpout2_div
      description: CLK_GPOUT2 divider with 8-bit fraction.
      input: clk_gpout2_src
      output: clk_gpout2_div_out
      factor:
        reg: CLK_GPOUT2.DIV
        field: INT
      denominator:
        reg: CLK_GPOUT2.DIV
        field: FRAC
    - name: clk_gpout3_div
      description: CLK_GPOUT3 divider with 8-bit fraction.
      input: clk_gpout3_src
      output: clk_gpout3_div_out
      factor:
        reg: CLK_GPOUT3.DIV
        field: INT
      denominator:
        reg: CLK_GPOUT3.DIV
        field: FRAC
  gates:
    - name: clk_peri_gate
      description: CLK_PERI enable gate. CLK_PERI has no divider; this gate follows the mux directly.
      input: clk_peri_src
      output: clk_peri
      control:
        reg: CLK_PERI.CTRL
        field: ENABLE
    - name: clk_usb_gate
      description: CLK_USB enable gate.
      input: clk_usb_div_out
      output: clk_usb
      control:
        reg: CLK_USB.CTRL
        field: ENABLE
    - name: clk_adc_gate
      description: CLK_ADC enable gate.
      input: clk_adc_div_out
      output: clk_adc
      control:
        reg: CLK_ADC.CTRL
        field: ENABLE
    - name: clk_rtc_gate
      description: CLK_RTC enable gate.
      input: clk_rtc_div_out
      output: clk_rtc
      control:
        reg: CLK_RTC.CTRL
        field: ENABLE
    - name: clk_gpout0_gate
      description: CLK_GPOUT0 enable gate.
      input: clk_gpout0_div_out
      output: clk_gpout0
      control:
        reg: CLK_GPOUT0.CTRL
        field: ENABLE
    - name: clk_gpout1_gate
      description: CLK_GPOUT1 enable gate.
      input: clk_gpout1_div_out
      output: clk_gpout1
      control:
        reg: CLK_GPOUT1.CTRL
        field: ENABLE
    - name: clk_gpout2_gate
      description: CLK_GPOUT2 enable gate.
      input: clk_gpout2_div_out
      output: clk_gpout2
      control:
        reg: CLK_GPOUT2.CTRL
        field: ENABLE
    - name: clk_gpout3_gate
      description: CLK_GPOUT3 enable gate.
      input: clk_gpout3_div_out
      output: clk_gpout3
      control:
        reg: CLK_GPOUT3.CTRL
        field: ENABLE
    - name: CLK_SYS_CLOCKS
      description: CLOCKS register-interface clock
      input: clk_sys
      output: clk_sys_clocks
      control:
        reg: WAKE_EN0
        field: CLK_SYS_CLOCKS
    - name: CLK_ADC_ADC
      description: ADC analog/conversion clock (48 MHz)
      input: clk_adc
      output: clk_adc_adc
      control:
        reg: WAKE_EN0
        field: CLK_ADC_ADC
    - name: CLK_SYS_ADC
      description: ADC register-interface clock
      input: clk_sys
      output: clk_sys_adc
      control:
        reg: WAKE_EN0
        field: CLK_SYS_ADC
    - name: CLK_SYS_BUSCTRL
      description: BUSCTRL bus-arbiter clock
      input: clk_sys
      output: clk_sys_busctrl
      control:
        reg: WAKE_EN0
        field: CLK_SYS_BUSCTRL
    - name: CLK_SYS_BUSFABRIC
      description: AHB-Lite crossbar clock
      input: clk_sys
      output: clk_sys_busfabric
      control:
        reg: WAKE_EN0
        field: CLK_SYS_BUSFABRIC
    - name: CLK_SYS_DMA
      description: DMA controller clock
      input: clk_sys
      output: clk_sys_dma
      control:
        reg: WAKE_EN0
        field: CLK_SYS_DMA
    - name: CLK_SYS_I2C0
      description: I2C0 clock
      input: clk_sys
      output: clk_sys_i2c0
      control:
        reg: WAKE_EN0
        field: CLK_SYS_I2C0
    - name: CLK_SYS_I2C1
      description: I2C1 clock
      input: clk_sys
      output: clk_sys_i2c1
      control:
        reg: WAKE_EN0
        field: CLK_SYS_I2C1
    - name: CLK_SYS_IO
      description: IO_BANK0 clock
      input: clk_sys
      output: clk_sys_io
      control:
        reg: WAKE_EN0
        field: CLK_SYS_IO
    - name: CLK_SYS_JTAG
      description: JTAG/SWD interface clock
      input: clk_sys
      output: clk_sys_jtag
      control:
        reg: WAKE_EN0
        field: CLK_SYS_JTAG
    - name: CLK_SYS_VREG_AND_CHIP_RESET
      description: VREG_AND_CHIP_RESET clock
      input: clk_sys
      output: clk_sys_vreg_and_chip_reset
      control:
        reg: WAKE_EN0
        field: CLK_SYS_VREG_AND_CHIP_RESET
    - name: CLK_SYS_PADS
      description: PADS_BANK0 clock
      input: clk_sys
      output: clk_sys_pads
      control:
        reg: WAKE_EN0
        field: CLK_SYS_PADS
    - name: CLK_SYS_PIO0
      description: PIO0 clock
      input: clk_sys
      output: clk_sys_pio0
      control:
        reg: WAKE_EN0
        field: CLK_SYS_PIO0
    - name: CLK_SYS_PIO1
      description: PIO1 clock
      input: clk_sys
      output: clk_sys_pio1
      control:
        reg: WAKE_EN0
        field: CLK_SYS_PIO1
    - name: CLK_SYS_PLL_SYS
      description: PLL_SYS register-interface clock
      input: clk_sys
      output: clk_sys_pll_sys
      control:
        reg: WAKE_EN0
        field: CLK_SYS_PLL_SYS
    - name: CLK_SYS_PLL_USB
      description: PLL_USB register-interface clock
      input: clk_sys
      output: clk_sys_pll_usb
      control:
        reg: WAKE_EN0
        field: CLK_SYS_PLL_USB
    - name: CLK_SYS_PSM
      description: PSM clock
      input: clk_sys
      output: clk_sys_psm
      control:
        reg: WAKE_EN0
        field: CLK_SYS_PSM
    - name: CLK_SYS_PWM
      description: PWM clock
      input: clk_sys
      output: clk_sys_pwm
      control:
        reg: WAKE_EN0
        field: CLK_SYS_PWM
    - name: CLK_SYS_RESETS
      description: RESETS clock
      input: clk_sys
      output: clk_sys_resets
      control:
        reg: WAKE_EN0
        field: CLK_SYS_RESETS
    - name: CLK_SYS_ROM
      description: Boot ROM clock
      input: clk_sys
      output: clk_sys_rom
      control:
        reg: WAKE_EN0
        field: CLK_SYS_ROM
    - name: CLK_SYS_ROSC
      description: ROSC register-interface clock
      input: clk_sys
      output: clk_sys_rosc
      control:
        reg: WAKE_EN0
        field: CLK_SYS_ROSC
    - name: CLK_RTC_RTC
      description: RTC counter clock (slow clock from CLK_RTC)
      input: clk_rtc
      output: clk_rtc_rtc
      control:
        reg: WAKE_EN0
        field: CLK_RTC_RTC
    - name: CLK_SYS_RTC
      description: RTC register-interface clock
      input: clk_sys
      output: clk_sys_rtc
      control:
        reg: WAKE_EN0
        field: CLK_SYS_RTC
    - name: CLK_SYS_SIO
      description: SIO clock
      input: clk_sys
      output: clk_sys_sio
      control:
        reg: WAKE_EN0
        field: CLK_SYS_SIO
    - name: CLK_PERI_SPI0
      description: SPI0 serial bit clock
      input: clk_peri
      output: clk_peri_spi0
      control:
