name: HSEM
description: HSEM
groupName: HSEM
source: STM32H745_CM4 SVD v2.5
params:
  - name: semaphores
    type: int
    default: 32
    max: 32
    description: Number of hardware semaphores (16 or 32)
  - name: cores
    type: int
    default: 1
    max: 2
    description: Number of CPUs that can access the unit; each owns an interrupt-control set C[n] (C[0]=CPU1, C[1]=CPU2)
registers:
  - name: C[%s]
    description: Per-CPU interrupt control
    dim: 2
    addressOffset: 256
    dimIncrement: 16
    registers:
      - name: IER
        displayName: IER
        description: Interrupt enable register
        addressOffset: 0
        size: 32
        access: read-write
        resetValue: 0
        fields:
          - name: ISE
            description: Interrupt semaphore x enable bit
            bitOffset: 0
            bitWidth: 32
      - name: ICR
        displayName: ICR
        description: Interrupt clear register
        addressOffset: 4
        size: 32
        access: read-write
        resetValue: 0
        fields:
          - name: ISC
            description: Interrupt semaphore x clear bit
            bitOffset: 0
            bitWidth: 32
      - name: ISR
        displayName: ISR
        description: Interrupt status register
        addressOffset: 8
        size: 32
        access: read-only
        resetValue: 0
        fields:
          - name: ISF
            description: Interrupt semaphore x status bit before enable (mask)
            bitOffset: 0
            bitWidth: 32
      - name: MISR
        displayName: MISR
        description: Masked interrupt status register
        addressOffset: 12
        size: 32
        access: read-only
        resetValue: 0
        fields:
          - name: MISF
            description: masked interrupt semaphore x status bit after enable (mask)
            bitOffset: 0
            bitWidth: 32
  - name: CR
    displayName: CR
    description: Clear register
    addressOffset: 320
    size: 32
    access: write-only
    resetValue: 0
    fields:
      - name: COREID
        description: "COREID of semaphores to be\n              cleared"
        bitOffset: 8
        bitWidth: 4
      - name: KEY
        description: Semaphore clear Key
        bitOffset: 16
        bitWidth: 16
  - name: KEYR
    displayName: KEYR
    description: Interrupt clear register
    addressOffset: 324
    size: 32
    access: read-write
    resetValue: 0
    fields:
      - name: KEY
        description: Semaphore Clear Key
        bitOffset: 16
        bitWidth: 16
  - name: R[%s]
    displayName: R[%s]
    description: Semaphore register
    addressOffset: 0
    size: 32
    access: read-write
    resetValue: 0
    fields:
      - name: PROCID
        description: Semaphore ProcessID
        bitOffset: 0
        bitWidth: 8
      - name: COREID
        description: Semaphore COREID
        bitOffset: 8
        bitWidth: 4
      - name: LOCK
        description: Lock indication
        bitOffset: 31
        bitWidth: 1
    dim: 32
    dimIncrement: 4
  - name: RLR[%s]
    displayName: RLR[%s]
    description: Read-lock register
    addressOffset: 128
    size: 32
    access: read-only
    resetValue: 0
    fields:
      - name: PROCID
        description: Semaphore ProcessID
        bitOffset: 0
        bitWidth: 8
      - name: COREID
        description: Semaphore COREID
        bitOffset: 8
        bitWidth: 4
      - name: LOCK
        description: Lock indication
        bitOffset: 31
        bitWidth: 1
    dim: 32
    dimIncrement: 4
addressBlocks:
  - offset: 0
    size: 1024
    usage: registers
outputs:
  - name: INTR
    description: Global interrupt 2
namespace: stm32h7
