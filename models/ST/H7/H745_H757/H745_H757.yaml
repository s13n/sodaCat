  plls:
    - name: PLL1
      description: Main system PLL (fractional-N)
      input: ref1_ck
      output: vco1_ck
      feedback_integer:
        reg: PLL1DIVR
        field: DIVN1
        value_range:
          min: 3
          max: 511
          offset: 1
      feedback_fraction:
        reg: PLL1FRACR
        field: FRACN1
        value_range:
          min: 0
          max: 8191
      vco_limits:
        min: 150000000
        max: 960000000
      notes: 'Wide VCO (VCOH): 192-960 MHz; Medium VCO (VCOL): 150-420 MHz. Selected by PLL1VCOSEL in RCC_PLLCFGR.'
    - name: PLL2
      description: Auxiliary PLL 2 (fractional-N)
      input: ref2_ck
      output: vco2_ck
      feedback_integer:
        reg: PLL2DIVR
        field: DIVN2
        value_range:
          min: 3
          max: 511
          offset: 1
      feedback_fraction:
        reg: PLL2FRACR
        field: FRACN2
        value_range:
          min: 0
          max: 8191
      vco_limits:
        min: 150000000
        max: 960000000
    - name: PLL3
      description: Auxiliary PLL 3 (fractional-N)
      input: ref3_ck
      output: vco3_ck
      feedback_integer:
        reg: PLL3DIVR
        field: DIVN3
        value_range:
          min: 3
          max: 511
          offset: 1
      feedback_fraction:
        reg: PLL3FRACR
        field: FRACN3
        value_range:
          min: 0
          max: 8191
      vco_limits:
        min: 150000000
        max: 960000000
    - name: DSI_PLL
      description: DSI D-PHY PLL (integer-N, in DSI peripheral block)
      input: dsi_ref_ck
      output: dsi_pll_ck
      feedback_integer:
        instance: DSIHOST
        reg: WRPCR
        field: NDIV
        value_range:
          min: 10
          max: 125
      vco_limits:
        min: 500000000
        max: 1000000000
      notes: >-
        Internal VCO runs at 1-2 GHz. A fixed /2 divider inside the feedback loop
        means the PLL locks at VCO/2 = ref * NDIV. The vco_limits here reflect the
        VCO/2 node (500 MHz - 1 GHz). The ODF output divider is modeled separately.
  dividers:
    - name: HSIDIV
      description: HSI oscillator prescaler
      input: hsi_osc
      output: hsi_ck
      factor:
        reg: CR
        field: HSIDIV
        values:
          - 1
          - 2
          - 4
          - 8
    - name: CSI_CEC_DIV
      description: Fixed /122 divider for HDMI-CEC from CSI kernel clock
      input: csi_ker_ck
      output: csi_ker_div122
      value: 122
    - name: DIVM1
      description: PLL1 prescaler (division factor for PLL1 reference clock)
      input: pll_src
      output: ref1_ck
      factor:
        reg: PLLCKSELR
        field: DIVM1
        value_range:
          min: 0
          max: 63
      notes: Value 0 disables the prescaler (no clock). Values 1-63 divide by that amount.
    - name: DIVM2
      description: PLL2 prescaler (division factor for PLL2 reference clock)
      input: pll_src
      output: ref2_ck
      factor:
        reg: PLLCKSELR
