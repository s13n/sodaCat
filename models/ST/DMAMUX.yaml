name: DMAMUX
description: DMA request line multiplexer
groupName: DMAMUX
source: STM32H723 SVD v2.1
params:
  - name: highest_channel
    type: int
    default: 15
    max: 31
    description: Highest valid CCR[] index on this instance (= channel count − 1). The CCR[] array is dim=32 (block address-space capacity — CSR sits at offset 0x80, leaving 32 four-byte slots); the max=31 ceiling matches that capacity.
  - name: highest_request_generator
    type: int
    default: 3
    max: 15
    description: Highest valid RGCR[] index on this instance (= request generator count − 1). The RGCR[] array is dim=16 (block address-space capacity — RGSR sits at offset 0x140, leaving 16 four-byte slots after RG-area start at 0x100); the max=15 ceiling matches that capacity.
  - name: request_inputs
    type: int
    default: 7
    max: 8
    description: Width of the DMAREQ_ID bitfield on C<N>CR (= log2 of addressable request inputs). The CCR layout reserves bits 0:7 for the ID, so the silicon max is 8 bits.
  - name: sync_inputs
    type: int
    default: 5
    max: 8
    description: Width of the SYNC_ID bitfield on C<N>CR (= log2 of addressable synchronization inputs). The CCR layout reserves bits 24:31 for the ID, so the silicon max is 8 bits.
  - name: request_triggers
    type: int
    default: 5
    max: 8
    description: Width of the SIG_ID bitfield on RG<N>CR (= log2 of addressable request-generator trigger inputs). The RGCR layout reserves bits 0:7 for the ID, so the silicon max is 8 bits.
  - name: has_secure_ovr
    type: bool
    default: false
    description: 'TrustZone-aware silicon: the request-line overrun event reaches two distinct NVIC vectors (non-secure OVR and secure OVR_S). True on L5 only today; false elsewhere (single OVR vector). When true, the OVR_S output is wired by the chip; when false, OVR_S is declared-but-unwired.'
