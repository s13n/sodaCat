        outputs:
          FLT0:
            pattern: '^DFSDM1_FLT0$'
          FLT1:
            pattern: '^DFSDM1_FLT1$'
          FLT2:
            pattern: '^DFSDM1_FLT2$'
          FLT3:
            pattern: '^DFSDM1_FLT3$'
      DMA:
        from: STM32F722.DMA1
        instances: [DMA1, DMA2]
        outputs:
          Stream0:
            pattern: '^DMA1_Stream0$'
          Stream1:
            pattern: '^DMA1_Stream1$'
          Stream2:
            pattern: '^DMA1_Stream2$'
          Stream3:
            pattern: '^DMA1_Stream3$'
          Stream4:
            pattern: '^DMA1_Stream4$'
          Stream5:
            pattern: '^DMA1_Stream5$'
          Stream6:
            pattern: '^DMA1_Stream6$'
          Stream7:
            pattern: '^DMA1_Stream7$'
        params:
          - {name: channel_count, type: int, max: 16, description: Number of DMA request channels per stream}
        transforms:
          - {type: patchFields, register: S0CR, fields: [{name: CHSEL, bitWidth: 4}]}
          - {type: patchFields, register: S1CR, fields: [{name: CHSEL, bitWidth: 4}]}
          - {type: patchFields, register: S2CR, fields: [{name: CHSEL, bitWidth: 4}]}
          - {type: patchFields, register: S3CR, fields: [{name: CHSEL, bitWidth: 4}]}
          - {type: patchFields, register: S4CR, fields: [{name: CHSEL, bitWidth: 4}]}
          - {type: patchFields, register: S5CR, fields: [{name: CHSEL, bitWidth: 4}]}
          - {type: patchFields, register: S6CR, fields: [{name: CHSEL, bitWidth: 4}]}
          - {type: patchFields, register: S7CR, fields: [{name: CHSEL, bitWidth: 4}]}
      DMA2D:
        uses: DMA2D
        instances: [DMA2D]
      DSI:
        uses: DSI
        instances: [DSI]
      EXTI:
        from: STM32F722.EXTI
        instances: [EXTI]
        outputs:
          TAMP_STAMP:
            pattern: '^TAMP_STAMP$'
          INTR0:
            pattern: '^EXTI0$'
          INTR1:
            pattern: '^EXTI1$'
          INTR2:
            pattern: '^EXTI2$'
          INTR3:
            pattern: '^EXTI3$'
        transforms:
          - {type: renameFields, register: IMR, pattern: ^MI9$, replacement: IM9}
      Ethernet_DMA:
        from: STM32F745.Ethernet_DMA
        instances: [Ethernet_DMA]
        outputs:
          INTR:
            pattern: '^ETH$'
          ETH_WKUP:
            pattern: '^ETH_WKUP$'
        description: Ethernet DMA (Synopsys GMAC)
      Ethernet_MAC:
        from: STM32F745.Ethernet_MAC
        instances: [Ethernet_MAC]
        outputs:
          INTR:
            pattern: '^ETH$'
          ETH_WKUP:
            pattern: '^ETH_WKUP$'
        description: Ethernet MAC (Synopsys GMAC)
      Ethernet_MMC:
        from: STM32F745.Ethernet_MMC
        instances: [Ethernet_MMC]
        description: Ethernet MMC (Synopsys GMAC)
      Ethernet_PTP:
        from: STM32F745.Ethernet_PTP
        instances: [Ethernet_PTP]
        description: Ethernet PTP (Synopsys GMAC)
      FMC:
        uses: FMC
        instances: [FMC]
        outputs:
          INTR:
            pattern: '^FSMC$'
      Flash:
        from: STM32F767.FLASH
        instances: [FLASH, Flash]
        outputs:
          INTR:
            pattern: '^FLASH$'
        params:
          - {name: has_pcrop, type: bool, default: false, description: 'PCROP protection support (RDERR, RDERRIE, OPTCR2)'}
          - {name: has_dual_bank, type: bool, default: false, description: 'Dual-bank Flash support (MER2, nDBOOT, nDBANK)'}
        transforms:
          - {type: renameFields, register: SR, pattern: ^PGSERR$, replacement: ERSERR}
          - {type: renameFields, register: OPTKEYR, pattern: ^OPTKEY$, replacement: OPTKEYR}
          - {type: renameFields, register: CR, pattern: ^MER1$, replacement: MER2}
          - type: patchFields
            register: SR
            fields:
              - {name: RDERR, description: PCROP protection error, bitOffset: 8, bitWidth: 1, access: read-write}
          - type: patchFields
            register: CR
            fields:
              - {name: RDERRIE, description: PCROP error interrupt enable, bitOffset: 26, bitWidth: 1}
          - type: patchRegisters
            registers:
              - name: OPTCR2
                displayName: OPTCR2
                description: Flash option control register 2
                addressOffset: 28
                size: 32
                access: read-write
                resetValue: 2147483903
                fields:
                  - {name: PCROPi, description: PCROP protection per sector, bitOffset: 0, bitWidth: 8}
                  - {name: PCROP_RDP, description: PCROP zone preserved when RDP level decreased, bitOffset: 31, bitWidth: 1}
      GPIO:
        uses: GPIO
        instances: [GPIOA, GPIOB, GPIOC, GPIOD, GPIOE, GPIOF, GPIOG, GPIOH, GPIOI, GPIOJ, GPIOK]
      Timer:
        uses: TimerV1
        instances: [TIM1, TIM10, TIM11, TIM12, TIM13, TIM14, TIM2, TIM3, TIM4, TIM5, TIM8, TIM9]
      HASH:
        uses: HASH
        instances: [HASH]
      I2C:
        uses: I2C
        instances: [I2C1, I2C2, I2C3, I2C4]
      IWDG:
        uses: IWDG
        instances: [IWDG]
      JPEG:
        uses: JPEG
        instances: [JPEG]
      LPTIM:
        uses: LPTIM
        instances: [LPTIM1]
        outputs:
          INTR:
            pattern: '^LP_Timer1$'
      LTDC:
        uses: LTDC
        instances: [LTCD, LTDC]
      MDIOS:
        uses: MDIOS
        instances: [MDIOS]
      OTG_FS:
        uses: OTG
        instances: [OTG_FS_GLOBAL]
        outputs:
          INTR:
            pattern: '^OTG_FS$'
          WKUP:
            pattern: '^OTG_FS_WKUP$'
      OTG_HS:
        uses: OTG
        instances: [OTG_HS_GLOBAL]
        outputs:
          EP1_OUT:
            pattern: '^OTG_HS_EP1_OUT$'
          EP1_IN:
            pattern: '^OTG_HS_EP1_IN$'
          WKUP:
            pattern: '^OTG_HS_WKUP$'
          INTR:
            pattern: '^OTG_HS$'
      PWR:
        from: STM32F767.PWR
        instances: [PWR]
        outputs:
          INTR:
            pattern: '^PVD$'
        params:
          - {name: has_eiwup, type: bool, default: true, description: Internal wakeup line gated by EIWUP bit (false = always enabled)}
        transforms:
          - type: patchFields
            register: CSR1
            fields:
              - {name: EIWUP, description: Enable internal wakeup, bitOffset: 8, bitWidth: 1, access: read-write}
      QUADSPI:
        uses: QUADSPI
        instances: [QUADSPI]
      RCC:
        instances: [RCC]
        outputs:
          INTR:
            pattern: '^RCC$'
        variants:
          F72x_F73x:
            from: STM32F722.RCC
          F74x_F75x:
            from: STM32F745.RCC
          F76x_F77x:
            from: STM32F767.RCC
      RNG:
        uses: RNG
        instances: [RNG]
      RTC:
        uses: RTC_V1
        instances: [RTC]
        outputs:
          WKUP:
            pattern: '^RTC_WKUP$'
          ALARM:
            pattern: '^RTC_ALARM$'
      SAI:
        uses: SAI
        instances: [SAI1, SAI2]
      SDMMC:
        uses: SDIO
        instances: [SDMMC1, SDMMC2]
        outputs:
          INTR:
            pattern: '^(SDMMC1|SDMMC2|SDMMC)$'
        description: SD/SDIO/MMC host interface (ARM PrimeCell PL18x)
      SPDIFRX:
        uses: SPDIFRX
        instances: [SPDIFRX, SPDIF_RX]
      SPI:
        uses: LegacySPI
        instances: [SPI1, SPI2, SPI3, SPI4, SPI5, SPI6]
      SYSCFG:
        from: STM32F722.SYSCFG
        instances: [SYSCFG]
        transforms:
          # F722 MEMRMP is correct (MEM_BOOT + SWP_FMC), add SWP_FB for F76x
          - type: patchFields
            register: MEMRMP
            fields:
              - name: SWP_FB
                description: Flash Bank swap
                bitOffset: 8
                bitWidth: 1
          # F722 PMC has I2C1-3_FMP + PBx_FMP + ADCDC2(16:3); add I2C4_FMP,
          # split ADCDC2 into individual fields, add MII_RMII_SEL
          - type: patchFields
            register: PMC
            fields:
              - name: ADCDC2
              - name: I2C4_FMP
                description: I2C4 Fast Mode Plus Enable
                bitOffset: 3
                bitWidth: 1
              - name: ADC1DC2
                description: ADC1DC2
                bitOffset: 16
                bitWidth: 1
              - name: ADC2DC2
                description: ADC2DC2
                bitOffset: 17
                bitWidth: 1
              - name: ADC3DC2
                description: ADC3DC2
                bitOffset: 18
                bitWidth: 1
              - name: MII_RMII_SEL
                description: Ethernet PHY interface selection
                bitOffset: 23
                bitWidth: 1
      USART:
        uses: USART
        instances: [UART4, UART5, UART7, UART8, USART1, USART2, USART3, USART6]
        outputs:
          INTR:
            pattern: '^(USART1|USART2|USART3|USART6|UART4|UART5|UART7|UART8|USART7|USART5|USART4|UART9|USART10)$'
      USBPHYC:
        from: STM32F730.USBPHYC
        instances: [USBPHYC]
      WWDG:
        uses: WWDG
        instances: [WWDG]
      bxCAN:
        uses: bxCAN
        instances: [CAN1, CAN2, CAN3]
        description: Controller area network (Bosch C_CAN)
    chip_params:
      _all:
        _all:
          CRC: {idr32: false}
          RTC: {or_f7: true, has_itsf: true}
          USART: {has_fifo: false}
          UART4: {synchronous: 0}
          UART5: {synchronous: 0}
          UART7: {synchronous: 0}
          UART8: {synchronous: 0}
          SPI: {has_fifo: false}
          SPI1: {has_i2s: true}
          SPI2: {has_i2s: true}
          SPI3: {has_i2s: true}
          TIM2: {width32: true, encoder: 1}
          TIM5: {width32: true, encoder: 1}
          TIM9: {max_channel: 1, has_centerPWM: false, has_xor_input: false, has_etr: false, has_dma_burst: false}
          TIM10: {max_channel: 0, has_centerPWM: false, has_xor_input: false, has_etr: false, has_dma_burst: false}
          TIM11: {max_channel: 0, has_centerPWM: false, has_xor_input: false, has_etr: false, has_dma_burst: false}
          TIM12: {max_channel: 1, has_centerPWM: false, has_xor_input: false, has_etr: false, has_dma_burst: false}
          TIM13: {max_channel: 0, has_centerPWM: false, has_xor_input: false, has_etr: false, has_dma_burst: false}
          TIM14: {max_channel: 0, has_centerPWM: false, has_xor_input: false, has_etr: false, has_dma_burst: false}
          TIM1: {max_channel: 5, has_complementary: true, has_mms2: true, encoder: 1}
          TIM8: {max_channel: 5, has_complementary: true, has_mms2: true, encoder: 1}
          TIM3: {encoder: 1}
          TIM4: {encoder: 1}
          LPTIM: {has_counter_reset: false, has_repetition: false, has_cfgr2: false}
          GPIO: {has_brr: false}
          SPDIFRX: {has_symbol_clock: false}
          SDMMC: {has_ceata: false, has_stbiterr: false}
          OTG_FS: {gccfg: 1, max_in_endpoint: 5, max_out_endpoint: 5, max_channel: 11, max_tx_fifo: 5, has_dma: false}
          OTG_HS: {gccfg: 1, max_in_endpoint: 7, max_out_endpoint: 7, max_tx_fifo: 7}
          DFSDM: {has_dlyr: false}
          FMC: {sdram: true}
      F72x_F73x:
        _all:
          DMA: {channel_count: 8}
          Flash: {has_pcrop: true}
          Timer: {has_uifremap: true, has_extended_ocm: true}
      F74x_F75x:
        _all:
          DMA: {channel_count: 8}
          USART: {synchronous: 2}
          CAN1: {linked_to_slave: CAN2}
          CAN2: {linked_to_master: CAN1}
      F76x_F77x:
        _all:
          DMA: {channel_count: 16}
          Flash: {has_dual_bank: true}
          PWR: {has_eiwup: false}
          CAN1: {linked_to_slave: CAN2}
          CAN2: {linked_to_master: CAN1}
    chip_connections:
      _all:
        _all:
          SPDIF_RX: {INTR: [NVIC.113]}
  G0:
    svd:
      zip: stm32g0-svd.zip
      version: '1.6'
      date: '2024-02-12'
    subfamilies:
      G0x0:
        ref_manual: {name: RM0454, url: https://www.st.com/resource/en/reference_manual/rm0454-stm32g0x0-advanced-armbased-32bit-mcus-stmicroelectronics.pdf, rev: '5', date: 2020-11}
        chips:
          - STM32G030
          - STM32G050
          - STM32G070
          - STM32G0B0
      G0x1:
        ref_manual: {name: RM0444, url: https://www.st.com/resource/en/reference_manual/rm0444-stm32g0x1-advanced-armbased-32bit-mcus-stmicroelectronics.pdf}
        chips:
          - STM32G031
          - STM32G041
          - STM32G051
          - STM32G061
          - STM32G071
          - STM32G081
          - STM32G0B1
          - STM32G0C1
    blocks:
      ADC:
        from: STM32G030.ADC
        instances: [ADC]
        outputs:
          INTR:
            pattern: '^(ADC|ADC3|ADC4|ADC1|ADC5|ADC2)$'
      AES:
        uses: AES_V2
        instances: [AES]
      BasicTimer:
        uses: BasicTimer
        instances: [TIM6, TIM7]
        outputs:
          INTR:
            pattern: '^(TIM6|TIM3|TIM9)$'
      CEC:
        uses: CEC
        instances: [HDMI_CEC]
      COMP:
        from: STM32G051.COMP
        instances: [COMP]
        transforms:
          - {type: renameRegisters, pattern: '^COMP(\d+)_(.+)$', replacement: '\2\1'}
      CRC:
        uses: CRC
        instances: [CRC]
      DAC:
        from: STM32G051.DAC
        instances: [DAC]
        outputs:
          INTR:
            pattern: '^TIM6_DAC_LPTIM1$'
      DBGMCU:
        from: STM32G030.DBG
        instances: [DBG]
      DMA:
        from: STM32G030.DMA1
        instances: [DMA1, DMA2]
        outputs:
          Channel1:
            pattern: '^DMA1_Channel1$'
          Channel2_3:
            pattern: '^DMA1_Channel2_3$'
          Channel4_5_6_7:
            pattern: '^DMA1_Channel4_5_6_7_DMAMUX_DMA2_Channel1_2_3_4_5$'
      DMAMUX:
        from: STM32G030.DMAMUX
        instances: [DMAMUX]
        outputs:
          INTR:
            pattern: '^DMA1_Channel4_5_6_7_DMAMUX_DMA2_Channel1_2_3_4_5$'
      EXTI:
        from: STM32G030.EXTI
        instances: [EXTI]
        outputs:
          INTR0_1:
            pattern: '^EXTI0_1$'
          INTR2_3:
            pattern: '^EXTI2_3$'
          INTR4_15:
            pattern: '^EXTI4_15$'
      FDCAN:
        uses: FDCAN
        instances: [FDCAN1, FDCAN2]
        description: Controller area network with flexible data-rate (Bosch M_CAN)
      Flash:
        from: STM32G030.FLASH
        instances: [FLASH]
        outputs:
          INTR:
            pattern: '^FLASH$'
      GPIO:
        uses: GPIO
        instances: [GPIOA, GPIOB, GPIOC, GPIOD, GPIOE, GPIOF]
      Timer:
        uses: TimerV1
        instances: [TIM1, TIM14, TIM15, TIM16, TIM17, TIM2, TIM3, TIM4]
      I2C:
        uses: I2C
        instances: [I2C1, I2C2, I2C3]
      IWDG:
        uses: IWDG
        instances: [IWDG]
      LPTIM:
        uses: LPTIM
        instances: [LPTIM1, LPTIM2]
      LPUART:
        uses: USART
        instances: [LPUART, LPUART1, LPUART2]
        outputs:
          # G0 shares a single NVIC vector across USART3/4 + LPUART1 (and on
          # higher-density parts also USART5/6); each peripheral lists the
          # full composite name in its SVD <interrupt> entry.  Map all the
          # alternates to INTR — dedup at connections-build keeps one entry.
          INTR:
            pattern: '^(USART3_USART4_LPUART1|USART3_USART4_USART5_USART6_LPUART1|USART2_LPUART2)$'
      PWR:
        from: STM32G030.PWR
        instances: [PWR]
        outputs:
          INTR:
            pattern: '^PVD$'
      RCC:
        from: STM32G030.RCC
        instances: [RCC]
        outputs:
          INTR:
            pattern: '^RCC$'
      RNG:
        uses: RNG
        instances: [RNG]
        outputs:
          INTR:
            pattern: '^AES_RNG$'
      RTC:
        uses: RTC_V2
        instances: [RTC]
        outputs:
          INTR:
            pattern: '^RTC_STAMP$'
      SPI:
        uses: LegacySPI
        instances: [SPI1, SPI2, SPI3]
      SYSCFG:
        from: STM32G030.SYSCFG
        instances: [SYSCFG]
      SYSCFG_ITLINE:
        from: STM32G031.SYSCFG_ITLINE
        instances: [SYSCFG_ITLINE]
      TAMP:
        uses: TAMP
        instances: [TAMP]
      UCPD:
        uses: UCPD
        instances: [UCPD1, UCPD2]
      USART:
        uses: USART
        instances: [USART1, USART2, USART3, USART4, USART5, USART6]
        outputs:
          # See LPUART block above for the shared-vector pattern.  USART2's
          # raw is USART2_LPUART2 (shared with LPUART2), USART3..6 share the
          # composite vectors below.
          INTR:
            pattern: '^(USART1|USART2|USART2_LPUART2|USART3_USART4_LPUART1|USART3_USART4_USART5_USART6_LPUART1|USART6|USART3|UART4|UART7|UART8|USART7|UART5|USART5|USART4|UART9|USART10)$'
      USB:
        uses: USB_DRD
        instances: [USB]
      VREFBUF:
        uses: VREFBUF
        instances: [VREFBUF]
      WWDG:
        uses: WWDG
        instances: [WWDG]
    chip_params:
      _all:
        _all:
          WWDG: {cfr_version: 2}
          USB: {has_ddisc: false}
          LPUART: {lpbaud: true, synchronous: 0, irda: false, lin: false, autobaud: false}
          SPI1: {has_i2s: true}
          CRS: {trim_width: 7}
          TIM2: {width32: true, encoder: 1}
          TIM14: {max_channel: 0, has_centerPWM: false, has_xor_input: false, has_etr: false, has_dma_burst: false}
          TIM15: {max_channel: 1, has_centerPWM: false, has_etr: false, has_complementary: true}
          TIM16: {max_channel: 0, has_centerPWM: false, has_xor_input: false, has_etr: false, has_complementary: true}
          TIM17: {max_channel: 0, has_centerPWM: false, has_xor_input: false, has_etr: false, has_complementary: true}
          TIM1: {max_channel: 5, has_complementary: true, has_mms2: true, encoder: 1}
          TIM3: {encoder: 1}
          TIM4: {encoder: 1}
          LPTIM: {has_repetition: false}
      G0x1:
        STM32G0B0:
          SPI2: {has_i2s: true}
        STM32G0B1:
          SPI2: {has_i2s: true}
        STM32G0C1:
          SPI2: {has_i2s: true}
