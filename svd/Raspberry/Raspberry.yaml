        instances: [PADS_QSPI]
        transforms:
          - type: patchFields
            register: VOLTAGE_SELECT
            fields:
              - name: VOLTAGE_SELECT
                enumeratedValues:
                  - {name: V3_3, value: 0}
                  - {name: V1_8, value: 1}
          - type: patchFields
            register_pattern: GPIO_QSPI_.*
            fields:
              - name: DRIVE
                enumeratedValues:
                  - {name: MA_2, value: 0}
                  - {name: MA_4, value: 1}
                  - {name: MA_8, value: 2}
                  - {name: MA_12, value: 3}

      # ====================================================================
