            - name: spi6_pclk
              max: 120000000
            - name: syscfg_pclk
              max: 120000000
            - name: vrefbuf_pclk
              max: 120000000
            - name: mco1_pre_ck
              description: MCO1 clock after the selector mux, before MCO1PRE prescaler
            - name: mco2_pre_ck
              description: MCO2 clock after the selector mux, before MCO2PRE prescaler
          generators:
            - name: HSI64
              description: 64 MHz high-speed internal RC oscillator
              output: hsi_osc
              control:
                reg: CR
                field: HSION
                values: [0, 64000000]

            - name: HSE
              description: High-speed external oscillator (4-48 MHz crystal or bypass)
              output: hse_ck
              control:
                state: freqHSE
                reg: CR
                field: HSEON

            - name: CSI
              description: 4 MHz low-power internal RC oscillator
              output: csi_ck
              control:
                reg: CR
                field: CSION
                values: [0, 4000000]

            - name: LSI
              description: 32 kHz low-speed internal RC oscillator
              output: lsi_ck
              control:
                reg: CSR
                field: LSION
                values: [0, 32000]

            - name: LSE
              description: 32.768 kHz low-speed external crystal oscillator
              output: lse_ck
              control:
                state: freqLSE
                reg: BDCR
                field: LSEON

            - name: HSI48
              description: 48 MHz internal RC oscillator (CRS trimmable)
              output: hsi48_ck
              control:
                reg: CR
                field: RC48ON
                values: [0, 48000000]

            - name: I2S_CKIN
              description: External I2S clock input pin
              output: I2S_CKIN

          # ===========================================================================
          # Muxes
          # ===========================================================================
          muxes:
            # --- PLL source ---
            - name: PLLSRC
              description: Common source for all three PLLs
              output: pll_src
              inputs:
                - hsi_ck
                - csi_ck
                - hse_ck
                - ''
              control:
                reg: PLLCKSELR
                field: PLLSRC

            # --- System clock ---
            - name: SW
              description: System clock switch
              output: sys_ck
              inputs:
                - hsi_ck
                - csi_ck
                - hse_ck
                - pll1_p_ck
                - 
                - 
                - 
                - 
              control:
                reg: CFGR
                field: SW

            # --- per_ck ---
            - name: CKPERSEL
              description: External peripheral clock source selection
              output: per_ck
              inputs:
                - hsi_ker_ck
                - csi_ker_ck
                - hse_ck
                - ''
              control:
                reg: D1CCIPR
                field: CKPERSEL

            # --- RTC source ---
            - name: RTCSEL
              description: RTC clock source selection
              output: rtc_pre
              inputs:
                - ''
                - lse_ck
                - lsi_ck
                - hse_rtc_ck
              control:
                reg: BDCR
                field: RTCSRC

            # --- MCO1 ---
            - name: MCO1SEL
              description: Microcontroller clock output 1 source
              output: mco1_pre_ck
              inputs:
                - hsi_ck
                - lse_ck
                - hse_ck
                - pll1_q_ck
                - hsi48_ck
                - 
                - 
                - 
              control:
                reg: CFGR
                field: MCO1SEL

            # --- MCO2 ---
            - name: MCO2SEL
              description: Microcontroller clock output 2 source
              output: mco2_pre_ck
              inputs:
                - sys_ck
                - pll2_p_ck
                - hse_ck
                - pll1_p_ck
                - csi_ck
                - lsi_ck
                - 
                - 
              control:
                reg: CFGR
                field: MCO2SEL

            # --- HRTIM clock source ---
            - name: HRTIMSEL
              description: HRTIM kernel clock source selection
              output: hrtim_ker_ck
              inputs:
                - rcc_timy_ker_ck
                - sys_d1cpre_ck
              control:
                reg: CFGR
                field: HRTIMSEL

            # --- D1 domain kernel clock muxes ---
            - name: SDMMCSEL
              description: SDMMC1/2 kernel clock source selection
              output: sdmmc_ker_ck
              inputs:
                - pll1_q_ck
                - pll2_r_ck
              control:
                reg: D1CCIPR
                field: SDMMCSEL

            - name: DSISEL
              description: DSI byte lane clock source selection
              output: dsi_ker_ck
              inputs:
                - dsi_phy_ck
                - pll2_q_ck
              control:
                reg: D1CCIPR
                field: DSISEL

            - name: QSPISEL
              description: QUADSPI kernel clock source selection
              output: quadspi_ker_ck
              inputs:
                - rcc_hclk
                - pll1_q_ck
                - pll2_r_ck
                - per_ck
              control:
                reg: D1CCIPR
