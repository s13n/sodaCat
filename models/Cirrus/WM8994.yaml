            value: 0
            description: VMID disabled (for OFF mode)
          - name: V_2_X_40K_DIVIDER
            value: 1
            description: 2 x 40k divider (for normal operation)
          - name: V_2_X_240K_DIVIDER
            value: 2
            description: 2 x 240k divider (for low power standby)
      - name: BIAS_ENA
        bitOffset: 0
