$schema: http://json-schema.org/draft-07/schema#
title: Chip Model
description: Chip-level integration model mapping peripheral instances to block models
type: object
required:
- name
- cpu
- interruptOffset
- instances
- models
additionalProperties: false
properties:
  name:
    type: string
    description: Chip name (e.g. STM32H563, MCXN947)
  namespace:
    type: string
    description: |
      Optional C++ namespace this chip lives in.  When absent, the
      lowercased innermost containing directory name is used.
  source:
    type: string
    description: SVD source identification (e.g. "STM32H563 SVD v1.8")
  description:
    type: string
    description: Human-readable chip description (free text)
  cpu:
    type: object
    required:
    - name
    - revision
    - endian
    - mpuPresent
    - fpuPresent
    - nvicPrioBits
    - vendorSystickConfig
    properties:
      name:
        type: string
        description: CPU core name (e.g. CM7, CM33, CM4)
      revision:
        type: string
        description: Core revision (e.g. r0p1)
      endian:
        type: string
        enum: [little, big, selectable, other]   # CMSIS-SVD: 'selectable' = boot-time switch (BE-8/LE), 'other' = vendor-defined
      mpuPresent:
        type: boolean
      fpuPresent:
        type: boolean
      vtorPresent:
        type: boolean
      nvicPrioBits:
        type: integer
        minimum: 0
        maximum: 8
      vendorSystickConfig:
        type: boolean
    additionalProperties: true   # tolerate vendor CMSIS-SVD extras (dcachePresent, dspPresent, sauNumRegions, deviceNumInterrupts, ...)
  interruptOffset:
    description: |
      The NVIC's own convention for how its input numbering aligns with
      the Cortex-M exception space (typically 16, since vectors 0-15 are
      system exceptions).  Purely descriptive — destination strings in
      per-instance `connections:` already encode absolute vector indices.
      Will migrate onto an NVIC instance once NVIC becomes a first-class
      block; non-NVIC interrupt controllers use their own conventions.
    type: integer
  instances:
    type: object
    description: Peripheral instances keyed by instance name
    additionalProperties:
      $ref: '#/definitions/instance'
  models:
    type: object
    description: "Block type -> model path mapping (e.g. ADC: ST/H7/ADC)"
    additionalProperties:
      type: string
  clocktree:
    type: string
    description: "Path to the chip's clock-tree model (e.g. Microchip/SAM_Gen1_clocks).
      When present, building the chip header also builds the clock-tree
      header in the same C++ namespace.  Legacy form; new chips use
      `inherits:` instead, pointing at a subfamily model that owns the
      clock tree (and other family-common fabrics)."
  inherits:
    type: string
    description: "Path to a subfamily or family-tier model whose facts the
      chip inherits.  Subfamily fabrics (e.g. clock tree, common instances)
      are merged into the chip view at C++ generation time.  Chip-level
      `instances:` entries override ancestor entries by name."
definitions:
  instance:
    type: object
    required:
    - baseAddress
    - model
    additionalProperties: true   # tolerate vestigial SVD metadata (description, id, version, ...)
    properties:
      baseAddress:
        type: integer
        description: Peripheral base address
      model:
        type: string
        description: Block type name referencing the models table
      connections:
        type: object
        description: |
          Wiring map from each block-declared output signal name to the
          list of destinations the chip routes it to.  A destination is
          a dotted "instance.input" string identifying the consumer
          instance (NVIC, DMAMUX, EXTI, ...) and its input port.  The
          same signal may have multiple destinations (e.g. a dual-CPU
          chip wires one wakeup signal to both cores' NVICs).  Signal
          names must appear in the referenced block model's `outputs:`
          declaration; unconnected outputs are omitted from the map (not
          listed with an empty list).
        additionalProperties:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9_]+\.[A-Za-z0-9_]+$
      parameters:
        type: array
        items:
          type: object
          required:
          - name
          - value
          additionalProperties: false
          properties:
            name:
              type: string
            value:
              oneOf:
              - type: integer
              - type: boolean
              - type: string
