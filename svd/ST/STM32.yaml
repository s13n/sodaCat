              input: rcc_pclk2
              output: sai2_pclk
              control: {reg: 'APB2ENR', field: SAI2EN}
            - name: DFSDM1EN
              description: DFSDM1 clock enable
              input: rcc_pclk2
              output: dfsdm1_pclk
              control: {reg: 'APB2ENR', field: DFSDM1EN}
            - name: UART9EN
              description: UART9 clock enable (H7A3_B-specific)
              input: rcc_pclk2
              output: uart9_pclk
              control: {reg: 'APB2ENR', field: UART9EN}
            - name: USART10EN
              description: USART10 clock enable (H7A3_B-specific)
              input: rcc_pclk2
              output: usart10_pclk
              control: {reg: 'APB2ENR', field: USART10EN}
            - name: SYSCFGEN
              description: SYSCFG clock enable
              input: rcc_pclk4
              output: syscfg_pclk
              control: {reg: 'APB4ENR', field: SYSCFGEN}
            - name: LPUART1EN
              description: LPUART1 clock enable
              input: rcc_pclk4
              output: lpuart1_pclk
              control: {reg: 'APB4ENR', field: LPUART1EN}
            - name: SPI6EN
              description: SPI6 clock enable
              input: rcc_pclk4
              output: spi6_pclk
              control: {reg: 'APB4ENR', field: SPI6EN}
            - name: I2C4EN
              description: I2C4 clock enable
              input: rcc_pclk4
              output: i2c4_pclk
              control: {reg: 'APB4ENR', field: I2C4EN}
            - name: LPTIM2EN
              description: LPTIM2 clock enable
              input: rcc_pclk4
              output: lptim2_pclk
              control: {reg: 'APB4ENR', field: LPTIM2EN}
            - name: LPTIM3EN
              description: LPTIM3 clock enable
              input: rcc_pclk4
              output: lptim3_pclk
              control: {reg: 'APB4ENR', field: LPTIM3EN}
            - name: COMP12EN
              description: COMP1/2 clock enable
              input: rcc_pclk4
              output: comp12_pclk
              control: {reg: 'APB4ENR', field: COMP12EN}
            - name: VREFEN
              description: VREFBUF clock enable
              input: rcc_pclk4
              output: vrefbuf_pclk
              control: {reg: 'APB4ENR', field: VREFEN}
            - name: RTCAPBEN
              description: RTC APB interface clock enable
              input: rcc_pclk4
              output: rtcapb_pclk
              control: {reg: 'APB4ENR', field: RTCAPBEN}
            - name: DAC2EN
              description: DAC2 peripheral clock enable (Smart Run Domain — separate from DAC1 on APB1)
              input: rcc_pclk4
              output: dac2_pclk
              control: {reg: 'APB4ENR', field: DAC2EN}
            - name: DFSDM2EN
              description: DFSDM2 peripheral clock enable (H7A3_B-specific; SRD-domain instance)
              input: rcc_pclk4
              output: dfsdm2_pclk
              control: {reg: 'APB4ENR', field: DFSDM2EN}
    blocks:
      ADC:
        from: STM32H723.ADC1
        instances: [ADC1, ADC2, ADC3]
        outputs:
          INTR:
            pattern: '^(ADC1_2|ADC3|ADC4|ADC1|ADC5|ADC2)$'
          DMA:
            description: DMA request for converted data
            pattern: '^DMA$'
          AWD1:
            description: Analog watchdog 1 event (routes to TIM ETR per RM0399 Table 102)
            pattern: '^AWD1$'
          AWD2:
            description: Analog watchdog 2 event (routes to TIM ETR per RM0399 Table 102)
            pattern: '^AWD2$'
          AWD3:
            description: Analog watchdog 3 event (routes to TIM ETR per RM0399 Table 102)
            pattern: '^AWD3$'
        transforms:
          - type: patchAddressBlock
            size: 256
      ADC_Common:
        from: STM32H723.ADC12_Common
        instances: [ADC12_Common, ADC3_Common]
        transforms:
          - type: patchAddressBlock
            size: 256
      ART:
        from: STM32H745_CM4.ART
        instances: [ART]
      AXI:
        from: STM32H723.AXI
        instances: [AXI]
      BDMA:
        from: STM32H723.BDMA
        instances: [BDMA, BDMA1, BDMA2]
        outputs:
          INTR:
            pattern: '^BDMA\d*$'
            description: Global interrupt (bare instance name, e.g. BDMA, BDMA1)
          CH0:
            pattern: '^BDMA_CH0$'
          CH1:
            pattern: '^BDMA_CH1$'
          CH2:
            pattern: '^BDMA_CH2$'
          CH3:
            pattern: '^BDMA_CH3$'
          CH4:
            pattern: '^BDMA_CH4$'
          CH5:
            pattern: '^BDMA_CH5$'
          CH6:
            pattern: '^BDMA_CH6$'
          CH7:
            pattern: '^BDMA_CH7$'
          CH8:
            pattern: '^BDMA_CH8$'
      BasicTimer:
        uses: BasicTimer
        instances: [TIM6, TIM7]
        outputs:
          INTR:
            pattern: '^(TIM6_DAC|TIM3|TIM9)$'
      CAN_CCU:
        from: STM32H723.CAN_CCU
        instances: [CAN_CCU]
      CEC:
        uses: CEC
        instances: [CEC]
      COMP:
        from: STM32H723.COMP1
        instances: [COMP1]
        outputs:
          INTR:
            pattern: '^COMP$'
          OUT:
            description: Analog comparator output (level/edge signal; routes to EXTI wakeup and to TIM/LPTIM trigger crossbars per RM0399 ch.14)
            pattern: '^OUT$'
      CORDIC:
        uses: CORDIC
        instances: [CORDIC]
      CRC:
        uses: CRC
        instances: [CRC]
      CRS:
        uses: CRS
        instances: [CRS]
      CRYP:
        uses: CRYP
        instances: [CRYP]
      DAC:
        from: STM32H7A3.DAC2
        instances: [DAC, DAC1, DAC2]
        outputs:
          INTR:
            pattern: '^DAC2$'
          CH1_DMA:
            description: DMA request for channel 1 conversions
            pattern: '^CH1_DMA$'
          CH2_DMA:
            description: DMA request for channel 2 conversions
            pattern: '^CH2_DMA$'
      DBGMCU:
        instances: [DBGMCU]
        variants:
          H73x:
            from: STM32H723.DBGMCU
          H742_H753:
            from: STM32H743.DBGMCU
          H745_H757:
            from: STM32H745_CM4.DBGMCU
          H7A3_B:
            from: STM32H7A3.DBGMCU
      DCMI:
        uses: DCMI
        instances: [DCMI]
      DFSDM:
        uses: DFSDM
        instances: [DFSDM, DFSDM1, DFSDM2]
        outputs:
          FLT0:
            pattern: '^DFSDM1_FLT0$'
          FLT1:
            pattern: '^DFSDM1_FLT1$'
          FLT2:
            pattern: '^DFSDM1_FLT2$'
          FLT3:
            pattern: '^DFSDM1_FLT3$'
          FLT0_DMA:
            description: DMA request for filter 0 output
            pattern: '^FLT0_DMA$'
          FLT1_DMA:
            description: DMA request for filter 1 output
            pattern: '^FLT1_DMA$'
          FLT2_DMA:
            description: DMA request for filter 2 output
            pattern: '^FLT2_DMA$'
          FLT3_DMA:
            description: DMA request for filter 3 output
            pattern: '^FLT3_DMA$'
          BREAK0:
            description: Filter 0 break event (signal-out-of-window). Routes to TIM brake inputs per RM0399 Table 102.
            pattern: '^BREAK0$'
          BREAK1:
            description: Filter 1 break event. Routes to TIM brake inputs per RM0399 Table 102.
            pattern: '^BREAK1$'
          BREAK2:
            description: Filter 2 break event. Routes to TIM brake inputs per RM0399 Table 102.
            pattern: '^BREAK2$'
          BREAK3:
            description: Filter 3 break event. Routes to TIM brake inputs per RM0399 Table 102.
            pattern: '^BREAK3$'
      DLYB:
        uses: DLYB
        instances: [DELAY_Block_SDMMC1, DELAY_Block_SDMMC2, DELAY_Block_QUADSPI, Delay_Block_OCTOSPI1, Delay_Block_OCTOSPI2]
      DMA:
        from: STM32H723.DMA1
        instances: [DMA1, DMA2, DMA2D, DMAMUX1, DMAMUX2]
        outputs:
          OVR:
            description: Request-line overrun event. Asserted by DMAMUX when more than one synchronized request fires before the previous was serviced. (Block shared between DMA and DMAMUX; for DMA instances this output is unwired — the per-stream STR<N> outputs carry interrupts.)
            pattern: '^DMAMUX\d+_OV(R)?$'
          EVT0:
            description: DMAMUX request-generator event 0 (feeds back to DMAMUX trigger input 0 per RM0399 Tables 106/107)
            pattern: '^EVT0$'
          EVT1:
            description: DMAMUX request-generator event 1
            pattern: '^EVT1$'
          EVT2:
            description: DMAMUX request-generator event 2
            pattern: '^EVT2$'
          EVT3:
            description: DMAMUX request-generator event 3
            pattern: '^EVT3$'
          EVT4:
            description: DMAMUX request-generator event 4
            pattern: '^EVT4$'
          EVT5:
            description: DMAMUX request-generator event 5
            pattern: '^EVT5$'
          EVT6:
            description: DMAMUX request-generator event 6 (also routes to EXTI D3 pendclear input per Table 104)
            pattern: '^EVT6$'
          EVT7:
            description: DMAMUX request-generator event 7 (also routes to EXTI D3 pendclear input per Table 104)
            pattern: '^EVT7$'
          # REQ_GEN<X> are the per-request-generator DMA-request outputs.
          # Each REQ_GEN<X> output feeds back into the DMAMUX request input
          # bus at slot X (so a DMA channel can pick it via
          # DMAMUX_CxCR.DMAREQ_ID = X).  Architecturally hard-wired; the loop
          # is invisible in Tables 134/135 but is the canonical content of
          # DMAMUX request-input slots 0..7.  Distinct from EVT<X>: EVT
          # signals are per-channel SYNC-overrun events that can route to
          # the trigger bus and EXTI pendclear, while REQ_GEN<X> outputs
          # only feed the request input bus.
          REQ_GEN0:
            description: Request generator 0 synthesized DMA-request output (feeds DMAMUX request input slot 0)
          REQ_GEN1:
            description: Request generator 1 synthesized DMA-request output (feeds DMAMUX request input slot 1)
          REQ_GEN2:
            description: Request generator 2 synthesized DMA-request output (feeds DMAMUX request input slot 2)
          REQ_GEN3:
            description: Request generator 3 synthesized DMA-request output (feeds DMAMUX request input slot 3)
          REQ_GEN4:
            description: Request generator 4 synthesized DMA-request output (feeds DMAMUX request input slot 4)
          REQ_GEN5:
            description: Request generator 5 synthesized DMA-request output (feeds DMAMUX request input slot 5)
          REQ_GEN6:
            description: Request generator 6 synthesized DMA-request output (feeds DMAMUX request input slot 6)
          REQ_GEN7:
            description: Request generator 7 synthesized DMA-request output (feeds DMAMUX request input slot 7)
          INTR:
            description: Global interrupt (used by DMA2D instances; the DMA block is shared across DMA streams, DMAMUX, and DMA2D — the latter has a single combined interrupt rather than per-stream)
            pattern: '^DMA2D$'
          CLUT_TRG:
            description: DMA2D CLUT load complete trigger (MDMA trigger source per RM0399 Table 105)
            pattern: '^CLUT_TRG$'
          TC_TRG:
            description: DMA2D transfer-complete trigger
            pattern: '^TC_TRG$'
          TW_TRG:
            description: DMA2D transfer-watermark trigger
            pattern: '^TW_TRG$'
          STR0:
            pattern: '^DMA_STR0$'
          STR1:
            pattern: '^DMA_STR1$'
          STR2:
            pattern: '^DMA_STR2$'
          STR3:
            pattern: '^DMA_STR3$'
          STR4:
            pattern: '^DMA_STR4$'
          STR5:
            pattern: '^DMA_STR5$'
          STR6:
            pattern: '^DMA_STR6$'
          STR7:
            pattern: '^DMA1_STR7$'
        transforms:
          - {type: createClusterArray, pattern: S(\d+)(\w+), name: S, description: DMA stream}
      DSIHOST:
        from: STM32H745_CM4.DSIHOST
        instances: [DSIHOST]
        outputs:
          INTR:
            description: Global interrupt (chapter-14 calls this 'dsi_it'). On H7 the chip-level NVIC vector is NMI-only; the signal also reaches EXTI.46 for low-power wake — the only chip-level destination we model today.
            pattern: '^DSI$'
          TE_TRG:
            description: Tearing-effect signal trigger (routes to MDMA per RM0399 Table 105)
            pattern: '^TE_TRG$'
          EOR_TRG:
            description: End-of-refresh signal trigger
            pattern: '^EOR_TRG$'
        transforms:
          - {type: renameRegisters, pattern: ^DSI_, replacement: ''}
        description: MIPI DSI host controller (Synopsys DesignWare)
      ETH:
        uses: ETH
        instances: [ETH, Ethernet_MAC]
        # H745/H747/H755/H757 SVDs name the instance Ethernet_MAC; H723/H7A3
        # SVDs name it ETH.  Same silicon (Synopsys EQOS), different SVD
        # spelling.  Canonicalise to ETH so chip yamls and chip_connections
        # use the RM-canonical name regardless of source SVD.
        rename_instances: {Ethernet_MAC: ETH}
      EXTI:
        from: STM32H723.EXTI
        instances: [EXTI]
        outputs:
          INTR1:
            pattern: '^EXTI1$'
          INTR2:
            pattern: '^EXTI2$'
          INTR3:
            pattern: '^EXTI3$'
          INTR4:
            pattern: '^EXTI4$'
          INTR9_5:
            pattern: '^EXTI9_5$'
          INTR15_10:
            pattern: '^EXTI15_10$'
          WKUP:
            pattern: '^WKUP$'
          FPU:
            pattern: '^FPU$'
          ECC_DIAG_IT:
            pattern: '^ECC_DIAG_IT$'
          TEMP_IT:
            pattern: '^TEMP_IT$'
      FDCAN:
        # RM0399 §56 models FDCAN as a subsystem: two M_CAN channels (FDCAN1
        # supports TTCAN, FDCAN2 doesn't), the CAN_CCU clock-calibration unit,
        # and a shared message RAM block.  The H745 SVD splits this into two
        # `derivedFrom` peripherals (FDCAN1 + FDCAN2), plus a separate
        # CAN_CCU peripheral; H7A3 splits the channels as TT_FDCAN + FDCAN
        # plus CAN_CCU.  Neither matches the silicon block topology.  We
        # model the subsystem here as one umbrella block: FDCAN1's register
        # set (superset including TTCAN) wrapped into a dim=2 cluster array
        # `chan[%s]` at offset 0 (stride 0x400) covering both channels,
        # CAN_CCU's register set embedded as cluster `CCU` at offset 0x800,
        # and the 10 KB shared message RAM as a uint32 array `MSGRAM[%s]`
        # at offset 0xC00 (one buffer for the whole subsystem; drivers carve
        # per-channel sections via the FDCAN allocation registers).  H7A3_B
        # keeps its legacy single-channel layout via a variant.
        from: STM32H745_CM7.FDCAN1
        instances: [FDCAN1]
        rename_instances: {FDCAN1: FDCAN}
        outputs:
          IT0_CH1:
            description: Channel 1 interrupt 0
            pattern: '^FDCAN1_IT0$'
          IT1_CH1:
            description: Channel 1 interrupt 1
            pattern: '^FDCAN1_IT1$'
          IT0_CH2:
            description: Channel 2 interrupt 0 (SVD attaches to FDCAN2 peripheral; chip_connections-injected on umbrella)
          IT1_CH2:
            description: Channel 2 interrupt 1
          CAL:
            description: Clock calibration interrupt (from CAN_CCU; SVD attaches it to the FDCAN1 peripheral's interrupt list)
            pattern: '^FDCAN_CAL$'
          SWT:
            description: TT trigger inputs from chip-level trigger crossbar (4 wires fanning out to both channels TT crossbars per RM0399 Table 102)
          EVT:
            description: TT event inputs (4 wires, same routing as SWT)
          TMP:
            description: TTCAN timestamp output (Table 102 lists the source as 'CAN' / 'TMP' → ETH PTP3; physically originates from channel 1, the only TT-capable channel)
        transforms:
          - {type: patchAddressBlock, size: 13312}
          - {type: wrapInClusterArray, name: chan, dim: 2, dimIncrement: 0x400, description: 'FDCAN channel (FDCAN1 supports TTCAN; FDCAN2 lacks TT registers - they are present but unused on slot 1)'}
          - {type: embedRegistersAsCluster, source: CAN_CCU, name: CCU, addressOffset: 0x800, description: 'CAN_CCU clock-calibration unit shared by both channels (one per FDCAN subsystem)'}
          # Shared 10 KB FDCAN message RAM (RM0399 §56.4.2).  Modeled as a
          # raw uint32 array because the structure is software-defined: the
          # driver carves per-channel sections (Std/Ext filter lists, Rx
          # FIFO 0/1, Rx Buffers, Tx event FIFO, Tx Buffers) via the FDCAN
          # allocation registers (SIDFC, XIDFC, RXF0C, RXF1C, RXBC, TXEFC,
          # TXBC).  Volatility propagates from the surrounding
          # `HwPtr<struct FDCAN volatile>`, so the bare `uint32_t[]`
          # elements still get volatile-qualified access when reached
          # through the registers pointer.
          - type: patchRegisters
            registers:
              - name: MSGRAM[%s]
                description: Shared FDCAN message RAM (10 KB, 2560 32-bit words). Drivers carve per-channel sections via FDCAN.chan[i] allocation registers.
                addressOffset: 0xC00
                size: 32
                access: read-write
                resetValue: 0
                dim: 2560
                dimIncrement: 4
        description: Controller area network with flexible data-rate (FDCAN subsystem - 2 channels + CCU + 10KB message RAM, Bosch M_CAN with TT support)
        variants:
          H7A3_B:
            # H7A3 SVD names channel 1 = TT_FDCAN and channel 2 = FDCAN.  The
            # umbrella restructure isn't applied here yet — keep legacy
            # single-channel modeling until a future session restructures it
            # symmetrically.
            #
            # SVD bug: the H7A3 SVD attaches ALL 5 FDCAN interrupts (both
            # channels' IT0/IT1 plus FDCAN_CAL) to the channel-2 peripheral
            # (FDCAN); the channel-1 peripheral (TT_FDCAN) carries none.  The
            # umbrella IT0_CH1/IT1_CH1 patterns at the family level resolve
            # the SVD raws FDCAN1_IT0/FDCAN1_IT1 to those canonicals first
            # (family entries beat variant entries in `_build_outputs_decl`),
            # so they land on FDCAN2's canonical map rather than on FDCAN1
            # where they belong.  The wires are wrong (FDCAN2 ends up with
            # FDCAN1's interrupts as IT0_CH1/IT1_CH1) but the destinations
            # do point at the correct NVIC vectors.  Declaring IT0_CH1 /
            # IT1_CH1 as pattern-less variant outputs accepts the wiring at
            # validation time without inviting them to capture new SVD raws.
            # TODO: redo H7A3_B FDCAN as the umbrella block; redistribute
            # interrupts to the correct instances via chip_connections.
            from: STM32H7A3.TT_FDCAN
            instances: [TT_FDCAN, FDCAN]
            rename_instances: {TT_FDCAN: FDCAN1, FDCAN: FDCAN2}
            outputs:
              CAL:
                pattern: '^FDCAN2_CAL$'
              IT1:
                pattern: '^(FDCAN2_IT1|FDCAN1_IT1)$'
              IT0:
                pattern: '^(FDCAN2_IT0|FDCAN1_IT0)$'
              IT0_CH1:
                description: Misattributed FDCAN1 IT0 — see TODO above
              IT1_CH1:
                description: Misattributed FDCAN1 IT1 — see TODO above
            transforms: []
            description: Controller area network with flexible data-rate (Bosch M_CAN)
      FDCAN3:
        from: STM32H723.FDCAN3
        instances: [FDCAN3]
        outputs:
          IT0:
            pattern: '^FDCAN3_IT0$'
          IT1:
            pattern: '^FDCAN3_IT1$'
      FMAC:
        uses: FMAC
        instances: [FMAC]
      FMC:
        uses: FMC
        instances: [FMC]
      Flash:
        instances: [FLASH, Flash]
        outputs:
          INTR:
            pattern: '^FLASH$'
        transforms:
          - {type: renameRegisters, pattern: ^FLASH_, replacement: ''}
        variants:
          H73x:
            from: STM32H723.Flash
          H742_H753:
            from: STM32H743.Flash
          H745_H757:
            from: STM32H745_CM4.Flash
          H7A3_B:
            from: STM32H7A3.Flash
      GPIO:
        uses: GPIO
        instances: [GPIOA, GPIOB, GPIOC, GPIOD, GPIOE, GPIOF, GPIOG, GPIOH, GPIOI, GPIOJ, GPIOK]
      Timer:
        uses: TimerV1
        instances: [TIM1, TIM12, TIM13, TIM14, TIM15, TIM16, TIM17, TIM2, TIM3, TIM4, TIM5, TIM8]
        variants:
          H73x:
            instances: [TIM1, TIM12, TIM13, TIM14, TIM15, TIM16, TIM17, TIM2, TIM23, TIM24, TIM3, TIM4, TIM5, TIM8]
      HASH:
        uses: HASH
        instances: [HASH]
        outputs:
          INTR:
            pattern: '^HASH_RNG$'
      HRTIM:
        uses: HRTIM
        instances: [HRTIM_Master]
        variants:
          # The H7A3_B SVD declares HRTIM peripherals (HRTIM_Master,
          # HRTIM_Common, HRTIM_TIM[A-E]) carbon-copied from H742_H753, but
          # this silicon doesn't have the HRTIM hardware — RM0455 doesn't
          # mention HRTIM and STM32H7A3 datasheet's timer feature list omits
          # it (no HRTIMEN bit in RCC, no HRTIMSEL kernel-clock mux).
          # Suppress the HRTIM instance from the H7A3_B chip yamls.
          H7A3_B:
            instances: []
      HSEM:
        from: STM32H743.HSEM
        instances: [HSEM]
        outputs:
          INTR:
            pattern: '^(HSEM0|HSEM1)$'
        params:
          - {name: semaphores, type: int, default: 32, max: 32, description: Number of hardware semaphores (16 or 32)}
        transforms:
          # MASTERID (RM0433): 4-bit at [11:8]; H743 SVD has 8-bit — narrow to 4
          # H745 SVD uses COREID (RM0399 name) at correct 4-bit width — no fix needed
          - {type: patchFields, register_pattern: ^R\d+$, fields: [{name: MASTERID, bitOffset: 8, bitWidth: 4}]}
          - {type: patchFields, register_pattern: ^RLR\d+$, fields: [{name: MASTERID, bitOffset: 8, bitWidth: 4}]}
          - {type: patchFields, register: CR, fields: [{name: MASTERID, bitOffset: 8, bitWidth: 4}]}
          # H743 SVD: CR is read-write, RM says write-only
          - {type: patchRegisters, registers: [{name: CR, access: write-only}]}
        variants:
          H745_H757:
            from: STM32H745_CM4.HSEM
            transforms: []
      I2C:
        uses: I2C
        instances: [I2C1, I2C2, I2C3, I2C4, I2C5]
      IWDG:
        uses: IWDG
        instances: [IWDG, IWDG1, IWDG2]
      JPEG:
        uses: JPEG
        instances: [JPEG]
      LPTIM:
        uses: LPTIM
        instances: [LPTIM1, LPTIM2, LPTIM3, LPTIM4, LPTIM5]
      LPUART:
        uses: USART
        instances: [LPUART1]
        outputs:
          INTR:
            pattern: '^LPUART$'
      LTDC:
        uses: LTDC
        instances: [LTDC]
      MDIOS:
        uses: MDIOS
        instances: [MDIOS]
      MDMA:
        from: STM32H743.MDMA
        instances: [MDMA]
        outputs:
          INTR:
            pattern: '^MDMA$'
        transforms:
          - {type: renameFields, register: C0ISR, pattern: 0$, replacement: ''}
          - {type: renameFields, register: C0IFCR, pattern: 0$, replacement: ''}
          - {type: createClusterArray, pattern: C(\d+)(\w+), name: C, description: MDMA channel}
      OCTOSPI:
        uses: XSPI
        instances: [OCTOSPI1, OCTOSPI2]
      OPAMP:
        uses: HSOPAMP
        instances: [OPAMP]
      OTFDEC:
        from: STM32H725.OTFDEC1
        instances: [OTFDEC1, OTFDEC2]
        outputs:
          INTR:
            pattern: '^(OTFDEC1|OTFDEC2)$'
      OTG_HS:
        uses: OTG
        instances: [OTG1_HS_GLOBAL, OTG2_HS_GLOBAL]
        outputs:
          INTR:
            pattern: '^OTG_HS$'
          WKUP:
            pattern: '^OTG_HS_WKUP$'
          EP1_IN:
            pattern: '^OTG_HS_EP1_IN$'
          EP1_OUT:
            pattern: '^OTG_HS_EP1_OUT$'
      PSSI:
        uses: PSSI
        instances: [PSSI]
      PWR:
        from: STM32H723.PWR
        instances: [PWR]
        outputs:
          PVD_AVD:
            description: Programmable / analog voltage detector event (PVD on VDD, AVD on VDDA)
            pattern: '^PVD_AVD$'
          WKUP1:
            description: Wakeup pin 1 event
            pattern: '^WKUP1$'
          WKUP2:
            description: Wakeup pin 2 event
            pattern: '^WKUP2$'
          WKUP3:
            description: Wakeup pin 3 event
            pattern: '^WKUP3$'
          WKUP4:
            description: Wakeup pin 4 event
            pattern: '^WKUP4$'
          WKUP5:
            description: Wakeup pin 5 event
            pattern: '^WKUP5$'
          WKUP6:
            description: Wakeup pin 6 event
            pattern: '^WKUP6$'
        params:
          - {name: has_smps, type: bool, default: true, description: Has SMPS step-down converter (false for H742/H753 which use SCUEN instead of SDEN)}
        transforms:
          # H723/H745 SVDs: USB33DEN marked write-only, RM says read-write
          - type: patchFields
            register: CR3
            fields:
              - {name: USB33DEN, access: read-write}
          # H742/H753 has no SMPS — bit 2 is SCUEN (Supply Config Update Enable) not SDEN
          - type: cloneRegister
            source: CR3
            name: CR3_SCUEN
            renameFields:
              - {pattern: ^SDEN$, replacement: SCUEN}
        variants:
          H7A3_B:
            from: STM32H7A3.PWR
            transforms: []
      QUADSPI:
        uses: QUADSPI
        instances: [QUADSPI]
      RAMECC:
        from: STM32H743.RAMECC1
        instances: [RAMECC, RAMECC1, RAMECC2, RAMECC3]
        outputs:
          INTR:
            pattern: '^ECC_DIAG_IT$'
        params:
          - {name: monitors, type: int, default: 5, max: 5, description: Number of ECC monitoring units in this RAMECC instance}
        transforms:
          # All H7 SVDs: M2FECR/M3FECR/M4FECR at wrong offsets (RM says regular 0x20 stride)
          # All H7 SVDs: scattered access bugs on FAR/FDRH/FECR (RM says all read-only)
          - type: patchRegisters
            registers:
              - {name: M1FECR, access: read-only}
              - {name: M2FDRH, access: read-only}
              - {name: M2FECR, addressOffset: 84, access: read-only}
              - {name: M3FECR, addressOffset: 116}
              - {name: M4FECR, addressOffset: 148, alternateRegister: null}
              - {name: M5FAR, access: read-only}
      RCC:
        instances: [RCC]
        outputs:
          INTR:
            pattern: '^RCC$'
          LSE_CSS:
            description: LSE Clock Security System event (LSE clock failure). Routes to both NVIC.18 (shared TAMP_STAMP_CSS_LSE vector) and EXTI.18 (shared with RTC tamper/timestamp).
            pattern: '^LSE_CSS$'
          HSE_CSS_WKUP:
            description: HSE Clock Security System wakeup event (HSE clock failure). Routes to EXTI.87 for low-power wake; the NVIC side is the chip's NMI exception, not a regular vector.
            pattern: '^HSE_CSS_WKUP$'
          LSE_CK:
            description: LSE clock as a routable signal (TIM2 ETR3 trigger source per RM0399 Table 102)
            pattern: '^LSE_CK$'
          LSI_CK:
            description: LSI internal clock as a routable signal (TIM16 TI1 source)
            pattern: '^LSI_CK$'
          CSI_CK:
            description: CSI internal oscillator clock as a routable signal (TIM15 TI1 source)
            pattern: '^CSI_CK$'
          HSE_1MHZ:
            description: HSE divided to 1 MHz, routable as TIM17 TI1 source
            pattern: '^HSE_1MHZ$'
          MCO1:
            description: Microcontroller clock output 1 (routes to TIM17 TI1 per Table 102)
            pattern: '^MCO1$'
          MCO2:
            description: Microcontroller clock output 2 (routes to TIM15 TI1 per Table 102)
            pattern: '^MCO2$'
        variants:
          H73x:
            from: STM32H723.RCC
          H742_H753:
            from: STM32H743.RCC
          H745_H757:
            from: STM32H745_CM4.RCC
            transforms:
              - {type: patchFields, register: APB3ENR, fields: [{name: DSIEN, bitOffset: 4, bitWidth: 1, description: DSI peripheral clock enable}]}
              - {type: patchFields, register: C1_APB3ENR, fields: [{name: DSIEN, bitOffset: 4, bitWidth: 1, description: DSI peripheral clock enable}]}
              - {type: patchFields, register: APB3LPENR, fields: [{name: DSILPEN, bitOffset: 4, bitWidth: 1, description: DSI peripheral clock enable during CSleep mode}]}
              - {type: patchFields, register: C1_APB3LPENR, fields: [{name: DSILPEN, bitOffset: 4, bitWidth: 1, description: DSI peripheral clock enable during CSleep mode}]}
              - {type: patchFields, register: APB1LENR, fields: [{name: WWDG2EN, bitOffset: 11, bitWidth: 1, description: WWDG2 peripheral clock enable}]}
              - {type: patchFields, register: C1_APB1LENR, fields: [{name: WWDG2EN, bitOffset: 11, bitWidth: 1, description: WWDG2 peripheral clock enable}]}
              - {type: patchFields, register: APB1LLPENR, fields: [{name: WWDG2LPEN, bitOffset: 11, bitWidth: 1, description: WWDG2 peripheral clock enable during CSleep mode}]}
              - {type: patchFields, register: C1_APB1LLPENR, fields: [{name: WWDG2LPEN, bitOffset: 11, bitWidth: 1, description: WWDG2 peripheral clock enable during CSleep mode}]}
              - {type: renameRegisters, pattern: '^(RSR|(?:AHB[1-4]|APB[1-4][LH]?)(?:ENR|LPENR))$', replacement: C0_\1}
              - {type: patchRegisters, registers: [{name: C2_RSR, addressOffset: 400, size: 32, access: read-write, resetValue: 0}]}
              - {type: createClusterArray, pattern: C(\d+)_(.+), name: C, description: Per-CPU register bank}
          H7A3_B:
            from: STM32H7A3.RCC
      RNG:
        uses: RNG
        instances: [RNG]
        outputs:
          INTR:
            pattern: '^HASH_RNG$'
      RTC:
        uses: RTC_V1
        instances: [RTC]
        outputs:
          TAMP_STAMP_CSS_LSE:
            pattern: '^RTC_TAMP_STAMP_CSS_LSE$'
          WKUP:
            pattern: '^RTC_WKUP$'
          ALARM:
            pattern: '^RTC_ALARM$'
          ALARM_A_EVT:
            description: Alarm A event (routable to LPTIM trigger inputs per RM0399 Table 102; distinct from the combined ALARM interrupt)
            pattern: '^ALARM_A_EVT$'
          ALARM_B_EVT:
            description: Alarm B event
            pattern: '^ALARM_B_EVT$'
          TAMP1_EVT:
            description: Tamper input 1 event
            pattern: '^TAMP1_EVT$'
          TAMP2_EVT:
            description: Tamper input 2 event
            pattern: '^TAMP2_EVT$'
          TAMP3_EVT:
            description: Tamper input 3 event
            pattern: '^TAMP3_EVT$'
        variants:
          H7A3_B:
            from: STM32H7A3.RTC
      SAI:
        uses: SAI
        instances: [SAI1, SAI2, SAI3, SAI4]
      SDMMC:
        uses: SDMMC
        instances: [SDMMC1, SDMMC2]
        description: SD/SDIO/MMC host interface (ARM PrimeCell PL18x)
      SPDIFRX:
        uses: SPDIFRX
        instances: [SPDIFRX]
      SPI:
        uses: ModernSPI
        instances: [SPI1, SPI2, SPI3, SPI4, SPI5, SPI6]
      SWPMI:
        uses: SWPMI
        instances: [SWPMI]
      SYSCFG:
        from: STM32H723.SYSCFG
        instances: [SYSCFG]
        outputs:
          INTR:
            pattern: '^LPUART$'
          # EXTICR-selected external-pin signals.  EXTI<N> is the mux output
          # for EXTI line N (SYSCFG.EXTICR<i>.EXTI<N> selects the GPIO port,
          # pin number is implicit N).  The signal always reaches EXTI line
          # input port N; lines 9/11/15 additionally fan out to DAC / ADC /
          # DFSDM trigger inputs per RM0399 Table 102.  Modelling the
          # GPIO-side upstream (pin -> mux input) is deferred — the mux
          # output is what fans out to non-EXTI destinations.
          EXTI0:  {description: EXTI line 0 mux output (GPIO port selected via SYSCFG.EXTICR1.EXTI0). Also drives DMAMUX1 REQ_GEN trigger 6 and DMAMUX2 REQ_GEN trigger 20 per RM0399 Tables 106/107.}
          EXTI1:  {description: EXTI line 1 mux output (GPIO port selected via SYSCFG.EXTICR1.EXTI1)}
          EXTI2:  {description: EXTI line 2 mux output (GPIO port selected via SYSCFG.EXTICR1.EXTI2). Also drives DMAMUX2 REQ_GEN trigger 21 per RM0399 Table 107.}
          EXTI3:  {description: EXTI line 3 mux output (GPIO port selected via SYSCFG.EXTICR1.EXTI3)}
          EXTI4:  {description: EXTI line 4 mux output (GPIO port selected via SYSCFG.EXTICR2.EXTI4)}
          EXTI5:  {description: EXTI line 5 mux output (GPIO port selected via SYSCFG.EXTICR2.EXTI5)}
          EXTI6:  {description: EXTI line 6 mux output (GPIO port selected via SYSCFG.EXTICR2.EXTI6)}
          EXTI7:  {description: EXTI line 7 mux output (GPIO port selected via SYSCFG.EXTICR2.EXTI7)}
          EXTI8:  {description: EXTI line 8 mux output (GPIO port selected via SYSCFG.EXTICR3.EXTI8)}
          EXTI9:  {description: EXTI line 9 mux output (GPIO port selected via SYSCFG.EXTICR3.EXTI9). Also drives DAC channel 1/2 trigger 12 per RM0399 Table 102.}
          EXTI10: {description: EXTI line 10 mux output (GPIO port selected via SYSCFG.EXTICR3.EXTI10)}
          EXTI11: {description: EXTI line 11 mux output (GPIO port selected via SYSCFG.EXTICR3.EXTI11). Also drives DFSDM TRG24 and ADC1/2/3 regular trigger 6 per RM0399 Table 102.}
          EXTI12: {description: EXTI line 12 mux output (GPIO port selected via SYSCFG.EXTICR4.EXTI12)}
          EXTI13: {description: EXTI line 13 mux output (GPIO port selected via SYSCFG.EXTICR4.EXTI13)}
          EXTI14: {description: EXTI line 14 mux output (GPIO port selected via SYSCFG.EXTICR4.EXTI14)}
          EXTI15: {description: EXTI line 15 mux output (GPIO port selected via SYSCFG.EXTICR4.EXTI15). Also drives DFSDM TRG25 and ADC1/2/3 injected trigger 6 per RM0399 Table 102.}
        variants:
          H742_H753:
            from: STM32H743.SYSCFG
          H745_H757:
            from: STM32H745_CM7.SYSCFG
          H7A3_B:
            from: STM32H7A3.SYSCFG
      TAMP:
        uses: TAMP
        instances: [TAMP]
      TT_FDCAN:
        from: STM32H7A3.TT_FDCAN
        instances: [TT_FDCAN]
      USART:
        uses: USART
        instances: [UART4, UART5, UART7, UART8, UART9, USART1, USART10, USART2, USART3, USART6, USART9]
        # SVD-raw interrupt names follow the instance name on H7 (USART2..6, UART4..9); enumerate
        # them all so chips get explicit INTR routing.  The block-level fallback that auto-mapped
        # raw==instance to the single canonical no longer fires once non-SVD outputs (TX_DMA/RX_DMA)
        # bring the canonical set above 1.
        outputs:
          INTR:
            pattern: '^(USART2|USART3|USART6|USART10|UART4|UART5|UART7|UART8|UART9|UART10|USART1|USART7|USART5|USART4)$'
      VREFBUF:
        uses: VREFBUF
        instances: [VREFBUF]
      WWDG:
        uses: WWDG
        instances: [WWDG, WWDG1, WWDG2]
    chip_connections:
      _all:
        _all:
          SPDIFRX: {INTR: [NVIC.113]}
          HRTIM: {MST: [NVIC.119], TIMA: [NVIC.120], TIMB: [NVIC.121], TIMC: [NVIC.122], TIMD: [NVIC.123], TIME: [NVIC.124], FLT: [NVIC.125]}
      H742_H753:
        _all:
          SDMMC1: {INTR: [NVIC.65]}
          SDMMC2: {INTR: [NVIC.140]}
      H745_H757:
        _all:
          # OTG WKUP gains EXTI destination per RM0399 Table 103 (usb<N>_wkup → WKUP43/44).
          # SOF (Start-of-Frame) routes to TIM ITR and CRS sync per Table 102.
          OTG1_HS_GLOBAL: {EP1_OUT: [NVIC.90], EP1_IN: [NVIC.91], WKUP: [NVIC.92, EXTI.43], INTR: [NVIC.93], SOF: [TIM2.ITR.5, TIM5.ITR.7, CRS.sync.2]}
          OTG2_HS_GLOBAL: {EP1_OUT: [NVIC.114], EP1_IN: [NVIC.115], WKUP: [NVIC.116, EXTI.44], INTR: [NVIC.117], SOF: [TIM2.ITR.6, TIM5.ITR.8, CRS.sync.3]}
          SDMMC2: {INTR: [NVIC.140]}
          # USART/UART DMAMUX1 request lines per RM0399 Table 106; EXTI wakeup
          # lines per Table 103. Standard USART/UART expose a single combined
          # WKUP signal (RX-event OR TX-event); LPUART1 exposes the RX-event
          # and TX-event signals separately on distinct EXTI lines. See
          # svd/ST/SVD_ERRATA.md → 'LPUART wakeup signals'.
          USART1:  {TX_DMA: [DMAMUX1.42], RX_DMA: [DMAMUX1.41], WKUP: [EXTI.26]}
          USART2:  {TX_DMA: [DMAMUX1.44], RX_DMA: [DMAMUX1.43], WKUP: [EXTI.27]}
          USART3:  {TX_DMA: [DMAMUX1.46], RX_DMA: [DMAMUX1.45], WKUP: [EXTI.28]}
          UART4:   {TX_DMA: [DMAMUX1.64], RX_DMA: [DMAMUX1.63], WKUP: [EXTI.30]}
          UART5:   {TX_DMA: [DMAMUX1.66], RX_DMA: [DMAMUX1.65], WKUP: [EXTI.31]}
          USART6:  {TX_DMA: [DMAMUX1.72], RX_DMA: [DMAMUX1.71], WKUP: [EXTI.29]}
          UART7:   {TX_DMA: [DMAMUX1.80], RX_DMA: [DMAMUX1.79], WKUP: [EXTI.32]}
          UART8:   {TX_DMA: [DMAMUX1.82], RX_DMA: [DMAMUX1.81], WKUP: [EXTI.33]}
          LPUART1: {INTR: [NVIC.158, EXTI.64], TX_DMA: [DMAMUX2.10], RX_DMA: [DMAMUX2.9], WKUP_RX: [EXTI.34, DMAMUX2.gen.7], WKUP_TX: [EXTI.35, DMAMUX2.gen.8], TX_IT: [DMAMUX2.gen.24], RX_IT: [DMAMUX2.gen.25]}
          # SPI: DMAMUX1 request lines (Table 106) for SPI1-5; SPI6 sits on
          # DMAMUX2 (Table 107). EXTI wakeup lines (Table 103) WKUP36-41 plus
          # SPI6's interrupt-routed-to-EXTI on WKUP64 (shared with LPUART1).
          SPI1:    {TX_DMA: [DMAMUX1.38], RX_DMA: [DMAMUX1.37], WKUP: [EXTI.36]}
          SPI2:    {TX_DMA: [DMAMUX1.40], RX_DMA: [DMAMUX1.39], WKUP: [EXTI.37]}
          SPI3:    {TX_DMA: [DMAMUX1.62], RX_DMA: [DMAMUX1.61], WKUP: [EXTI.38]}
          SPI4:    {TX_DMA: [DMAMUX1.84], RX_DMA: [DMAMUX1.83], WKUP: [EXTI.39]}
          SPI5:    {TX_DMA: [DMAMUX1.86], RX_DMA: [DMAMUX1.85], WKUP: [EXTI.40]}
          # SPI6.INTR → EXTI.65 per RM0399 Table 152 (§21.4); Table 103 in ch.14
          # has a typo placing both LPUART1 and SPI6 at WKUP64. See errata.
          SPI6:    {INTR: [NVIC.102, EXTI.65, DMAMUX2.gen.23], TX_DMA: [DMAMUX2.12], RX_DMA: [DMAMUX2.11], WKUP: [EXTI.41, DMAMUX2.gen.16]}
          # I2C: DMAMUX1 request lines (Table 106) for I2C1-3; I2C4 sits on
          # DMAMUX2 (Table 107). EXTI wakeup lines (Table 103) WKUP22-25 plus
          # I2C4's EV/ER interrupts additionally routed to EXTI WKUP62/63.
          I2C1:    {TX_DMA: [DMAMUX1.34], RX_DMA: [DMAMUX1.33], WKUP: [EXTI.22]}
          I2C2:    {TX_DMA: [DMAMUX1.36], RX_DMA: [DMAMUX1.35], WKUP: [EXTI.23]}
          I2C3:    {TX_DMA: [DMAMUX1.74], RX_DMA: [DMAMUX1.73], WKUP: [EXTI.24]}
          I2C4:    {EV: [NVIC.111, EXTI.62, DMAMUX2.gen.22], ER: [NVIC.112, EXTI.63], TX_DMA: [DMAMUX2.14], RX_DMA: [DMAMUX2.13], WKUP: [EXTI.25, DMAMUX2.gen.15]}
          # SAI: per-sub-block DMA requests (Table 106 SAI1-3 → DMAMUX1,
          # Table 107 SAI4 → DMAMUX2). SAI4's INTR additionally routes to
          # EXTI.76 (Table 103 sai4_gbl_it). Frame-sync routes from Table 102
          # (FS_A/FS_B → TIM ETR / LPTIM trigger inputs) are deferred to the
          # peripheral-interconnect sub-step.
          # SAI FS_A/FS_B (frame-sync signals) route to TIM ETR and LPTIM
          # trigger / mux inputs per Table 102. SAI1 → TIM2.ETR; SAI2 →
          # TIM5.ETR + LPTIM4 ext_trg; SAI4 → LPTIM3/LPTIM5 (no TIM destination).
          SAI1:    {A_DMA: [DMAMUX1.87], B_DMA: [DMAMUX1.88], FS_A: [TIM2.ETR.4, LPTIM3.ext_trg.4], FS_B: [TIM2.ETR.5, LPTIM3.ext_trg.5]}
          SAI2:    {A_DMA: [DMAMUX1.89], B_DMA: [DMAMUX1.90], FS_A: [TIM5.ETR.1, LPTIM4.ext_trg.4], FS_B: [TIM5.ETR.2, LPTIM4.ext_trg.5]}
          SAI3:    {A_DMA: [DMAMUX1.113], B_DMA: [DMAMUX1.114]}
          # SAI4.FS_A/FS_B route to LPTIM3 (in1_mux) and LPTIM5 (ext_trg) per
          # Table 102. SAI4 has no TIM ETR routes (only the LPTIM ones).
          SAI4:    {INTR: [NVIC.162, EXTI.76], A_DMA: [DMAMUX2.15], B_DMA: [DMAMUX2.16], FS_A: [LPTIM3.in1_mux.1, LPTIM5.ext_trg.3], FS_B: [LPTIM3.in1_mux.2, LPTIM5.ext_trg.4]}
          # Simple-DMA peripherals: ADC, DAC, DCMI, HASH, CRYP, SPDIFRX,
          # DFSDM, SWPMI per RM0399 Table 106. ADC3 also has DMAMUX2 routing
          # (Table 107) and an INTR-to-EXTI line (Table 103 adc3_it → WKUP75).
          # ADC: AWD<N> (analog watchdog events) route to TIM1/TIM8 ETR
          # inputs and HRTIM events per Table 102.
          ADC1:    {DMA: [DMAMUX1.9], AWD1: [TIM1.ETR.3, HRTIM.evt1_4], AWD2: [TIM1.ETR.4, HRTIM.evt2_4], AWD3: [TIM1.ETR.5, HRTIM.evt3_4]}
          ADC2:    {DMA: [DMAMUX1.10], AWD1: [TIM8.ETR.3, HRTIM.evt4_4], AWD2: [TIM8.ETR.4, HRTIM.evt5_4], AWD3: [TIM8.ETR.5, HRTIM.evt6_4]}
          ADC3:    {INTR: [NVIC.143, EXTI.75, DMAMUX2.gen.26], DMA: [DMAMUX1.115, DMAMUX2.17], AWD1: [TIM1.ETR.6, TIM8.ETR.6, DMAMUX2.gen.27], AWD2: [TIM1.ETR.7, TIM8.ETR.7], AWD3: [TIM1.ETR.8, TIM8.ETR.8]}
          DAC:     {CH1_DMA: [DMAMUX1.67], CH2_DMA: [DMAMUX1.68]}
          DCMI:    {DMA: [DMAMUX1.75]}
          CRYP:    {IN_DMA: [DMAMUX1.76], OUT_DMA: [DMAMUX1.77]}
          HASH:    {IN_DMA: [DMAMUX1.78]}
          SPDIFRX: {DT_DMA: [DMAMUX1.93], CS_DMA: [DMAMUX1.94], FRAME_SYNC: [TIM17.TI1.1]}
          # Chapter 14 calls this 'DFSDM1' but the chip instance is named 'DFSDM'.
          # The break outputs feed TIM brake inputs per Table 102. ST writes
          # the source signal inconsistently — 'dfsdm1_break<N>' on some rows
          # and 'dfsdm_break<N>' on others, but they refer to the same per-
          # filter signals. Each break has two TIM-brake destinations:
          # BREAK0 → TIM1.BRK.3 + TIM15.BRK.3 (filter 0)
          # BREAK1 → TIM1.BRK2.3 + TIM16.BRK.3 (filter 1)
          # BREAK2 → TIM8.BRK.3 + TIM17.BRK.3 (filter 2)
          # BREAK3 → TIM8.BRK2.3 (filter 3; only one destination)
          DFSDM:   {FLT0_DMA: [DMAMUX1.101], FLT1_DMA: [DMAMUX1.102], FLT2_DMA: [DMAMUX1.103], FLT3_DMA: [DMAMUX1.104], BREAK0: [TIM1.BRK.3, TIM15.BRK.3], BREAK1: [TIM1.BRK2.3, TIM16.BRK.3], BREAK2: [TIM8.BRK.3, TIM17.BRK.3], BREAK3: [TIM8.BRK2.3]}
          SWPMI:   {TX_DMA: [DMAMUX1.92], RX_DMA: [DMAMUX1.91], WKUP: [EXTI.54]}
          # OPAMP1 output (the H7 OPAMP peripheral contains 2 amplifiers; Table
          # 102 lists only OPAMP1's output as feeding HRTIM events 4 and 9).
          OPAMP:   {OUT1: [HRTIM.evt4_2, HRTIM.evt9_2]}
          # Ethernet PPS (pulse-per-second from PTP engine) routes to TIM2/3 ITR4
          # and the FDCAN subsystem's TT trigger wires 2 (SWT + EVT) per Table 102.
          # FDCAN.SWT/EVT are the chip-side fan-out wires; both channels' TT
          # crossbars read the same four lines.
          ETH: {PPS: [TIM2.ITR.4, TIM3.ITR.4, FDCAN.SWT.2, FDCAN.EVT.2]}
          # FDCAN subsystem: SVD attaches channel-2 interrupts to a separate
          # FDCAN2 peripheral, which our umbrella restructure folds away — so
          # the IT0_CH2/IT1_CH2 vectors are injected here on the umbrella
          # instance (NVIC.36/38 on H742_H753, H745_H757, H73x).  TMP is the
          # TTCAN timestamp output (Table 102 'CAN'/'TMP' row → ETH PTP3).
          FDCAN:   {IT0_CH2: [NVIC.36], IT1_CH2: [NVIC.38], TMP: [ETH.PTP.3]}
          # SYSCFG EXTI line mux outputs (RM0399 §10.3 EXTICR + Table 102).
          # Each EXTI<N> signal is the GPIO-selected pin signal that drives
          # EXTI input line N; lines 9/11/15 additionally fan out to DAC,
          # DFSDM, and ADC trigger inputs.  The upstream GPIO-pin source
          # side is intentionally left implicit.
          SYSCFG:  {EXTI0:  [EXTI.0,  DMAMUX1.gen.6, DMAMUX2.gen.20],
                    EXTI1:  [EXTI.1],
                    EXTI2:  [EXTI.2,  DMAMUX2.gen.21],
                    EXTI3:  [EXTI.3],
                    EXTI4:  [EXTI.4],
                    EXTI5:  [EXTI.5],
                    EXTI6:  [EXTI.6],
                    EXTI7:  [EXTI.7],
                    EXTI8:  [EXTI.8],
                    EXTI9:  [EXTI.9,  DAC.ch1_trg.12, DAC.ch2_trg.12],
                    EXTI10: [EXTI.10],
                    EXTI11: [EXTI.11, DFSDM.TRG.24, ADC1.ext_trg.6,  ADC2.ext_trg.6,  ADC3.ext_trg.6],
                    EXTI12: [EXTI.12],
                    EXTI13: [EXTI.13],
                    EXTI14: [EXTI.14],
                    EXTI15: [EXTI.15, DFSDM.TRG.25, ADC1.jext_trg.6, ADC2.jext_trg.6, ADC3.jext_trg.6]}
          # Additional EXTI destinations on existing interrupt/wakeup outputs
          # per RM0399 Table 103. The D3-domain peripherals' interrupt signals
          # ('_it' suffix in Table 103) feed EXTI for cross-domain wakeup;
          # MDIOS and CEC wakeups feed EXTI for low-power wake.
          MDIOS:   {WKUP: [NVIC.135, EXTI.42]}
          # RCC: per Table 152, LSECSS shares NVIC.18 and EXTI.18 with RTC
          # tamper/timestamp; HSECSS goes to NMI + EXTI.87 (not a regular NVIC
          # vector, so the NMI side isn't expressed in our routing model).
          # LSE_CK additionally feeds CRS.sync.1 (clock-recovery-system
          # sync source) per Table 102.
