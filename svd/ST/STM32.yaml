          generators:
            - name: HSI64
              description: 64 MHz high-speed internal RC oscillator
              output: hsi_osc
              control:
                reg: CR
                field: HSION
                values: [0, 64000000]

            - name: HSE
              description: High-speed external oscillator (4-48 MHz crystal or bypass)
              output: hse_ck
              control:
                state: freqHSE
                reg: CR
                field: HSEON

            - name: CSI
              description: 4 MHz low-power internal RC oscillator
              output: csi_ck
              control:
                reg: CR
                field: CSION
                values: [0, 4000000]

            - name: LSI
              description: 32 kHz low-speed internal RC oscillator
              output: lsi_ck
              control:
                reg: CSR
                field: LSION
                values: [0, 32000]

            - name: LSE
              description: 32.768 kHz low-speed external crystal oscillator
              output: lse_ck
              control:
                state: freqLSE
                reg: BDCR
                field: LSEON

            - name: HSI48
              description: 48 MHz internal RC oscillator (CRS trimmable)
              output: hsi48_ck
              control:
                reg: CR
                field: RC48ON
                values: [0, 48000000]

            - name: I2S_CKIN
              description: External I2S clock input pin
              output: I2S_CKIN

          # ===========================================================================
          # Muxes
          # ===========================================================================
          muxes:
            # --- PLL source ---
            - name: PLLSRC
              description: Common source for all three PLLs
              output: pll_src
              inputs:
                - hsi_ck
                - csi_ck
                - hse_ck
                - ''
              control:
                reg: PLLCKSELR
                field: PLLSRC

            # --- System clock ---
            - name: SW
              description: System clock switch
              output: sys_ck
              inputs:
                - hsi_ck
                - csi_ck
                - hse_ck
                - pll1_p_ck
                - 
                - 
                - 
                - 
              control:
                reg: CFGR
                field: SW

            # --- per_ck ---
            - name: CKPERSEL
              description: External peripheral clock source selection
              output: per_ck
              inputs:
                - hsi_ker_ck
                - csi_ker_ck
                - hse_ck
                - ''
              control:
                reg: D1CCIPR
                field: CKPERSEL

            # --- RTC source ---
            - name: RTCSEL
              description: RTC clock source selection
              output: rtc_pre
              inputs:
                - ''
                - lse_ck
                - lsi_ck
                - hse_rtc_ck
              control:
                reg: BDCR
                field: RTCSEL

            # --- MCO1 ---
            - name: MCO1SEL
              description: Microcontroller clock output 1 source
              output: mco1_pre_ck
              inputs:
                - hsi_ck
                - lse_ck
                - hse_ck
                - pll1_q_ck
                - hsi48_ck
                - 
                - 
                - 
              control:
                reg: CFGR
                field: MCO1

            # --- MCO2 ---
            - name: MCO2SEL
              description: Microcontroller clock output 2 source
              output: mco2_pre_ck
              inputs:
                - sys_ck
                - pll2_p_ck
                - hse_ck
                - pll1_p_ck
                - csi_ck
                - lsi_ck
                - 
                - 
              control:
                reg: CFGR
                field: MCO2


            # --- D1 domain kernel clock muxes ---
            - name: SDMMCSEL
              description: SDMMC1/2 kernel clock source selection
              output: sdmmc_ker_ck
              inputs:
                - pll1_q_ck
                - pll2_r_ck
              control:
                reg: D1CCIPR
                field: SDMMCSEL

            - name: OCTOSPISEL
              description: OCTOSPI1/2 kernel clock source selection (RM0468)
              output: octospi_ker_ck
              inputs:
                - rcc_hclk
                - pll1_q_ck
                - pll2_r_ck
                - per_ck
              control:
                reg: D1CCIPR
                field: OCTOSPISEL

            - name: FMCSEL
              description: FMC kernel clock source selection
              output: fmc_ker_ck
              inputs:
                - rcc_hclk
                - pll1_q_ck
                - pll2_r_ck
                - per_ck
              control:
                reg: D1CCIPR
                field: FMCSEL

            # --- D2 domain kernel clock muxes ---
            - name: FDCANSEL
              description: FDCAN kernel clock source selection
              output: fdcan_ker_ck
              inputs:
                - hse_ck
                - pll1_q_ck
                - pll2_q_ck
                - ''
              control:
                reg: D2CCIP1R
                field: FDCANSEL

            - name: SWPSEL
              description: SWPMI kernel clock source selection
              output: swpmi_ker_ck
              inputs:
                - rcc_pclk1
                - hsi_ker_ck
              control:
                reg: D2CCIP1R
                field: SWPMISEL

            - name: DFSDM1SEL
              description: DFSDM1 processing clock source selection
              output: dfsdm1_ker_ck
              inputs:
                - rcc_pclk2
                - sys_ck
              control:
                reg: D2CCIP1R
                field: DFSDM1SEL

            - name: SPDIFSEL
              description: SPDIFRX kernel clock source selection
              output: spdif_ker_ck
              inputs:
                - pll1_q_ck
                - pll2_r_ck
                - pll3_r_ck
                - hsi_ker_ck
              control:
                reg: D2CCIP1R
                field: SPDIFRXSEL

            - name: SPI45SEL
              description: SPI4/5 kernel clock source selection
              output: spi45_ker_ck
              inputs:
                - rcc_pclk2
                - pll2_q_ck
                - pll3_q_ck
                - hsi_ker_ck
                - csi_ker_ck
                - hse_ck
                - 
                - 
              control:
                reg: D2CCIP1R
                field: SPI45SEL

            - name: SPI123SEL
              description: SPI/I2S 1,2,3 kernel clock source selection
              output: spi123_ker_ck
              inputs:
                - pll1_q_ck
                - pll2_p_ck
                - pll3_p_ck
                - I2S_CKIN
                - per_ck
                - 
                - 
                - 
              control:
                reg: D2CCIP1R
                field: SPI123SEL

            - name: SAI1SEL
              description: SAI1 and DFSDM1 audio kernel clock source selection
              output: sai1_ker_ck
              inputs:
                - pll1_q_ck
                - pll2_p_ck
                - pll3_p_ck
                - I2S_CKIN
                - per_ck
                - 
                - 
                - 
              control:
                reg: D2CCIP1R
                field: SAI1SEL

            - name: USART16910SEL
              description: USART1, USART6, UART9, USART10 kernel clock source selection (H73x adds UART9 + USART10 to the H742_H753 USART16SEL mux)
              output: usart16910_ker_ck
              inputs:
                - rcc_pclk2
                - pll2_q_ck
                - pll3_q_ck
                - hsi_ker_ck
                - csi_ker_ck
                - lse_ck
                - 
                - 
              control:
                reg: D2CCIP2R
                field: USART16910SEL

            - name: USART234578SEL
              description: USART2/3, UART4/5/7/8 kernel clock source selection
              output: usart234578_ker_ck
              inputs:
                - rcc_pclk1
                - pll2_q_ck
                - pll3_q_ck
                - hsi_ker_ck
                - csi_ker_ck
                - lse_ck
                - 
                - 
              control:
                reg: D2CCIP2R
                field: USART234578SEL

            - name: I2C123SEL
              description: I2C1/2/3 kernel clock source selection
              output: i2c123_ker_ck
              inputs:
                - rcc_pclk1
                - pll3_r_ck
                - hsi_ker_ck
                - csi_ker_ck
              control:
                reg: D2CCIP2R
                field: I2C123SEL

            - name: USBSEL
              description: USB1/2 OTG kernel clock source selection
              output: usb_ker_ck
              inputs:
                - ''
                - pll1_q_ck
                - pll3_q_ck
                - hsi48_ck
              control:
                reg: D2CCIP2R
                field: USBSEL

            - name: RNGSEL
              description: RNG kernel clock source selection
              output: rng_ker_ck
              inputs:
                - hsi48_ck
                - pll1_q_ck
                - lse_ck
                - lsi_ck
              control:
                reg: D2CCIP2R
                field: RNGSEL

            - name: CECSEL
              description: HDMI-CEC kernel clock source selection
              output: cec_ker_ck
              inputs:
                - lse_ck
                - lsi_ck
                - csi_ker_div122
                - ''
              control:
                reg: D2CCIP2R
                field: CECSEL

            - name: LPTIM1SEL
              description: LPTIM1 kernel clock source selection
              output: lptim1_ker_ck
              inputs:
                - rcc_pclk1
                - pll2_p_ck
                - pll3_r_ck
                - lse_ck
                - lsi_ck
                - per_ck
                - 
                - 
              control:
                reg: D2CCIP2R
                field: LPTIM1SEL

            # --- D3 domain kernel clock muxes ---
            - name: SPI6SEL
              description: SPI6 kernel clock source selection
              output: spi6_ker_ck
              inputs:
                - rcc_pclk4
                - pll2_q_ck
                - pll3_q_ck
                - hsi_ker_ck
                - csi_ker_ck
                - hse_ck
                - 
                - 
              control:
                reg: D3CCIPR
                field: SPI6SEL

            - name: SAI4ASEL
              description: SAI4 sub-block A kernel clock source selection
              output: sai4a_ker_ck
              inputs:
                - pll1_q_ck
                - pll2_p_ck
                - pll3_p_ck
                - I2S_CKIN
                - per_ck
                - 
                - 
                - 
              control:
                reg: D3CCIPR
                field: SAI4ASEL

            - name: SAI4BSEL
              description: SAI4 sub-block B kernel clock source selection
              output: sai4b_ker_ck
              inputs:
                - pll1_q_ck
                - pll2_p_ck
                - pll3_p_ck
                - I2S_CKIN
                - per_ck
                - 
                - 
                - 
              control:
                reg: D3CCIPR
                field: SAI4BSEL

            - name: ADCSEL
              description: ADC1/2/3 kernel clock source selection
              output: adc_ker_ck
              inputs:
                - pll2_p_ck
                - pll3_r_ck
                - per_ck
                - ''
              control:
                reg: D3CCIPR
                field: ADCSEL

            - name: LPTIM2SEL
              description: LPTIM2 kernel clock source selection
              output: lptim2_ker_ck
              inputs:
                - rcc_pclk4
                - pll2_p_ck
                - pll3_r_ck
                - lse_ck
                - lsi_ck
                - per_ck
                - 
                - 
              control:
                reg: D3CCIPR
                field: LPTIM2SEL

            - name: LPTIM345SEL
              description: LPTIM3/4/5 kernel clock source selection
              output: lptim345_ker_ck
              inputs:
                - rcc_pclk4
                - pll2_p_ck
                - pll3_r_ck
                - lse_ck
                - lsi_ck
                - per_ck
                - 
                - 
              control:
                reg: D3CCIPR
                field: LPTIM345SEL

            - name: I2C4SEL
              description: I2C4 kernel clock source selection
              output: i2c4_ker_ck
              inputs:
                - rcc_pclk4
                - pll3_r_ck
                - hsi_ker_ck
                - csi_ker_ck
              control:
                reg: D3CCIPR
                field: I2C4SEL

            - name: LPUART1SEL
              description: LPUART1 kernel clock source selection
              output: lpuart1_ker_ck
              inputs:
                - rcc_pclk4
                - pll2_q_ck
                - pll3_q_ck
                - hsi_ker_ck
                - csi_ker_ck
                - lse_ck
                - 
                - 
              control:
                reg: D3CCIPR
                field: LPUART1SEL

          # ===========================================================================
          # PLLs
          # ===========================================================================
          plls:
            - name: PLL1
              description: Main system PLL (fractional-N)
              input: ref1_ck
              output: vco1_ck
              feedback_integer:
                reg: PLL1DIVR
                field: DIVN1
                value_range:
                  min: 3
                  max: 511
                  offset: 1
              feedback_fraction:
                reg: PLL1FRACR
                field: FRACN1
                value_range:
                  min: 0
                  max: 8191
              vco_limits:
                min: 150000000
                max: 960000000
              notes: 'Wide VCO (VCOH): 192-960 MHz; Medium VCO (VCOL): 150-420 MHz. Selected by PLL1VCOSEL in RCC_PLLCFGR.'

            - name: PLL2
              description: Auxiliary PLL 2 (fractional-N)
              input: ref2_ck
              output: vco2_ck
              feedback_integer:
                reg: PLL2DIVR
                field: DIVN2
                value_range:
                  min: 3
                  max: 511
                  offset: 1
              feedback_fraction:
                reg: PLL2FRACR
                field: FRACN2
                value_range:
                  min: 0
                  max: 8191
              vco_limits:
                min: 150000000
                max: 960000000

            - name: PLL3
              description: Auxiliary PLL 3 (fractional-N)
              input: ref3_ck
              output: vco3_ck
              feedback_integer:
                reg: PLL3DIVR
                field: DIVN3
                value_range:
                  min: 3
                  max: 511
                  offset: 1
              feedback_fraction:
                reg: PLL3FRACR
                field: FRACN3
                value_range:
                  min: 0
                  max: 8191
              vco_limits:
                min: 150000000
                max: 960000000

          # ===========================================================================
          # Dividers
          # ===========================================================================
          dividers:
            # --- HSI divider ---
            - name: HSIDIV
              description: HSI oscillator prescaler
              input: hsi_osc
              output: hsi_ck
              factor:
                reg: CR
                field: HSIDIV
                values: [1, 2, 4, 8]

            # --- CEC fixed divider ---
            - name: CSI_CEC_DIV
              description: Fixed /122 divider for HDMI-CEC from CSI kernel clock
              input: csi_ker_ck
              output: csi_ker_div122
              value: 122

            # --- PLL input prescalers ---
            - name: DIVM1
              description: PLL1 prescaler (division factor for PLL1 reference clock)
              input: pll_src
              output: ref1_ck
              factor:
                reg: PLLCKSELR
                field: DIVM1
                value_range:
                  min: 0
                  max: 63
              notes: Value 0 disables the prescaler (no clock). Values 1-63 divide by that amount.

            - name: DIVM2
              description: PLL2 prescaler (division factor for PLL2 reference clock)
              input: pll_src
              output: ref2_ck
              factor:
                reg: PLLCKSELR
                field: DIVM2
                value_range:
                  min: 0
                  max: 63

            - name: DIVM3
              description: PLL3 prescaler (division factor for PLL3 reference clock)
              input: pll_src
              output: ref3_ck
              factor:
                reg: PLLCKSELR
                field: DIVM3
                value_range:
                  min: 0
                  max: 63

            # --- PLL output dividers ---
            - name: DIVP1
              description: PLL1 P output divider
              input: vco1_ck
              output: pll1_p_raw
              factor:
                reg: PLL1DIVR
                field: DIVP1
                value_range:
                  min: 0
                  max: 127
                  offset: 1
              notes: Odd division factors not allowed for PLL1 P output

            - name: DIVQ1
              description: PLL1 Q output divider
              input: vco1_ck
              output: pll1_q_raw
              factor:
                reg: PLL1DIVR
                field: DIVQ1
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVR1
              description: PLL1 R output divider
              input: vco1_ck
              output: pll1_r_raw
              factor:
                reg: PLL1DIVR
                field: DIVR1
                value_range:
                  min: 1
                  max: 127
                  offset: 1
              notes: Field value 0 is not allowed

            - name: DIVP2
              description: PLL2 P output divider
              input: vco2_ck
              output: pll2_p_raw
              factor:
                reg: PLL2DIVR
                field: DIVP2
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVQ2
              description: PLL2 Q output divider
              input: vco2_ck
              output: pll2_q_raw
              factor:
                reg: PLL2DIVR
                field: DIVQ2
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVR2
              description: PLL2 R output divider
              input: vco2_ck
              output: pll2_r_raw
              factor:
                reg: PLL2DIVR
                field: DIVR2
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVP3
              description: PLL3 P output divider
              input: vco3_ck
              output: pll3_p_raw
              factor:
                reg: PLL3DIVR
                field: DIVP3
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVQ3
              description: PLL3 Q output divider
              input: vco3_ck
              output: pll3_q_raw
              factor:
                reg: PLL3DIVR
                field: DIVQ3
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            - name: DIVR3
              description: PLL3 R output divider
              input: vco3_ck
              output: pll3_r_raw
              factor:
                reg: PLL3DIVR
                field: DIVR3
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            # --- Domain prescalers ---
            - name: D1CPRE
              description: D1 domain CPU clock prescaler (sys_ck to CPU1)
              input: sys_ck
              output: sys_d1cpre_ck
              factor:
                reg: D1CFGR
                field: D1CPRE
                values: [1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 16, 64, 128, 256, 512]

            - name: HPRE
              description: AHB prescaler (sys_d1cpre_ck to AHB/AXI buses)
              input: sys_d1cpre_ck
              output: rcc_hclk
              factor:
                reg: D1CFGR
                field: HPRE
                values: [1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 16, 64, 128, 256, 512]

            - name: D1PPRE
              description: D1 domain APB3 prescaler
              input: rcc_hclk
              output: rcc_pclk3
              factor:
                reg: D1CFGR
                field: D1PPRE
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            - name: D2PPRE1
              description: D2 domain APB1 prescaler
              input: rcc_hclk
              output: rcc_pclk1
              factor:
                reg: D2CFGR
                field: D2PPRE1
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            - name: D2PPRE2
              description: D2 domain APB2 prescaler
              input: rcc_hclk
              output: rcc_pclk2
              factor:
                reg: D2CFGR
                field: D2PPRE2
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            - name: D3PPRE
              description: D3 domain APB4 prescaler
              input: rcc_hclk
              output: rcc_pclk4
              factor:
                reg: D3CFGR
                field: D3PPRE
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            # --- Timer clock prescalers ---
            - name: TIMX_PRESCALER
              description: APB1 timer clock prescaler from HCLK
              input: rcc_hclk
              output: rcc_timx_ker_ck
              notes: >-
                The timer clock divisor from rcc_hclk depends on BOTH the D2PPRE1 APB
                prescaler and the TIMPRE bit (RCC_CFGR bit 15). With TIMPRE=0: divisor =
                max(1, D2PPRE1_ratio / 2). With TIMPRE=1: divisor = max(1, D2PPRE1_ratio / 4).
                The result is always >= rcc_pclk1 and <= rcc_hclk. This conditional logic
                cannot be expressed with a single register field.

            - name: TIMY_PRESCALER
              description: APB2 timer clock prescaler from HCLK
              input: rcc_hclk
              output: rcc_timy_ker_ck
              notes: >-
                Same logic as TIMX_PRESCALER but using D2PPRE2 instead of D2PPRE1.
                With TIMPRE=0: divisor = max(1, D2PPRE2_ratio / 2). With TIMPRE=1:
                divisor = max(1, D2PPRE2_ratio / 4).

            # --- HSE division for RTC ---
            - name: RTCPRE
              description: HSE division factor for RTC clock
              input: hse_ck
              output: hse_rtc_ck
              factor:
                reg: CFGR
                field: RTCPRE
                value_range:
                  min: 0
                  max: 63
              notes: Values 0 and 1 produce no clock. Values 2-63 divide HSE by that amount.

            # ===========================================================================
            # Gates
            # ===========================================================================
            - name: MCO1PRE
              description: MCO1 output-pin prescaler
              input: mco1_pre_ck
              output: mco1
              factor:
                reg: CFGR
                field: MCO1PRE
                value_range:
                  max: 15
              notes: 4-bit field at CFGR[21:18].  Value 0 disables the MCO output entirely; values 1-15 divide by the corresponding integer.
            - name: MCO2PRE
              description: MCO2 output-pin prescaler
              input: mco2_pre_ck
              output: mco2
              factor:
                reg: CFGR
                field: MCO2PRE
                value_range:
                  max: 15
              notes: 4-bit field at CFGR[28:25].  Value 0 disables the MCO output entirely; values 1-15 divide by the corresponding integer.
          gates:
            # --- HSI/CSI kernel clock gates ---
            - name: HSIKERON
              description: HSI kernel clock enable for Stop mode
              input: hsi_ck
              output: hsi_ker_ck
              control:
                reg: CR
                field: HSIKERON

            - name: CSIKERON
              description: CSI kernel clock enable for Stop mode
              input: csi_ck
              output: csi_ker_ck
              control:
                reg: CR
                field: CSIKERON

            # --- PLL output enable gates ---
            - name: DIVP1EN
              description: PLL1 P output enable
              input: pll1_p_raw
              output: pll1_p_ck
              control:
                reg: PLLCFGR
                field: DIVP1EN

            - name: DIVQ1EN
              description: PLL1 Q output enable
              input: pll1_q_raw
              output: pll1_q_ck
              control:
                reg: PLLCFGR
                field: DIVQ1EN

            - name: DIVR1EN
              description: PLL1 R output enable
              input: pll1_r_raw
              output: pll1_r_ck
              control:
                reg: PLLCFGR
                field: DIVR1EN

            - name: DIVP2EN
              description: PLL2 P output enable
              input: pll2_p_raw
              output: pll2_p_ck
              control:
                reg: PLLCFGR
                field: DIVP2EN

            - name: DIVQ2EN
              description: PLL2 Q output enable
              input: pll2_q_raw
              output: pll2_q_ck
              control:
                reg: PLLCFGR
                field: DIVQ2EN

            - name: DIVR2EN
              description: PLL2 R output enable
              input: pll2_r_raw
              output: pll2_r_ck
              control:
                reg: PLLCFGR
                field: DIVR2EN

            - name: DIVP3EN
              description: PLL3 P output enable
              input: pll3_p_raw
              output: pll3_p_ck
              control:
                reg: PLLCFGR
                field: DIVP3EN

            - name: DIVQ3EN
              description: PLL3 Q output enable
              input: pll3_q_raw
              output: pll3_q_ck
              control:
                reg: PLLCFGR
                field: DIVQ3EN

            - name: DIVR3EN
              description: PLL3 R output enable
              input: pll3_r_raw
              output: pll3_r_ck
              control:
                reg: PLLCFGR
                field: DIVR3EN

            # --- RTC gate ---
            - name: RTCEN
              description: RTC clock enable
              input: rtc_pre
              output: rtc_ck
              control:
                reg: BDCR
                field: RTCEN

            # =========================================================================
            # Peripheral clock gates — AHB3 (D1 domain)
            # Register: RCC_AHB3ENR
            # =========================================================================
            - name: MDMAEN
              description: MDMA peripheral clock enable
              input: rcc_hclk
              output: mdma_hclk
              control: {reg: 'C1_AHB3ENR', field: MDMAEN}
            - name: DMA2DEN
              description: DMA2D peripheral clock enable
              input: rcc_hclk
              output: dma2d_hclk
