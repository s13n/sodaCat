        bitWidth: 1
        access: read-only
      - name: MREP
        description: Master repetition interrupt flag
        bitOffset: 4
        bitWidth: 1
        access: read-only
        enumeratedValues:
          - name: B_0x0
            description: No master repetition interrupt occurred
            value: 0
          - name: B_0x1
            description: Master repetition interrupt occurred
