                field: DIV
                value_range:
                  min: 0 # Zero turns off divider
                  max: 255
            - name: IOCONCLKDIV5
              input: main_clk
              output: ioconclkdiv5
              factor:
                reg: IOCONCLKDIV5
                field: DIV
                value_range:
                  min: 0 # Zero turns off divider
                  max: 255
            - name: IOCONCLKDIV6
              input: main_clk
              output: ioconclkdiv6
              factor:
                reg: IOCONCLKDIV6
                field: DIV
                value_range:
                  min: 0 # Zero turns off divider
                  max: 255
            - name: ADCCLKDIV
              input: adc_clk
              output: adc_div_clk
              factor:
                reg: ADCCLKDIV
                field: DIV
                value_range:
                  min: 0 # Zero turns off divider
                  max: 255
              description: Divides ADC clock source
            - name: I3CFCLKDIV
              input: i3cfclk
