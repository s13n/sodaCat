                field: DIVR3
                value_range:
                  min: 0
                  max: 127
                  offset: 1

            # --- Domain prescalers (RM0455 nomenclature: CD = CPU Domain, SRD = Smart Run Domain) ---
            - name: CDCPRE
              description: CPU domain CPU-clock prescaler (sys_ck to CPU)
              input: sys_ck
              output: sys_cdcpre_ck
              factor:
                reg: CDCFGR1
                field: CDCPRE
                values: [1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 16, 64, 128, 256, 512]

            - name: HPRE
              description: AHB prescaler (sys_cdcpre_ck to AHB/AXI buses)
              input: sys_cdcpre_ck
              output: rcc_hclk
              factor:
                reg: CDCFGR1
                field: HPRE
                values: [1, 1, 1, 1, 1, 1, 1, 1, 2, 4, 8, 16, 64, 128, 256, 512]

            - name: CDPPRE
              description: CPU domain APB3 prescaler
              input: rcc_hclk
              output: rcc_pclk3
              factor:
                reg: CDCFGR1
                field: CDPPRE
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            - name: CDPPRE1
              description: CPU domain APB1 prescaler
              input: rcc_hclk
              output: rcc_pclk1
              factor:
                reg: CDCFGR2
                field: CDPPRE1
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            - name: CDPPRE2
              description: CPU domain APB2 prescaler
              input: rcc_hclk
              output: rcc_pclk2
              factor:
                reg: CDCFGR2
                field: CDPPRE2
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            - name: SRDPPRE
              description: Smart Run Domain APB4 prescaler
              input: rcc_hclk
              output: rcc_pclk4
              factor:
                reg: SRDCFGR
                field: SRDPPRE
                values: [1, 1, 1, 1, 2, 4, 8, 16]

            # --- Timer clock prescalers ---
            - name: TIMX_PRESCALER
              description: APB1 timer clock prescaler from HCLK
              input: rcc_hclk
              output: rcc_timx_ker_ck
              notes: >-
                The timer clock divisor from rcc_hclk depends on BOTH the D2PPRE1 APB
                prescaler and the TIMPRE bit (RCC_CFGR bit 15). With TIMPRE=0: divisor =
                max(1, D2PPRE1_ratio / 2). With TIMPRE=1: divisor = max(1, D2PPRE1_ratio / 4).
                The result is always >= rcc_pclk1 and <= rcc_hclk. This conditional logic
                cannot be expressed with a single register field.

            - name: TIMY_PRESCALER
              description: APB2 timer clock prescaler from HCLK
              input: rcc_hclk
              output: rcc_timy_ker_ck
              notes: >-
                Same logic as TIMX_PRESCALER but using D2PPRE2 instead of D2PPRE1.
                With TIMPRE=0: divisor = max(1, D2PPRE2_ratio / 2). With TIMPRE=1:
                divisor = max(1, D2PPRE2_ratio / 4).

            # --- HSE division for RTC ---
            - name: RTCPRE
              description: HSE division factor for RTC clock
              input: hse_ck
              output: hse_rtc_ck
              factor:
                reg: CFGR
                field: RTCPRE
                value_range:
                  min: 0
                  max: 63
              notes: Values 0 and 1 produce no clock. Values 2-63 divide HSE by that amount.

