$schema: http://json-schema.org/draft-07/schema#
title: Peripheral Model
type: object
required:
- name
- registers
properties:
  name:
    type: string
  namespace:
    type: string
    description: |
      Optional C++ namespace this block lives in (consumed by the C++
      generator).  When absent, the lowercased innermost containing
      directory name is used as the default.
  description:
    type: string
  groupName:
    type: string
  registers:
    type: array
    items:
      $ref: '#/definitions/registerOrCluster'
  params:
    type: array
    items:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        type:
          type: string
          enum: [int, bool, string]
          # Optional; defaults to `int` in the C++ generator.
        default: {}
        max:
          type: integer
        description:
          type: string
  outputs:
    description: |
      Named output signals this block emits.  Each output is a port the
      chip design can route to a destination instance (NVIC, DMAMUX,
      EXTI, ...); the kind of destination is determined by the chip-level
      wiring, not declared here.  Interrupts, DMA requests, wakeup events,
      and trigger outputs all share this shape.
    type: array
    items:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
  addressBlocks:
    type: array
    items:
      type: object
      properties:
        offset:
          type: integer
        size:
          type: integer
        usage:
          type: string
        headerStructName:
          type: string
definitions:
  dimValue:
    oneOf:
    - type: integer
    - type: array
      items:
        type: integer
  # Comma-separated list of identifier-safe tokens. Used when the array
  # indices are not a contiguous 0..N-1 range; each token is substituted
  # into the %s placeholder in the register name to produce one member.
  # Range form (e.g. "0-N") is intentionally rejected: normalize it to
  # a plain `dim` value with a bracketed `name: xxx[%s]` instead.
  dimIndexValue:
    type: string
    pattern: ^[A-Za-z0-9_]+(,[A-Za-z0-9_]+)*$
  # Register/cluster `name` must contain at least one %s placeholder
  # when used inside an array/cluster. Further structural constraints
  # (bracketed vs bare, matching dim arity, identifier-safe substitution)
  # are enforced by tools/validate_peripherals.py.
  arrayName:
    type: string
    pattern: '%s'
  # An indexEnum is one scoped enum mapping symbolic names to integer
  # subscripts on one axis of a register/cluster array.  C++ generators
  # emit it as `enum class <name> : <underlying> { ... };` and instantiate
  # the corresponding HwArray template parameter so subscripts of that
  # axis can only accept this enum's values (or an explicit cast).
  # `value` ranges and array-rank checks are enforced by
  # tools/validate_peripherals.py.
  indexEnum:
    type: object
    required:
    - values
    properties:
      name:
        type: string
      description:
        type: string
      values:
        type: array
        minItems: 1
        items:
          type: object
          required:
          - name
          - value
          properties:
            name:
              type: string
            description:
              type: string
            value:
              type: integer
  # `enumeratedIndices` is an indexEnum (1D form, single object) or a
  # list of {indexEnum, null} (multi-axis form).  In the list form the
  # k-th entry applies to axis k of `dim`; null means that axis carries
  # no enum and stays plain-integer indexed.  The list may be shorter
  # than the array's rank; missing trailing entries are implicit nulls.
  enumeratedIndices:
    oneOf:
    - $ref: '#/definitions/indexEnum'
    - type: array
      items:
        oneOf:
        - $ref: '#/definitions/indexEnum'
        - type: 'null'
  register:
    type: object
    required:
    - name
    - addressOffset
    not:
      # Presence of `registers` makes an entry a cluster, not a register.
      required: [registers]
    properties:
      name:
        type: string
      description:
        type: string
      addressOffset:
        oneOf:
        - type: integer
        - type: string
          pattern: ^0x[0-9a-fA-F]+$
      size:
        type: integer
      access:
        type: string
      resetValue:
        type: integer
      resetMask:
        type: integer
      dim:
        $ref: '#/definitions/dimValue'
      dimIncrement:
        $ref: '#/definitions/dimValue'
      dimIndex:
        $ref: '#/definitions/dimIndexValue'
      enumeratedIndices:
        $ref: '#/definitions/enumeratedIndices'
      fields:
        type: array
        items:
          type: object
          required:
          - name
          - bitOffset
          - bitWidth
          properties:
            name:
              type: string
            description:
              type: string
            bitOffset:
              type: integer
            bitWidth:
              type: integer
            access:
              type: string
            enumeratedValues:
              type: array
              items:
                type: object
                required:
                - name
                - value
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  value:
                    type: integer
  cluster:
    type: object
    required:
    - name
    - addressOffset
    - registers
    properties:
      name:
        type: string
      description:
        type: string
      addressOffset:
        oneOf:
        - type: integer
        - type: string
          pattern: ^0x[0-9a-fA-F]+$
      dim:
        $ref: '#/definitions/dimValue'
      dimIncrement:
        $ref: '#/definitions/dimValue'
      dimIndex:
        $ref: '#/definitions/dimIndexValue'
      enumeratedIndices:
        $ref: '#/definitions/enumeratedIndices'
      registers:
        type: array
        items:
          $ref: '#/definitions/registerOrCluster'
  registerOrCluster:
    oneOf:
    - $ref: '#/definitions/register'
    - $ref: '#/definitions/cluster'
