            value: 0
          - name: B_0x1
            description: A synchronization input event resets the timer x
            value: 1
      - name: SYNCSTRTA
        description: Synchronization starts timer x
        bitOffset: 11
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: No effect on timer x
            value: 0
          - name: B_0x1
            description: A synchronization input event starts the timer x
            value: 1
      - name: DELCMP2
        description: CMP2 auto-delayed mode
        bitOffset: 12
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: CMP2 register is always active (standard compare mode)
            value: 0
          - name: B_0x1
            description: CMP2 value is recomputed and is active following a capture 1 event
            value: 1
          - name: B_0x2
            description: CMP2 value is recomputed and is active following a capture 1 event, or is recomputed and active after compare 1 match (timeout function if capture event is missing)
            value: 2
          - name: B_0x3
            description: CMP2 value is recomputed and is active following a capture 1 event, or is recomputed and active after compare 3 match (timeout function if capture event is missing)
            value: 3
      - name: DELCMP4
        description: CMP4 auto-delayed mode
        bitOffset: 14
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: CMP4 register is always active (standard compare mode)
            value: 0
          - name: B_0x1
            description: CMP4 value is recomputed and is active following a capture 2 event
            value: 1
          - name: B_0x2
            description: CMP4 value is recomputed and is active following a capture 2 event, or is recomputed and active after Compare 1 match (timeout function if capture 2 event is missing)
            value: 2
          - name: B_0x3
            description: CMP4 value is recomputed and is active following a capture 2 event, or is recomputed and active after Compare 3 match (timeout function if capture event is missing)
            value: 3
      - name: TFU
        description: Timer F update
        bitOffset: 16
