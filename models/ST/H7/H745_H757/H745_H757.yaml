      control:
        reg: D2CCIP2R
        field: USART16SEL
    - name: USART234578SEL
      description: USART2/3, UART4/5/7/8 kernel clock source selection
      output: usart234578_ker_ck
      inputs:
        - rcc_pclk1
        - pll2_q_ck
        - pll3_q_ck
        - hsi_ker_ck
