# Consolidated configuration for Espressif ESP32 model extraction.
# SVD files sourced from https://github.com/espressif/svd

svd:
  source: https://github.com/espressif/svd
  release: "2024-05-09"
  version: "2"

families:
  P4:
    svd:
      file: esp32p4.svd
      version: "2"
      date: "2024-05-09"
    subfamilies:
      ESP32_P4:
        chips: [ESP32-P4]
        ref_manual:
          name: ESP32-P4 TRM
          rev: "0.2"
          date: "2025-10-23"
          url: https://www.espressif.com/sites/default/files/documentation/esp32-p4_technical_reference_manual_en.pdf

    blocks:
      # ====================================================================
      # Communication
      # ====================================================================
      UART:
        from: ESP32-P4.UART0
        instances: [UART0, UART1, UART2, UART3, UART4]
        outputs:
          INTR:
            pattern: '^(UART0|UART1|UART2|UART3|UART4)$'
      I2C:
        from: ESP32-P4.I2C0
        instances: [I2C0, I2C1]
        outputs:
          INTR:
            pattern: '^(I2C0|I2C1)$'
      I2S:
        from: ESP32-P4.I2S0
        instances: [I2S0, I2S1, I2S2]
        outputs:
          INTR:
            pattern: '^(I2S0|I2S1|I2S2)$'
      SpiMem:
        from: ESP32-P4.SPI0
        instances: [SPI0, SPI1]
        # Auto-strip removes SPI_ (base of SPI0); explicit transform removes
        # remaining MEM_ prefix: SPI_MEM_CMD -> MEM_CMD -> CMD
        transforms:
          - {type: renameRegisters, pattern: "^MEM_", replacement: ""}

      SPI:
        from: ESP32-P4.SPI2
        instances: [SPI2, SPI3]
        # Auto-strip removes SPI_ (base of SPI2): SPI_CMD -> CMD
        outputs:
          INTR:
            pattern: '^(SPI2|SPI3)$'
      I3C_MST:
        from: ESP32-P4.I3C_MST
        instances: [I3C_MST]
        outputs:
          INTR:
            pattern: '^I3C$'
      I3C_MST_MEM:
        from: ESP32-P4.I3C_MST_MEM
        instances: [I3C_MST_MEM]

      I3C_SLV:
        from: ESP32-P4.I3C_SLV
        instances: [I3C_SLV]
        outputs:
          INTR:
            pattern: '^I3C_SLV$'
      UHCI:
        from: ESP32-P4.UHCI0
        instances: [UHCI0]
        outputs:
          INTR:
            pattern: '^UHCI0$'
      PARL_IO:
        from: ESP32-P4.PARL_IO
        instances: [PARL_IO]
        outputs:
          RX:
            pattern: '^PARLIO_RX$'
          TX:
            pattern: '^PARLIO_TX$'
      TIMG:
        from: ESP32-P4.TIMG0
        instances: [TIMG0, TIMG1]
        # Note: T1 timer registers are missing from SVD (see SVD_ERRATA.md)
        outputs:
          T0:
            pattern: '^(TG0_T0|TG1_T0)$'
          T1:
            pattern: '^(TG0_T1|TG1_T1)$'
          WDT:
            pattern: '^(TG0_WDT|TG1_WDT)$'
      MCPWM:
        from: ESP32-P4.MCPWM0
        instances: [MCPWM0, MCPWM1]
        outputs:
          INTR:
            pattern: '^(PWM0|PWM1)$'
      SYSTIMER:
        from: ESP32-P4.SYSTIMER
        instances: [SYSTIMER]
        outputs:
          TARGET0:
            pattern: '^SYSTIMER_TARGET0$'
          TARGET1:
            pattern: '^SYSTIMER_TARGET1$'
          TARGET2:
            pattern: '^SYSTIMER_TARGET2$'
      RMT:
        from: ESP32-P4.RMT
        instances: [RMT]
        outputs:
          INTR:
            pattern: '^RMT$'
      PCNT:
        from: ESP32-P4.PCNT
        instances: [PCNT]
        outputs:
          INTR:
            pattern: '^PCNT$'
      LEDC:
        from: ESP32-P4.LEDC
        instances: [LEDC]
        outputs:
          INTR:
            pattern: '^LEDC$'
      TWAI:
        from: ESP32-P4.TWAI0
        instances: [TWAI0, TWAI1, TWAI2]
        outputs:
          INTR:
            pattern: '^(TWAI0|TWAI1|TWAI2)$'
      GPIO:
        from: ESP32-P4.GPIO
        instances: [GPIO]
        # Note: FUNC255_IN_SEL_CFG missing from SVD (see SVD_ERRATA.md)
        outputs:
          INT0:
            pattern: '^GPIO_INT0$'
          INT1:
            pattern: '^GPIO_INT1$'
          INT2:
            pattern: '^GPIO_INT2$'
          INT3:
            pattern: '^GPIO_INT3$'
          PAD_COMP:
            pattern: '^GPIO_PAD_COMP$'
      GPIO_SD:
        from: ESP32-P4.GPIO_SD
        instances: [GPIO_SD]

      IO_MUX:
        from: ESP32-P4.IO_MUX
        instances: [IO_MUX]
        # Note: GPIO54 register missing from SVD (see SVD_ERRATA.md)

      # ====================================================================
      # DMA
      # ====================================================================
      AHB_DMA:
        from: ESP32-P4.AHB_DMA
        instances: [AHB_DMA]
        # SVD puts all 12 DMA interrupts (AHB+AXI) on AHB_DMA.
        # Only AHB channels listed here; AXI channels fixed via chip_connections.
        outputs:
          IN_CH0:
            pattern: '^AHB_PDMA_IN_CH0$'
          IN_CH1:
            pattern: '^AHB_PDMA_IN_CH1$'
          IN_CH2:
            pattern: '^AHB_PDMA_IN_CH2$'
          OUT_CH0:
            pattern: '^AHB_PDMA_OUT_CH0$'
          OUT_CH1:
            pattern: '^AHB_PDMA_OUT_CH1$'
          OUT_CH2:
            pattern: '^AHB_PDMA_OUT_CH2$'
      AXI_DMA:
        from: ESP32-P4.AXI_DMA
        instances: [AXI_DMA]
        # Interrupts misattributed to AHB_DMA in SVD; injected via chip_connections.
        outputs:
          IN_CH0:
            pattern: '^AXI_PDMA_IN_CH0$'
          IN_CH1:
            pattern: '^AXI_PDMA_IN_CH1$'
          IN_CH2:
            pattern: '^AXI_PDMA_IN_CH2$'
          OUT_CH0:
            pattern: '^AXI_PDMA_OUT_CH0$'
          OUT_CH1:
            pattern: '^AXI_PDMA_OUT_CH1$'
          OUT_CH2:
            pattern: '^AXI_PDMA_OUT_CH2$'
      DMA2D:
        from: ESP32-P4.DMA
        instances: [DMA]
        outputs:
          INTR:
            pattern: '^DMA$'
      H264_DMA:
        from: ESP32-P4.H264_DMA
        instances: [H264_DMA]
        outputs:
          OUT_CH0:
            pattern: '^H264_DMA2D_OUT_CH0$'
          OUT_CH1:
            pattern: '^H264_DMA2D_OUT_CH1$'
          OUT_CH2:
            pattern: '^H264_DMA2D_OUT_CH2$'
          OUT_CH3:
            pattern: '^H264_DMA2D_OUT_CH3$'
          OUT_CH4:
            pattern: '^H264_DMA2D_OUT_CH4$'
          IN_CH0:
            pattern: '^H264_DMA2D_IN_CH0$'
          IN_CH1:
            pattern: '^H264_DMA2D_IN_CH1$'
          IN_CH2:
            pattern: '^H264_DMA2D_IN_CH2$'
          IN_CH3:
            pattern: '^H264_DMA2D_IN_CH3$'
          IN_CH4:
            pattern: '^H264_DMA2D_IN_CH4$'
          IN_CH5:
            pattern: '^H264_DMA2D_IN_CH5$'
      AES:
        from: ESP32-P4.AES
        instances: [AES]
        outputs:
          INTR:
            pattern: '^AES$'
      RSA:
        from: ESP32-P4.RSA
        instances: [RSA]
        outputs:
          INTR:
            pattern: '^RSA$'
      SHA:
        from: ESP32-P4.SHA
        instances: [SHA]
        outputs:
          INTR:
            pattern: '^SHA$'
      ECC:
        from: ESP32-P4.ECC
        instances: [ECC]
        outputs:
          INTR:
            pattern: '^ECC$'
      ECDSA:
        from: ESP32-P4.ECDSA
        instances: [ECDSA]

      DS:
        from: ESP32-P4.DS
        instances: [DS]

      HMAC:
        from: ESP32-P4.HMAC
        instances: [HMAC]

      # ====================================================================
      # Media / Imaging
      # ====================================================================
      H264:
        from: ESP32-P4.H264
        instances: [H264]
        outputs:
          INTR:
            pattern: '^H264_REG$'
      JPEG:
        from: ESP32-P4.JPEG
        instances: [JPEG]
        outputs:
          INTR:
            pattern: '^JPEG$'
      ISP:
        from: ESP32-P4.ISP
        instances: [ISP]
        outputs:
          INTR:
            pattern: '^ISP$'
      PPA:
        from: ESP32-P4.PPA
        instances: [PPA]
        outputs:
          INTR:
            pattern: '^PPA$'
      LCD_CAM:
        from: ESP32-P4.LCD_CAM
        instances: [LCD_CAM]

      MIPI_CSI_HOST:
        from: ESP32-P4.MIPI_CSI_HOST
        instances: [MIPI_CSI_HOST]
        outputs:
          INTR:
            pattern: '^CSI$'
      MIPI_CSI_BRIDGE:
        from: ESP32-P4.MIPI_CSI_BRIDGE
        instances: [MIPI_CSI_BRIDGE]
        outputs:
          INTR:
            pattern: '^CSI_BRIDGE$'
      MIPI_DSI_HOST:
        from: ESP32-P4.MIPI_DSI_HOST
        instances: [MIPI_DSI_HOST]
        outputs:
          INTR:
            pattern: '^DSI$'
      MIPI_DSI_BRIDGE:
        from: ESP32-P4.MIPI_DSI_BRIDGE
        instances: [MIPI_DSI_BRIDGE]
        outputs:
          INTR:
            pattern: '^DSI_BRIDGE$'
      SDHOST:
        from: ESP32-P4.SDHOST
        instances: [SDHOST]
        # Missing fields per TRM (see SVD_ERRATA.md):
        #   CTRL[25]: USE_INTERNAL_DMAC
        #   UHS[1:0]: VOLT_REG
        transforms:
          - type: patchFields
            register: CTRL
            fields:
              - {name: USE_INTERNAL_DMAC, bitOffset: 25, bitWidth: 1, access: read-write, description: "DMA mode select (0=external, 1=internal)"}
          - type: patchFields
            register: UHS
            fields:
              - {name: VOLT_REG, bitOffset: 0, bitWidth: 2, access: read-write, description: "Voltage switch per card (0=3.3V, 1=1.8V)"}

      USB_DEVICE:
        from: ESP32-P4.USB_DEVICE
        instances: [USB_DEVICE]
        outputs:
          INTR:
            pattern: '^USB_DEVICE$'
      USB_WRAP:
        from: ESP32-P4.USB_WRAP
        instances: [USB_WRAP]

      # ====================================================================
      # ADC / Sensors
      # ====================================================================
      ADC:
        from: ESP32-P4.ADC
        instances: [ADC]
        # Note: SAR_PATT_TAB fields are 24-bit, should be 32-bit (see SVD_ERRATA.md)

      # ====================================================================
      # Low-Power Domain
      # ====================================================================
      LP_ADC:
        from: ESP32-P4.LP_ADC
        instances: [LP_ADC]
        outputs:
          INTR:
            pattern: '^LP_ADC$'
      LP_GPIO:
        from: ESP32-P4.LP_GPIO
        instances: [LP_GPIO]
        outputs:
          INTR:
            pattern: '^LP_GPIO$'
      LP_I2C:
        from: ESP32-P4.LP_I2C0
        instances: [LP_I2C0]
        outputs:
          INTR:
            pattern: '^LP_I2C0$'
      LP_I2S:
        from: ESP32-P4.LP_I2S0
        instances: [LP_I2S0]
        outputs:
          INTR:
            pattern: '^LP_I2S0$'
      LP_UART:
        from: ESP32-P4.LP_UART
        instances: [LP_UART]
        outputs:
          INTR:
            pattern: '^LP_UART$'
      LP_TIMER:
        from: ESP32-P4.LP_TIMER
        instances: [LP_TIMER]
        outputs:
          TIMER0:
            pattern: '^LP_TIMER0$'
          TIMER1:
            pattern: '^LP_TIMER1$'
      LP_WDT:
        from: ESP32-P4.LP_WDT
        instances: [LP_WDT]
        outputs:
          INTR:
            pattern: '^LP_WDT$'
      LP_TOUCH:
        from: ESP32-P4.LP_TOUCH
        instances: [LP_TOUCH]
        outputs:
          INTR:
            pattern: '^LP_TOUCH$'
      LP_TSENS:
        from: ESP32-P4.LP_TSENS
        instances: [LP_TSENS]
        outputs:
          INTR:
            pattern: '^LP_TSENS$'
      LP_IO_MUX:
        from: ESP32-P4.LP_IO_MUX
        instances: [LP_IO_MUX]

      LP_INTR:
        from: ESP32-P4.LP_INTR
        instances: [LP_INTR]

      LP_SYS:
        from: ESP32-P4.LP_SYS
        instances: [LP_SYS]
        outputs:
          INTR:
            pattern: '^LP_SYS$'
      LP_PERI:
        from: ESP32-P4.LP_PERI
        instances: [LP_PERI]

      LP_AON_CLKRST:
        from: ESP32-P4.LP_AON_CLKRST
        instances: [LP_AON_CLKRST]

      LP_ANA_PERI:
        from: ESP32-P4.LP_ANA_PERI
        instances: [LP_ANA_PERI]
        outputs:
          INTR:
            pattern: '^LP_ANA$'
      LP_HUK:
        from: ESP32-P4.LP_HUK
        instances: [LP_HUK]
        outputs:
          INTR:
            pattern: '^LP_HUK$'
      LP_I2C_ANA_MST:
        from: ESP32-P4.LP_I2C_ANA_MST
        instances: [LP_I2C_ANA_MST]

      # ====================================================================
      # System / Debug
      # ====================================================================
      INTERRUPT_CORE:
        from: ESP32-P4.INTERRUPT_CORE0
        instances: [INTERRUPT_CORE0, INTERRUPT_CORE1]

      TRACE:
        from: ESP32-P4.TRACE0
        instances: [TRACE0, TRACE1]

      HP_SYS:
        from: ESP32-P4.HP_SYS
        instances: [HP_SYS]
        outputs:
          INTR:
            pattern: '^HP_SYS$'
      HP_SYS_CLKRST:
        from: ESP32-P4.HP_SYS_CLKRST
        instances: [HP_SYS_CLKRST]

      PMU:
        from: ESP32-P4.PMU
        instances: [PMU]
        outputs:
          PMU0:
            pattern: '^PMU0$'
          PMU1:
            pattern: '^PMU1$'
      SOC_ETM:
        from: ESP32-P4.SOC_ETM
        instances: [SOC_ETM]

      PAU:
        from: ESP32-P4.PAU
        instances: [PAU]
        outputs:
          INTR:
            pattern: '^PAU$'
      PVT:
        from: ESP32-P4.PVT
        instances: [PVT]

      ASSIST_DEBUG:
        from: ESP32-P4.ASSIST_DEBUG
        instances: [ASSIST_DEBUG]
        outputs:
          INTR:
            pattern: '^ASSIST_DEBUG$'
      EFUSE:
        from: ESP32-P4.EFUSE
        instances: [EFUSE]

      CACHE:
        from: ESP32-P4.CACHE
        instances: [CACHE]
        outputs:
          INTR:
            pattern: '^CACHE$'
      AXI_ICM:
        from: ESP32-P4.AXI_ICM
        instances: [AXI_ICM]

      BITSCRAMBLER:
        from: ESP32-P4.BITSCRAMBLER
        instances: [BITSCRAMBLER]

    # ==================================================================
    # Base address overrides (fix SVD bugs documented in SVD_ERRATA.md)
    # ==================================================================
    address_overrides:
      RMT: 0x500A2000        # SVD: 0x500D4000, TRM Table 7.3-2 + ESP-IDF
      DS: 0x50093000         # SVD: 0x50094000 (3-way rotation with HMAC/ECC)
      HMAC: 0x50094000       # SVD: 0x50095000
      ECC: 0x50095000        # SVD: 0x50093000

    # ==================================================================
    # Interrupt overrides (fix SVD misattributions)
    # ==================================================================
    chip_connections:
      ESP32_P4:
        _all:
          # AXI_DMA interrupts are misattributed to AHB_DMA in SVD
          AXI_DMA: {IN_CH0: [NVIC.62], IN_CH1: [NVIC.63], IN_CH2: [NVIC.64], OUT_CH0: [NVIC.65], OUT_CH1: [NVIC.66], OUT_CH2: [NVIC.67]}
