    resetValue: 511
    resetMask: 4294967295
    fields:
      - name: EN_OSC1
        description: When the RNG is enabled (RNGEN bit set), each bit of this bitfield enables one of the three inputs from the oscillator instance number 1.
        bitOffset: 0
        bitWidth: 3
        access: read-write
      - name: EN_OSC2
        description: When the RNG is enabled (RNGEN bit set), each bit of this bitfield enables one of the three inputs from the oscillator instance number 2.
        bitOffset: 3
        bitWidth: 3
        access: read-write
      - name: EN_OSC3
        description: When the RNG is enabled (RNGEN bit set), each bit of this bitfield enables one of the three inputs from the oscillator instance number 3.
        bitOffset: 6
        bitWidth: 3
        access: read-write
      - name: EN_OSC4
        bitOffset: 9
        bitWidth: 3
        access: read-write
        description: Oscillator 4 enable (6-oscillator NSCR only, nscr_osc = 6)
      - name: EN_OSC5
        bitOffset: 12
        bitWidth: 3
        access: read-write
        description: Oscillator 5 enable (6-oscillator NSCR only, nscr_osc = 6)
      - name: EN_OSC6
        bitOffset: 15
        bitWidth: 3
        access: read-write
        description: Oscillator 6 enable (6-oscillator NSCR only, nscr_osc = 6)
