displayPrefix: STM32
shared_blocks:
  WWDG:
    from: STM32L412.WWDG
    outputs:
      INTR:
        pattern: '^(WWDG|WWDG1|WWDG2)$'
      OUT_RST:
        description: Reset request asserted when the window watchdog times out. Also routed to EXTI on H7 to wake a peer CPU before its own watchdog resets the chip.
        pattern: '^OUT_RST$'
    params:
      - {name: cfr_version, type: int, default: 1, max: 2, description: 'CFR register layout: 1 = v1 (2-bit WDGTB at [8:7]), 2 = v2 (3-bit WDGTB at [13:11])'}
    transforms:
      # Clone CFR -> CFR_V2: newer WWDG IP with 3-bit prescaler at bits [13:11]
      - type: cloneRegister
        source: CFR
        name: CFR_V2
        removeFields: [WDGTB]
      - type: patchFields
        register: CFR_V2
        fields:
          - {name: WDGTB, description: Timer base, bitOffset: 11, bitWidth: 3}
  IWDG:
    # Independent Watchdog (Gen 0-3 superset chain)
    # Gen 0 (basic): KR, PR[2:0], RLR, SR{PVU,RVU} — F4, L1
    # Gen 1 (window): +WINR, +WVU — F3, F7, L0, L4, L4+, L5, C0, G0, G4, H7
    # Gen 2 (early wakeup): +EWCR, PR[3:0], +EWU/EWIF in SR — U3, U5
    # Gen 3 (EW+ONF): +ONF in SR — H5, H7RS, U0
    # N6 stays separate (Gen 4: EWIF@bit15, separate ICR register)
    from: STM32H7S.IWDG
    outputs:
      INTR:
        pattern: '^IWDG$'
    params:
      - {name: gen, type: int, default: 1, max: 3, description: 'IWDG generation: 0=basic (KR/PR/RLR/SR), 1=+window (WINR/WVU), 2=+early wakeup (EWCR/4-bit PR/EWU/EWIF), 3=+ONF status'}
    transforms:
      - {type: patchAddressBlock, size: 24}
      # Rename PR field to PRESCALER to avoid C++ name collision with register PR
      - {type: renameFields, register: PR, pattern: ^PR$, replacement: PRESCALER}
  RNG:
    # Random Number Generator (Gen 0-3 superset chain)
    # Gen 0 (basic): CR{RNGEN,IE}, SR{DRDY,CECS,SECS,CEIS,SEIS}, DR — F4
    # Gen 1 (+CED): +CED in CR — F7, L0, L4, L4+(L4R/S), G0, G4, H7(non-H73x)
    # Gen 2 (+config): +CONFIG3/NISTC/CONFIG2/CLKDIV/CONFIG1/CONDRST/CONFIGLOCK, +HTCR — L5, L4+(L4P/Q), H7(H73x)
    # Gen 3 (+ARDIS+NSCR): +ARDIS in CR, +NSCR register — H5, H7RS, U0, U5, N6
    # U3 stays separate (8-bit CONFIG1, BUSY in SR, 4 HTCR registers)
    from: STM32N645.RNG
    outputs:
      INTR:
        pattern: '^RNG$'
    params:
      - {name: gen, type: int, default: 1, max: 3, description: 'RNG generation: 0=basic (CR:RNGEN+IE), 1=+CED, 2=+HTCR/config/CONDRST/CONFIGLOCK, 3=+ARDIS+NSCR'}
    transforms:
      - {type: patchAddressBlock, size: 20}
  CRYP:
    # Cryptographic processor (Gen 0-2 superset chain)
    # Gen 0 (basic): CR{ALGODIR,ALGOMODE,DATATYPE,KEYSIZE,FFLUSH,CRYPEN,GCM_CCMPH,ALGOMODE_1}, SR{IFEM-BUSY} — F4, F7, H7(H742_H753)
    # Gen 1 (+NPBLB): +NPBLB[23:20] in CR — H7(H745_H757, H73x, H7A3_B)
    # Gen 2 (+KMOD+IPRST+KERF+KEYVALID): +KMOD, +IPRST in CR; +KERF, +KEYVALID in SR — H7RS, N6
    from: STM32N655.CRYP
    outputs:
      INTR:
        pattern: '^CRYP$'
      IN_DMA:
        description: DMA request for input data (plaintext for encrypt, ciphertext for decrypt)
        pattern: '^IN_DMA$'
      OUT_DMA:
        description: DMA request for output data (ciphertext for encrypt, plaintext for decrypt)
        pattern: '^OUT_DMA$'
    params:
      - {name: gen, type: int, default: 0, max: 2, description: 'CRYP generation: 0=basic, 1=+NPBLB, 2=+KMOD/IPRST/KERF/KEYVALID'}
  AES_V1:
    # AES co-processor V1 (basic, AES-128 only): L0, L1, F4, L4, L4+
    # 12 registers: CR(flag clear+interrupt in-band), SR{CCF,RDERR,WRERR}, DINR, DOUTR, KEYR0-3, IVR0-3
    from: STM32L431.AES
    outputs:
      INTR:
        pattern: '^(AES|CRYPTO|AES_RNG_LPUART1)$'
    description: AES co-processor V1 (basic, 128-bit key)
  AES_V2:
    # AES co-processor V2 (extended, 256-bit key + GCM/CCM + suspend): F7, G0, G4, L5
    # 24 registers: V1 + GCMPH/CHMOD2/KEYSIZE/NPBLB in CR, BUSY in SR, KEYR4-7, SUSP0R-7
    from: STM32G431.AES
    outputs:
      INTR:
        pattern: '^(AES|AES_RNG)$'
    description: AES co-processor V2 (256-bit key, GCM/CCM, suspend)
  AES_V3:
    # AES co-processor V3 (restructured interrupts): H5, U0, U3, U5, C5
    # 27 registers: V2 base + KMOD/IPRST in CR, KEYVALID in SR, separate IER/ISR/ICR at 0x300+
    # Flag clear/interrupt enable moved from CR to dedicated IER/ISR/ICR registers
    from: STM32H533.AES
    outputs:
      INTR:
        pattern: '^(AES|AES_RNG)$'
    description: AES co-processor V3 (separate IER/ISR/ICR, key mode)
  HASH:
    # Hash processor (Gen 0-2 superset chain)
    # Gen 0 (basic): CR{ALGO0[7]+ALGO1[18] split}, SR{DINIS,DCIS,DMAS,BUSY} — F4, F7, H7, L4, L4+, L5
    # Gen 1 (+extended SR): CR{ALGO[17:18] unified 2-bit}, SR{+NBWP,DINNE,NBWE} — H5, U5
    # Gen 2 (+SHA-512): CR{ALGO[17:20] unified 4-bit, +SHA-384/512}, SR extended — H7RS, N6, U3
    from: STM32N645.HASH
    outputs:
      INTR:
        pattern: '^HASH$'
      IN_DMA:
        description: DMA request for input data (hash result is read from registers, no OUT DMA)
        pattern: '^IN_DMA$'
    params:
      - {name: gen, type: int, default: 0, max: 2, description: 'HASH generation: 0=basic (split ALGO0+ALGO1, 4-field SR), 1=+extended SR (unified 2-bit ALGO, NBWP/DINNE/NBWE), 2=+SHA-512 (4-bit ALGO)'}
  PKA:
    # Public key accelerator (Gen 0-3 superset chain)
    # Gen 0 (basic): CR{EN,START,MODE,PROCENDIE,RAMERRIE,ADDRERRIE}, SR{BUSY,PROCENDF,RAMERRF,ADDRERRF} — L5
    # Gen 1 (+OPER error): CR{+OPERRIE}, SR{+INITOK,+OPERRF}, CLRFR{+OPERRFC} — U5
    # Gen 2 (+LMF): SR{+LMF} — H5, H7RS, N6
    # Gen 3 (+chaining mode): CR{+CMFIE}, SR{+CCEN,+RNGOKF,+DATAOKF,+INCRERRF,+DATAZF,+TRZERRF,+MDERRF,+RNGERRF,+CMF}, CLRFR{+CMFC} — U3
    from: STM32U385.PKA
    outputs:
      INTR:
        pattern: '^PKA$'
    params:
      - {name: gen, type: int, default: 2, max: 3, description: 'PKA generation: 0=basic, 1=+OPER error/INITOK, 2=+LMF, 3=+chaining mode'}
  DMA2D:
    # Chrom-Art Accelerator (Gen 0-3 superset chain)
    # Gen 0 (basic): CR.MODE[2-bit], LO[14-bit], OPFCCR{CM}, single OCOLR — F4, F7
    # Gen 1 (+AI/RBS): FGPFCCR/BGPFCCR/OPFCCR{+AI,+RBS} — L4, L4+
    # Gen 2 (+LOM/wideMode/wideLO/SB): CR{+LOM}, MODE→3-bit, LO→16-bit, OPFCCR{+SB}, 4 OCOLR variants — U5
    # Gen 3 (+CSS): FGPFCCR{+CSS} — H7RS, N6
    from: STM32H7S.DMA2D
    outputs:
      INTR:
        pattern: '^DMA2D$'
      CLUT_TRG:
        description: CLUT transfer trigger (MDMA trigger source per RM0399 Table 105)
        pattern: '^CLUT_TRG$'
      TC_TRG:
        description: Transfer-complete trigger
        pattern: '^TC_TRG$'
      TW_TRG:
        description: Transfer watermark trigger
        pattern: '^TW_TRG$'
    params:
      - {name: gen, type: int, default: 0, max: 3, description: 'DMA2D generation: 0=basic, 1=+AI/RBS, 2=+LOM/wideMode/wideLO/SB/OCOLR variants, 3=+CSS'}
    transforms:
      - {type: patchAddressBlock, size: 3072}
      - {type: createArray, pattern: FGCLUT(\d+), name: FGCLUT, description: Foreground CLUT}
      - {type: createArray, pattern: BGCLUT(\d+), name: BGCLUT, description: Background CLUT}
  JPEG:
    # JPEG codec: F7, H7, H7RS, N6, U5
    from: STM32N645.JPEG
    outputs:
      INTR:
        pattern: '^JPEG$'
      IFT_TRG:
        description: Input FIFO threshold trigger (MDMA trigger source per RM0399 Table 105)
        pattern: '^IFT_TRG$'
      IFNT_TRG:
        description: Input FIFO not-threshold trigger
        pattern: '^IFNT_TRG$'
      OFT_TRG:
        description: Output FIFO threshold trigger
        pattern: '^OFT_TRG$'
      OFNE_TRG:
        description: Output FIFO not-empty trigger
        pattern: '^OFNE_TRG$'
      OEC_TRG:
        description: Output end-of-conversion trigger
        pattern: '^OEC_TRG$'
    transforms:
      - {type: createArray, pattern: DHTMEM(\d+), name: DHTMEM, description: DHT memory}
      - {type: createArray, pattern: HUFFBASE(\d+), name: HUFFBASE, description: Huffman base}
      - {type: createArray, pattern: HUFFSYMB(\d+), name: HUFFSYMB, description: Huffman symbol}
      - {type: createArray, pattern: HUFFENC_AC0_(\d+), name: HUFFENC_AC0, description: Huffman encoder AC table 0}
      - {type: createArray, pattern: HUFFENC_AC1_(\d+), name: HUFFENC_AC1, description: Huffman encoder AC table 1}
      - {type: createArray, pattern: HUFFENC_DC0_(\d+), name: HUFFENC_DC0, description: Huffman encoder DC table 0}
      - {type: createArray, pattern: HUFFENC_DC1_(\d+), name: HUFFENC_DC1, description: Huffman encoder DC table 1}
      - {type: create2DArray, pattern: QMEM(\d+)_(\d+), name: QMEM, description: Quantization memory}
      - {type: create2DArray, pattern: HUFFMIN(\d+)_(\d+), name: HUFFMIN, description: Huffman min}
  HRTIM:
    # High Resolution Timer — unified block: Master (11 regs) + Timer cluster (29 regs × 6)
    # + Common (36 regs). G4 superset (6 timers, FLTINR3/4, ADC post-scaler).
    # Families: F3, G4, H7. Model is hand-maintained (no from:).
    # SVD names the peripheral HRTIM_Master (a leftover from when the master /
    # timer / common sub-peripherals were modelled separately).  Canonicalise
    # to HRTIM at Pass-3 emit time: chip yamls show the instance as `HRTIM:`,
    # and chip_connections / chip_params / destination strings use that name.
    rename_instances: {HRTIM_Master: HRTIM}
    params:
      - {name: dll, type: bool, default: true, description: 'DLL (delay-locked loop) present (V1.0/V2.0); absent in V1.1'}
      - {name: v2,  type: bool, default: false, description: 'Version 2.0 block (adds sixth timer F, extended fault/ADC registers)'}
    outputs:
      MST:
        pattern: '^(HRTIM1_MST|HRTIM_Master_IRQn)$'
      TIMA:
        pattern: '^(HRTIM1_TIMA|HRTIM_TIMA_IRQn)$'
      TIMB:
        pattern: '^(HRTIM1_TIMB|HRTIM_TIMB_IRQn)$'
      TIMC:
        pattern: '^(HRTIM1_TIMC|HRTIM_TIMC_IRQn)$'
      TIMD:
        pattern: '^(HRTIM1_TIMD|HRTIM_TIMD_IRQn)$'
      TIME:
        pattern: '^(HRTIM1_TIME|HRTIM_TIME_IRQn)$'
      TIMF:
        pattern: '^(HRTIM1_TIMF|HRTIM_TIMF_IRQn)$'
      FLT:
        pattern: '^(HRTIM1_FLT|HRTIM_TIM_FLT_IRQn)$'
      ADC_TRG1:
        description: ADC trigger output 1 from HRTIM (routes to ADC ext_trg / jext_trg selectors per RM0399 Table 102)
        pattern: '^ADC_TRG1$'
      ADC_TRG2:
        description: ADC trigger output 2 from HRTIM
        pattern: '^ADC_TRG2$'
      ADC_TRG3:
        description: ADC trigger output 3 from HRTIM
        pattern: '^ADC_TRG3$'
      ADC_TRG4:
        description: ADC trigger output 4 from HRTIM
        pattern: '^ADC_TRG4$'
      DAC_TRG1:
        description: DAC trigger output 1 from HRTIM (separately routable to DAC channel triggers and ETH PTP / FDCAN SWT-EVT inputs per RM0399 Table 102)
        pattern: '^DAC_TRG1$'
      DAC_TRG2:
        description: DAC trigger output 2 from HRTIM
        pattern: '^DAC_TRG2$'
      MST_DMA:
        description: DMA request from the master timer
        pattern: '^MST_DMA$'
      TIMA_DMA:
        description: DMA request from timer A
        pattern: '^TIMA_DMA$'
      TIMB_DMA:
        description: DMA request from timer B
        pattern: '^TIMB_DMA$'
      TIMC_DMA:
        description: DMA request from timer C
        pattern: '^TIMC_DMA$'
      TIMD_DMA:
        description: DMA request from timer D
        pattern: '^TIMD_DMA$'
      TIME_DMA:
        description: DMA request from timer E
        pattern: '^TIME_DMA$'
  TimerV2:
    # Modern timer (V2 layout): CCR5@0x48, DCR@0x3DC, DTR2, ECR
    # Unified GP + AdvCtrl. Families: G4, H5, H7RS, N6, U3, U5
    from: STM32N645.TIM1
    outputs:
      INTR:
        description: Global interrupt
        pattern: '^TIM2$'
      BRK:
        pattern: '^(TIM1_BRK|TIM1_BRK_TIM15)$'
      UP:
        pattern: '^(TIM1_UP|TIM1_UP_TIM16)$'
      TRG_COM:
        pattern: '^TIM1_TRG_COM$'
      TRG_CCU:
        pattern: '^TIM1_TRG_CCU$'
      CC:
        pattern: '^TIM1_CC$'
      BRK_TERR_IERR:
        pattern: '^TIM1_BRK_TERR_IERR$'
      TRG_COM_DIR_IDX:
        pattern: '^TIM1_TRG_COM_DIR_IDX$'
    params:
      - {name: width32, type: bool, default: false, description: 32-bit counter width}
      - {name: max_channel, type: int, default: 3, max: 5, description: Highest capture/compare channel index (0-5)}
      - {name: has_centerPWM, type: bool, default: true, description: Center-aligned PWM (CMS/DIR in CR1)}
      - {name: encoder, type: int, default: 0, max: 3, description: 'Encoder level: 0=none 1=basic 2=index 3=index+blanking'}
      - {name: has_xor_input, type: bool, default: true, description: TI1S XOR (Hall sensor)}
      - {name: has_etr, type: bool, default: true, description: External trigger input (ETF/ETPS/ECE/ETP)}
      - {name: has_dma_burst, type: bool, default: true, description: DMA burst transfer (DCR/DMAR)}
      - {name: has_complementary, type: bool, default: false, description: Complementary output (BDTR/RCR/break/dead-time)}
      - {name: has_dither, type: bool, default: true, description: Dithering (DITHEN in CR1)}
      - {name: sms_preload, type: int, default: 0, max: 2, description: 'SMS preload: 0=none 1=SMSPE 2=SMSPE+SMSPS'}
      - {name: has_uifremap, type: bool, default: false, description: UIF remap (UIFREMAP in CR1)}
      - {name: has_extended_ocm, type: bool, default: false, description: Extended OC mode (OC1M_3 etc.)}
      - {name: has_mms2, type: bool, default: false, description: Master mode selection 2 (MMS2 in CR2)}
    transforms:
      # N6 SVD naming normalization
      - {type: renameFields, register: SMCR, pattern: ^SMS_1$, replacement: SMS_3}
      - {type: renameFields, register: SMCR, pattern: ^TS_1$, replacement: TS_4_3}
      - {type: renameFields, register: CCMR1_Output, pattern: OC(\d)M_1$, replacement: OC\1M_3}
      - {type: renameFields, register: CCMR2_Output, pattern: OC(\d)M_1$, replacement: OC\1M_3}
      - {type: renameFields, register: CCMR3, pattern: OC(\d)M_1$, replacement: OC\1M_3}
      - {type: renameFields, register: CR2, pattern: ^MMS_1$, replacement: MMS_3}
      # Widen counter/compare fields to 32-bit (TIM1 source has 16/20-bit)
      - {type: patchFields, register: CNT, fields: [{name: CNT, bitWidth: 31}]}
      - {type: patchFields, register: ARR, fields: [{name: ARR, bitWidth: 32}]}
      - {type: patchFields, register: CCR1, fields: [{name: CCR1, bitWidth: 32}]}
      - {type: patchFields, register: CCR2, fields: [{name: CCR2, bitWidth: 32}]}
      - {type: patchFields, register: CCR3, fields: [{name: CCR3, bitWidth: 32}]}
      - {type: patchFields, register: CCR4, fields: [{name: CCR4, bitWidth: 32}]}
      # Add OCCS to SMCR (GP-only, bit 3, reserved on AdvCtrl hardware)
      - {type: patchFields, register: SMCR, fields: [{name: OCCS, description: OCREF clear selection, bitOffset: 3, bitWidth: 1}]}
      # Ensure addressBlock covers DCR/DMAR at 0x3E0+4
      - {type: patchAddressBlock, size: 996}
  BasicTimer:
    from: STM32N645.TIM6
    outputs:
      INTR:
        pattern: '^(TIM6|TIM6_DAC|TIM6_DAC1|TIM6_DACUNDER|TIM6_DAC_LPTIM1|TIM7|TIM18|TIM3|TIM9)$'
      UP_DMA:
        description: DMA request on update event (counter wraparound)
        pattern: '^UP_DMA$'
      TRGO:
        description: Trigger output (MMS-field-selected; basic timers expose this for ADC/DAC/HRTIM routing per RM0399 Table 102)
        pattern: '^TRGO$'
  I2C:
    from: STM32U535.I2C1
    outputs:
      INTR:
        pattern: '^(I2C|I2C1)$'
      EV:
        pattern: '^(I2C1_EV|I2C1_EV_IRQ)$'
      ER:
        pattern: '^(I2C1_ER|I2C1_ER_IRQ)$'
      ERR:
        pattern: '^I2C1_ERR$'
      TX_DMA:
        description: DMA request for transmit (TXIS / TXDR)
        pattern: '^TX_DMA$'
      RX_DMA:
        description: DMA request for receive (RXNE / RXDR)
        pattern: '^RX_DMA$'
      WKUP:
        description: Wakeup from Stop mode (asserted on the configured wakeup event)
        pattern: '^WKUP$'
  USART:
    from: STM32N645.USART1
    outputs:
      INTR:
        description: Global interrupt
        pattern: '^(USART1|LPUART1|USART2|USART6|USART3|UART4|UART7|UART8|USART7|UART5|USART5|USART4|UART9|USART10)$'
      TX_DMA:
        description: DMA request for transmit (TXFIFO threshold / TXE)
        pattern: '^TX_DMA$'
      RX_DMA:
        description: DMA request for receive (RXFIFO threshold / RXNE)
        pattern: '^RX_DMA$'
      WKUP:
        description: Wakeup from Stop mode (combined; asserted on any configured RX-event OR TX-event per RM0399 §51.5.21 / §52.4.14). Standard USART/UART expose this combined output externally; LPUART exposes WKUP_RX and WKUP_TX separately and does not wire this combined signal. See svd/ST/SVD_ERRATA.md → 'LPUART wakeup signals'.
        pattern: '^WKUP$'
      WKUP_RX:
        description: Wakeup from Stop mode on RX-event only (LPUART only; standard USART/UART have no externally accessible RX-only wakeup output)
        pattern: '^WKUP_RX$'
      WKUP_TX:
        description: Wakeup from Stop mode on TX-event only (LPUART only; standard USART/UART have no externally accessible TX-only wakeup output)
        pattern: '^WKUP_TX$'
      TX_IT:
        description: Transmit-event interrupt flag exposed as a trigger source (LPUART only on H7; routes to DMAMUX gen per RM0399 Table 107 'it_tx_lpuart1'). Finer-grained than the global INTR.
        pattern: '^TX_IT$'
      RX_IT:
        description: Receive-event interrupt flag exposed as a trigger source (LPUART only on H7; routes to DMAMUX gen per RM0399 Table 107 'it_rx_lpuart1')
        pattern: '^RX_IT$'
    params:
      - {name: lpbaud, type: bool, default: false, description: Low-power baud rate generation (BRR_LP variant; no OVER8/ONEBIT/GTPR/RTOR; no RTOIE/RTOEN/RTOF/RTOCF; no TECLREN in AUTOCR)}
      - {name: synchronous, type: int, default: 3, max: 3, description: 'Synchronous/smartcard capability: 0=none, 1=synchronous+SPI slave (CLKEN/CPHA/CPOL/LBCL/SLVEN/DIS_NSS/UDR/UDRCF/TXFECF), 2=sync+smartcard (NACK/SCEN/SCARCNT/EOBIE/EOBF/EOBCF), 3=sync+smartcard+TCBGT'}
      - {name: irda, type: bool, default: true, description: IrDA mode (IREN/IRLP in CR3; PSC prescaler in GTPR)}
      - {name: lin, type: bool, default: true, description: LIN mode (LBDL/LBDIE/LINEN in CR2; LBDF in ISR; LBDCF in ICR)}
      - {name: autobaud, type: bool, default: true, description: Auto baud rate detection (ABREN/ABRMOD in CR2; ABRRQ in RQR; ABRE/ABRF in ISR)}
      - {name: has_fifo, type: bool, default: true, description: FIFO mode (FIFOEN in CR1; TXFTIE/RXFTCFG/RXFTIE/TXFTCFG in CR3; TXFE/RXFF/RXFT/TXFT in ISR). Also implies PRESC register.}
      - {name: has_wakeup, type: bool, default: true, description: Wakeup from Stop mode interrupt flag selection (WUS/WUFIE in CR3; WUF in ISR; WUCF in ICR)}
      - {name: has_autocr, type: bool, default: false, description: Autonomous mode (AUTOCR register at 0x30)}
    transforms:
      # Add BRR_LP alternate register for LPUART baud rate (20-bit BRR)
      - {type: cloneRegister, source: BRR, name: BRR_LP}
      - type: patchRegisters
        registers:
          - {name: BRR_LP, description: 'Baud rate register [low-power variant]', alternateRegister: BRR}
      - type: patchFields
        register: BRR_LP
        fields:
          - {name: BRR, bitOffset: 0, bitWidth: 20, description: LPUART baud rate division (LPUARTDIV)}
      # Add AUTOCR register for autonomous mode (U3/U5 only)
      - type: patchRegisters
        registers:
          - name: AUTOCR
            description: Autonomous mode control register
            displayName: AUTOCR
            addressOffset: 48
            size: 32
            access: read-write
            resetValue: 2147483648
            fields:
              - {name: TDN, description: Transmit data number, bitOffset: 0, bitWidth: 16}
              - {name: TRIGPOL, description: Trigger polarity, bitOffset: 16, bitWidth: 1}
              - {name: TRIGEN, description: Trigger enable, bitOffset: 17, bitWidth: 1}
              - {name: IDLEDIS, description: Idle disable, bitOffset: 18, bitWidth: 1}
              - {name: TRIGSEL, description: Trigger selection, bitOffset: 19, bitWidth: 4}
              - {name: TECLREN, description: Transfer complete clear enable, bitOffset: 31, bitWidth: 1}
  LPOPAMP:
    # LPOTR-type OPAMP: L4, L4+, L5, U0, U5 share this model
    # HSOTR-type families use HSOPAMP; G4/L1 are distinct IPs; U3 has different VM_SEL width
    from: STM32U535.OPAMP
    params:
      - {name: single, type: bool, default: false, description: Single operational amplifier (no second amplifier registers)}
    transforms:
      - {type: renameRegisters, pattern: ^OPAMP1_, replacement: ''}
      - {type: renameRegisters, pattern: ^OPAMP2_(.+), replacement: \g<1>2}
      # U5/L5 SVD typo: OPAMP2_CRS instead of OPAMP2_CSR
      - {type: renameRegisters, pattern: ^CRS, replacement: CSR}
  HSOPAMP:
    # HSOTR-type OPAMP: H7 and H5 share this model
    # LPOTR-type families use LPOPAMP; G4/L1 are distinct IPs; U3 has different VM_SEL width
    from: STM32H723.OPAMP
    outputs:
      OUT1:
        description: Op-amp 1 output (routes to HRTIM event router per RM0399 Table 102)
        pattern: '^OUT1$'
      OUT2:
        description: Op-amp 2 output
        pattern: '^OUT2$'
    params:
      - {name: single, type: bool, default: false, description: Single operational amplifier (no second amplifier registers)}
    transforms:
      - {type: renameRegisters, pattern: ^OPAMP1_, replacement: ''}
      - {type: renameRegisters, pattern: ^OPAMP2_(.+), replacement: \g<1>2}
      # SVD bug: HSOTR fields named TRIMLP* instead of TRIMHS* (confirmed in all H7 RMs)
      - {type: renameFields, register: HSOTR, pattern: ^TRIMLP, replacement: TRIMHS}
      - {type: renameFields, register: HSOTR2, pattern: ^TRIMLP, replacement: TRIMHS}
      # SVD bug: CSR2 missing VP_SEL field (present in RM0468, RM0399, RM0433, RM0455)
      - {type: patchFields, register: CSR2, fields: [{name: VP_SEL, description: Non inverted input selection, bitOffset: 2, bitWidth: 2}]}
      # SVD bug: OR register missing (all reserved, present in all H7/H5 RMs at offset 0x0C)
      - {type: patchRegisters, registers: [{name: OR, displayName: OR, description: OPAMP option register, addressOffset: 12, size: 32, access: read-write, resetValue: 0}]}
  LPTIM:
    from: STM32U031.LPTIM1
    outputs:
      INTR:
        pattern: '^(LPTIM\d+|LP_Timer\d+)$'
      WKUP:
        description: Wakeup from Stop mode
        pattern: '^WKUP$'
      OUT:
        description: Timer compare/PWM output signal (routes to EXTI wakeup on some instances and to TIM trigger crossbars per RM0399 ch.14)
        pattern: '^OUT$'
      IN1:
        description: Input 1 pin signal (LPTIMx_IN1 alternate function). Per RM0399 §45.4.3 Tables 380/382, IN1SEL=0 selects this pin as the LPTIM's input 1. Not all LPTIM instances have this pin — LPTIM3 specifically has slot 0 'not connected' (Table 384).
        pattern: '^IN1$'
      IN2:
        description: Input 2 pin signal (LPTIMx_IN2 alternate function). IN2SEL=0 selects this pin. Only LPTIM1/LPTIM2 expose IN2 on H7 (LPTIM3-5 lack IN2 entirely).
        pattern: '^IN2$'
      ETR:
        description: External trigger pin (LPTIMx_ETR alternate function). TRIGSEL=0 default for LPTIM1/LPTIM2 on H7; LPTIM3-5 have other internal sources at slot 0 (per RM Tables 377-379).
        pattern: '^ETR$'
    params:
      - {name: max_channel, type: int, default: 0, max: 3, description: 'Highest CC channel index (0=CCR1 only, 1=CCR1+CCR2, 3=CCR1-CCR4)'}
      - {name: has_counter_reset, type: bool, default: true, description: COUNTRST/RSTARE in CR}
      - {name: has_repetition, type: bool, default: true, description: RCR register and UE/REPOK status bits}
      - {name: has_cfgr2, type: bool, default: true, description: CFGR2 input selection register}
      - {name: or_type, type: int, default: 0, max: 2, description: 'OR register variant (0=none, 1=L4 2-bit option, 2=G4 6-bit input mux)'}
    transforms:
      # Widen TRIGSEL from 3-bit to 4-bit (G4 has 16 trigger sources)
      - {type: patchFields, register: CFGR, fields: [{name: TRIGSEL, bitWidth: 4}]}
      # Add OR register variants at offset 0x20 (G4 input-mux layout, L4 generic option bits)
      - type: patchRegisters
        registers:
          - name: OR_INMUX
            displayName: OR_INMUX
            description: Option register [input mux variant]
            addressOffset: 32
            size: 32
            access: read-write
            resetValue: 0
            fields:
              - {name: IN1, description: LPTIM input 1 mux, bitOffset: 0, bitWidth: 1}
              - {name: IN2, description: LPTIM input 2 mux, bitOffset: 1, bitWidth: 1}
              - {name: IN1_2_1, description: LPTIM input 1 extended mux, bitOffset: 2, bitWidth: 2}
              - {name: IN2_2_1, description: LPTIM input 2 extended mux, bitOffset: 4, bitWidth: 2}
          - name: OR_OPTION
            displayName: OR_OPTION
            description: Option register [generic option bits variant]
            alternateRegister: OR_INMUX
            addressOffset: 32
            size: 32
            access: read-write
            resetValue: 0
            fields:
              - {name: OR_0, description: Option register bit 0, bitOffset: 0, bitWidth: 1}
              - {name: OR_1, description: Option register bit 1, bitOffset: 1, bitWidth: 1}
  TimerV1:
    # Classic timer (V1 layout): DCR@0x48, CCR5@0x58
    # Unified GP + AdvCtrl. Families: F4, F7, H7, C0, G0, U0, L4, L4P, L5, L0, L1
    from: STM32H723.TIM1
    outputs:
      INTR:
        description: Global interrupt
        pattern: '^TIM\d+$'
      BRK:
        pattern: '^(TIM1_BRK|TIM1_BRK_TIM9|TIM1_BRK_TIM15)$'
      UP:
        pattern: '^(TIM1_UP|TIM1_UP_TIM10|TIM1_UP_TIM16)$'
      TRG_COM:
        pattern: '^(TIM1_TRG_COM|TIM1_TRG_COM_TIM11|TIM1_TRG_COM_TIM17)$'
      CC:
        pattern: '^(TIM1_CC|TIM_CC)$'
      BRK_UP_TRG_COM:
        pattern: '^TIM1_BRK_UP_TRG_COM$'
      TRGO:
        description: Trigger output (TRGO; MMS-field-selected event — reset / enable / update / CC1IF / OC1REF-4REF). Wires to other timers' ITR inputs, HRTIM event router, ADC trigger selectors, DAC channels, DFSDM filter triggers.
        pattern: '^TRGO$'
      TRGO2:
        description: Second trigger output (TRGO2; MMS2-field-selected; advanced-control timers TIM1/TIM8 only). Feeds ADC trigger selectors with finer-grained source events than TRGO.
        pattern: '^TRGO2$'
      CH1:
        description: Channel 1 bidirectional signal — what's at the TIMx_CH1 pin alternate function. In input/capture mode, the external pin signal flows into the timer via TI1SEL=0. In output/compare mode, the internal OC1REF drives the pin. The same wire is observed by other timers' TI muxes and ADC/HRTIM/DAC trigger selectors. (Table 102 names it 'CH<x>' in TIM-as-source rows, 'CC<x>' in some ADC-trigger rows; treated as one canonical.)
        pattern: '^CH1$'
      CH2:
        description: Channel 2 bidirectional signal (TIMx_CH2 pin alternate function)
        pattern: '^CH2$'
      CH3:
        description: Channel 3 bidirectional signal (TIMx_CH3 pin alternate function)
        pattern: '^CH3$'
      CH4:
        description: Channel 4 bidirectional signal (TIMx_CH4 pin alternate function)
        pattern: '^CH4$'
      ETR:
        description: External trigger input pin (TIMx_ETR alternate function). Wired by silicon to ETR mux slot 0 (TIMx_AF1.ETRSEL=0 default).
        pattern: '^ETR$'
      BKIN:
        description: Break input pin (TIMx_BKIN alternate function). Enabled via TIMx_AF1.BKINE bit. The break input is an OR of multiple sources — the pin is one of them, occupying slot 0.
        pattern: '^BKIN$'
      BKIN2:
        description: Second break input pin (TIMx_BKIN2; advanced-control timers TIM1/TIM8 only). Enabled via TIMx_AF1.BKINE-equivalent for the second break input. Occupies slot 0 of the BRK2 input.
        pattern: '^BKIN2$'
      OC1:
        description: Output compare channel 1 reference signal (level following the OC1 waveform). Distinct from CC1, which is the event pulse on capture/compare match.
        pattern: '^OC1$'
      OC3:
        description: Output compare channel 3 reference signal
        pattern: '^OC3$'
      OC4:
        description: Output compare channel 4 reference signal
        pattern: '^OC4$'
      OC5:
        description: Output compare channel 5 reference signal (TIM1/TIM8 only; 5th channel is compare-only and exists specifically for COMP blanking and ADC injected-trigger purposes per RM0399 Table 102)
        pattern: '^OC5$'
      CH1_DMA:
        description: DMA request on capture/compare channel 1 event
        pattern: '^CH1_DMA$'
      CH2_DMA:
        description: DMA request on capture/compare channel 2 event
        pattern: '^CH2_DMA$'
      CH3_DMA:
        description: DMA request on capture/compare channel 3 event
        pattern: '^CH3_DMA$'
      CH4_DMA:
        description: DMA request on capture/compare channel 4 event
        pattern: '^CH4_DMA$'
      UP_DMA:
        description: DMA request on update event (counter wraparound)
        pattern: '^UP_DMA$'
      TRIG_DMA:
        description: DMA request on trigger event
        pattern: '^TRIG_DMA$'
      COM_DMA:
        description: DMA request on commutation event (advanced-control timers only)
        pattern: '^COM_DMA$'
    params:
      - {name: width32, type: bool, default: false, description: 32-bit counter width}
      - {name: max_channel, type: int, default: 3, max: 5, description: Highest capture/compare channel index (0-5)}
      - {name: has_centerPWM, type: bool, default: true, description: Center-aligned PWM (CMS/DIR in CR1)}
      - {name: encoder, type: int, default: 0, max: 1, description: 'Encoder level: 0=none 1=basic'}
      - {name: has_xor_input, type: bool, default: true, description: TI1S XOR (Hall sensor)}
      - {name: has_etr, type: bool, default: true, description: External trigger input (ETF/ETPS/ECE/ETP)}
      - {name: has_dma_burst, type: bool, default: true, description: DMA burst transfer (DCR/DMAR)}
      - {name: has_complementary, type: bool, default: false, description: Complementary output (BDTR/RCR/break/dead-time)}
      - {name: has_uifremap, type: bool, default: false, description: UIF remap (UIFREMAP in CR1)}
      - {name: has_extended_ocm, type: bool, default: false, description: Extended OC mode (OC1M_3 etc.)}
      - {name: has_mms2, type: bool, default: false, description: Master mode selection 2 (MMS2 in CR2)}
    transforms:
      # Fix H7 SVD naming inconsistency: OC4M_4 should be OC4M_3
      - {type: renameFields, register: CCMR2_Output, pattern: ^OC4M_4$, replacement: OC4M_3}
      # Widen counter/compare fields to 32-bit (TIM1 source has 16-bit)
      - {type: patchFields, register: CNT, fields: [{name: CNT, bitWidth: 31}]}
      - {type: patchFields, register: ARR, fields: [{name: ARR, bitWidth: 32}]}
      - {type: patchFields, register: CCR1, fields: [{name: CCR1, bitWidth: 32}]}
      - {type: patchFields, register: CCR2, fields: [{name: CCR2, bitWidth: 32}]}
      - {type: patchFields, register: CCR3, fields: [{name: CCR3, bitWidth: 32}]}
      - {type: patchFields, register: CCR4, fields: [{name: CCR4, bitWidth: 32}]}
      # Add OCCS to SMCR (GP-only, bit 3, reserved on AdvCtrl hardware)
      - {type: patchFields, register: SMCR, fields: [{name: OCCS, description: OCREF clear selection, bitOffset: 3, bitWidth: 1}]}
      # Widen DMAR DMAB field from 16-bit to 32-bit
      - {type: patchFields, register: DMAR, fields: [{name: DMAB, bitWidth: 32}]}
      # Fix RCR REP field: SVD has 8-bit, RM says 16-bit for TIM1/TIM8
      - {type: patchFields, register: RCR, fields: [{name: REP, bitWidth: 16}]}
  ModernSPI:
    # Modern SPI/I2S: split TX/RX data registers, CFG1/CFG2 configuration
    # Families: H5, H7, H7RS, N6, U3, U5
    from: STM32N645.SPI1
    outputs:
      INTR:
        pattern: '^(SPI1|SPI|SPI2|SPI4|SPI5|SPI6|SPI3)$'
      TX_DMA:
        description: DMA request for transmit (TXFIFO threshold / TXP)
        pattern: '^TX_DMA$'
      RX_DMA:
        description: DMA request for receive (RXFIFO threshold / RXP)
        pattern: '^RX_DMA$'
      WKUP:
        description: Wakeup from Stop mode (asserted on the configured wakeup event)
        pattern: '^WKUP$'
    params:
      - {name: has_tser, type: bool, default: false, description: 'TSER transfer reload (H7): TSER in CR2, TSERFIE/TSERF/TSERFC, UDRDET/UDRCFG widened in CFG1'}
      - {name: has_autocr, type: bool, default: false, description: Autonomous mode (AUTOCR register at 0x1C)}
      - {name: has_i2s, type: bool, default: false, description: I2S audio capability (per-instance)}
    transforms:
      # H7: TSER field in CR2 for transfer extension reload
      - type: patchFields
        register: CR2
        fields:
          - {name: TSER, description: Number of data transfer extension to be reload into TSIZE, bitOffset: 16, bitWidth: 16, access: read-only}
      # H7: widen UDRCFG from 1-bit to 2-bit and add UDRDET
      - type: patchFields
        register: CFG1
        fields:
          - {name: UDRCFG, bitWidth: 2}
          - {name: UDRDET, description: Detection of underrun condition at slave transmitter, bitOffset: 11, bitWidth: 2}
      # H7: TSERFIE in IER
      - type: patchFields
        register: IER
        fields:
          - {name: TSERFIE, description: Additional number of transactions reload interrupt enable, bitOffset: 10, bitWidth: 1}
      # H7: TSERF in SR
      - type: patchFields
        register: SR
        fields:
          - {name: TSERF, description: Additional number of SPI data to be transacted was reload, bitOffset: 10, bitWidth: 1}
      # H7: TSERFC in IFCR
      - type: patchFields
        register: IFCR
        fields:
          - {name: TSERFC, description: TSERFC flag clear, bitOffset: 10, bitWidth: 1}
      # U3/U5: AUTOCR register for autonomous mode
      - type: patchRegisters
        registers:
          - name: AUTOCR
            displayName: AUTOCR
            description: Autonomous mode control register
            addressOffset: 28
            size: 32
            access: read-write
            resetValue: 0
            fields:
              - {name: TRIGSEL, description: Trigger selection, bitOffset: 16, bitWidth: 4}
              - {name: TRIGPOL, description: Trigger polarity, bitOffset: 20, bitWidth: 1}
              - {name: TRIGEN, description: Hardware control of CSTART triggering enable, bitOffset: 21, bitWidth: 1}
  LegacySPI:
    # Legacy SPI/I2S: single data register, CR1/CR2/SR/DR architecture
    # Families: C0, F3, F4, F7, G0, G4, L0, L1, L4, L4P, L5, U0
    from: STM32G030.SPI1
    outputs:
      INTR:
        pattern: '^(SPI1|SPI3|SPI|SPI2|SPI4|SPI5|SPI6)$'
    params:
      - {name: has_fifo, type: bool, default: true, description: 'FIFO capability (DS/FRXTH/LDMA_RX/LDMA_TX/NSSP in CR2, FRLVL/FTLVL in SR)'}
      - {name: has_i2s, type: bool, default: false, description: I2S audio capability (per-instance)}
      - {name: has_astrten, type: bool, default: false, description: Asynchronous start enable (ASTRTEN in I2SCFGR)}
    transforms:
      # Fix G0 SVD typo: SE2 should be I2SE
      - {type: renameFields, register: I2SCFGR, pattern: ^SE2$, replacement: I2SE}
      # Add ASTRTEN field (C0 and possibly others)
      - type: patchFields
        register: I2SCFGR
        fields:
          - {name: ASTRTEN, description: Asynchronous start enable, bitOffset: 12, bitWidth: 1}
  SAI:
    # Serial Audio Interface: dual audio block (A/B) with optional GCR, PDM
    # Families: F4, F7, G4, H5, H7, H7RS, L4, L4P, L5, N6, U3, U5
    from: STM32U535.SAI1
    outputs:
      INTR:
        pattern: '^SAI\d+$'
      A:
        pattern: '^SAI\d+_A$'
      B:
        pattern: '^SAI\d+_B$'
      A_DMA:
        description: DMA request from sub-block A (TX or RX depending on per-sub-block configuration)
        pattern: '^A_DMA$'
      B_DMA:
        description: DMA request from sub-block B (TX or RX depending on per-sub-block configuration)
        pattern: '^B_DMA$'
      FS_A:
        description: Frame-sync signal from sub-block A (drives external pin; routed to TIM ETR / LPTIM trigger inputs per RM0399 Table 102)
        pattern: '^FS_A$'
      FS_B:
        description: Frame-sync signal from sub-block B (drives external pin; routed to TIM ETR / LPTIM trigger inputs per RM0399 Table 102)
        pattern: '^FS_B$'
    params:
      - {name: has_gcr, type: bool, default: true, description: GCR register (inter-SAI synchronization)}
      - {name: has_pdm, type: bool, default: false, description: PDM support (PDMCR/PDMDLY registers + OSR in xCR1)}
      - {name: has_mcken, type: bool, default: false, description: Master clock enable (MCKEN + 6-bit MCKDIV in xCR1)}
    transforms:
      # Normalize enable field names to generic SAIXEN
      - {type: renameFields, register: ACR1, pattern: ^SAIAEN$, replacement: SAIXEN}
      - {type: renameFields, register: BCR1, pattern: ^SAIAEN$, replacement: SAIXEN}
      # Fix truncated counter name
      - {type: renameFields, register: ACR2, pattern: ^MUTECN$, replacement: MUTECNT}
      - {type: renameFields, register: BCR2, pattern: ^MUTECN$, replacement: MUTECNT}
  GPIO:
    # General Purpose I/O: standard GPIO port with optional BRR, HSLVR, SECCFGR
    # Families: all except N6 (N6 has 20+ extended registers)
    from: STM32U375.GPIOA
    params:
      - {name: has_brr, type: bool, default: true, description: BRR register (port bit reset)}
      - {name: has_hslvr, type: bool, default: false, description: HSLVR register (high-speed low-voltage)}
      - {name: has_seccfgr, type: bool, default: false, description: SECCFGR register (security configuration)}
      - {name: pins, type: int, default: 65535, max: 65535, description: Bitmask of implemented pins (uint16_t)}
  QUADSPI:
    # Quad-SPI flash memory interface
    # Families: F4, F7, G4, H7, L4
    from: STM32F412.QUADSPI
    params:
      - {name: base, type: int, default: 144, max: 255, description: Top 8 bits of memory-mapped base address (0x90 = 0x90000000)}
      - {name: logsize, type: int, default: 28, max: 31, description: Memory window size as log2 (28 = 256 MB)}
      - {name: dual, type: bool, default: true, description: Dual-flash mode support (DFM bit in CR)}
    outputs:
      INTR:
        pattern: '^QUADSPI$'
      FT_TRG:
        description: FIFO threshold trigger (MDMA trigger source per RM0399 Table 105)
        pattern: '^FT_TRG$'
      TC_TRG:
        description: Transfer-complete trigger
        pattern: '^TC_TRG$'
  XSPI:
    # Extended-SPI flash memory interface (unified OCTOSPI/XSPI)
    # Families: H5, H7, H7RS, L5, N6, U3, U5 (L4P has different IP variants, stays family-specific)
    from: STM32N645.XSPI1
    outputs:
      INTR:
        pattern: '^(OCTOSPI1|XSPI1|OSPI1|HSPI1|XSPI2|XSPI3|OCTOSPI2)$'
    description: Extended-SPI flash memory interface
    params:
      - {name: variant, type: int, default: 0, description: "IP variant: 0 = OCTOSPI, 1 = HSPI, 2 = XSPI"}
      - {name: has_dll, type: bool, default: false, description: "DLL calibration registers present (CALFCR/CALMR/CALSOR/CALSIR)"}
      - {name: has_maxtran, type: bool, default: false, description: "DCR3 maximum transfer field present"}
    transforms:
      # N6 SVD marks DCR1.CKMODE as read-only, but it's read-write per RM0486
      - {type: patchFields, register: DCR1, fields: [{name: CKMODE, access: read-write}]}
      # Add OCTOSPI/HSPI-only fields (not in XSPI SVD source but needed for older variants)
      - {type: patchFields, register: CR, fields: [{name: FSEL, description: FLASH memory selection, bitOffset: 7, bitWidth: 1}]}
      - {type: patchFields, register: DCR1, fields: [{name: DLYBYP, description: Delay block bypass, bitOffset: 3, bitWidth: 1}]}
      - {type: patchFields, register: CCR, fields: [{name: SIOO, description: Send instruction only once mode, bitOffset: 31, bitWidth: 1}]}
  SPDIFRX:
    # S/PDIF audio receiver interface
    # Families: F4, F7, H7, H7RS, N6
    from: STM32N645.SPDIFRX
    outputs:
      INTR:
        pattern: '^(SPDIFRX|SPDIF_Rx|SPDIF|SPDIF_RX)$'
      DT_DMA:
        description: DMA request for received audio data
        pattern: '^DT_DMA$'
      CS_DMA:
        description: DMA request for received channel-status / user-data bits
        pattern: '^CS_DMA$'
      FRAME_SYNC:
        description: Recovered frame-sync signal (routes to TIM17 TI1 per RM0399 Table 102)
        pattern: '^FRAME_SYNC$'
    params:
      - {name: has_symbol_clock, type: bool, default: true, description: 'CR symbol clock fields (CKSEN, CKSBKPEN)'}
  TSC:
    # Touch Sensing Controller: F3, L0, L4, L4P, L5, U0, U3, U5
    # 8 IO groups max (G1-G8); some chips implement 6 or 7
    from: STM32U535.TSC
    outputs:
      INTR:
        pattern: '^TSC$'
    params:
      - {name: groups, type: int, default: 8, description: 'Number of touch sensing IO groups (6, 7, or 8)'}
    transforms:
      - {type: patchAddressBlock, size: 1024}
  SWPMI:
    # Single Wire Protocol Master Interface: H7, L4, L4P
    # H7 is superset (transceiver enable/ready bits, OR register, 8-bit BRR)
    from: STM32H723.SWPMI
    outputs:
      INTR:
        pattern: '^SWPMI1$'
      TX_DMA:
        description: DMA request for transmit
        pattern: '^TX_DMA$'
      RX_DMA:
        description: DMA request for receive
        pattern: '^RX_DMA$'
      WKUP:
        description: Wakeup from Stop mode
        pattern: '^WKUP$'
  CORDIC:
    # CORDIC co-processor: G4, H5, H7, H7RS, U5
    from: STM32H562.CORDIC
    outputs:
      INTR:
        pattern: '^(Cordic|CORDIC_IT|CORDIC)$'
  FMAC:
    # Filter Math Accelerator: G4, H5, H7, U5
    from: STM32H723.FMAC
    outputs:
      INTR:
        pattern: '^FMAC$'
  FMC:
    # Flexible Memory Controller (NOR/SRAM/NAND/SDRAM): F3, F4, F7, G4, H5, H7, H7RS, L4, L4P, L5, U5
    from: STM32H523.FMC
    outputs:
      INTR:
        pattern: '^FMC$'
    description: Flexible Memory Controller
    params:
      - {name: sdram, type: bool, default: false, description: "SDRAM controller present"}
      - {name: nand_banks, type: int, default: 1, description: "Number of NAND flash banks (1 or 3)"}
      - {name: pcscntr, type: bool, default: false, description: "PSRAM chip-select counter register present"}
    transforms:
      # Add BMAP field to BCR1-4 (H7/H7RS: bank remapping control, bits [25:24])
      - {type: patchFields, register: BCR1, fields: [{name: BMAP, description: "FMC bank mapping", bitOffset: 24, bitWidth: 2}]}
      - {type: patchFields, register: BCR2, fields: [{name: BMAP, description: "FMC bank mapping", bitOffset: 24, bitWidth: 2}]}
      - {type: patchFields, register: BCR3, fields: [{name: BMAP, description: "FMC bank mapping", bitOffset: 24, bitWidth: 2}]}
      - {type: patchFields, register: BCR4, fields: [{name: BMAP, description: "FMC bank mapping", bitOffset: 24, bitWidth: 2}]}
      # Add CLKDIV/DATLAT to BWTR1-4 (F3: synchronous write timing, bits [23:20] and [27:24])
      - {type: patchFields, register: BWTR1, fields: [{name: CLKDIV, description: "Clock divide ratio", bitOffset: 20, bitWidth: 4}, {name: DATLAT, description: "Data latency", bitOffset: 24, bitWidth: 4}]}
      - {type: patchFields, register: BWTR2, fields: [{name: CLKDIV, description: "Clock divide ratio", bitOffset: 20, bitWidth: 4}, {name: DATLAT, description: "Data latency", bitOffset: 24, bitWidth: 4}]}
      - {type: patchFields, register: BWTR3, fields: [{name: CLKDIV, description: "Clock divide ratio", bitOffset: 20, bitWidth: 4}, {name: DATLAT, description: "Data latency", bitOffset: 24, bitWidth: 4}]}
      - {type: patchFields, register: BWTR4, fields: [{name: CLKDIV, description: "Clock divide ratio", bitOffset: 20, bitWidth: 4}, {name: DATLAT, description: "Data latency", bitOffset: 24, bitWidth: 4}]}
      # Clone NAND bank 2 registers (F3/F4: 3-bank NAND)
      - {type: cloneRegister, source: PCR, name: PCR2, addressOffset: 96}
      - {type: cloneRegister, source: SR, name: SR2, addressOffset: 100}
      - {type: cloneRegister, source: PMEM, name: PMEM2, addressOffset: 104}
      - {type: cloneRegister, source: PATT, name: PATT2, addressOffset: 108}
      - {type: cloneRegister, source: ECCR, name: ECCR2, addressOffset: 116}
      # Clone NAND bank 4 registers (F3/F4: 3-bank NAND)
      - {type: cloneRegister, source: PCR, name: PCR4, addressOffset: 160}
      - {type: cloneRegister, source: SR, name: SR4, addressOffset: 164}
      - {type: cloneRegister, source: PMEM, name: PMEM4, addressOffset: 168}
      - {type: cloneRegister, source: PATT, name: PATT4, addressOffset: 172}
      # Add PIO4 register (F3/F4: bank 4 I/O space timing)
      - type: patchRegisters
        registers:
          - name: PIO4
            displayName: PIO4
            description: "I/O space timing register 4"
            addressOffset: 176
            size: 32
            access: read-write
            resetValue: 4244438268
            fields:
              - {name: IOSETx, description: "I/O setup time", bitOffset: 0, bitWidth: 8}
              - {name: IOWAITx, description: "I/O wait time", bitOffset: 8, bitWidth: 8}
              - {name: IOHOLDx, description: "I/O hold time", bitOffset: 16, bitWidth: 8}
              - {name: IOHIZx, description: "I/O Hi-Z time", bitOffset: 24, bitWidth: 8}
  GPDMA:
    # General-purpose DMA: H5, H7RS, N6, U3, U5
