  - name: EEFER1
    displayName: EEFER1
    description: Timer E external event filtering register 1
    addressOffset: 1356
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: EEALTCH
        description: External event A latch
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Event A is ignored if it happens during a blank, or passed through during a window.
            value: 0
          - name: B_0x1
            description: Event A is latched and delayed till the end of the blanking or windowing period.
            value: 1
      - name: EEAFLTR
        description: External event A filter
        bitOffset: 1
        bitWidth: 5
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: No filtering
            value: 0
          - name: B_0x1
            description: Blanking from counter reset/roll-over to compare 1
            value: 1
          - name: B_0x2
            description: Blanking from counter reset/roll-over to compare 2 in up-counting mode (UDM bit reset)
            value: 2
          - name: B_0x3
            description: Blanking from counter reset/roll-over to compare 3
            value: 3
          - name: B_0x4
            description: Blanking from counter reset/roll-over to compare 4 in up-counting mode (UDM bit reset)
            value: 4
          - name: B_0xD
            description: Windowing from counter reset/roll-over to compare 2 in up-counting mode (UDM bit reset)
            value: 13
          - name: B_0xE
            description: Windowing from counter reset/roll-over to compare 3 in up-counting mode (UDM bit reset)
            value: 14
          - name: B_0xF
            description: 'Windowing from another timing unit: TIMWIN source (see Table233 for details) in up-counting mode (UDM bit reset)'
            value: 15
          - name: B_0x10
            description: 'Blanking from compare 1 to counter reset/roll-over (UDM bit reset).In up-down counting mode (UDM bit set): blanking from compare 1 during down-counting to compare 2 during the following up-counting phase.'
            value: 16
          - name: B_0x11
            description: 'Blanking from compare 2 to counter reset/roll-over (UDM bit reset).In up-down counting mode (UDM bit set): blanking from CMP1 (down-counting) to CMP2 (down-counting).'
            value: 17
          - name: B_0x12
            description: 'Blanking from compare 1 to compare 2 (UDM bit reset). In up-down counting mode (UDM bit set): blanking from CMP1 (up-counting) to CMP2 (down-counting.'
            value: 18
          - name: B_0x13
            description: 'Blanking from compare 3 to compare 4 (UDM bit reset). In up-down counting mode (UDM bit set): blanking from CMP3 (up-counting) to CMP4 (down-counting).'
            value: 19
          - name: B_0x14
            description: Windowing from compare 1 to counter reset/roll-over. In up-down counting mode (UDM bit set), the reset/roll-over event is conditioned to the ROM[1:0] bit field setting
            value: 20
          - name: B_0x15
            description: Windowing from compare 2 to counter reset/roll-over. In up-down counting mode (UDM bit set), the reset/roll-over event is conditioned to the ROM[1:0] bit field setting
            value: 21
          - name: B_0x16
            description: 'Windowing from compare 1 to compare 2 (UDM bit reset). In up-down counting mode (UDM bit set): windowing from CMP1 (up-counting) to CMP2 (down-counting).'
            value: 22
          - name: B_0x17
            description: 'Windowing from compare 3 to compare 4 (UDM bit reset). In up-down counting mode (UDM bit set): windowing from compare 3 during down-counting to compare 4 during the following up-counting phase'
            value: 23
          - name: B_0x18
            description: TIMWIN2 source (see Table233 for details). In up-down counting mode (UDM bit set), the reset/roll-over event is conditioned to the ROM[1:0] bit field setting
            value: 24
          - name: B_0x19
            description: TIMWIN3 source (see Table233 for details)
            value: 25
          - name: B_0x1A
            description: Blanking from Period Event to Compare 1 In up-down counting mode (UDM bit set), the reset/roll-over event is conditioned to the ROM[1:0] bit field setting
            value: 26
          - name: B_0x1B
            description: Blanking from Period Event to Compare 2 In up-down counting mode (UDM bit set), the reset/roll-over event is conditioned to the ROM[1:0] bit field setting
            value: 27
