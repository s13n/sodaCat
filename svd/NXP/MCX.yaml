        from: MCXN947.ADC0
        instances: [ADC0, ADC1]
        interrupts:
          ADC0: ADC
          ADC1: ADC

      CMP:
        from: MCXN947.CMP0
        instances: [CMP0, CMP1, CMP2]
        interrupts:
          HSCMP0: HSCMP
          HSCMP1: HSCMP
          HSCMP2: HSCMP

      DAC:
        from: MCXN947.DAC0
        instances: [DAC0, DAC1, DAC2]
        interrupts:
          DAC0: DAC
          DAC1: DAC
          DAC2: DAC

      OPAMP:
        from: MCXN947.OPAMP0
        instances: [OPAMP0, OPAMP1, OPAMP2]

      SINC:
        from: MCXN947.SINC0
        instances: [SINC0]
        interrupts:
          SINC_FILTER: FILTER

      TSI:
        from: MCXN947.TSI0
        instances: [TSI0]
        interrupts:
          TSI_END_OF_SCAN: END_OF_SCAN
          TSI_OUT_OF_SCAN: OUT_OF_SCAN

      VREF:
        from: MCXN947.VREF0
        instances: [VREF0]

      # ====================================================================
      # Communication
      # ====================================================================
      CAN:
        from: MCXN947.CAN0
        instances: [CAN0, CAN1]
        interrupts:
          CAN0: CAN
          CAN1: CAN

      EMVSIM:
        from: MCXN947.EMVSIM0
        instances: [EMVSIM0, EMVSIM1]
        interrupts:
          EMVSIM0: EMVSIM
          EMVSIM1: EMVSIM

      ENET:
        from: MCXN947.ENET0
        instances: [ENET0]
        interrupts:
          ETHERNET: INTR
          ETHERNET_PMT: PMT
          ETHERNET_MACLP: MACLP

      FLEXIO:
        from: MCXN947.FLEXIO0
        instances: [FLEXIO0]
        interrupts:
          FLEXIO: FLEXIO

      I3C:
        from: MCXN947.I3C0
        instances: [I3C0, I3C1]
        interrupts:
          I3C0: I3C
          I3C1: I3C

      LPI2C:
        from: MCXN947.LPI2C0
        instances: [LPI2C0, LPI2C1, LPI2C2, LPI2C3, LPI2C4,
                    LPI2C5, LPI2C6, LPI2C7, LPI2C8, LPI2C9]
        interrupts:
          LP_FLEXCOMM0: LP_FLEXCOMM
          LP_FLEXCOMM1: LP_FLEXCOMM
          LP_FLEXCOMM2: LP_FLEXCOMM
          LP_FLEXCOMM3: LP_FLEXCOMM
          LP_FLEXCOMM4: LP_FLEXCOMM
          LP_FLEXCOMM5: LP_FLEXCOMM
          LP_FLEXCOMM6: LP_FLEXCOMM
          LP_FLEXCOMM7: LP_FLEXCOMM
          LP_FLEXCOMM8: LP_FLEXCOMM
          LP_FLEXCOMM9: LP_FLEXCOMM

