          F301:
            from: STM32F301.SYSCFG_COMP_OPAMP
          F302:
            from: STM32F302.SYSCFG_COMP_OPAMP
          F303:
            from: STM32F303.SYSCFG_COMP_OPAMP
          F37x:
            from: STM32F373.SYSCFG_COMP_OPAMP
          F334:
            from: STM32F3x4.SYSCFG_COMP_OPAMP
      TSC:
        uses: TSC
        instances: [TSC]
        outputs:
          INTR:
            pattern: '^EXTI2_TSC$'
      USART:
        uses: USART
        instances: [UART4, UART5, USART1, USART2, USART3]
        outputs:
          # F3 SVDs report each USART/UART line under multiple raw names: the
          # plain instance and EXTI-aliased / _IRQ-suffixed duplicates of the
          # same vector.  Map them all to the single canonical so dedup at
          # connections-build time leaves one INTR entry per instance.
          INTR:
            pattern: '^(USART1|USART1_EXTI25|USART1_IRQ|USART2|USART2_EXTI26|USART2_IRQ|USART3|USART3_EXTI28|USART3_IRQ|UART4|UART4_EXTI34|UART5|UART5_EXTI35|USART6|UART7|UART8|USART7|USART5|USART4|UART9|USART10)$'
      USB:
        uses: USB_DEV
        instances: [USB, USB_FS]
      WWDG:
        uses: WWDG
        instances: [WWDG]
      bxCAN:
        uses: bxCAN
        instances: [CAN]
        description: Controller area network (Bosch C_CAN)
