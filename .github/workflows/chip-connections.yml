name: Chip connection validation

on:
  push:
    paths:
      - "models/**"
      - "tools/validate_chip_connections.py"
  pull_request:
    paths:
      - "models/**"
      - "tools/validate_chip_connections.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate chip connections against block models
        run: |
          python tools/validate_chip_connections.py \
            --models-root models \
            --docs "models/**/*.yaml"
