  - name: WSEQ[%s]
    addressOffset: 12288
    description: 'Control Write Sequencer RAM: 128 sequence steps (R12288..R12799, 3000h..31FFh). Each step is defined by four registers. These registers are not affected by a software reset.'
    dim: 128
    dimIncrement: 4
    registers:
      - name: WSEQ_CTRL_A
        addressOffset: 0
        description: 'Write Sequencer step control A: target register address.'
        fields:
          - name: WSEQ_ADDR
            bitOffset: 0
            bitWidth: 14
            description: Control register address to be written in this sequence step.
      - name: WSEQ_CTRL_B
        addressOffset: 1
        description: 'Write Sequencer step control B: write data.'
        fields:
          - name: WSEQ_DATA
            bitOffset: 0
            bitWidth: 8
            description: Data to be written to the control register in this sequence step.
      - name: WSEQ_CTRL_C
        addressOffset: 2
        description: 'Write Sequencer step control C: data width and start position.'
        fields:
          - name: WSEQ_DATA_WIDTH
            bitOffset: 8
            bitWidth: 3
            description: Number of bits (minus one) to be written in this sequence step.
          - name: WSEQ_DATA_START
            bitOffset: 0
            bitWidth: 4
            description: Bit position of the LSB of the data field within the target register.
      - name: WSEQ_CTRL_D
        addressOffset: 3
        description: 'Write Sequencer step control D: end-of-sequence and delay.'
        fields:
          - name: WSEQ_EOS
            bitOffset: 8
            bitWidth: 1
            description: End of Sequence flag. Set on the last step of a sequence.
          - name: WSEQ_DELAY
            bitOffset: 0
            bitWidth: 4
            description: Time delay inserted after executing this sequence step.
params:
  - name: addr
    type: int
    max: 1
    description: 'Control interface address select (CS/ADDR pin): I2C device address 0x1A (0) or 0x1B (1)'
  - name: cifmode
    type: int
    max: 1
    description: 'Control interface mode (CIFMODE pin): 0 = 2-wire (I2C), 1 = 3/4-wire (SPI)'
