        params:
          - {name: synchronous, type: int, default: 2, max: 2, description: 'Synchronous/smartcard capability: 0=none, 2=sync+smartcard'}
      WWDG:
        uses: WWDG
        instances: [WWDG]
      bxCAN:
        uses: bxCAN
        instances: [CAN1, CAN2, CAN3]
        description: Controller area network (Bosch C_CAN)
