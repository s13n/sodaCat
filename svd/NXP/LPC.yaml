            - name: M4_USART2
              input: base_m4_clk
              output: clk_m4_usart2
              control:
                instance: CCU1
                reg: CLK[5][1].CFG
                field: RUN
              description: "USART2 register interface branch of BASE_M4_CLK"
            - name: M4_USART3
              input: base_m4_clk
              output: clk_m4_usart3
              control:
                instance: CCU1
                reg: CLK[5][2].CFG
                field: RUN
              description: "USART3 register interface branch of BASE_M4_CLK"
            - name: M4_TIMER2
              input: base_m4_clk
              output: clk_m4_timer2
              control:
                instance: CCU1
                reg: CLK[5][3].CFG
                field: RUN
              description: "Timer 2 branch of BASE_M4_CLK"
            - name: M4_TIMER3
              input: base_m4_clk
              output: clk_m4_timer3
              control:
                instance: CCU1
                reg: CLK[5][4].CFG
                field: RUN
              description: "Timer 3 branch of BASE_M4_CLK"
            - name: M4_SSP1
              input: base_m4_clk
              output: clk_m4_ssp1
              control:
                instance: CCU1
                reg: CLK[5][5].CFG
                field: RUN
              description: "SSP1 register interface branch of BASE_M4_CLK"
            - name: M4_QEI
              input: base_m4_clk
              output: clk_m4_qei
              control:
                instance: CCU1
                reg: CLK[5][6].CFG
                field: RUN
              description: "QEI branch of BASE_M4_CLK"
            - name: PERIPH_BUS
              input: base_periph_clk
              output: clk_periph_bus
              control:
                instance: CCU1
                reg: CLK[6][0].CFG
                field: RUN
              description: "M0SUB AHB matrix and peripheral bus branch of BASE_PERIPH_CLK"
            - name: PERIPH_CORE
              input: base_periph_clk
              output: clk_periph_core
              control:
                instance: CCU1
                reg: CLK[6][2].CFG
                field: RUN
              description: "Cortex-M0 subsystem core branch of BASE_PERIPH_CLK"
            - name: PERIPH_SGPIO
              input: base_periph_clk
              output: clk_periph_sgpio
              control:
                instance: CCU1
                reg: CLK[6][3].CFG
                field: RUN
              description: "SGPIO interface branch of BASE_PERIPH_CLK"
            - name: USB0
              input: base_usb0_clk
              output: clk_usb0
              control:
                instance: CCU1
                reg: CLK[7][0].CFG
                field: RUN
              description: "USB0 peripheral branch of BASE_USB0_CLK"
            - name: USB1
              input: base_usb1_clk
              output: clk_usb1
              control:
                instance: CCU1
                reg: CLK[8][0].CFG
                field: RUN
              description: "USB1 peripheral branch of BASE_USB1_CLK"
            - name: SPI
              input: base_spi_clk
              output: clk_spi
              control:
                instance: CCU1
                reg: CLK[9][0].CFG
                field: RUN
              description: "SPI interface branch of BASE_SPI_CLK"
            - name: ADCHS
              input: base_adchs_clk
              output: clk_adchs
              control:
                instance: CCU1
                reg: CLK[10][0].CFG
                field: RUN
              description: "ADCHS branch of BASE_ADCHS_CLK"
            # CLK_M4_EMCDIV: gated AND divided.  Modeled as a gate feeding an
            # intermediate signal which is then divided in the dividers section.
            - name: M4_EMCDIV_GATE
              input: base_m4_clk
              output: clk_m4_emcdiv_gated
              control:
                instance: CCU1
                reg: CLK[3][15].CFG
                field: RUN
              description: "EMC divided clock branch -- gate stage. RUN bit in CLK_M4_EMCDIV_CFG."
            # ----- CCU2 branches (instance: CCU2) -----
            - name: AUDIO
              input: base_audio_clk
              output: clk_audio
              control:
                instance: CCU2
                reg: CLK[0][0].CFG
                field: RUN
              description: "I2S audio system branch of BASE_AUDIO_CLK"
            - name: APB2_USART3
              input: base_uart3_clk
              output: clk_apb2_usart3
              control:
                instance: CCU2
                reg: CLK[1][0].CFG
                field: RUN
              description: "USART3 peripheral branch of BASE_UART3_CLK"
            - name: APB2_USART2
              input: base_uart2_clk
              output: clk_apb2_usart2
              control:
                instance: CCU2
                reg: CLK[2][0].CFG
                field: RUN
              description: "USART2 peripheral branch of BASE_UART2_CLK"
            - name: APB0_UART1
              input: base_uart1_clk
              output: clk_apb0_uart1
              control:
                instance: CCU2
                reg: CLK[3][0].CFG
                field: RUN
              description: "UART1 peripheral branch of BASE_UART1_CLK"
            - name: APB0_USART0
              input: base_uart0_clk
              output: clk_apb0_usart0
              control:
                instance: CCU2
                reg: CLK[4][0].CFG
                field: RUN
              description: "USART0 peripheral branch of BASE_UART0_CLK"
            - name: APB2_SSP1
              input: base_ssp1_clk
              output: clk_apb2_ssp1
              control:
                instance: CCU2
                reg: CLK[5][0].CFG
                field: RUN
              description: "SSP1 peripheral branch of BASE_SSP1_CLK"
            - name: APB0_SSP0
              input: base_ssp0_clk
              output: clk_apb0_ssp0
              control:
                instance: CCU2
                reg: CLK[6][0].CFG
                field: RUN
              description: "SSP0 peripheral branch of BASE_SSP0_CLK"
            - name: SDIO
              input: base_sdio_clk
              output: clk_sdio
              control:
                instance: CCU2
                reg: CLK[7][0].CFG
                field: RUN
              description: "SD/MMC peripheral branch of BASE_SDIO_CLK"
    blocks:
      ADC:
        from: LPC43xx_43Sxx.ADC0
        instances: [ADC0, ADC1]
        outputs:
          ADC0: ADC
          ADC1: ADC
      ADCHS:
        from: LPC43xx_43Sxx.ADCHS
        instances: [ADCHS]
        outputs:
          ADCHS: INTR
        # The SVD describes the two descriptor tables as separate 1D
        # arrays DESCRIPTOR0_[%s] and DESCRIPTOR1_[%s] (each dim=8) at
        # back-to-back addresses 0x300 / 0x320.  Field layout, widths,
        # and increments are identical, so fuse them into one 2D array
        # DESCRIPTOR[2][8] for a more honest representation.
        transforms:
          - {type: create2DArray, pattern: '^DESCRIPTOR(\d+)_\[%s\]$', name: DESCRIPTOR, description: 'Table m descriptor n, m=0..1, n=0..7'}
      ATIMER:
        from: LPC43xx_43Sxx.ATIMER
        instances: [ATIMER]
        outputs:
          ATIMER: INTR
      C_CAN:
        from: LPC43xx_43Sxx.C_CAN1
        instances: [C_CAN0, C_CAN1]
        outputs:
          C_CAN0: INTR
          C_CAN1: INTR
      CCU:
        from: LPC43xx_43Sxx.CCU1
        instances: [CCU1, CCU2]
        # Unified Clock Control Unit covering both CCU1 and CCU2.
        # The 4 KB SCU address space holds up to 16 0x100-byte regions:
        # the first contains PM (offset 0) and BASE_STAT (offset 4); the
        # remaining 15 are clock branches indexed 0..14, each holding up
        # to 32 CFG/STAT pairs at stride 8.  CCU1 populates 11 branches
        # (APB3, APB1, SPIFI, M4 part1/2/3, PERIPH, USB0, USB1, SPI,
        # ADCHS); CCU2 populates 8 (AUDIO, USART3, USART2, UART1, USART0,
        # SSP1, SSP0, SDIO).  Sharing one block sacrifices per-pair RM
        # names and per-instance BASE_STAT field semantics (the field
        # names follow CCU1; bit positions are consistent with CCU2 but
        # the names are not) in exchange for one model and one driver
        # for both peripherals.  outerDim=15 covers the full 4 KB region
        # so neither instance overflows the cluster.
        transforms:
          - type: createCluster2DArray
            pattern: '^CLK_[A-Z0-9_]+_(CFG|STAT)$'
            name: CLK
            addressOffset: 0x100
            outerStride: 0x100
            outerDim: 15
            innerDim: 32
            innerStride: 8
            description: Clock branch slot CFG/STAT pair
            # Outer-axis enum.  CCU1 populates branches 0..10; CCU2
            # populates 0..7.  Branch names follow the CCU1 reference-
            # manual numbering since extraction is from CCU1; CCU2 users
            # consult the LPC43xx UM10503 §14.5 table to map branch
            # indices to their CCU2 names (AUDIO, USART3, ..., SDIO).
            # Inner axis (slot) carries no enum because slot meanings
            # vary per branch.
            enumeratedIndices:
              - name: Branch
                description: 'Clock-control branch identifier. CCU1 populates branches 0..10; CCU2 populates 0..7 with different per-branch semantics (consult RM).'
                values:
                  - {name: APB3, value: 0, description: 'APB peripheral block 3 (CCU1)'}
                  - {name: APB1, value: 1, description: 'APB peripheral block 1 (CCU1)'}
                  - {name: SPIFI, value: 2, description: 'SPIFI clock (CCU1)'}
                  - {name: M4_PART1, value: 3, description: 'M4 clock set, region 1 (CCU1)'}
                  - {name: M4_PART2, value: 4, description: 'M4 clock set, region 2 (CCU1)'}
                  - {name: M4_PART3, value: 5, description: 'M4 clock set, region 3 (CCU1)'}
                  - {name: PERIPH, value: 6, description: 'Cortex-M0 subsystem peripherals (CCU1)'}
                  - {name: USB0, value: 7, description: 'USB0 peripheral (CCU1)'}
                  - {name: USB1, value: 8, description: 'USB1 peripheral (CCU1)'}
                  - {name: SPI, value: 9, description: 'SPI peripheral (CCU1)'}
                  - {name: ADCHS, value: 10, description: 'ADCHS peripheral (CCU1)'}
          # Replace BASE_STAT's CCU1-specific field names with generic
          # per-branch indicators that match the CLK[i][j] indexing.
          # Each bit n reports whether at least one slot in CLK[n] is
          # currently enabled.  CCU1 caveat: bit 3 covers branches 3, 4
          # and 5 jointly (the M4 clock set spans three 0x100 regions
          # but shares a single indicator bit); the generic model can't
          # express that mapping, so users targeting CCU1's M4 must
          # treat CLK_3_IND as covering all three branches.
          - type: patchRegisters
            registers:
              - name: BASE_STAT
                description: 'Per-branch active indicator. Bit n reports whether at least one slot in CLK[n] is currently enabled. CCU1 caveat: bit 3 covers branches 3, 4 and 5 jointly (the M4 clock set spans three branches sharing one indicator).'
                fields:
                  - {name: CLK_0_IND, bitOffset: 0, bitWidth: 1, description: 'Active indicator for CLK[0]'}
                  - {name: CLK_1_IND, bitOffset: 1, bitWidth: 1, description: 'Active indicator for CLK[1]'}
                  - {name: CLK_2_IND, bitOffset: 2, bitWidth: 1, description: 'Active indicator for CLK[2]'}
                  - {name: CLK_3_IND, bitOffset: 3, bitWidth: 1, description: 'Active indicator for CLK[3] (CCU1: also covers CLK[4] and CLK[5])'}
                  - {name: CLK_4_IND, bitOffset: 4, bitWidth: 1, description: 'Active indicator for CLK[4]'}
                  - {name: CLK_5_IND, bitOffset: 5, bitWidth: 1, description: 'Active indicator for CLK[5]'}
                  - {name: CLK_6_IND, bitOffset: 6, bitWidth: 1, description: 'Active indicator for CLK[6]'}
                  - {name: CLK_7_IND, bitOffset: 7, bitWidth: 1, description: 'Active indicator for CLK[7]'}
                  - {name: CLK_8_IND, bitOffset: 8, bitWidth: 1, description: 'Active indicator for CLK[8]'}
                  - {name: CLK_9_IND, bitOffset: 9, bitWidth: 1, description: 'Active indicator for CLK[9]'}
                  - {name: CLK_10_IND, bitOffset: 10, bitWidth: 1, description: 'Active indicator for CLK[10]'}
                  - {name: CLK_11_IND, bitOffset: 11, bitWidth: 1, description: 'Active indicator for CLK[11]'}
                  - {name: CLK_12_IND, bitOffset: 12, bitWidth: 1, description: 'Active indicator for CLK[12]'}
                  - {name: CLK_13_IND, bitOffset: 13, bitWidth: 1, description: 'Active indicator for CLK[13]'}
                  - {name: CLK_14_IND, bitOffset: 14, bitWidth: 1, description: 'Active indicator for CLK[14]'}
      CGU:
        from: LPC43xx_43Sxx.CGU
        instances: [CGU]
        # SVD omits BASE_ADCHS_CLK (LPC4370/LPC43S70 only) at offset 0x8C,
        # between BASE_LCD_CLK and BASE_SDIO_CLK.  UM10503 Table 144 (Output
        # stage 12).  Field layout and clock-source list are identical to
        # BASE_LCD_CLK.
        #
        # The 24 BASE_*_CLK registers (offsets 0x5C..0xC8, stride 4)
        # share an identical field layout (PD/AUTOBLOCK/CLK_SEL).  Fold
        # them into a single 28-slot register array indexed by a
        # BaseClock enum that names each populated slot per UM10503
        # Table 144.  Slots 21..24 (offsets 0xB0..0xBC) are reserved
        # and therefore unenumerated.
        transforms:
          - {type: cloneRegister, source: BASE_LCD_CLK, name: BASE_ADCHS_CLK, addressOffset: 140, description: "Output stage 12 control register for base clock BASE_ADCHS_CLK (LPC4370/LPC43S70 only)"}
          - type: createIndexedRegisterArray
            pattern: '^BASE_[A-Z0-9_]+_CLK$'
            name: BASE_CLK
            addressOffset: 0x5C
            stride: 4
            dim: 28
            description: 'Base clock control register (one per output stage; per UM10503 Table 144).'
            enumeratedIndices:
              name: BaseClock
              description: 'LPC43 base-clock identifier (UM10503 Table 144 output stage). Slots 21..24 are reserved and therefore unenumerated.'
              values:
                - {name: SAFE, value: 0, description: 'Safe clock (IRC, output stage 0)'}
                - {name: USB0, value: 1, description: 'USB0 clock (output stage 1)'}
                - {name: PERIPH, value: 2, description: 'M0SUB peripheral clock (output stage 2)'}
                - {name: USB1, value: 3, description: 'USB1 clock (output stage 3)'}
                - {name: M4, value: 4, description: 'Main M4 clock (output stage 4)'}
                - {name: SPIFI, value: 5, description: 'SPIFI clock (output stage 5)'}
                - {name: SPI, value: 6, description: 'SPI clock (output stage 6)'}
                - {name: PHY_RX, value: 7, description: 'Ethernet PHY RX clock (output stage 7)'}
                - {name: PHY_TX, value: 8, description: 'Ethernet PHY TX clock (output stage 8)'}
                - {name: APB1, value: 9, description: 'APB1 peripheral clock (output stage 9)'}
                - {name: APB3, value: 10, description: 'APB3 peripheral clock (output stage 10)'}
                - {name: LCD, value: 11, description: 'LCD clock (output stage 11)'}
                - {name: ADCHS, value: 12, description: 'High-speed ADC clock (output stage 12, LPC4370/43S70 only)'}
                - {name: SDIO, value: 13, description: 'SDIO clock (output stage 13)'}
                - {name: SSP0, value: 14, description: 'SSP0 clock (output stage 14)'}
                - {name: SSP1, value: 15, description: 'SSP1 clock (output stage 15)'}
                - {name: UART0, value: 16, description: 'USART0 clock (output stage 16)'}
                - {name: UART1, value: 17, description: 'UART1 clock (output stage 17)'}
                - {name: UART2, value: 18, description: 'USART2 clock (output stage 18)'}
                - {name: UART3, value: 19, description: 'USART3 clock (output stage 19)'}
                - {name: OUT, value: 20, description: 'CLKOUT pin clock (output stage 20)'}
                - {name: AUDIO, value: 25, description: 'Audio clock (output stage 25)'}
                - {name: CGU_OUT0, value: 26, description: 'CGU_OUT0 pin clock (output stage 26)'}
                - {name: CGU_OUT1, value: 27, description: 'CGU_OUT1 pin clock (output stage 27)'}
      CREG:
        from: LPC43xx_43Sxx.CREG
        instances: [CREG]
      DAC:
        from: LPC43xx_43Sxx.DAC
        instances: [DAC]
        outputs:
          DAC: INTR
      EEPROM:
        from: LPC43xx_43Sxx.EEPROM
        instances: [EEPROM]
        outputs:
          FLASH: FLASH
      EMC:
        from: LPC43xx_43Sxx.EMC
        instances: [EMC]
      ETHERNET:
        from: LPC43xx_43Sxx.ETHERNET
        instances: [ETHERNET]
        outputs:
          ETHERNET: INTR
      EVENTROUTER:
        from: LPC43xx_43Sxx.EVENTROUTER
        instances: [EVENTROUTER]
        outputs:
          EVENTROUTER: INTR
      GIMA:
        from: LPC43xx_43Sxx.GIMA
        instances: [GIMA]
        # GIMA is a 30-register input-multiplexer table at offsets
        # 0x00..0x74, every entry sharing the same 5-field shape
        # (INV/EDGE/SYNCH/PULSE/FUNC).  Fold the lot into one array
        # IN[%s] indexed by an Input enum that names every signal per
        # UM10503 §17.4: 16 capture-timer inputs (CAPx_y), 8 SCT inputs
        # (CTIN_n), the high-speed-ADC trigger, three event-router
        # inputs, and two ADC-start signals.
        transforms:
          - type: createIndexedRegisterArray
            pattern: '^(?:CAP\d+_\d+|CTIN_\d+|ADCHS_TRIGGER|EVENTROUTER_\d+|ADCSTART\d+)_IN$'
            name: IN
            addressOffset: 0
            stride: 4
            dim: 30
            description: 'Input multiplexer entry — selects which signal is routed to the indexed destination (capture timer input, SCT input, ADC trigger, ...). Per UM10503 §17.4.'
            enumeratedIndices:
              name: Input
              description: 'GIMA destination identifier (UM10503 §17.4 input-multiplexer table).'
              values:
                - {name: CAP0_0, value: 0, description: 'Capture timer 0, capture channel 0'}
                - {name: CAP0_1, value: 1, description: 'Capture timer 0, capture channel 1'}
                - {name: CAP0_2, value: 2, description: 'Capture timer 0, capture channel 2'}
                - {name: CAP0_3, value: 3, description: 'Capture timer 0, capture channel 3'}
                - {name: CAP1_0, value: 4, description: 'Capture timer 1, capture channel 0'}
                - {name: CAP1_1, value: 5, description: 'Capture timer 1, capture channel 1'}
                - {name: CAP1_2, value: 6, description: 'Capture timer 1, capture channel 2'}
                - {name: CAP1_3, value: 7, description: 'Capture timer 1, capture channel 3'}
                - {name: CAP2_0, value: 8, description: 'Capture timer 2, capture channel 0'}
                - {name: CAP2_1, value: 9, description: 'Capture timer 2, capture channel 1'}
                - {name: CAP2_2, value: 10, description: 'Capture timer 2, capture channel 2'}
                - {name: CAP2_3, value: 11, description: 'Capture timer 2, capture channel 3'}
                - {name: CAP3_0, value: 12, description: 'Capture timer 3, capture channel 0'}
                - {name: CAP3_1, value: 13, description: 'Capture timer 3, capture channel 1'}
                - {name: CAP3_2, value: 14, description: 'Capture timer 3, capture channel 2'}
                - {name: CAP3_3, value: 15, description: 'Capture timer 3, capture channel 3'}
                - {name: CTIN_0, value: 16, description: 'SCT input 0'}
                - {name: CTIN_1, value: 17, description: 'SCT input 1'}
                - {name: CTIN_2, value: 18, description: 'SCT input 2'}
                - {name: CTIN_3, value: 19, description: 'SCT input 3'}
                - {name: CTIN_4, value: 20, description: 'SCT input 4'}
                - {name: CTIN_5, value: 21, description: 'SCT input 5'}
                - {name: CTIN_6, value: 22, description: 'SCT input 6'}
                - {name: CTIN_7, value: 23, description: 'SCT input 7'}
                - {name: ADCHS_TRIGGER, value: 24, description: 'High-speed ADC trigger'}
                - {name: EVENTROUTER_13, value: 25, description: 'Event router input 13'}
                - {name: EVENTROUTER_14, value: 26, description: 'Event router input 14'}
                - {name: EVENTROUTER_16, value: 27, description: 'Event router input 16'}
                - {name: ADCSTART0, value: 28, description: 'ADC0 start signal'}
                - {name: ADCSTART1, value: 29, description: 'ADC1 start signal'}
      GPIO_GROUP_INT:
        from: LPC43xx_43Sxx.GPIO_GROUP_INT0
        instances: [GPIO_GROUP_INT0, GPIO_GROUP_INT1]
        outputs:
          GINT0: GINT
          GINT1: GINT
      GPIO_PIN_INT:
        from: LPC43xx_43Sxx.GPIO_PIN_INT
        instances: [GPIO_PIN_INT]
        outputs:
          PIN_INT0: INT0
          PIN_INT1: INT1
          PIN_INT2: INT2
          PIN_INT3: INT3
          PIN_INT4: INT4
          PIN_INT5: INT5
          PIN_INT6: INT6
          PIN_INT7: INT7
      GPIO_PORT:
        from: LPC43xx_43Sxx.GPIO_PORT
        instances: [GPIO_PORT]
        # The byte (B) and word (W) pin registers are flat 256-entry
        # arrays in the SVD but addressed as B[port][pin] / W[port][pin]
        # in the RM (8 ports × 32 pins).  Reshape to 2D so consumers
        # subscript by (port, pin) instead of computing port*32 + pin.
        transforms:
          - type: patchRegisters
            registers:
              - {name: 'B[%s]', newName: 'B[%s][%s]', dim: [8, 32], dimIncrement: [32, 1], dimIndex: null}
              - {name: 'W[%s]', newName: 'W[%s][%s]', dim: [8, 32], dimIncrement: [128, 4], dimIndex: null}
      GPDMA:
        uses: PL08x
        instances: [GPDMA]
        outputs:
          # PL080 has three interrupt outputs (DMACINTERR, DMACINTTC, and the
          # combined DMACINTR).  LPC43 wires only the combined output to NVIC.
          DMA: COMBINED
      I2C:
        from: LPC43xx_43Sxx.I2C0
        instances: [I2C0, I2C1]
        outputs:
          I2C0: I2C
          I2C1: I2C
      I2S:
        from: LPC43xx_43Sxx.I2S0
        instances: [I2S0, I2S1]
        outputs:
          I2S0: I2S
          I2S1: I2S
      LCD:
        uses: LCD
        instances: [LCD]
        outputs:
          LCD: INTR
      MCPWM:
        from: LPC43xx_43Sxx.MCPWM
        instances: [MCPWM]
        outputs:
          MCPWM: INTR
      PMC:
        from: LPC43xx_43Sxx.PMC
        instances: [PMC]
      QEI:
        from: LPC43xx_43Sxx.QEI
        instances: [QEI]
        outputs:
          QEI: INTR
      REGFILE:
        from: LPC43xx_43Sxx.REGFILE
        instances: [REGFILE]
      RGU:
        from: LPC43xx_43Sxx.RGU
        instances: [RGU]
      RITIMER:
        from: LPC43xx_43Sxx.RITIMER
        instances: [RITIMER]
        outputs:
          RITIMER: INTR
      RTC:
        from: LPC43xx_43Sxx.RTC
        instances: [RTC]
        outputs:
          RTC: INTR
      SCT:
        uses: SCT
        instances: [SCT]
        outputs:
          SCT: INTR
      SCU:
        from: LPC43xx_43Sxx.SCU
        instances: [SCU]
        # The LPC43 SVD splits each SFSPx port into multiple register
        # definitions to encode per-pin field variation (high-drive pins
        # have EHD at [8:9] instead of EHS at [5]; high-speed pins have
        # their own field set).  The variants don't conflict at the bit
        # level, so we fuse each port back into one array — the
        # superset's EHS and EHD live at distinct bit positions and
        # programmers ignore the irrelevant one for any given pin.
        transforms:
          - {type: mergeArrays, pattern: '^SFSP1(_\[%s\]|_%s|_\d+)$', name: 'SFSP1_[%s]', description: 'Pin configuration register for pins P1'}
          - {type: mergeArrays, pattern: '^SFSP2(_\[%s\]|_%s|_\d+)$', name: 'SFSP2_[%s]', description: 'Pin configuration register for pins P2'}
          - {type: mergeArrays, pattern: '^SFSP3(_\[%s\]|_%s|_\d+)$', name: 'SFSP3_[%s]', description: 'Pin configuration register for pins P3'}
          - {type: mergeArrays, pattern: '^SFSP8(_\[%s\]|_%s|_\d+)$', name: 'SFSP8_[%s]', description: 'Pin configuration register for pins P8'}
          - {type: mergeArrays, pattern: '^SFSPA(_\[%s\]|_%s|_\d+)$', name: 'SFSPA_[%s]', description: 'Pin configuration register for pins PA'}
          # Fold the 16 per-port arrays into a single 2D array
          # SFSP[16][32].  Outer index 0..F (parsed as hex) covers ports
          # P0..PF.  Inner dim is 32 = port stride / colStride; ports
          # with fewer real pins leave phantom inner indices for the
          # reserved tail.  Field union across ports adds EHD (bits 8:9)
          # to ports that don't have it and ZIF (bit 7) to port 9 — both
          # are consistent with the per-port superset already taken
          # above.
          - {type: create2DArray, pattern: '^SFSP([0-9A-F])_\[%s\]$', name: SFSP, description: 'Pin configuration register for port m, pin n'}
      SDMMC:
        from: LPC43xx_43Sxx.SDMMC
        instances: [SDMMC]
        outputs:
          SDIO: INTR
      SGPIO:
        from: LPC43xx_43Sxx.SGPIO
        instances: [SGPIO]
        outputs:
          SGPIO_IINT: INTR
      SPI:
        from: LPC43xx_43Sxx.SPI
        instances: [SPI]
        outputs:
          SPI_INT: INTR
      SPIFI:
        uses: SPIFI
        instances: [SPIFI]
        outputs:
          SPIFI: INTR
      SSP:
        from: LPC43xx_43Sxx.SSP0
        instances: [SSP0, SSP1]
        outputs:
          SSP0: SSP
          SSP1: SSP
      TIMER:
        from: LPC43xx_43Sxx.TIMER0
        instances: [TIMER0, TIMER1, TIMER2, TIMER3]
        outputs:
          TIMER0: TIMER
          TIMER1: TIMER
          TIMER2: TIMER
          TIMER3: TIMER
      USART:
        # Unified UART/USART block.  UART1 has modem control (MCR/MSR) but
        # lacks the IrDA/smart-card/sync/oversampling/half-duplex extras the
        # other three instances have; the model declares the union and
        # per-instance params advertise which features are present.  Source
        # is USART0 (the larger feature set); UART1-only registers and
        # fields are added by transforms below.
        from: LPC43xx_43Sxx.USART0
        instances: [UART1, USART0, USART2, USART3]
        description: Universal (a)synchronous receiver/transmitter (UART/USART)
        outputs:
          UART1: INTR
          USART0: INTR
          USART2: INTR
          USART3: INTR
        params:
          - {name: has_modem, type: bool, default: false, description: 'Modem control: MCR/MSR registers and CTSIE/MSIE bits in IER, SEL bit in RS485CTRL (UART1 only)'}
          - {name: has_irda, type: bool, default: true, description: 'IrDA encoder/decoder (ICR register)'}
          - {name: has_smartcard, type: bool, default: true, description: 'ISO7816-3 smart card mode (SCICTRL register)'}
          - {name: has_synchronous, type: bool, default: true, description: 'Synchronous mode (SYNCCTRL register)'}
          - {name: has_oversampling, type: bool, default: true, description: 'Configurable oversampling (OSR register)'}
          - {name: has_halfduplex, type: bool, default: true, description: 'Half-duplex direction control (HDEN register)'}
        transforms:
          # Align IER auto-baud bit names with UART1's shorter form (bits identical).
          - {type: renameFields, register: IER, pattern: ABEOINTEN, replacement: ABEOIE}
          - {type: renameFields, register: IER, pattern: ABTOINTEN, replacement: ABTOIE}
          # UART1-only IER bits: declared here so UART1 instances can reach them.
          - type: patchFields
            register: IER
            fields:
              - {name: MSIE, description: 'Modem Status Interrupt Enable (UART1 only); status in MSR[3:0].', bitOffset: 3, bitWidth: 1}
              - {name: CTSIE, description: 'CTS Interrupt Enable (UART1 only). With auto-CTS, gates modem-status interrupt on CTS transitions.', bitOffset: 7, bitWidth: 1}
          # UART1-only RS485CTRL bit: selects RTS vs DTR for direction control.
          - type: patchFields
            register: RS485CTRL
            fields:
              - {name: SEL, description: 'Direction-control pin select (UART1 only): 0=RTS, 1=DTR', bitOffset: 3, bitWidth: 1}
          # UART1-only modem-control / modem-status registers.
          - type: patchRegisters
            registers:
              - name: MCR
                displayName: MCR
                description: 'Modem Control Register (UART1 only). Flow-control handshaking and loopback mode.'
                addressOffset: 16
                size: 32
                access: read-write
                resetValue: 0
                resetMask: 4294967295
                fields:
                  - {name: DTRCTRL, description: 'DTR Control. Source for modem output DTR; reads as 0 in loopback mode.', bitOffset: 0, bitWidth: 1}
                  - {name: RTSCTRL, description: 'RTS Control. Source for modem output RTS; reads as 0 in loopback mode.', bitOffset: 1, bitWidth: 1}
                  - {name: LMS, description: 'Loopback Mode Select.', bitOffset: 4, bitWidth: 1}
                  - {name: RTSEN, description: 'Auto-RTS flow control enable.', bitOffset: 6, bitWidth: 1}
                  - {name: CTSEN, description: 'Auto-CTS flow control enable.', bitOffset: 7, bitWidth: 1}
              - name: MSR
                displayName: MSR
                description: 'Modem Status Register (UART1 only). Handshake-signal status flags.'
                addressOffset: 24
                size: 32
                access: read-only
                resetValue: 0
                resetMask: 4294967295
                fields:
                  - {name: DCTS, description: 'Delta CTS. Set on CTS state change; cleared on read.', bitOffset: 0, bitWidth: 1}
                  - {name: DDSR, description: 'Delta DSR. Set on DSR state change; cleared on read.', bitOffset: 1, bitWidth: 1}
                  - {name: TERI, description: 'Trailing Edge RI. Set on RI low-to-high transition; cleared on read.', bitOffset: 2, bitWidth: 1}
                  - {name: DDCD, description: 'Delta DCD. Set on DCD state change; cleared on read.', bitOffset: 3, bitWidth: 1}
                  - {name: CTS, description: 'Clear To Send (complement of CTS pin; mirrors MCR[1] in loopback).', bitOffset: 4, bitWidth: 1}
                  - {name: DSR, description: 'Data Set Ready (complement of DSR pin; mirrors MCR[0] in loopback).', bitOffset: 5, bitWidth: 1}
                  - {name: RI, description: 'Ring Indicator (complement of RI pin; mirrors MCR[2] in loopback).', bitOffset: 6, bitWidth: 1}
                  - {name: DCD, description: 'Data Carrier Detect (complement of DCD pin; mirrors MCR[3] in loopback).', bitOffset: 7, bitWidth: 1}
      USB:
        uses: ChipIdeaHS
        instances: [USB0, USB1]
        outputs:
          USB0: USB
          USB1: USB
      WWDT:
        uses: WWDT
        instances: [WWDT]
    chip_params:
      _all:
        _all:
          SCT: {match_channels: 8, events: 8, outputs: 7, has_fractional_match: true}
          SPIFI: {base: 20, logsize: 26, data_base: 128, data_logsize: 26}
          # UART1 has modem control (MCR/MSR) but lacks the IrDA/smart-card/
          # sync/oversampling/half-duplex registers that USART0/2/3 have.
          UART1: {has_modem: true, has_irda: false, has_smartcard: false, has_synchronous: false, has_oversampling: false, has_halfduplex: false}
          # ChipIdeaHS defaults assume the full MCXN feature set; LPC43
          # turns off the HW-cap prefix, GPTIMER, SBUSCFG, CONFIGFLAG and
          # DCCPARAMS (none are wired up) and turns on TTCTRL / BINTERVAL.
          USB: {has_hw_caps: false, has_gptimer: false, has_sbuscfg: false, has_configflag: false, has_dccparams: false, has_ttctrl: true, has_binterval: true}
          # USB0 = HS OTG with on-chip HS PHY, EP1..EP5 (5 additional pairs beyond EP0).
          USB0: {endpoints: 5, has_hs_phy: true, has_fs_phy: false}
          # USB1 = FS host/device with on-chip FS PHY, EP1..EP3 (3 additional pairs beyond EP0).
          USB1: {endpoints: 3, has_hs_phy: false, has_fs_phy: true}
    # Per-chip instance presence.  The single LPC43xx_43Sxx SVD describes a
    # superset; the actual peripheral set varies per chip.  Sources:
    #   USB0 / USB1: UM10503 §3.1 (and Table 2 / Table 4 ordering options).
    #   ETHERNET:    UM10503 §3.1.
    #   LCD:         UM10503 §17.1.
    #   ADCHS:       UM10503 §13.1, §18.1, §47 — only on LPC4370/LPC43S70.
    # ADC0/ADC1 are on every part — non-LPC4370 chips just tie input channels
    # together at the pin level (UM10503 §17.1), but both register blocks are
    # still present, so neither is excluded.
    chip_instances:
      _all:
        # LPC4310 / LPC43S10: no USB, no ETHERNET, no LCD, no ADCHS.
        LPC4310: {exclude: [USB0, USB1, ETHERNET, LCD, ADCHS]}
        LPC43S10: {exclude: [USB0, USB1, ETHERNET, LCD, ADCHS]}
        # LPC4320 / LPC43S20: USB0 only; no ETHERNET, no LCD, no ADCHS.
        LPC4320: {exclude: [USB1, ETHERNET, LCD, ADCHS]}
        LPC43S20: {exclude: [USB1, ETHERNET, LCD, ADCHS]}
        # LPC433x / LPC43S3x: ETHERNET, USB0+USB1; no LCD, no ADCHS.
        LPC4330: {exclude: [LCD, ADCHS]}
        LPC43S30: {exclude: [LCD, ADCHS]}
        LPC43S37: {exclude: [LCD, ADCHS]}
        # LPC435x / LPC43S5x / LPC43S6x: LCD, ETHERNET, USB0+USB1; no ADCHS.
        LPC4350: {exclude: [ADCHS]}
        LPC43S50: {exclude: [ADCHS]}
        LPC43S57: {exclude: [ADCHS]}
        LPC43S67: {exclude: [ADCHS]}
        # LPC4370: full feature set (ADC0+ADC1+ADCHS, ETHERNET, LCD, USB0+USB1) — no exclusions.
