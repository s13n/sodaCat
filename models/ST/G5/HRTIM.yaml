        access: read-write
      - name: MCMP3DE
        description: Master compare 3 DMA request enable
        bitOffset: 18
        bitWidth: 1
        access: read-write
      - name: MCMP4DE
        description: Master compare 4 DMA request enable
        bitOffset: 19
        bitWidth: 1
        access: read-write
      - name: MREPDE
        description: Master repetition DMA request enable
        bitOffset: 20
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Repetition DMA request disabled
