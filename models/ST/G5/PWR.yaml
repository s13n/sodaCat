name: PWR
description: Register block
groupName: PWR
source: stm32g5xx-dfp 2.0.0/STM32G564 SVD v2.0.0
registers:
  - name: LPMCR
    displayName: LPMCR
    description: Low power mode control register
    addressOffset: 0
    size: 32
    access: read-write
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: LPMS
        description: low-power mode selection
        bitOffset: 0
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: keeps Stop mode when entering DeepSleep.
            value: 0
          - name: B_0x1
            description: allows Standby mode when entering DeepSleep.
            value: 1
      - name: CSSF
        description: clear Standby and Stop flags (always read as 0)
        bitOffset: 7
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: no effect
            value: 0
          - name: B_0x1
            description: STOPF and SBF flags cleared
            value: 1
      - name: FLPS
        description: flash memory low-power mode in Stop mode
        bitOffset: 9
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: flash memory remains in normal mode when the system enters Stop mode (quickrestart time).
            value: 0
          - name: B_0x1
            description: flash memory enters low-power mode when the system enters Stop mode(low-power consumption).
            value: 1
      - name: SRAM3PDS
        description: AHB SRAM3 power-down in Stop mode. Only on STM32G553, STM32G554, STM32G563, STM32G564.
        bitOffset: 23
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: AHB RAM3 content is kept in Stop mode.
            value: 0
          - name: B_0x1
            description: AHB RAM3 content is lost in Stop mode.
            value: 1
      - name: SRAM2PDS1
        description: AHB SRAM2 page 1 power-down in Stop mode.
        bitOffset: 24
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: AHB RAM2 page 1 content is kept in Stop mode.
            value: 0
          - name: B_0x1
            description: AHB RAM2 page 1 content is lost in Stop mode.
            value: 1
      - name: SRAM2PDS2
        description: AHB SRAM2 page 2 power-down in Stop mode.
        bitOffset: 25
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: AHB RAM2 page 2 content is kept in Stop mode.
            value: 0
          - name: B_0x1
            description: AHB RAM2 page 2 content is lost in Stop mode.
            value: 1
      - name: SRAM1PDS
        description: AHB SRAM1 power-down in Stop mode
        bitOffset: 26
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: AHB RAM1 content is kept in Stop mode.
