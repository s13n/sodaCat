        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Compare 1 DMA request disabled
            value: 0
          - name: B_0x1
            description: Compare 1 DMA request enabled
            value: 1
      - name: MCMP2DE
        description: Master compare 2 DMA request enable
        bitOffset: 17
