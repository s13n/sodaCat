name: DMAMUX
description: DMAMUX
groupName: DMAMUX
source: STM32H723 SVD v2.1
params:
  - name: channels
    type: int
    default: 16
    description: Number of multiplexer channels — size of the C<N>CR register array and the REQ_OUT<N> output bus driving the downstream DMA engine.
  - name: request_inputs
    type: int
    default: 128
    description: Addressable DMA request input range (DMAREQ_ID bitfield), equal to 2^DMAREQ_ID_width. Drivers should validate that the configured request ID falls within this range; the silicon-valid subset is typically smaller and listed in the RM.
  - name: sync_inputs
    type: int
    default: 8
    description: Addressable synchronization/trigger input range (SYNC_ID on C<N>CR and SIG_ID on RG<N>CR — both bitfields have the same width on a given instance), equal to 2^SYNC_ID_width.
registers:
  - name: C0CR
    displayName: C0CR
    addressOffset: 0
    size: 32
    resetValue: 0
    resetMask: 4294967295
    fields:
      - name: DMAREQ_ID
        description: "DMA request identification\nSelects the input DMA request. See the DMAMUX table about assignments of multiplexer inputs to resources."
        bitOffset: 0
        bitWidth: 7
        access: read-write
      - name: SOIE
        description: Synchronization overrun interrupt enable
        bitOffset: 8
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Interrupt disabled
            value: 0
          - name: B_0x1
            description: Interrupt enabled
            value: 1
      - name: EGE
        description: Event generation enable
        bitOffset: 9
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Event generation disabled
            value: 0
          - name: B_0x1
            description: Event generation enabled
            value: 1
      - name: SE
        description: Synchronization enable
        bitOffset: 16
        bitWidth: 1
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: Synchronization disabled
            value: 0
          - name: B_0x1
            description: Synchronization enabled
            value: 1
      - name: SPOL
        description: "Synchronization polarity\nDefines the edge polarity of the selected synchronization input:"
        bitOffset: 17
        bitWidth: 2
        access: read-write
        enumeratedValues:
          - name: B_0x0
            description: No event, i.e. no synchronization nor detection.
            value: 0
          - name: B_0x1
            description: Rising edge
            value: 1
          - name: B_0x2
            description: Falling edge
            value: 2
          - name: B_0x3
            description: Rising and falling edges
            value: 3
      - name: NBREQ
        description: "Number of DMA requests minus 1 to forward\nDefines the number of DMA requests to forward to the DMA controller after a synchronization event, and/or the number of DMA requests before an output event is generated.\nThis field shall only be written when both SE and EGE bits are low."
        bitOffset: 19
        bitWidth: 5
        access: read-write
      - name: SYNC_ID
        description: "Synchronization identification\nSelects the synchronization input (see inputs to resources)."
        bitOffset: 24
        bitWidth: 3
        access: read-write
