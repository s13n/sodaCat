        - name: CAP1_1
          value: 5
          description: Capture timer 1, capture channel 1
        - name: CAP1_2
          value: 6
          description: Capture timer 1, capture channel 2
        - name: CAP1_3
          value: 7
          description: Capture timer 1, capture channel 3
        - name: CAP2_0
          value: 8
          description: Capture timer 2, capture channel 0
        - name: CAP2_1
          value: 9
          description: Capture timer 2, capture channel 1
        - name: CAP2_2
          value: 10
          description: Capture timer 2, capture channel 2
        - name: CAP2_3
          value: 11
          description: Capture timer 2, capture channel 3
        - name: CAP3_0
