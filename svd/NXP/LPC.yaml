          plls:
            - name: PLL0USB
              input: pll0usb_in
              output: pll0usb_clk
              feedback_integer:
                reg: PLL0USB_MDIV
                field: MDEC
              post_divider:
                reg: PLL0USB_NP_DIV
                field: PDEC
              vco_limits: {min: 275000000, max: 550000000}
              description: |-
                Dedicated PLL for the USB high-speed 480 MHz clock.
                M/N/P are stored as LFSR-encoded values MDEC/NDEC/PDEC (not direct
                binary).  Encoding tables in UM10503 §13.6.3.3 and §13.6.3.4.
                Valid logical ranges: M = 1..2^15, N = 1..2^8, P = 1..2^5.
                The N pre-divider lives in PLL0USB_NP_DIV.NDEC; not modeled here as
                the schema does not represent PLL pre-dividers.
                VCO must be in 275-550 MHz range per the LPC43 datasheet.

            - name: PLL0AUDIO
              input: pll0audio_in
              output: pll0audio_clk
              feedback_integer:
                reg: PLL0AUDIO_MDIV
                field: MDEC
              feedback_fraction:
                reg: PLL0AUDIO_FRAC
                field: PLLFRACT_CTRL
              post_divider:
                reg: PLL0AUDIO_NP_DIV
                field: PDEC
              vco_limits: {min: 275000000, max: 550000000}
              description: |-
                PLL with optional fractional divider for audio applications.
                Same M/N/P LFSR encoding as PLL0USB.  When SEL_EXT=0 in
                PLL0AUDIO_CTRL, the sigma-delta modulator drives MDEC from the
                PLLFRACT_CTRL[21:0] word: integer part PLLFRACT[21:15] (M), fraction
                PLLFRACT[14:0] (K) producing average ratio M + K/L.  When SEL_EXT=1,
                MDEC is set directly via PLL0AUDIO_MDIV.MDEC.
                The N pre-divider in PLL0AUDIO_NP_DIV.NDEC is not modeled here.

            - name: PLL1
              input: pll1_in
              output: pll1_clk
              feedback_integer:
                reg: PLL1_CTRL
                field: MSEL
                value_range: {min: 1, max: 256, offset: 1}
              post_divider:
                reg: PLL1_CTRL
                field: PSEL
                values: [2, 4, 8, 16]
              vco_limits: {min: 156000000, max: 320000000}
              description: |-
                Main system PLL feeding BASE_M4_CLK and the bulk of peripheral base
                clocks.  Direct binary divisors (no LFSR encoding):
                  M = MSEL + 1     (range 1..256)
                  N = NSEL + 1     (range 1..4, modeled as separate PLL1_N_DIV)
                  P_div = 2 * PSEL_value  where PSEL_value in {1,2,4,8}
                  => actual post_divider values: {2,4,8,16}
                DIRECT bit (PLL1_CTRL[7]) bypasses the post-divider entirely; not
                modeled here.  Boot default produces 96 MHz from the IRC.

          dividers:
            - name: PLL1_N_DIV
              input: pll1_in_pre
              output: pll1_in
              factor:
                reg: PLL1_CTRL
                field: NSEL
                value_range: {min: 1, max: 4, offset: 1}
              description: "PLL1 pre-divider (N).  NSEL=0..3 -> N=1..4."

            - name: IDIVA
              input: idiva_in
              output: idiva_clk
              factor:
                reg: IDIVA_CTRL
                field: IDIV
                value_range: {min: 1, max: 4, offset: 1}
              description: "Integer divider A.  IDIV=0..3 -> divisor=1..4."

            - name: IDIVB
              input: idivb_in
              output: idivb_clk
              factor:
                reg: IDIVB_CTRL
                field: IDIV
                value_range: {min: 1, max: 16, offset: 1}
              description: "Integer divider B.  IDIV=0..15 -> divisor=1..16."

            - name: IDIVC
              input: idivc_in
              output: idivc_clk
              factor:
                reg: IDIVC_CTRL
                field: IDIV
                value_range: {min: 1, max: 16, offset: 1}
              description: "Integer divider C.  IDIV=0..15 -> divisor=1..16."

            - name: IDIVD
              input: idivd_in
              output: idivd_clk
              factor:
                reg: IDIVD_CTRL
                field: IDIV
                value_range: {min: 1, max: 16, offset: 1}
              description: "Integer divider D.  IDIV=0..15 -> divisor=1..16."

            - name: IDIVE
              input: idive_in
              output: idive_clk
              factor:
                reg: IDIVE_CTRL
                field: IDIV
                value_range: {min: 1, max: 256, offset: 1}
              description: "Integer divider E.  IDIV=0..255 -> divisor=1..256."

            - name: M4_EMCDIV
              input: clk_m4_emcdiv_gated
              output: clk_m4_emcdiv
              factor:
                instance: CCU1
                reg: CLK[3][15].CFG
                field: DIV
                values: [1, 2]
              description: "CLK_M4_EMCDIV divider stage.  DIV=0 -> /1, DIV=1 -> /2; values 0x2-0x4 reserved.  Status reflected in DIVSTAT (bits 29:27) of the same register, not the STAT register."

